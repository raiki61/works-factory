name: works-factory-fix
description: '修正の block（docs/design/fix.md）。承認済みの修正案（無ければ判定）の直す義務の単位を組に分け、組ごとに自分を子の run として起こして直す（組の子は単位ごとの TDD のループと修正役。受け付けが書き込みの出どころ・凍ったテスト・範囲・当たる試験・閉鎖の数え直し・書いた指し・事前審査への答えを照らし、3 回拒まれた単位だけを戻して諦める。範囲の外が要れば修正案の側に相談し、緑にするために曲げるしかなければ食い違いの申し出を出す）。親は組の差分を順に当て、当てて赤になった・字でぶつかった組を合わせ役が直し、申し出を読むだけの裁定役が持ち主の決まりで裁き、直す裁定の後に直し直す。最後に、役が残した生成物を消し、申告したファイルが本当に変わったかを確かめ、単位ごとの記録と差分を返す。1 つの YAML が 2 つの形で走る: mode whole は graph から include された親（組ごとに自分を workflow: と fan_out: で子の run として起こす。単独の run では Archon が先祖と同じ名の子を拒むので回らない）、mode group は組 1 つを直す子の run（単独の run でも回る）'
inputs:
  mode:
    default: group
    description: 'choice(whole|group): 形。whole は graph から include された親（組ごとに自分を子の run として起こす。単独の run では Archon が先祖と同じ名の子を拒むので回らない）。group は組 1 つを直す（単独の run・子の run）'
  judgment:
    default: ''
    description: 'json(shared:judgment.schema.json): 判定（units・questions・precedents・framing などを持つ object）。whole と、out_dir の無い group では必須。out_dir の在る group（子の run）は親の写しを読むので空でよい'
  plan:
    default: ''
    description: 'json(plan-fields.schema.json): 承認済みの修正案の欄の控え {fields}（凍結の印を付けて置く）。空は修正案の無い run'
  fix_plan:
    default: ''
    description: 'json(fix-plan.schema.json): 承認済みの修正案の返り（項目の並びを持つ object。項目の unit_keys が承認済みの項目の出どころ）。空は修正案の無い run'
  answer_ties:
    default: 'null'
    description: 'json(answer-ties.schema.json): 依頼の答えを判定の問い・単位に結んだ行。null は結びが無い（字の一致だけ）'
  materials:
    default: 'null'
    description: 'json(fix-materials.schema.json): 判定の素材の状態（素材の名 → {status, …}）。null は無い'
  ripple:
    default: ''
    description: 'file: 波及の一覧（承認済みの修正案の項目が変える名の呼び出し元と試験）。空は無い'
  skip_rerun:
    default: '[]'
    description: 'json(skip-rerun.schema.json): 緑の後の試験の走らせ直し（TDD のループの test_cmd の関門と、組を当てた後の test_cmd）を省く単位の key の配列。空の配列は省かない'
  answers:
    default: 'null'
    description: 'json(fix-answers.schema.json): 修正の前の承認ノードの答え {decision, text, asked}。null は聞いていない'
  request_answers:
    default: '[]'
    description: 'json(fix-request-answers.schema.json): 依頼のファイルが先に持っていた問いへの答えの行。空の配列は無い'
  unattended:
    default: 'false'
    description: 'flag: 無人の run か（判定の推しつきの fork・held を答えとして数える）'
  plan_review:
    default: 'null'
    description: 'json(fix-plan-review.schema.json): 事前審査の返答（faces・shrink）。修正役が plan_faces で穴と別案に答える。null は事前審査の無い run'
  prior:
    default: 'null'
    description: 'json(carry.schema.json): 前の修正の段の申し送り（前の段の出力 carry の先 {conflicts, loops}）。2 回目の修正の段だけに渡す。null は 1 回目の段'
  notes:
    default: ''
    description: 'text: 機械の申し送りの文（案の直しの後の 2 回目の修正の段だけ）。修正役と TDD の役の notes に足す。空は無い'
  only_items:
    default: '[]'
    description: 'json(only-items.schema.json): 2 回目の修正の段で直す修正案の項目の番号の配列。空の配列は直す義務の単位の全部'
  baseline:
    default: ''
    description: 'file: 直す前の結末（{cases, exit, how}）。空は実行器の無い run'
  test_cmd:
    default: ''
    description: 'text: 人が渡したテストのコマンド（対象の根で走らせる 1 行）。空は無い'
  tdd_suite:
    default: ''
    description: 'text: TDD の実行器のパス（第 1 引数の書き先に JUnit XML を書く物）。空は TDD のループを回さない'
  reuse_dir:
    default: ''
    description: 'text: 同じ run の中の試験の結果の控えの置き場の絶対パス。空は使い回さない'
  reuse_key:
    default: ''
    description: 'text: 控えを引く時に照らす run の名。空はこの run の id'
  user_env_dir:
    default: ''
    description: 'text: 利用者の HOME・XDG に戻して起こした印を置く置き場の絶対パス。空は置き場が無い（戻す run では止まる）'
  policy:
    default: ''
    description: 'file: 人の方針の文書。空は無い'
  request:
    default: ''
    description: 'file: 人の修正依頼のファイル（役が Read し、裁定役と修正役が <絶対パス>:<行> で名指す）。空は無い'
  parallel:
    default: 'true'
    description: 'flag: 組を子の run で並べてよいか。偽なら 1 組ずつ親の作業ツリーで回す'
  group:
    default: ''
    description: 'json(group.schema.json): 組 1 つ {group_id, unit_ids, items}（group の時。親の fan_out が渡す）'
  from_tree:
    default: ''
    description: 'text: 親の作業ツリーの姿の木の sha（group の時。並べる子だけ）。空は親の作業ツリーをそのまま使う'
  out_dir:
    default: ''
    description: 'text: 子が組の結果を書く、親の place の中の絶対パス（group の時）。空は自分の place の groups/ に書く（単独の run）'
  lang:
    default: ''
    description: 'text: 人に見せる欄（各役の md が名指す欄）の言語。空は依頼の言語'
  excluded:
    default: 'null'
    description: 'json(excluded.schema.json): 並行 PR の確かめが外した hunk（{excluded: [{pr, file, start, end, why, text, sha256}]} か、その行の配列。text・sha256 は確かめが走った時のその行の中身の錨で、前の段の修正で行がずれていても中身で引き直す）。修正の受け付けと、組の終わり・全体の変更の確かめは、始めの木からの変更がこの範囲に触れていないかを照らす。null は外した hunk が無い'

returns: finish
outcome_field: ok

nodes:
  # port を読み、形ごとの必須を確かめて intake.json と values.json を書く。後ろの script は port を読まずにそれを読む。形の振り分けを兼ねる
  # （include の中の when: は $INPUTS を左に置けないので、mode を script が読んで返す）
  - id: intake
    script: intake
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [ok, whole, reason]
      properties:
        ok: {type: boolean}
        whole: {type: boolean}
        reason: {type: string}

  # ---- 全体の形（graph の include の中だけ） ----

  - id: prep
    script: prep
    runtime: uv
    depends_on: [intake]
    when: "$intake.output.whole == true && $intake.output.ok == true"
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [groups, count, par, start_tree, out_dir]
      properties:
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [group_id, unit_ids, items]
            properties:
              group_id: {type: string, minLength: 1}
              unit_ids: {type: array, items: {type: string}}
              items: {type: array, items: {type: integer}}
        count: {type: integer, minimum: 0}
        par: {type: boolean}
        start_tree: {type: string}
        out_dir: {type: string, minLength: 1}

  # 組ごとに子の run を起こし、子ごとに Archon が作業ツリーを切る。親の姿は木の sha で渡して子が写す。
  # max_parallel は Archon の既定の 5 を見えるように書く（並べの数の上限。列ではない）。
  # join: all_success は、子が 1 つでも落ちればこの node を落として run を止める（諦めた子は result.json を書いて completed で終わる
  # ので、落ちた子は諦めていない）。親の resume は済んだ子を飛ばし、落ちた子だけを同じ run・同じ作業ツリーで続きから回す。
  # all_done にすると node が済んで resume が子に届かず、落ちた子の組が持ち越しになる（issue #576）。
  # 子の with: は 3 つだけ（子は親の place から入力の写しと values.json を写す。docs/design/fix.md の 1.3 の 4）
  - id: groups-par
    workflow: works-factory-fix
    depends_on: [prep]
    when: "$prep.output.par == true"
    isolation: worktree
    fan_out:
      items: $prep.output.groups
      as: group
      max_parallel: 5
      join: all_success
    with:
      mode: group
      from_tree: $prep.output.start_tree
      out_dir: $prep.output.out_dir

  # 並べない run は、子を親の作業ツリーで 1 つずつ回す（Archon の作業ツリーの錠は先祖と子孫を除く）
  - id: groups-seq
    workflow: works-factory-fix
    depends_on: [prep]
    when: "$prep.output.par == false"
    fan_out:
      items: $prep.output.groups
      as: group
      max_parallel: 1
      join: all_success
    with:
      mode: group
      from_tree: ""
      out_dir: $prep.output.out_dir

  # 子の返りを with: で受けない。子が out_dir/<group_id>/result.json に書いた結果を組の順に読み、並べた run は子の差分を決めた順に
  # 親の作業ツリーへ当てて確かめ直す。組の node が落ちた run では走らない（順の組の子が親の作業ツリーに残した変更を戻さず、
  # resume で続きから回す）
  - id: join
    script: join
    runtime: uv
    depends_on: [intake, groups-par, groups-seq]
    trigger_rule: none_failed_min_one_success
    when: "$intake.output.whole == true"
    output_format:
      type: object
      additionalProperties: false
      required: [groups, returned]
      properties:
        groups: {type: integer, minimum: 0}
        returned: {type: integer, minimum: 0}

  # 合わせのループ（持ち主の決め clash-goes-to-ruling）。join が確かめ直しの赤で戻した組と字で当たらなかった組を 1 つずつ当て直し、
  # 合わせ役がその組の変えたファイルの中だけで直す。直せなければ当て直す前の木へ戻し、組どうしの合わせの申し出を裁定役へ回す。
  # max_iterations は 3 組 × 3 回（上限の周の受け付けが残りの組を申し出へ回して抜ける。with: limit と同じ値）。周ごとに組が替わりうるので
  # 毎周新しい会話にする。同じ組の出し直しは、指示の却下の段落が前の回の理由を渡す。
  # 確かめ直しは並べた run だけが持つ（join）ので、並べない run では回さない
  - id: clash-loop
    depends_on: [join]
    when: "$prep.output.par == true"
    loop_group:
      max_iterations: 9
      fresh_context: true
      until_bash: done=$clash-accept.output.done; test "$done" = true
      nodes:
        - id: clash-prep
          script: clash_prep
          runtime: uv
          with:
            pass: first
          output_format: &clash_prep_out
            type: object
            additionalProperties: false
            required: [prompt, go, iteration]
            properties:
              prompt: {type: string}
              go: {type: boolean}
              iteration: {type: integer, minimum: 1}

        - id: clash-fix
          description: '合わせ役: 組を合わせて赤になった所を、その組の変えたファイルの中だけで直す'
          <<: &clash_launch
            model: '@wf-fix-writers'
            settingSources: [user]
            allowed_tools: [Read, Grep, Glob, Edit, Write, Bash]
            sandbox: {enabled: true, allowUnsandboxedCommands: false}
            idle_timeout: 1728000000
            retry: {max_attempts: 2, on_error: all}
          prompt: "$clash-prep.output.prompt"
          depends_on: [clash-prep]
          when: "$clash-prep.output.go == true"
          output_format: &clash_reply
            type: object
            additionalProperties: false
            required: [handled, how, files]
            properties:
              handled:
                type: string
                enum: [fixed, cannot]
              how: {type: string, minLength: 20}
              files:
                type: array
                items: {type: string, minLength: 1}
              bash_writes:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [path, why]
                  properties:
                    path: {type: string, minLength: 1}
                    why: {type: string, minLength: 10}

        - id: clash-accept
          script: clash_accept
          runtime: uv
          depends_on: [clash-prep, clash-fix]
          trigger_rule: none_failed_min_one_success
          with:
            reply: {from: "$clash-fix.output", if_skipped: null}
            iteration: $clash-prep.output.iteration
            pass: first
            limit: 9
          output_format: &accept_out
            type: object
            additionalProperties: false
            required: [ok, done, reason, reason_file]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}

  # 子と join が集めた食い違いの申し出の名指し（<パス>:<行>）を現物で照らし、在る申し出を place の conflicts.json に残す
  - id: conflict-check
    script: conflict_check
    runtime: uv
    mutates_checkout: false
    depends_on: [join, clash-loop]
    trigger_rule: none_failed_min_one_success
    output_format:
      type: object
      additionalProperties: false
      required: [go, count]
      properties:
        go: {type: boolean}
        count: {type: integer, minimum: 0}

  # 裁定の輪。役 ruler は読むだけで、持ち主の決まり（prompts/ruler.md の裁定の拠り所）で裁く。3 回目の拒否で裁かれていない申し出を人へ回して抜ける
  - id: rule-loop
    depends_on: [conflict-check]
    when: "$conflict-check.output.go == true"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: done=$rule-accept.output.done; test "$done" = true
      nodes:
        - id: rule-prep
          script: rule_prep
          runtime: uv
          mutates_checkout: false
          output_format:
            type: object
            additionalProperties: false
            required: [prompt, iteration]
            properties:
              prompt: {type: string}
              iteration: {type: integer, minimum: 1}

        - id: ruler
          description: '裁定役: 食い違いを持ち主の決まりで裁く（読むだけ）'
          model: '@wf-fix-ruler'
          prompt: "$rule-prep.output.prompt"
          depends_on: [rule-prep]
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            additionalProperties: false
            required: [rulings]
            properties:
              rulings:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [id, decision, text, limits]
                  properties:
                    id: {type: string, minLength: 1, pattern: '\S'}
                    decision:
                      type: string
                      enum: [fix_test_scope, fix_code_as, ask_human, replace_query, fix_plan_item, rejudge]
                    text: {type: string, minLength: 10, pattern: '\S[\s\S]{8,}\S'}
                    limits:
                      type: array
                      items: {type: string, minLength: 1, pattern: '\S'}
                    grounds:
                      type: array
                      items: {type: string, minLength: 3, pattern: '\S[\s\S]{1,}\S'}
                    request_searched: {type: string, minLength: 10, pattern: '\S[\s\S]{8,}\S'}
                    ask_why:
                      type: object
                      additionalProperties: false
                      required: [changes, line]
                      properties:
                        changes:
                          type: string
                          enum: [direction, scope, name_only]
                        line: {type: string, minLength: 1, pattern: '^[^\n\r\x00]*[^\s\x00][^\n\r\x00]*$'}
                    query:
                      type: object
                      additionalProperties: false
                      required: [how, counts, hits, misses]
                      properties:
                        how: {type: object}
                        counts:
                          type: string
                          enum: [defects, population]
                        hits:
                          type: array
                          maxItems: 20
                          items: {type: string, minLength: 1, pattern: '\S'}
                          minItems: 1
                        misses:
                          type: array
                          maxItems: 20
                          items: {type: string, minLength: 1, pattern: '\S'}

        - id: rule-accept
          script: rule_accept
          runtime: uv
          mutates_checkout: false
          depends_on: [ruler]
          with:
            status_guarded: true
            reply: $ruler.output
          output_format: *accept_out

  # 裁定の後の合わせのループ。組どうしの合わせの申し出が直す裁定を受けた組だけを当て直し、合わせ役が裁定の文のとおりに直す。
  # 受け付けを通らなければ当て直す前の木へ戻して人に回す。扱う組が無ければ支度が go: false を返し、役を起こさずに抜ける
  - id: clash-ruled-loop
    depends_on: [conflict-check, rule-loop]
    when: "$conflict-check.output.go == true"
    loop_group:
      max_iterations: 9
      fresh_context: true
      until_bash: done=$clash-ruled-accept.output.done; test "$done" = true
      nodes:
        - id: clash-ruled-prep
          script: clash_prep
          runtime: uv
          with:
            pass: ruled
          output_format: *clash_prep_out

        - id: clash-ruled
          description: '裁定の後の合わせ役: 裁定の文のとおりに組の合わせを直す'
          <<: *clash_launch
          prompt: "$clash-ruled-prep.output.prompt"
          depends_on: [clash-ruled-prep]
          when: "$clash-ruled-prep.output.go == true"
          output_format: *clash_reply

        - id: clash-ruled-accept
          script: clash_accept
          runtime: uv
          depends_on: [clash-ruled-prep, clash-ruled]
          trigger_rule: none_failed_min_one_success
          with:
            reply: {from: "$clash-ruled.output", if_skipped: null}
            iteration: $clash-ruled-prep.output.iteration
            pass: ruled
            limit: 9
          output_format: *accept_out

  # 裁定の後の修正の輪。直す裁定（fix_test_scope・fix_code_as）が無ければ支度が go: false を返し、役を起こさずに抜ける。
  # 役 fix-ruled は修正役の返答と裁定を機械が保存したファイルを読む。2 周目からは前の周の会話を継ぐ（fresh_context: false）
  - id: fix-ruled-loop
    depends_on: [conflict-check, rule-loop, clash-ruled-loop]
    when: "$conflict-check.output.go == true"
    loop_group:
      max_iterations: 12
      fresh_context: false
      until_bash: done=$fix-ruled-accept.output.done; test "$done" = true
      nodes:
        - id: fix-ruled-prep
          script: fix_ruled_prep
          runtime: uv
          mutates_checkout: false
          output_format: &fix_prep_out
            type: object
            additionalProperties: false
            required: [prompt, go, iteration]
            properties:
              prompt: {type: string}
              go: {type: boolean}
              iteration: {type: integer, minimum: 1}

        - id: fix-ruled
          description: '裁定の文を読んで直す'
          <<: &fix_launch
            model: '@wf-fix-writers'
            settingSources: [user]
            allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Agent]
            sandbox: {enabled: true, allowUnsandboxedCommands: false}
            idle_timeout: 1728000000
            retry: {max_attempts: 2, on_error: all}
          prompt: "$fix-ruled-prep.output.prompt"
          depends_on: [fix-ruled-prep]
          when: "$fix-ruled-prep.output.go == true"
          output_format: &fix_reply
            type: object
            required: [changes, fix_closure, gates_changed, interactions, mechanism_changed, not_done, path_changed, plan_faces, premise_drift, seams_changed, security_surface_changed, wrote_refs]
            additionalProperties: false
            properties:
              changes:
                type: array
                items:
                  type: object
                  required: [breaks, bypass_tried, closure, files, root_or_symptom, unit_key, what, precedent]
                  additionalProperties: false
                  properties:
                    unit_key: {type: string}
                    what: {type: string}
                    closure:
                      type: object
                      required: [mechanism, fix_mechanism, verified_how, sites]
                      additionalProperties: false
                      properties:
                        mechanism: {type: string}
                        fix_mechanism: {type: string}
                        verified_how: {type: string}
                        sites:
                          type: array
                          items:
                            type: object
                            required: [site, red_seen]
                            additionalProperties: false
                            properties:
                              site: {type: string}
                              red_seen: {type: boolean}
                              path: {type: string}
                    files:
                      type: array
                      minItems: 1
                      items: {type: string}
                    coverage:
                      type: object
                      additionalProperties: false
                      properties:
                        how:
                          type: object
                          required: [patterns, paths, count]
                          additionalProperties: false
                          properties:
                            patterns:
                              type: array
                              minItems: 1
                              maxItems: 20
                              items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]+$'}
                            fixed: {type: boolean}
                            paths:
                              type: array
                              minItems: 1
                              maxItems: 50
                              items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]+$'}
                            count:
                              type: string
                              enum: [lines, files]
                            untracked: {type: boolean}
                            ignore_case: {type: boolean}
                            word: {type: boolean}
                        counts:
                          type: string
                          enum: [defects, population]
                        remaining: {type: string}
                    root_or_symptom:
                      type: object
                      required: [kind, why]
                      additionalProperties: false
                      properties:
                        kind:
                          type: string
                          enum: [root, symptom]
                        why: {type: string, minLength: 1}
                    bypass_tried: {type: string, minLength: 1}
                    breaks:
                      type: object
                      required: [how, result]
                      additionalProperties: false
                      properties:
                        how: {type: string, minLength: 1}
                        result: {type: string, minLength: 1}
                        accepted: {type: string}
                    precedent:
                      type: object
                      required: [verdict, reason]
                      additionalProperties: false
                      properties:
                        problem: {type: string}
                        source: {type: string}
                        verdict:
                          type: string
                          enum: [adopt, adapt, does_not_apply, not_found]
                        reason: {type: string, minLength: 4}
                        searched: {type: string}
                        from_judge_row: {type: boolean}
                      allOf:
                      - if:
                          not:
                            required: [from_judge_row]
                            properties:
                              from_judge_row: {const: true}
                        then:
                          required: [problem]
                          properties:
                            problem: {type: string, minLength: 4}
                      - if:
                          allOf:
                          - not:
                              required: [from_judge_row]
                              properties:
                                from_judge_row: {const: true}
                          - required: [verdict]
                            properties:
                              verdict: {const: not_found}
                        then:
                          required: [searched]
                          properties:
                            searched: {type: string, minLength: 4}
                      - if:
                          allOf:
                          - not:
                              required: [from_judge_row]
                              properties:
                                from_judge_row: {const: true}
                          - required: [verdict]
                            properties:
                              verdict:
                                not: {const: not_found}
                        then:
                          required: [source]
                          properties:
                            source: {type: string, minLength: 4}
              not_done:
                type: array
                items:
                  type: object
                  required: [unit_key, why]
                  additionalProperties: false
                  properties:
                    unit_key: {type: string}
                    why: {type: string}
              fix_closure:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [found, clean, carried_over, not_applicable, awaiting_human, not_run]
                  count: {type: integer, minimum: 0}
                  detail: {type: string}
                  checked: {type: string}
                  reason: {type: string}
                  from_round: {type: integer, minimum: 1}
              mechanism_changed: {type: boolean}
              premise_drift: {type: boolean}
              premise_drift_note: {type: string}
              gates_changed: {type: boolean}
              seams_changed: {type: boolean}
              security_surface_changed: {type: boolean}
              path_changed: {type: boolean}
              decision_records_changed: {type: boolean}
              rejudge_requested: {type: string}
              interactions:
                type: array
                items:
                  type: object
                  required: [surface, checked]
                  additionalProperties: false
                  properties:
                    surface: {type: string, minLength: 1}
                    checked: {type: string, minLength: 1}
                    combined_effect: {type: string}
              wrote_refs:
                type: array
                maxItems: 50
                items:
                  type: object
                  required: [kind, target, where]
                  additionalProperties: false
                  properties:
                    kind:
                      type: string
                      enum: [file, text]
                    cite: {type: string, minLength: 1, maxLength: 500}
                    target: {type: string, minLength: 1, maxLength: 300}
                    where: {type: string, minLength: 1, maxLength: 300}
              plan_faces:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [key, handled, how]
                  properties:
                    key: {type: string, minLength: 8}
                    handled:
                      type: string
                      enum: [absorbed, declared]
                    how: {type: string, minLength: 20}
              x_scalars:
                type: object
                additionalProperties: false
                patternProperties:
                  ^x_[a-z0-9_]+$: {type: number}
              conflicts:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [unit_key, between, why_both_cannot_hold, which_is_right, kind]
                  properties:
                    unit_key: {type: string, minLength: 1}
                    between:
                      type: array
                      minItems: 2
                      items: {type: string, minLength: 3}
                    why_both_cannot_hold: {type: string, minLength: 10}
                    which_is_right:
                      type: string
                      enum: [request, test, code, unknown, query]
                    correct_lines:
                      type: array
                      minItems: 1
                      maxItems: 20
                      items: {type: string, minLength: 1}
                    kind:
                      type: string
                      enum: [brief_vs_judgment, unnamed_test_broke, not_red, scope_needed, query_hits_fixed, needs_context]
              consult:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [item, paths, tests, why]
                  properties:
                    item: {type: integer, minimum: 1}
                    paths:
                      type: array
                      items: {type: string, minLength: 1}
                    tests:
                      type: array
                      items: {type: string, minLength: 1}
                    new_tests:
                      type: array
                      items: {type: string, minLength: 1}
                    why: {type: string, minLength: 10}
              bash_writes:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [path, why]
                  properties:
                    path: {type: string, minLength: 1}
                    why: {type: string, minLength: 10}

        - id: ruled-consult-check
          script: consult_check
          runtime: uv
          mutates_checkout: false
          depends_on: [fix-ruled]
          with:
            reply: $fix-ruled.output
            pass: ruled
          output_format: &consult_check_out
            type: object
            additionalProperties: false
            required: [consulted, go, prompt]
            properties:
              consulted: {type: boolean}
              go: {type: boolean}
              prompt: {type: string}

        # 相談の答えの役は context を持たないので、同じ周の修正役の会話から分かれて起きる（今のまま。docs/design/fix.md の 13.3 の 1）
        - id: ruled-consult-answer
          description: '範囲の相談に答える（修正案と波及を読む。読むだけ）'
          <<: &consult_launch
            model: '@wf-fix-consult'
            settingSources: [user]
            allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
            sandbox: {enabled: true, allowUnsandboxedCommands: false}
            idle_timeout: 1728000000
            retry: {max_attempts: 2, on_error: all}
          prompt: "$ruled-consult-check.output.prompt"
          depends_on: [ruled-consult-check]
          when: "$ruled-consult-check.output.go == true"
          mutates_checkout: false
          output_format: &consult_answer
            type: object
            additionalProperties: false
            required: [answers]
            properties:
              answers:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [ask, decision, paths, tests, spec, reason]
                  properties:
                    ask: {type: integer, minimum: 1}
                    decision:
                      type: string
                      enum: [allow, deny, defer]
                    new_tests:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required: [id, red_kind]
                        properties:
                          id: {type: string, minLength: 1}
                          red_kind:
                            type: string
                            enum: [red, guard]
                    paths:
                      type: array
                      items: {type: string, minLength: 1}
                    tests:
                      type: array
                      items: {type: string, minLength: 1}
                    spec: {type: string}
                    reason: {type: string, minLength: 10}

        - id: ruled-consult-accept
          script: consult_accept
          runtime: uv
          mutates_checkout: false
          depends_on: [ruled-consult-check, ruled-consult-answer]
          trigger_rule: none_failed_min_one_success
          with:
            answer: {from: "$ruled-consult-answer.output", if_skipped: null}
            pass: ruled
          output_format: &consult_accept_out
            type: object
            additionalProperties: false
            required: [consulted, answer_file]
            properties:
              consulted: {type: boolean}
              answer_file: {type: string}

        - id: fix-ruled-accept
          script: fix_ruled_accept
          runtime: uv
          depends_on: [fix-ruled-prep, ruled-consult-accept]
          trigger_rule: none_failed_min_one_success
          with:
            reply: {from: "$fix-ruled.output", if_skipped: null}
            consulted: {from: "$ruled-consult-accept.output.consulted", if_skipped: false}
          output_format: *accept_out

  # 控えに無かった git が無視するファイルだけを消す（Archon の置き場 .archon/ は消さない）。前のどれかの node が落ちた run では飛ぶ
  - id: clean
    script: clean
    runtime: uv
    depends_on: [intake, clash-loop, conflict-check, rule-loop, clash-ruled-loop, fix-ruled-loop]
    trigger_rule: none_failed_min_one_success
    when: "$intake.output.whole == true"
    output_format:
      type: object
      additionalProperties: false
      required: [ok, count]
      properties:
        ok: {type: boolean}
        count: {type: integer, minimum: 0}

  # 申告したファイルが run の始めの版から本当に変わったか。比べが通らない時も落ちずに ok: false と理由を place に残す
  # （比べの外の誤り——groups.json が無い・git が効かない——は落ちる）
  - id: assert-changed
    script: assert_changed
    runtime: uv
    depends_on: [intake, clean]
    trigger_rule: none_failed_min_one_success
    when: "$intake.output.whole == true"
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [ok, reason]
      properties:
        ok: {type: boolean}
        reason: {type: string}

  # ---- 組の形（組ごとの子の run。単独の run でも回る） ----

  # 親の姿の木を自分の作業ツリーに写し（from_tree が在る時）、控えと始めの木を取り、TDD の輪の状態を置く
  - id: group-start
    script: group_start
    runtime: uv
    depends_on: [intake]
    when: "$intake.output.whole == false && $intake.output.ok == true"
    output_format:
      type: object
      additionalProperties: false
      required: [tdd, units, reason]
      properties:
        tdd: {type: boolean}
        units: {type: integer, minimum: 0}
        reason: {type: string}

  # 単位ごとの TDD の輪（route → 単位ごとに test（赤）→ fix（緑）→ refactor）。赤・緑は tdd-step が JUnit XML で機械が決める。
  # 同じ単位の段は 1 つの会話で続け、単位が替わる周だけ新しい会話にする。Archon は fresh_context: false の輪で前の周の最後の会話を
  # 次の周の体の AI の node へ渡し、node の context: fresh だけがそれを切る（止めた Archon の dag-executor.ts の lastSequentialSession）。
  # tdd-prep が単位が替わったかを new_unit で返し、続きの役 tdd と新しい単位の役 tdd-new を when: で振り分ける。並んだ層（2 つ以上の
  # node の層）は会話を渡さないので、tdd-new は tdd の後ろの層に置く。前の単位の物は指示の引き継ぎの段落でも渡す
  - id: tdd-loop
    depends_on: [group-start]
    when: "$group-start.output.tdd == true"
    loop_group:
      max_iterations: 40
      fresh_context: false
      until_bash: done=$tdd-step.output.done; test "$done" = true
      nodes:
        - id: tdd-prep
          script: tdd_prep
          runtime: uv
          mutates_checkout: false
          output_format:
            type: object
            additionalProperties: false
            required: [prompt, go, new_unit]
            properties:
              prompt: {type: string}
              go: {type: boolean}
              new_unit: {type: boolean}   # 前の周と単位（振り分けの段は route）が替わった周（tdd-new が新しい会話で起きる）

        # 同じ単位の続き（前の周の会話を継ぐ）。道具・skills は tdd-new と同じ（merge key の錨 tdd_launch）
        - id: tdd
          description: 'TDD の役（今の単位を直す。同じ単位の続き）'
          <<: &tdd_launch
            model: '@wf-fix-writers'
            prompt: "$tdd-prep.output.prompt"
            settingSources: [user]
            skills: [test-driven-development]
            allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch, Skill]
            sandbox: {enabled: true, allowUnsandboxedCommands: false}
            idle_timeout: 1728000000
            retry: {max_attempts: 2, on_error: all}
          depends_on: [tdd-prep]
          when: "$tdd-prep.output.go == true && $tdd-prep.output.new_unit == false"
          output_format: &tdd_reply
            type: object
            additionalProperties: false
            required: [phase]
            properties:
              phase:
                type: string
                enum: [route, test, fix, refactor, conflict]
              units:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [unit_key, route]
                  properties:
                    unit_key: {type: string, minLength: 1}
                    route:
                      type: string
                      enum: [tdd, direct]
                    why: {type: string}
              unit_key: {type: string}
              test_files:
                type: array
                items: {type: string}
              tests:
                type: array
                items: {type: string}
              red_quotes:
                type: object
                additionalProperties: false
                patternProperties:
                  ^.+$:
                    type: object
                    additionalProperties: false
                    required: [quote, why]
                    properties:
                      quote: {type: string}
                      why: {type: string}
              direct_why: {type: string}
              files:
                type: array
                items: {type: string}
              what: {type: string}
              refactor:
                type: object
                additionalProperties: false
                required: [declared, why]
                properties:
                  declared: {type: boolean}
                  why: {type: string}
              between:
                type: array
                items: {type: string}
              why_both_cannot_hold: {type: string}
              which_is_right:
                type: string
                enum: [request, test, code, unknown, query]
              correct_lines:
                type: array
                items: {type: string}
              kind:
                type: string
                enum: [brief_vs_judgment, unnamed_test_broke, not_red, scope_needed, query_hits_fixed, needs_context]
              bash_writes:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [path, why]
                  properties:
                    path: {type: string, minLength: 1}
                    why: {type: string, minLength: 10}

        # 新しい単位（1 周目と単位が替わる周。新しい会話）。tdd の後ろの層（同じ層に置くと Archon は並んだ層として会話を切る）
        - id: tdd-new
          description: 'TDD の役（今の単位を直す。新しい単位）'
          <<: *tdd_launch
          depends_on: [tdd-prep, tdd]
          trigger_rule: none_failed_min_one_success
          when: "$tdd-prep.output.go == true && $tdd-prep.output.new_unit == true"
          context: fresh
          output_format: *tdd_reply

        - id: tdd-step
          script: tdd_step
          runtime: uv
          depends_on: [tdd-prep, tdd, tdd-new]
          trigger_rule: none_failed_min_one_success
          with:
            reply: {from: "$tdd.output", if_skipped: null}
            reply_new: {from: "$tdd-new.output", if_skipped: null}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason, reason_file, phase]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              reason_file: {type: string}
              phase: {type: string}

  # 修正役の輪。範囲の外が要る時は返答の欄 consult で頼み、相談の 3 node が答える（その周は受け付けを回さない）。
  # 3 回目の拒否で、名指しの単位だけを段の頭の木に戻して諦め、ほかは先へ。max_iterations 12 は拒否 3 回 + 相談の枠 9
  - id: fix-loop
    depends_on: [group-start, tdd-loop]
    trigger_rule: none_failed_min_one_success
    loop_group:
      max_iterations: 12
      fresh_context: false
      until_bash: done=$fix-accept.output.done; test "$done" = true
      nodes:
        - id: fix-prep
          script: fix_prep
          runtime: uv
          mutates_checkout: false
          output_format: *fix_prep_out

        - id: fixer
          description: '修正役: TDD のループで直していない単位を直す'
          <<: *fix_launch
          prompt: "$fix-prep.output.prompt"
          depends_on: [fix-prep]
          when: "$fix-prep.output.go == true"
          output_format: *fix_reply

        - id: consult-check
          script: consult_check
          runtime: uv
          mutates_checkout: false
          depends_on: [fixer]
          with:
            reply: $fixer.output
            pass: first
          output_format: *consult_check_out

        - id: consult-answer
          description: '範囲の相談に答える（修正案と波及を読む。読むだけ）'
          <<: *consult_launch
          prompt: "$consult-check.output.prompt"
          depends_on: [consult-check]
          when: "$consult-check.output.go == true"
          mutates_checkout: false
          output_format: *consult_answer

        - id: consult-accept
          script: consult_accept
          runtime: uv
          mutates_checkout: false
          depends_on: [consult-check, consult-answer]
          trigger_rule: none_failed_min_one_success
          with:
            answer: {from: "$consult-answer.output", if_skipped: null}
            pass: first
          output_format: *consult_accept_out

        - id: fix-accept
          script: fix_accept
          runtime: uv
          depends_on: [fix-prep, consult-accept]
          trigger_rule: none_failed_min_one_success
          with:
            reply: {from: "$fixer.output", if_skipped: null}
            consulted: {from: "$consult-accept.output.consulted", if_skipped: false}
          output_format: *accept_out

  # 終わりの木・単位ごとの結末・TDD の輪の結果・申し出・異議・修正役の印・許したテストの変更を out_dir/<group_id>/result.json に書く
  - id: group-end
    script: group_end
    runtime: uv
    mutates_checkout: false
    depends_on: [group-start, tdd-loop, fix-loop]
    trigger_rule: none_failed_min_one_success
    output_format:
      type: object
      additionalProperties: false
      required: [result_file]
      properties:
        result_file: {type: string}

  # ---- 両方の形の終わり ----

  # どの node かが落ちた run で飛ぶ柵。どの node もこれに依存しない sink で、返す node finish（all_done で必ず済み、この時は ok: false）と
  # 別に、node が落ちたことを block の出口に出す。finish と fix-reads のほかの全部の node（loop の node を含む）に結ぶ（足した node を結び
  # 忘れると配線の試験が落ちる）。when を書かない（when で飛ぶ node は落ちと数えない）
  - id: nodes-ok
    bash: "true"
    depends_on: [intake, prep, groups-par, groups-seq, join, clash-loop, conflict-check, rule-loop, clash-ruled-loop, fix-ruled-loop, clean,
                 assert-changed, group-start, tdd-loop, fix-loop, group-end]
    trigger_rule: none_failed_min_one_success
    mutates_checkout: false

  # 読んだ証拠（受け付けの条件にしない。返す node に結ばない）。修正役と裁定の後の修正役が、機械が渡したパス（判定の写し・brief）を
  # 読んだかを、フックの記録から集めて place の reads-<役>.json と索引に書く。前の node が落ちても飛ばされても走り、落ちない
  - id: fix-reads
    script: fix_reads
    runtime: uv
    mutates_checkout: false
    depends_on: [fix-loop, fix-ruled-loop]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, missing, index_file, reason]
      properties:
        ok: {type: boolean}
        missing: {type: array, items: {type: string}}
        index_file: {type: string}
        reason: {type: string}

  # 前の node の返りを with: で束ねず、各 node が place に書いたファイルを読んで出力の欄を組む。前の node が落ちても飛ばされても走り、
  # この node は落ちない（中の誤りは ok: false と理由で返す）
  - id: finish
    script: finish
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, prep, groups-par, groups-seq, join, clash-loop, conflict-check, rule-loop, clash-ruled-loop, fix-ruled-loop, clean,
                 assert-changed, group-start, tdd-loop, fix-loop, group-end, fix-reads]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, reason, units, groups, conflicts, carry, replan_items, objection, diff, start_tree, reply, ruled_reply, scope,
                 checked, allowed_test_changes, changed, x_scalars, handoffs, mismatched, plan_declared, stop_reason, allowed_tests,
                 accept_trace, closure, tdd_unit, tdd, frozen, removed, tdd_refused, item_claims, freeze_off, report]
      properties:
        ok: {type: boolean}
        reason: {type: string}
        units:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [unit_id, group_id, status, reason]
            properties:
              unit_id: {type: string}
              group_id: {type: string}
              status: {type: string, enum: [fixed, given_up, not_done]}
              reason: {type: string}
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [group_id, unit_ids, returned, reason]
            properties:
              group_id: {type: string}
              unit_ids: {type: array, items: {type: string}}
              returned: {type: boolean}
              reason: {type: string}
              backed_out: {type: array, items: {type: string}}
              unrestored: {type: array, items: {type: string}}
              # 合わせのループの結末（join が確かめ直しの赤で戻した組と字で当たらなかった組だけ。後者は backed_out を持たない）: 合わせ役が直して当てた（repaired）か、申し出へ回した（parked）か
              clash:
                type: object
                additionalProperties: false
                required: [outcome, requests, patch]
                properties:
                  outcome: {type: string, enum: [repaired, parked]}
                  requests: {type: array, items: {type: string}}
                  patch: {type: string}
        conflicts: &pointer_or_null

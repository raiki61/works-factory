# 単独の run: 依頼の行と機械の確かめの有無だけで最後まで届く（script は本当に走り、AI の役の返答だけを差し替える）。
# 役の返答の引用は受け付けが依頼の字と照らし、通れば一番重い種類（原因）から標準を引く
fixture:
  expect: completed
  reached: [intake, head-depth-prep, head-depth, head-depth-accept, finish]
  inputs:
    request: '[{"where": "stats.py:4-5", "text": "mean は 2 でなく 3 を返す"}]'
    has_checks: 'true'
  resolved-text-contains:
    head-depth: 'You are the run-depth role, started in a new conversation.'
exec-code: true
head-depth:
  why: 筋書きの役は原因が残る行を返す
  items:
    - item: 1
      unknown: 原因
      cause_quote: mean は 2 でなく 3 を返す
  groups: []

# 出し直しの役の指示を本当の prep で組んだと照らす筋書き。dry-run の輪は 1 周で、$LOOP_PREV は 1 周目に空なので、本当の plan-prep は出し直しにならない。
# そこでこの筋書きだけ plan-prep を {prompt: "", resubmit: true} で差し替え、plan-fix-prep は本当に走らせる。受け付けは合わせる元の控えが無いので拒み、

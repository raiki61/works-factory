  reached: [intake, provenance-prep, provenance, provenance-accept, finish]
  inputs:
    base: ''
    entry: ''
    lang: ''
  resolved-text-contains:
    provenance: 'You are the provenance role.'
exec-code: true
provenance:
  material:
    status: clean
    checked: the claims in the diff body and docstrings
  claims: []

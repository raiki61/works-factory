name: works-factory-provenance
description: >-
  根拠の出所検査: 対象差分が根拠に引く「正本は X」「規約は X」「合意済み」の X が、差分の根の時点に在るかを確かめ、差分が自分で足した物を引く循環と、
  痕跡の無い外との合意を見つける。素材集めの観点の block（docs/design/materials.md の形）。単独の run でも、判定のまとめから include されても動く
inputs:
  base: {default: "", description: "text: 対象差分の根の commit（対象差分は、この commit から作業ツリーの今の姿まで。未追跡の新しいファイルも入る）。空は HEAD"}
  entry: {default: "", description: "text: 判定から入る run の出どころの文（例「人の依頼（/path/req.json）」）。空は判定から入る run でない"}
  lang: {default: "", description: "text: 人に見せる欄（material の detail・checked・reason、claims の claim・evidence）の言語。空は依頼の言語"}
returns: finish
outcome_field: ok
nodes:
  - id: intake
    script: intake
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [due, reason]
      properties:
        due: {type: boolean}
        reason: {type: string}
  - id: provenance-loop
    depends_on: [intake]
    when: $intake.output.due == true
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: done=$provenance-accept.output.done; test "$done" = true
      nodes:
        - id: provenance-prep
          script: role_prep
          runtime: uv
          mutates_checkout: false
          output_format:
            type: object
            additionalProperties: false
            required: [prompt]
            properties:
              prompt: {type: string}
        - id: provenance
          prompt: "$provenance-prep.output.prompt"
          depends_on: [provenance-prep]
          model: '@wf-judge-materials'
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, Bash, WebSearch, WebFetch]
          sandbox:
            enabled: true
            allowUnsandboxedCommands: false
            failIfUnavailable: true
            enableWeakerNetworkIsolation: true
            network:
              allowedDomains: ['*']
              allowLocalBinding: true
            # 作業ツリー・ほかの run の worktree・artifacts を書けなくする（~ は起動が隔離した HOME で、~/../archon-home が Archon の家。
            # '.' は cwd でなく設定の一時ファイルのフォルダに解かれる。実測 2026-10-13。issue #293）
            # 起こす直前に包み（workflows/.shared/fence.py）がこの値を印と読み、cwd・共通の .git・worktree の根などを足す（#309）
            filesystem:
              allowWrite: [/]
              denyWrite: ['~/../archon-home']
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            required: [material, claims]
            additionalProperties: false
            properties:
              material:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [found, clean, carried_over, not_applicable, awaiting_human, not_run]
                  count: {type: integer, minimum: 0}
                  detail: {type: string}
                  checked: {type: string}
                  reason: {type: string}
                  from_round: {type: integer, minimum: 1}
              claims:
                type: array
                items:
                  type: object
                  required: [claim, exists_at_base, evidence]
                  additionalProperties: false
                  properties:
                    claim: {type: string}
                    exists_at_base: {type: boolean}
                    evidence: {type: string}
        - id: provenance-accept
          script: role_accept
          runtime: uv
          mutates_checkout: false
          depends_on: [provenance]
          with: {reply: $provenance.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
  - id: finish
    script: finish
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, provenance-loop]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, status, reason, material, report]
      properties:
        ok: {type: boolean}
        status: {type: string, enum: [ran, skipped, gave_up, failed]}
        reason: {type: string}
        material:
          type: [object, "null"]
          required: [type, run_id, path]
          properties:
            type: {const: archon_artifact}
            run_id: {type: string}
            path: {type: string}
        report: {type: array, items: {type: string}}

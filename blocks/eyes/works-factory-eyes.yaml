name: works-factory-eyes
description: '独立の目のまとめの graph（docs/design/judge-eyes.md の 2 節）。修正の後に、直しを作った役と別の会話で差分を確かめる 4 つの目（r1〜r4）と、直した後の構造の実測（structure の mode after）を並べ、目の判定をまとめて変更を通してよいか（ok）を出す。目を回すか・R3 を R4 にまとめるかは呼び手が flag で渡す。line から 1 つの include で呼ばれ、単独でも差分の根と目的と単位だけで回る'
inputs:
  run: {default: 'true', description: 'flag: 4 つの目を回すか（偽なら目を起こさず、直した後の実測だけを回す）'}
  merge: {default: 'false', description: 'flag: R3 の観点を R4 の会話に入れるか（r3 を回さず、r4 の coherence を真にする）'}
  skip_why: {default: '', description: 'text: 目を回さない訳（報告の行）。空は訳が渡されていない'}
  base: {default: '', description: 'text: 累積差分の根の commit（入口の差分の根。差分の run では PR の根）。累積差分はここから作業ツリーの今の姿まで（未追跡の新しいファイルも入る）。空は HEAD'}
  lang: {default: '', description: 'text: 人に見せる欄の言語（include する block のどれにも渡す）。空は依頼の言語'}
  green: {default: 'true', description: 'flag: 修正の後の試験の緑が認証されたか（試験の関門 final の ok）。偽なら目の指示に「最後のテストの認証が通っていない」の 1 文を足す'}
  policy: {default: '', description: 'file: 人の方針の文書を run の頭で固めた写し。空は方針の文書が無い'}
  review: {default: '{}', description: 'json(shared:plan-verdict.schema.json): 修正が使った修正案を審査した事前審査の最後の往復の結論 {round, verdict, blocks, why}。空のオブジェクトは渡されていない'}
  answers: {default: '{}', description: 'json(shared:gate-answers.schema.json): 承認ノードの人の答え {start, before_fix}。空のオブジェクトは答えが無い'}
  request: {default: '', description: 'file: 依頼のファイル（工場の依頼の JSON）。空は依頼のファイルが無い'}
  changed: {default: '{}', description: 'json(shared:fix-marks.schema.json): 修正の印（修正の出力の changed）。空のオブジェクトは渡されていない'}
  pushes: {default: '[]', description: 'json(shared:pushes.schema.json): 無人の run が判定の保留の問いに採った推しの文の配列。空の配列は無い'}
  decisions: {default: '', description: 'file: 先行議論の突合の素材（prior-decisions の block の出力 material の先）。空は突合が無い'}
  purpose: {default: '', description: 'text: 元の目的の 1 文（目的の固定の purpose_text）。空は渡されていない'}
  units: {default: '[]', description: 'json(shared:units.schema.json): 判定が切った根本の単位の目録 [{id, summary, paths}]。空の配列は渡されていない（直した後の実測は差分の全体を 1 つの単位として見る）'}
  judgment: {default: '', description: 'file: 判定の出力（judgment.json）。空は渡されていない'}
  fixes: {default: '[]', description: 'json(eyes-fixes.schema.json): この run の修正の単位ごとの結末 [{unit_id, group_id, status, reason}]。空の配列は渡されていない'}
  x_scalars: {default: '{}', description: 'json(eyes-scalars.schema.json): 修正役が足した規模の数値の欄（名は x_ で始まる）の object。空の object は無い'}
  checks: {default: '', description: 'file: 最後の試験の関門の証拠の文（試験の関門 final の出力 evidence の先）。空は渡されていない'}
  head: {default: '', description: 'text: 修正前の HEAD（審査する変更の先の版。直した後の実測の直す前の版にも使う）。空は HEAD'}
  base_label: {default: '', description: 'text: 累積差分の起点の出どころの文（例「PR #12 の根」）。空は書かない'}
  design: {default: 'null', description: 'json(eyes-design.schema.json): 独立設計の役の返答（独立設計の block の出力 design の先）。null は独立設計が無い'}
  design_reason: {default: '', description: 'text: 独立設計が無い訳（独立設計の block の出力 reason）。空は訳が無い'}
  design_premises: {default: 'null', description: 'json(eyes-design-premises.schema.json): 独立設計の控え（独立設計の block の出力 premises の先）。null は控えが無い'}
  constraints: {default: '[]', description: 'json(shared:constraints.schema.json): 記録の制約（前提の実測の出力 constraints）。空の配列は無い'}
  test_outcomes: {default: 'null', description: 'json(eyes-outcomes.schema.json): テストごとの base と最後の結末 {rows, unmeasured}。null は渡されていない'}
  tdd: {default: 'null', description: 'json(eyes-tdd.schema.json): 修正の段ごとの TDD の記録。null は渡されていない'}
  ripple: {default: '', description: 'file: 波及の一覧（修正案の出力 ripple の先）。空は渡されていない'}
  world_rows: {default: '', description: 'file: 定石の行（world の block の出力 rows の先）。空は渡されていない'}
  asked: {default: '[]', description: 'json(eyes-asked.schema.json): 修正前の承認ノードで聞いた項目 [{kind, text}]。空の配列は聞いていない'}
  declared: {default: '[]', description: 'json(eyes-declared.schema.json): 直す側が直さずに残すと答えた事前審査の block の行。空の配列は無い'}
  plan: {default: '', description: 'file: 修正が使った修正案の欄のファイル（plan-fields.json）。直した後の実測が構造の目の避け方から外れた訳を読む。空は渡されていない'}
  intent: {default: '[]', description: 'json(eyes-intent.schema.json): 対象の書いた意図の文書のパスの配列。空の配列なら直した後の実測が決まった名で探す'}
returns: verdict
outcome_field: ok
nodes:
  - id: ins
    script: ins
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [run, merge, head]
      properties:
        run: {type: boolean}
        merge: {type: boolean}
        head: {type: string}
  # 直した後の実測は目を省く run でも回す（E71）。when: を持たない
  - id: structure-after
    include: works-factory-structure
    depends_on: [ins]
    with:
      mode: "after"
      units: "$INPUTS.units"
      intent: "$INPUTS.intent"
      policy: "$INPUTS.policy"
      base: "$ins.output.head"
      plan: "$INPUTS.plan"
      lang: "$INPUTS.lang"
  - id: structure-after-out
    # 受け皿の本体はここ 1 か所。ほかは <<: *receiver で受け、id・depends_on・with だけを書く（names は運ぶ欄の名）
    <<: &receiver
      script: returned
      runtime: uv
      mutates_checkout: false
      output_format:
        type: object
        additionalProperties: false
        required: [got, why]
        properties:
          got: {type: [object, 'null']}
          why: {type: string}
    depends_on: [structure-after]
    with:
      got: "$structure-after.output"
      names: "ok status reason structure after dirty escalate report"
  - id: after-in
    script: after_in
    runtime: uv
    mutates_checkout: false
    depends_on: [ins, structure-after-out]
    trigger_rule: none_failed_min_one_success
    with:
      structure_after_out: {from: "$structure-after-out.output", if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [after, why]
      properties:
        after: {type: [object, string]}
        why: {type: string}
  - id: r1
    include: works-factory-r1
    depends_on: [after-in]
    when: "$ins.output.run == true"
    with:
      base: "$INPUTS.base"
      purpose: "$INPUTS.purpose"
      units: "$INPUTS.units"
      judgment: "$INPUTS.judgment"
      fixes: "$INPUTS.fixes"
      x_scalars: "$INPUTS.x_scalars"
      green: "$INPUTS.green"
      checks: "$INPUTS.checks"
      after: "$after-in.output.after"
      review: "$INPUTS.review"
      policy: "$INPUTS.policy"
      lang: "$INPUTS.lang"
  - id: r1-out
    <<: *receiver
    depends_on: [r1]
    with:
      got: "$r1.output"
      names: "ok status reason verdict questions report"
  # r2 は直した後の実測を読まないので待たない（E9）
  - id: r2
    include: works-factory-r2
    depends_on: [ins]
    when: "$ins.output.run == true"
    with:
      base: "$INPUTS.base"
      head: "$INPUTS.head"
      base_label: "$INPUTS.base_label"
      purpose: "$INPUTS.purpose"
      design: "$INPUTS.design"
      design_reason: "$INPUTS.design_reason"
      design_premises: "$INPUTS.design_premises"
      answers: "$INPUTS.answers"
      request: "$INPUTS.request"
      changed: "$INPUTS.changed"
      constraints: "$INPUTS.constraints"
      test_outcomes: "$INPUTS.test_outcomes"
      tdd: "$INPUTS.tdd"
      lang: "$INPUTS.lang"
  - id: r2-out
    <<: *receiver
    depends_on: [r2]
    with:
      got: "$r2.output"
      names: "ok status reason verdict questions premise_check notes report"
  - id: r3
    include: works-factory-r3
    depends_on: [after-in]
    when: "$ins.output.run == true && $ins.output.merge == false"
    with:
      base: "$INPUTS.base"
      green: "$INPUTS.green"
      after: "$after-in.output.after"
      review: "$INPUTS.review"
      policy: "$INPUTS.policy"
      answers: "$INPUTS.answers"
      request: "$INPUTS.request"
      pushes: "$INPUTS.pushes"
      decisions: "$INPUTS.decisions"
      lang: "$INPUTS.lang"
  - id: r3-out
    <<: *receiver
    depends_on: [r3]
    with:
      got: "$r3.output"
      names: "ok status reason verdict questions report"
  # R4 は R1・R2 の後に、どちらかが落ちても回す（E8。落ちた目は受け皿が飛ぶだけ）
  - id: r4
    include: works-factory-r4
    depends_on: [after-in, r1-out, r2-out]
    trigger_rule: none_failed_min_one_success
    when: "$ins.output.run == true"
    with:
      base: "$INPUTS.base"
      green: "$INPUTS.green"
      after: "$after-in.output.after"
      review: "$INPUTS.review"
      policy: "$INPUTS.policy"
      answers: "$INPUTS.answers"
      request: "$INPUTS.request"
      changed: "$INPUTS.changed"
      pushes: "$INPUTS.pushes"
      decisions: "$INPUTS.decisions"
      purpose: "$INPUTS.purpose"
      ripple: "$INPUTS.ripple"
      world_rows: "$INPUTS.world_rows"
      asked: "$INPUTS.asked"
      declared: "$INPUTS.declared"
      coherence: "$ins.output.merge"
      lang: "$INPUTS.lang"
  - id: r4-out
    <<: *receiver
    depends_on: [r4]
    with:
      got: "$r4.output"
      names: "ok status reason verdict questions passes coherence report"
  - id: verdict
    script: verdict
    runtime: uv
    mutates_checkout: false
    depends_on: [ins, after-in, structure-after-out, r1-out, r2-out, r3-out, r4-out]
    trigger_rule: all_done
    with:
      structure_after_out: {from: "$structure-after-out.output", if_skipped: null}
      r1_out: {from: "$r1-out.output", if_skipped: null}
      r2_out: {from: "$r2-out.output", if_skipped: null}
      r3_out: {from: "$r3-out.output", if_skipped: null}
      r4_out: {from: "$r4-out.output", if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [ok, r1, r2, r3, r4, questions, passes, premise_check, notes, after, dirty, escalate, after_ok, report, sections, optional]
      properties:
        ok: {type: boolean}
        r1: &row
          type: [object, 'null']
          properties:
            status: {type: string}
            reason: {type: string}
        r2: *row
        r3: *row
        r4: *row
        questions: {type: array, items: {type: string}}
        passes: {type: array, items: {type: object}}
        premise_check: {type: [object, 'null']}
        notes: {type: array, items: {type: string}}
        after: {type: [object, 'null']}
        dirty: {type: integer}
        escalate: {type: integer}
        after_ok: {type: boolean}
        report: {type: array, items: {type: string}}
        sections:
          type: array
          items:
            type: object
            required: [title, lines]
            properties:
              title: {type: string}
              lines: {type: array, items: {type: string}}
        optional:
          type: array
          items:
            type: object
            properties:
              node: {type: string}
              bare: {type: boolean}

# 止め札で止めた run（最後の承認ノードの止める語で、文が request: で始まる）。facts と出口の script が本当に走り、結末は stopped_by_request
# （持ち主の決め report-on-stop: 止めた run も報告を出す）。AI の node だけを差し替える
fixture:
  expect: completed
  reached: [facts, write-prep, write, cold-prep, cold, write-accept, finish]
  inputs:
    sections: '[]'
    facts: '{"start_ok": true, "gates": [{"at": "final-answer", "decision": "stop", "text": "request: 止め札"}]}'
  resolved-text-contains:
    write: 'The outcome word of this run is **stopped_by_request**'
exec-code: true
write:
  text: "止め札で止めた。\n最後の承認ノードの前で止めた。\n続けるなら新しい run を始める。"
  terms: []
  handoff: {read: [], kept: [], set_aside: [], open: []}
cold: {verdict: pass, stops: [], guessed: [], decidable: true}

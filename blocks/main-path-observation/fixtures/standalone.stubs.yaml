# 単独の run: port の値だけで最後まで届く（始めの記録を読まない）。script は本当に走り、観測の役の返答だけを差し替える。
# 指示が md から組まれたことを md の決まった文で照らす。出口の status が ran になることと、観測の行の受け付けは
# tests/blocks/main_path_observation の試験が確かめる（筋書きは値と node の返りの欄を照らさない）
fixture:
  expect: completed
  reached: [intake, main-path-observation-prep, main-path-observation, main-path-observation-accept, finish]
  inputs:
    base: ''
    entry: ''
    lang: ''
  resolved-text-contains:
    main-path-observation: 'You are the main-path-observation role.'
exec-code: true
main-path-observation:
  material:
    status: clean
    checked: the command line entry of the changed tool, run once on a copy of the repository
  observed:
    - path: the changed command, run once from the command line
      value: it printed the usage text and exited with status 0

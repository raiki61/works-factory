# 却下は 1 回で、3 回で諦めて出口が status: gave_up を返す数えは tests/blocks/hygiene の試験が確かめる
fixture:
  expect: completed
  reached: [intake, hygiene-prep, hygiene, hygiene-accept, finish]
  inputs:
    base: ''
    entry: ''
    lang: ''
  resolved-text-contains:
    hygiene: '差分を読む役。道具は 1 つも無い'
exec-code: true
hygiene:
  findings: []
  seen: ''

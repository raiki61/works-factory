name: works-factory-resume-probe
description: |
  段 1b の U1 の使い捨ての工程（docs/design/archon.md の U1）。AI の役は無い。関所の前と後に bash の節を置き、関所で止めて
  approve・resume した後も run の id が変わらないかを見る。回すのは tests/e2e/test_resume_probe.py。

nodes:
  - id: first
    bash: echo first
    mutates_checkout: false
  - id: gate
    wait:
      attention: U1 の確かめ
      form: select
      options: [{ id: approve }, { id: reject }]
    depends_on: [first]
  - id: after
    bash: echo after
    mutates_checkout: false
    depends_on: [gate]

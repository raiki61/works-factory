name: works-factory-line
returns: result
outcome_field: ok
nodes:
  - id: rounds
    loop_group:
      max_iterations: 3
      until_bash: 'true'
      nodes:
        - id: ask
          prompt: 前の理由は $INPUTS.reason
          with: { reason: $LOOP_PREV.take.output.reason }
          idle_timeout: 1728000000
  - id: result
    script: stub
    depends_on: [rounds]
    output_format:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]

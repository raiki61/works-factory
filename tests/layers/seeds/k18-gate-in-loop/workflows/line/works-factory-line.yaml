name: works-factory-line
nodes:
  - id: rounds
    loop_group:
      max_iterations: 3
      until_bash: 'true'
      nodes:
        - id: gate
          wait:
            attention: m
            form: select
            options: [{ id: approve }, { id: continue }, { id: stop }, { id: reject }]
        - id: after
          bash: 'true'
          depends_on: [gate]

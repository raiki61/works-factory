# works-bench: only the task's main container may build the Claude Code sandbox (bwrap): a user namespace and mounts
# inside it, including a fresh /proc. Docker's default seccomp profile plus those syscalls, no AppArmor profile, and
# no masked /proc paths (a masked /proc refuses the mount). Never --privileged or CAP_SYS_ADMIN; the egress sidecar
# keeps Docker's defaults.
services:
  main:
    security_opt:
      - seccomp=${WORKS_BENCH_SECCOMP:?works-bench passes the seccomp profile path}
      - apparmor=unconfined
      - systempaths=unconfined

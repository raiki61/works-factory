# 外のパッケージの宣言の置き場（1 か所。lib/AGENTS.md の E3・持ち主の決め outside-packages-ok）。版は == で止める。
[project]
name = "works-factory"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "PyYAML==6.0.3",  # tests/layers/scan.py が workflows/ の YAML を読む
]

[project.optional-dependencies]
bench = [
    "harbor==0.24.0",  # tests/calibration/swepro_agent.py。運び役が uv run --isolated --extra bench で入れる
]
trace = [
    "opentelemetry-sdk==1.45.2",  # tests/viewer/test_otlp.py と、見る道具の run の記録のトレースの送り（--extra trace で回す）。span を組む
    "opentelemetry-exporter-otlp-proto-http==1.45.2",  # 同じ送りの OTLP/HTTP の protobuf
    "requests==2.34.2",  # 同じ送りが trust_env を切った session を作るために直に import する（exporter の依存に頼らない）
]

# 試験の 2 つの束（tests と lib/tests）を走らせる。check の名は tests
# （harness/harness.config.json の required_checks が名指す。ASF の merge queue が読む）。
# 束の見送りと「1 件も走らない」の扱いは .github/scripts/unittest_suites.py に書いてある。
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: unittest（tests と lib/tests）
        run: python3 .github/scripts/unittest_suites.py

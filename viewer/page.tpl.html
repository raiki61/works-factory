<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>works-factory の作りと run</title>
<!-- 見る道具の雛形（viewer/AGENTS.md の E25。設計は docs/design/viewer.md の 6.5 と docs/plans/2026-10-29-viewer-overview.md の 6.6）。
     viewer/src/page.py が下の印にデータを埋める。ページは 1 枚で完結し、別のファイルからスクリプトを読まない。見た目は試験で縛らない（見ながら直す） -->
<style>
/* 字の段は 4 つ（40/600・22/600・15/400〔強めは 15/600〕・12/400）。色は墨・灰と、押せる所と今の所の青 1 つ。止めたは注意色、落ちたは赤
   色は全部この札（変数）で持ち、下の CSS とスクリプトは札だけを使う。light と dark は札の値だけが違う。
   値の根拠は WCAG の比: 字は地と 4.5:1 以上（灰は 2 段 --sub・--ter）、状態を伝える縁は地と 3:1 以上（--edge・--dash・--stop・--bad）。
   白い字を載せる青い面は light・dark とも #0071e3、字の青は dark で明るい #6ab4ff（札の #3a3a3c の上でも 4.5:1 以上）。
   トークンの 4 分けの「cache から読んだ」--a3 は帯の地 --fill とカードの面 --card に 3:1 以上で、青の 3 段の端に置いて新しく読んだ --accent・
   cache に書いた --a2 と明るさで分ける: light は紺 #1d3f73（--fill に 8.6:1・--card に 10.4:1・--accent と 2.2:1・--a2 と 4.3:1）、
   dark は淡い青 #cfe3fa（--fill に 10.6:1・--card に 13.0:1・--accent と 3.6:1・--a2 と 2.2:1）。今の札の淡い青の輪は --ring */
:root{--th:56px;--pb:0px;color-scheme:light;
  --bg:#f5f5f7;--card:#fff;--raised:#fff;--fill:#e8e8ed;--line:#d2d2d7;--ink:#1d1d1f;--sub:#515154;--ter:#636366;
  --inset:#f5f5f7;--accent:#0071e3;--link:#0066cc;--on-accent:#fff;--on-accent2:#e3eefc;--a2:#66aaf0;--a3:#1d3f73;--ring:#cfe3fa;--now:#e8f1fc;
  --k-ex:#86868b;--k-wait:#c7c7cc;--dash:#7c7c80;--edge:#7c7c80;--stop:#c93400;--bad:#d70015;
  --topbg:rgba(245,245,247,.92);--plbg:rgba(255,255,255,.96);--shadow:#0000001f;--shadow2:#00000033}
/* dark: 地は黒に近い面（#000）と一段ずつ明るい面（#1c1c1e・#2c2c2e・札の #3a3a3c）の重ね。影が見えないので、上に載る物ほど明るい面にする */
:root[data-theme=dark]{color-scheme:dark;
  --bg:#000;--card:#1c1c1e;--raised:#3a3a3c;--fill:#2c2c2e;--line:#38383a;--ink:#f5f5f7;--sub:#aeaeb2;--ter:#98989d;
  --inset:#2c2c2e;--accent:#0071e3;--link:#6ab4ff;--on-accent:#fff;--on-accent2:#e3eefc;--a2:#409cff;--a3:#cfe3fa;--ring:#0a3a6b;--now:#0d2a4a;
  --k-ex:#8e8e93;--k-wait:#545458;--dash:#8e8e93;--edge:#8e8e93;--stop:#ff9f0a;--bad:#ff6961;
  --topbg:rgba(22,22,23,.88);--plbg:rgba(28,28,30,.94);--shadow:#00000099;--shadow2:#000000cc}
*{box-sizing:border-box}
html,body{margin:0}
/* 地は html に置き、ビューアの包みの中でもページの下まで続ける */
html{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
b,strong{font-weight:600}
button,select{font:inherit;color:inherit}
a{color:var(--link);cursor:pointer;text-decoration:none}
/* 押せる物は button にする（鍵盤で届く）。字の口の形の button は .lk で地と縁を外す */
.lk{border:0;background:none;padding:0;color:var(--link);cursor:pointer;text-align:left}
.cap{font-size:12px;font-weight:400;color:var(--sub)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.n{font-variant-numeric:tabular-nums}
.r{text-align:right}

/* 頭の帯: 左に run の 1 行、右にタブと明るさの札。上に貼りつく。戻る札の場所はその下の 1 か所（口と戻り先は後の PR） */
.top{position:sticky;top:0;z-index:20;background:var(--topbg);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--fill)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.who{font-size:12px;color:var(--sub);flex:1 1 220px;min-width:0}
.who b{color:var(--ink)}
.who .lk{font-size:12px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;background:var(--fill);border-radius:10px;padding:3px;max-width:100%}
.tabs button{border:0;background:none;font-size:12px;padding:5px 12px;border-radius:8px;color:var(--sub);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}
.theme{border:0;background:var(--fill);color:var(--sub);border-radius:8px;font-size:12px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.backbar{max-width:1180px;margin:0 auto;padding:0 28px 10px}
.backbar[hidden]{display:none}

/* 画面ごとの型: 小見出し → 主張 1 文 → 補い → 白い角丸の面（枠の線は使わず、面と余白で組を分ける） */
.wrap{max-width:1180px;margin:0 auto;padding:0 28px 24px}
.hero{padding:48px 0 32px}
.hero h1{font-size:40px;font-weight:600;line-height:1.2;margin:6px 0 10px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--sub)}
h2{font-size:22px;font-weight:600;line-height:1.3;margin:4px 0 0}
.card{background:var(--card);border-radius:18px;padding:26px 28px;margin:0 0 20px;min-width:0}
.claim{margin:0}
details{margin:14px 0 0;border-top:1px solid var(--fill);padding-top:10px}
summary{cursor:pointer;color:var(--link);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ＋"}
details[open]>summary::after{content:" −"}
details .in{margin-top:10px}
details ul,details ol{margin:6px 0;padding-left:20px}
details li{margin:5px 0}
pre{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--inset);border-radius:10px;padding:10px 12px;margin:8px 0;max-height:420px;overflow:auto}
pre.err{box-shadow:inset 3px 0 0 var(--bad)}
.chip{display:inline-block;border:0;background:var(--inset);border-radius:8px;padding:3px 10px;margin:3px 4px 3px 0;font-size:12px;cursor:pointer}
/* 動きを減らす設定に従う（WCAG 2.3.3）。説明の文は 1 行 40 字前後で折る（WCAG 1.4.8 の CJK の 40 字） */
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.hero p,.claim,.panel p,.gnote{max-width:40em}

/* 流れ: 段の地図（5 つずつの箱。HTML なので幅 900 でも字が縮まない） */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0 0}
.st{background:var(--inset);border-radius:14px;padding:12px 14px;min-width:0;border:2px solid transparent}
.st .name{font-weight:600}
.st .name,.st .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1000px){ .st{padding:10px} }
/* 走らなかった段は薄めない（段が在ることは読める）。面を外して点線の縁と --ter の字と語「飛んだ」「まだ」で分ける */
.st.skip,.st.yet{background:transparent;border:2px dashed var(--dash);color:var(--ter)}
.st.skip .cap,.st.yet .cap{color:var(--ter)}
.st.skip .name,.st.yet .name{font-weight:400}
.st.stop,.st.fail{border:3px solid var(--stop);padding:11px 13px}
.st.fail{border-color:var(--bad)}
.st.stop .cap,.st.fail .cap{color:var(--ink);font-weight:600}
.st.live{border-color:var(--accent)}
.st.now{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.st.now .cap{color:var(--on-accent2)}
/* 流れ: 時間の帯（HTML の %。段の名の列は字の幅で切らない。右に段ごとの時間と費用） */
.band{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;row-gap:4px;margin:18px 0 0;position:relative}
.band .lab{font-size:12px;color:var(--sub);white-space:nowrap;padding-right:14px;line-height:22px}
.band .lab.now{color:var(--link);font-weight:600}
.band .sum{font-size:12px;color:var(--sub);white-space:nowrap;padding-left:14px;line-height:22px;text-align:right}
.lane{position:relative;height:22px;background:var(--inset);border-radius:6px;cursor:crosshair}
.lane i{position:absolute;top:5px;height:12px;border-radius:3px;min-width:2px}
.k-ai{background:var(--accent)}.k-ex{background:var(--k-ex)}.k-wait{background:var(--k-wait)}
.axis{position:relative;height:18px;grid-column:2}
.axis span{position:absolute;font-size:12px;color:var(--sub);transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none}
.nowline{position:absolute;top:0;width:2px;background:var(--accent);pointer-events:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.fnow{margin:12px 0 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;color:var(--sub);font-weight:400;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--fill);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* 無駄の手がかり: 費用の大きい順の行と、5 つの数のカード（大きな数 1 つと主張 1 文と畳み） */
.rank{list-style:none;margin:16px 0 0;padding:0}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(60px,220px);gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--fill)}
.bar{height:8px;border-radius:4px;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin:0 0 20px}
.grid .card{margin:0}
.big{font-size:40px;font-weight:600;line-height:1.1;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--fill);margin:14px 0 6px}
.split i,.tok i,.tk i{display:block;height:100%}
.tok{display:flex;height:8px;width:140px;border-radius:4px;overflow:hidden;background:var(--fill)}
.c1{background:var(--accent)}.c2{background:var(--a2)}.c3{background:var(--a3)}

/* 図と再生: 札を字の流れのように左から右へ並べ、幅で折り返す（横にはみ出さない）。段は行 */
.gscr .wrap{max-width:1400px;padding:0 20px 24px}
.gbar{display:flex;gap:6px 16px;align-items:baseline;flex-wrap:wrap;padding:16px 0 4px}
.crumb{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:15px;min-width:0}
.gbar .tools{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px}
.gbar select{font-size:12px;border:0;background:var(--card);border-radius:8px;padding:4px 8px;max-width:220px}
.gnote{margin:0 0 12px;font-size:12px;color:var(--sub)}
.gnote b{color:var(--ink)}
.gkey{margin:0 0 4px;font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.gkey .kt{margin-right:4px}
.gkey .tw{color:var(--link);font-weight:600}
#s-graph.popen .wrap{padding-right:420px}
.map{display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
/* 段の行: 左に段の名と状態（いつも見える列）、右にその段の札 */
.row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;border-radius:14px;padding:7px 10px;scroll-margin:calc(var(--th) + 12px) 0 calc(var(--pb) + 12px)}
.row.one{grid-template-columns:minmax(0,1fr)}
.row .rh{min-width:0}
.row .rh .name{font-weight:600}
.row .rh .name,.row .rh .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.off .rh .name{color:var(--sub);font-weight:400}
.row.stop{box-shadow:inset 4px 0 0 var(--stop)}
.row.fail{box-shadow:inset 4px 0 0 var(--bad)}
.row.now{background:var(--now)}
.row.stop .rh .rst,.row.fail .rh .rst{color:var(--ink);font-weight:600}
.row.folded{padding-top:3px;padding-bottom:3px}
.flowl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;min-width:0}
.arr{color:var(--ter);font-size:12px;padding:0 2px;flex:none}
.seg{display:inline-flex;align-items:center;gap:4px;max-width:100%;min-width:0}
.grp{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--fill);border-radius:12px;padding:3px;max-width:100%}
.loopg{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 4px;border:1.5px dashed var(--dash);border-radius:12px;padding:5px 7px;max-width:100%}
.loopg>.cap{width:100%;padding:0 3px}
.loopg.now{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
/* 札: 1 行。種類の語の札と何をする物か（15/600）とこの run での姿の語（12/400）。id は札の title と板の頭 */
.node{background:transparent;text-align:left;display:inline-flex;align-items:baseline;gap:7px;max-width:300px;min-width:0;border-radius:10px;padding:5px 10px;cursor:pointer;white-space:nowrap;border:1.5px solid transparent;scroll-margin:calc(var(--th) + 16px) 0 calc(var(--pb) + 16px)}
.node .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
.node .s{font-size:12px;color:var(--sub);flex:none}
/* 札の姿: 走った（縁と面）・走っていない（縁も面も無い灰の字）・飛んだ（点線）・止めた（注意色の太い縁と ■）・落ちた（赤の太い縁と ✕）。色だけに頼らない */
.node.done{background:var(--raised);box-shadow:0 1px 2px var(--shadow);border-color:var(--edge)}
.node.yet{color:var(--ter);background:transparent}
.node.skip{color:var(--ter);background:transparent;border:1.5px dashed var(--dash);font-size:12px;padding:3px 8px}
.node.yet .t,.node.skip .t{font-weight:400}
.node.stopat,.node.fail{border:3px solid var(--stop);padding:3px 8px}
.node.stopat{background:var(--raised)}
.node.fail{border-color:var(--bad)}
.node.stopat .s,.node.fail .s{color:var(--ink);font-weight:600}
.node.stopat .s::before{content:"■ ";color:var(--stop)}
.node.fail .s::before{content:"✕ ";color:var(--bad)}
.mk{font-weight:600}
.mk.stop{color:var(--stop)}.mk.bad{color:var(--bad)}
.node.run{background:var(--raised);border-color:var(--accent)}
/* 再生の今: 青い面に白い字と淡い青の輪（一番深い今の札だけ）。今を中に持つ開いた入れ子の札は淡い青の面と青い縁と「今は中」 */
.node.now{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.node.now .s{color:var(--on-accent2)}
.node.nowin{background:var(--now);border-color:var(--accent)}
.node.nowin .s{color:var(--link);font-weight:600}
.node.rel{background:var(--now)}
.node.sel{outline:2px solid var(--ink);outline-offset:1px}
/* 種類の札: 札の頭の短い語（AI・人・子の run・止め）。機械（script・bash）は語の札を出さない（札が無いことが印）。
   AI だけ墨の面、人は 2px の墨の縁と太字、ほかは 1px の縁。走っていない札・飛んだ札の上では --ter に落とす */
.kt{display:inline-block;flex:none;font-size:12px;font-weight:400;line-height:16px;padding:0 5px;border-radius:5px;border:1px solid var(--sub);color:var(--sub);white-space:nowrap;vertical-align:1px}
.kt.ai{background:var(--ink);border-color:var(--ink);color:var(--card)}
.kt.part{background:transparent;border-color:var(--ink);color:var(--ink)}
.kt.gate{border:2px solid var(--ink);color:var(--ink);font-weight:600;line-height:14px}
.node.yet .kt,.node.skip .kt{border-color:var(--ter);color:var(--ter)}
.node.yet .kt.ai,.node.skip .kt.ai{background:var(--ter);color:var(--bg)}
/* 今の札（青い面）の上の種類の札: 縁と字は白、AI は白い面に青い字 */
.node.now .kt{border-color:var(--on-accent);color:var(--on-accent)}
.node.now .kt.ai{background:var(--on-accent);border-color:var(--on-accent);color:var(--accent)}
/* 入れ子の札: 頭に ＋（閉じている）か −（開いている）。押すとその場で開く */
.node .tw,.nestbox .tw{font-size:15px;font-weight:600;color:var(--link);flex:none;line-height:1}
.node.opened{border-color:var(--line)}
.node.now .tw{color:var(--on-accent2)}
/* 開いた入れ子: 層の後ろで行を折り（幅いっぱい）、字下げと左の縦の線で中を出す。何段でも同じ形 */
.nestbox{flex:1 0 calc(100% - 14px);max-width:calc(100% - 14px);min-width:0;margin:2px 0 4px 14px;padding:4px 0 6px 14px;border-left:2px solid var(--line);scroll-margin:calc(var(--th) + 16px) 0 calc(var(--pb) + 16px)}
.nestbox .nh{font-size:15px;margin:0 0 6px;display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.nestbox.nowin{border-left-color:var(--accent)}
/* 開いた入れ子を中に持つ繰り返しと同じ層の束は、幅いっぱいに広げて中を折り返す */
.loopg:has(>.nestbox),.loopg:has(>.seg>.nestbox){display:flex;width:100%}
.grp:has(.nestbox){display:flex;width:100%}
.seg:has(.nestbox){flex:1 0 100%}
.seg:has(.nestbox)>.loopg,.seg:has(.nestbox)>.grp{flex:1 1 auto;min-width:0}
/* 入れ子の中の走らなかった層は 1 つの札に畳む */
.idle{background:transparent;font-size:12px;color:var(--ter);border:1.5px dashed var(--dash);border-radius:10px;padding:3px 8px;white-space:nowrap;cursor:pointer}
/* 依存の線の試作（選んだ札の前後にだけ引く。今の形と並べて選ぶ） */
.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.edges path{fill:none;stroke:var(--link);stroke-width:1.5}
.edges .head{fill:var(--link)}
/* 板: 札を押した時だけ開く画面に固定の面。上の端は頭の帯の下 */
.panel{background:var(--card);border-radius:18px;overflow:auto;padding:20px 24px;position:fixed;right:20px;width:380px;top:calc(var(--th) + 12px);bottom:calc(var(--pb) + 24px);z-index:15;box-shadow:0 2px 12px var(--shadow)}
.panel .close{float:right;border:0;background:var(--inset);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:15px;color:var(--sub)}
.panel h2{margin:4px 0 8px}
.nums{display:flex;gap:28px;flex-wrap:wrap;margin:14px 0 0}
.nums .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.ev{border-top:1px solid var(--fill);padding:10px 0}
.turns{margin:8px 0}
.turn{display:grid;grid-template-columns:52px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12px;color:var(--sub);margin:2px 0}
.tk{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--fill)}
.tkey{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.tkey i{display:inline-block;width:10px;height:6px;border-radius:2px;margin-right:4px;vertical-align:1px}
@media (max-width:1180px){
  #s-graph.popen .wrap{padding-right:20px}
  /* 狭い時の板は図に右から重ねる */
  .panel{right:12px;width:min(420px,calc(100% - 24px));box-shadow:0 8px 32px var(--shadow2)}
}

/* 再生の帯: 1 つの物を、図と再生のタブにだけ画面の下に固定して出す。いつも一番上の層。
   ページの下の余白と板の下の端は、帯の測った高さ（--pb）だけ空け、帯が中身と板を隠さない */
.player{position:fixed;left:0;right:0;bottom:12px;z-index:30;padding:0 12px;pointer-events:none}
.player[hidden]{display:none}
.player .in{pointer-events:auto;max-width:1000px;margin:0 auto;background:var(--plbg);backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 4px 24px var(--shadow);padding:10px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.player .btns{display:flex;gap:4px}
.player .btns button{border:0;background:var(--inset);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:15px}
.player .btns button.main{background:var(--accent);color:var(--on-accent);min-width:44px}
.player input[type=range]{width:100%;accent-color:var(--accent)}
.player .what{grid-column:1/-1;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .what b{color:var(--ink);font-size:15px}
main{padding-bottom:calc(var(--pb) + 24px)}

/* run の一覧: 1 行 1 本の詰めた並び。今の run は行の面だけを替え、字の位置は動かさない */
.rl{display:flex;flex-direction:column}
.rr{display:grid;grid-template-columns:84px minmax(0,1fr) 128px 64px 72px;gap:12px;align-items:baseline;padding:7px 10px;border-radius:10px;cursor:pointer}
.rr+.rr,.rcmd+.rr{box-shadow:inset 0 1px 0 var(--fill)}
.rr.rhd{cursor:default;padding-top:0}
.rr.cur{background:var(--now);box-shadow:none}
.rr.cur+.rr,.rr.cur+.rcmd+.rr{box-shadow:none}
.rr:not(.rhd):hover{background:var(--inset)}
.rr.cur:hover{background:var(--now)}
.rr .oc{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .oc.bad,.lgr.bad .w{font-weight:600}
.rcmd{padding:4px 10px 10px 106px}
.rcmd .mono{word-break:break-all}
.warn{font-weight:600}
/* ログ: 段の見出しと出来事の行（1 行 1 件）。行を押すと中身 */
.jump{display:flex;flex-wrap:wrap;margin:0 0 14px}
.card.log{padding-top:12px}
.lgh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:18px 0 6px;scroll-margin-top:calc(var(--th) + 12px);border-bottom:1px solid var(--line)}
.lgh .name{font-size:15px;font-weight:600}
.lgr{display:grid;grid-template-columns:52px 64px minmax(0,1fr) auto 56px;gap:10px;align-items:baseline;padding:4px 6px;border-radius:8px;cursor:pointer}
.lgr:hover,.lgr.open{background:var(--inset)}
.lgr .w{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lgr .st2{white-space:nowrap}
.lgb{padding:4px 6px 10px 112px}
@media (max-width:760px){ .stages{grid-template-columns:repeat(2,minmax(0,1fr))} .row{grid-template-columns:minmax(0,1fr)}
  .lgr{grid-template-columns:52px minmax(0,1fr) 56px} .lgr>:nth-child(2),.lgr .st2{display:none} .lgb,.rcmd{padding-left:6px}
  .rr{grid-template-columns:76px minmax(0,1fr) 64px} .rr>:nth-child(3),.rr>:nth-child(4){display:none} }
/* 読めなかった物 */
.ur{border-top:1px solid var(--fill);padding:10px 0}
.ur:first-child{border-top:0}
.urh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.foot{margin:16px 0 0}
</style>
</head>
<body>
<script type="application/json" id="data">__DATA__</script>
<div class="app">
<header class="top"><div class="in"><div class="who" id="who"></div><nav class="tabs" id="tabs"></nav><button class="theme" id="theme" title="表示の明るさ。自動は OS とエディタの設定に従う"></button></div><div class="backbar" id="backbar" hidden></div></header>
<main>
  <section class="screen" id="s-flow" hidden><div class="wrap" id="flow"></div></section>
  <section class="screen" id="s-waste" hidden><div class="wrap" id="waste"></div></section>
  <section class="screen gscr" id="s-graph" hidden><div class="wrap">
    <div class="gbar"><div class="crumb" id="crumb"></div><div class="tools" id="gtools"></div></div>
    <p class="gkey" id="gkey"></p>
    <p class="gnote" id="gnote"></p>
    <div id="notes"></div>
    <div class="map" id="world"></div>
    <aside class="panel" id="panel" hidden></aside>
  </div></section>
  <section class="screen" id="s-runs" hidden><div class="wrap" id="runs"></div></section>
  <section class="screen" id="s-log" hidden><div class="wrap" id="log"></div></section>
  <section class="screen" id="s-unread" hidden><div class="wrap" id="unread"></div></section>
</main>
<div class="player" id="player" hidden><div class="in">
  <div class="btns"><button id="p-prev" title="1 歩戻る（←）">‹</button><button class="main" id="p-play" title="再生と止める（空白）">▶</button><button id="p-next" title="1 歩進む（→）">›</button><button id="p-off" title="再生をやめて run の終わりの姿へ">■</button></div>
  <input type="range" id="p-pos" min="0" value="0" aria-label="再生の位置（歩の番号）">
  <div class="what" id="p-what"></div>
</div></div>
</div>
<script>
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const G = D.shape.graphs, RUN = D.run, TX = D.texts || {}, TJ = D.texts_ja || {};
const $ = id => document.getElementById(id);
// 動きを減らす設定の時は、送りを飛ばす（WCAG 2.3.3）
const SMOOTH = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
// 字は全部 textContent で置く（記録の字を HTML として読まない）
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'text') el.textContent = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
// 押せる物は button（.lk は字の口の形）。行のように button にできない物は press で Enter と空白を押したのと同じに動かす
const btn = (attrs, ...kids) => h('button', {type: 'button', ...attrs, class: 'lk' + (attrs.class ? ' ' + attrs.class : '')}, ...kids);
const press = el => { el.addEventListener('keydown', ev => { if (ev.target === el && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); el.click(); } }); return el; };
const fold = (title, body, open) => h('details', {open: open || null}, h('summary', {}, title), h('div', {class: 'in'}, body));
const pre = (s, cls) => h('pre', {class: cls || null, text: s});
const text = m => TX[m] ?? '';
// 日本語の写し（人が読むための射影。LLM には渡していない）。訳の無い段落は英語のまま
const ja = s => s ? fold('日本語の写し', pre(s), true) : null;
const both = mark => [pre(text(mark)), ja(TJ[mark])];
const num = v => v == null ? '' : Number(v).toLocaleString('ja-JP');
const man = v => v >= 10000 ? `${(v / 10000).toFixed(v >= 1e6 ? 0 : 1)} 万` : num(v);
const usd = v => '$' + Number(v || 0).toFixed(2);
const sh = s => /^[\w@%+=:,./-]+$/.test(s) ? s : `'${s.replace(/'/g, `'"'"'`)}'`;
const pretty = s => { try { return JSON.stringify(JSON.parse(s), null, 1); } catch (_) { return s; } };
// 丸め（決め 7）: 頭と大きな数は分を整数（四捨五入。30 秒未満は「1 分未満」）、畳みの中は「分:秒」。どの画面もこの 2 つだけを使う
const mins = s => s < 30 ? '1 分未満' : `${Math.round(s / 60)} 分`;
const mmss = s => { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const dur = e => e.start && e.end ? (Date.parse(e.end) - Date.parse(e.start)) / 1000 : 0;
const STATUS = {ok: '済み', failed: '落ち', running: '走り中', waiting: '人の答え待ち', skipped: '飛んだ'};
const stWord = st => STATUS[st] || st;
// 出来事の周の字（「周 1.2」。周の無い出来事は空）
const loopOf = e => e && e.loop.length ? `周 ${e.loop.join('.')}` : '';
// 札ごとの AI の手番の費用（札とその中の和。データの欄 run.ai_cost。数えるのは viewer/src/stages.py で、雛形は読むだけ）
const aiCostAt = key => (RUN && RUN.ai_cost && RUN.ai_cost[key]) || 0;
const RUNWORD = {completed: '終わった', failed: '落ちた', cancelled: '止めた', running: '走り中', paused: '人の答え待ち', pending: '待ち'};
// 種類の語: 図の札・凡例・板の頭・ログで同じ語を使う。人の承認は札では「人」。機械（script・bash）は語の札を出さず、板の頭だけ字で「機械」
const KIND = {ai: 'AI', block: '入れ子', child: '子の run', gate: '人', loop: '繰り返し', halt: '止め'};
const KIND_LONG = {gate: '人の承認', script: '機械', bash: '機械'};
// 種類の札。入れ子（＋ が印）と繰り返し（点線の枠）は札に出さない（tagAll で出す）
const kindTag = (k, tagAll) => KIND[k] && (tagAll || !['block', 'loop'].includes(k)) ? h('span', {class: 'kt' + (k === 'ai' ? ' ai' : k === 'gate' ? ' gate' : ''), text: KIND[k]}) : null;
const flat = list => list.flatMap(i => [i, ...flat(i.kids || [])]);
// 入れ子（block・子の run）の札の中の graph。作りに無い graph と入れ子でない札は null
const nestOf = it => (it.kind === 'block' || it.kind === 'child') && G[it.target] ? it.target : null;
const itemAt = w => { const it = w && G[w.graph] ? flat(G[w.graph].items).find(i => i.path.join('/') === w.node) : null; return it ? {...it, graph: w.graph} : null; };
// 出来事の種類: ノードの種類を先に見て、無ければ出来事の種類から
const evKind = e => { const it = itemAt(e.at); return it ? it.kind : e.kind === 'agent' ? 'ai' : e.kind === 'wait' ? 'gate' : e.kind === 'loop_group' ? 'loop' : 'script'; };
// 何をする物かの 1 行（作りの読みの what。工場に在る字から選んだ物）。無ければ空で、出す所が「1 行が無い」と言う
const what = it => (it && it.what && it.what.line) || '';
const gwhat = f => (G[f] && G[f].what && G[f].what.line) || '';
const NO_WHAT = '何をする物かの 1 行が無い';

// ---- 段（viewer/stages.json と段ごとの集計。データの欄 stages） ----
const ST = D.stages || {table: [], run: null, stop: null, stop_by: null, stop_event: null, graph: ''};
const STAGE_ALL = ST.table.map((s, i) => ({n: i + 1, name: s.name, line: s.line, hands: s.hands, source: s.source, ids: s.nodes, wiring: s.wiring}));
const STAGE_OF = {};
STAGE_ALL.forEach(s => s.ids.forEach(id => STAGE_OF[id] = s));
const STAGES_NONE = {n: 0, name: '段の表に無い'};
const WIRESET = new Set(STAGE_ALL.flatMap(s => s.wiring));
const SUMR = ST.run;   // 段ごとの集計（line の run の時だけ）
const sumOf = s => SUMR && s && s.n ? SUMR[s.n - 1] : null;
const RAN = st => ['ok', 'failed', 'waiting', 'running'].includes(st);
const STOP = ST.stop ? STAGE_ALL[ST.stop - 1] : null;
// 止まった所の札と止まり方（人が止めた human・落ちた failed）は段の集計（viewer/src/stages.py）が決めた物を読むだけ
const STOP_EV = STOP && RUN && ST.stop_event != null ? RUN.events[ST.stop_event] : null;
const STOP_HUMAN = ST.stop_by === 'human';
const STOP_WORD = STOP ? `${STOP.name}で${STOP_HUMAN ? '人が止めた' : '落ちた'}` : '';
// 結末の語（line の result の出力の outcome。run の一覧の行の欄）→ 頭の語（段の表の outcomes）。語が空の run は run の状態の語で代える
const OUTCOMES = ST.outcomes || {};
const endWord = r => (r.outcome && OUTCOMES[r.outcome]) || RUNWORD[r.status] || r.status;
const RUNROW = RUN ? (D.runs || []).find(r => r.id === RUN.id) || RUN : null;
const runWord = () => STOP_WORD || endWord(RUNROW);
// 終わりの無い出来事（走り中・人の答え待ちのまま）の姿。段（stageLook）と図の札（paint。再生の終わりの歩も）が同じ決めで呼ぶ。
// 走り中の run はその語、終わった run は頭の主張と同じ止まり方: 止まった段が在ればその止まり方、無ければ run の状態（落ちた run は落ちた、ほかは止めた）
function openLook(state) {
  if (RUN.live) return {mark: 'live', word: STATUS[state]};
  return (STOP ? STOP_HUMAN : RUN.status !== 'failed') ? {mark: 'stop', word: '止めた'} : {mark: 'fail', word: '落ちた'};
}
// 段の終わりの姿（流れの地図と表と、図の段の行で同じ形）。mark は箱と行の印（stop・fail・live・skip・空）、word は語、label は時間つきの語。
// 終わった run で終わりの無い出来事が残った段（走り中・人の答え待ちのまま）は、止まった段が在ればその止まり方、無ければ run の状態の語と色にする。
// 頭の 1 文は止まった段が無い時に結末の語（endWord）を先に見るが、段の印は結末の語を持たないので run の状態で決める
function stageLook(s, x) {
  const t = mins(x.seconds || 0), ran = RAN(x.state);
  const end = (mark, word) => ({mark, word, label: `${word} · ${t}`});
  if (s === STOP) return end(STOP_HUMAN ? 'stop' : 'fail', STOP_HUMAN ? '止まった' : '落ちた');
  if (x.state === 'failed') return end('fail', '落ちた');
  if (x.state === 'waiting' || x.state === 'running') {
    const o = openLook(x.state);
    return o.mark === 'live' ? {...o, label: o.word} : end(o.mark, o.word);
  }
  if (ran) return {mark: '', word: '通った', label: `${t}${x.cost ? ' · ' + usd(x.cost) : ''}`};
  const w = x.state === 'skipped' ? '飛んだ' : '走っていない';
  return {mark: 'skip', word: w, label: w};
}

// ---- 図の根と出来事 ----
const ROOT = (RUN && Object.keys(G).find(f => G[f].name === RUN.graph)) || (G.line ? 'line' : Object.keys(G)[0]);
const T0 = RUN && RUN.started ? Date.parse(RUN.started) : 0;
const since = t => t ? `+${mmss((Date.parse(t) - T0) / 1000)}` : '';
// 札の鍵は入れ子の場所ごと。line の一番上は「line/judge」、入れ子の中は「line/plan-rounds/plan>plan/plan-loop/plan-writer」。
// 同じ block を 2 か所で使っても、開いた場所ごとに別の札になる。鍵は出来事の via の鎖から組む
const K = (scope, graph, path) => (scope ? scope + '>' : '') + graph + '/' + path;
function spots(w) {
  const out = []; let scope = '';
  for (const {graph, node} of [...(w.via || []), w]) { const p = node.split('/'); p.forEach((_, i) => out.push(K(scope, graph, p.slice(0, i + 1).join('/')))); scope = K(scope, graph, node); }
  return out;
}
// 終わりの姿: 出来事が触れた所（入れ子のノードと周の器を含む）。EVS は外の札の鍵にも中の出来事を積む
const FIN = {}, EVS = {}, SKS = {};
if (RUN) {
  for (const e of RUN.events) if (e.at && e.at.graph) for (const k of new Set(spots(e.at))) { (EVS[k] ||= []).push(e); (FIN[k] ||= new Set()).add(e.status); }
  for (const s of RUN.skipped) if (s.at && s.at.graph) { const ks = spots(s.at); (SKS[ks[ks.length - 1]] ||= []).push(s); for (const k of ks) FIN[k] ||= new Set(['skipped']); }
}
const finalState = key => { const st = FIN[key]; return !st ? 'yet' : st.has('failed') ? 'failed' : st.has('running') ? 'running' : st.has('waiting') ? 'waiting' : st.has('ok') ? 'ok' : 'skipped'; };
const STOP_KEY = STOP_EV && STOP_EV.at && STOP_EV.at.graph ? spots(STOP_EV.at).pop() : null;
const NFAIL = RUN ? RUN.events.filter(e => e.status === 'failed').length : 0;
// 終わった run に、終わりの無いまま残った出来事（図の頭の 1 文が、段と札と同じ止まり方の語で言う）。読む部品が run の終わりで閉じ、
// 印 cut を付けた物（終わりの欄は埋まっているので、終わりの欄の空では見つからない）
const ENDLESS = RUN && !RUN.live ? RUN.events.filter(e => e.cut) : [];

// ---- 再生の歩（位置はページに 1 つ。変えるのは go と「やめる」だけ） ----
// 1 歩は出来事の始まりか終わりの 1 つ。時刻順で、同じ時刻は始まりが先。終わりの無い出来事（走り中・待ち）は始まりだけ。
// 飛んだノードは歩にせず、時の位置が飛んだ時刻を過ぎて、その所がまだ走っていなければ「飛んだ」に見せる
const STEPS = [], SKIPS = [];
if (RUN) {
  for (const e of RUN.events) { if (e.start) STEPS.push({t: e.start, end: false, e}); if (e.end) STEPS.push({t: e.end, end: true, e}); }
  STEPS.sort((a, b) => a.t < b.t ? -1 : a.t > b.t ? 1 : a.end - b.end);
  for (const s of RUN.skipped) if (s.at && s.at.graph && s.time) SKIPS.push(s);
}
let at = -1, playing = null, behind = false;
// 歩の入れ子の鎖: その歩を見るために開く入れ子の札の鍵（外から順）
function chainOf(w) {
  const out = []; let scope = '';
  for (const {graph, node} of (w.via || [])) { scope = K(scope, graph, node); out.push(scope); }
  return out;
}
// k 歩目の時の札の姿: 今（その歩の所と外の入れ子）・走り中か人の答え待ち・終わりの状態・飛んだ・まだ。
// 終わりの無い出来事（走り中・待ちのまま）の所は、始まりの後は走り中か待ち（終わりの姿の語と色は paint が最後の歩で openLook から出す）
function stateAt(k) {
  const run = {}, last = {}, wait = {}, now = new Set();
  for (let j = 0; j <= k; j++) {
    const {e, end} = STEPS[j]; if (!e.at || !e.at.graph) continue;
    const waits = e.kind === 'wait' ? 1 : 0;
    for (const key of new Set(spots(e.at))) {
      if (end) { run[key] = (run[key] || 0) - 1; wait[key] = (wait[key] || 0) - waits; last[key] = e.status; }
      else { run[key] = (run[key] || 0) + 1; wait[key] = (wait[key] || 0) + waits; last[key] ??= 'running'; }
    }
  }
  const step = STEPS[k];
  if (step.e.at && step.e.at.graph) spots(step.e.at).forEach(x => now.add(x));
  const skipped = new Set(SKIPS.filter(s => s.time <= step.t).flatMap(s => spots(s.at)).filter(x => !(x in last)));
  return key => now.has(key) ? 'now' : run[key] > 0 ? (wait[key] > 0 && wait[key] === run[key] ? 'waiting' : 'running') : key in last ? last[key] : skipped.has(key) ? 'skipped' : 'yet';
}
// k 歩目までに通った段（配線でない出来事だけで数える。6.6.9）と、k 歩目の段
function reachedAt(k) { const out = new Set(); for (let j = 0; j <= k; j++) { const e = STEPS[j].e; if (e.stage && !e.through) out.add(e.stage); } return out; }
const stageAt = k => k >= 0 && STEPS[k].e.stage ? STAGE_ALL[STEPS[k].e.stage - 1] : null;

// ---- 表示の明るさ ----
// 既定は OS・エディタの設定（prefers-color-scheme）に従う。頭の帯の札で 自動 → ライト → ダーク と回す。
// ページは 1 枚で保存の場所を持たないので、手で選んだ値は開いている間だけ（開き直すと自動に戻る）
const DARK = matchMedia('(prefers-color-scheme: dark)');
let theme = 'auto';
function applyTheme() {
  const dark = theme === 'dark' || (theme === 'auto' && DARK.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('theme').textContent = {auto: `${dark ? '☾' : '☀'} 自動`, light: '☀ ライト', dark: '☾ ダーク'}[theme];
}
DARK.addEventListener('change', applyTheme);
$('theme').onclick = () => { theme = {auto: 'light', light: 'dark', dark: 'auto'}[theme]; applyTheme(); };
applyTheme();

// ---- 頭の帯とタブ ----
let curTab = null;
function header() {
  const tabs = [['flow', '流れ'], ...(W ? [['waste', '無駄の手がかり']] : []), ['graph', '図と再生'], ...(D.target ? [['runs', 'run の一覧']] : []), ...(RUN ? [['log', 'ログ']] : []), ...(UNREAD_N ? [['unread', '読めなかった物']] : [])];
  $('who').append(RUN ? h('span', {}, h('b', {text: `run ${RUN.id.slice(0, 8)}`}), ` · ${mins(RUN.seconds)} · ${usd(RUN.cost)} · ${runWord()}`)
    : h('span', {text: `工場の作り${D.commit ? ' · commit ' + D.commit : ''}`}));

    // 6: 大きな道具の結果と往復ごとの積み上がり
    card(6, '大きな道具の結果', `${b.results.length} 件`, `が ${num(b.line)} 字を超えた（道具の結果 ${num(b.calls)} 件のうち）。`, [
      b.results[0] ? h('p', {class: 'cap', text: `一番大きいのは ${num(b.results[0].chars)} 字の ${b.results[0].name}（${sname(b.results[0])} の往復 ${b.results[0].turn + 1}）。`}) : null,
      fold('内訳と往復ごとの積み上がり', h('ul', {},
        b.results.slice(0, 12).map(x => h('li', {text: `${num(x.chars)} 字 · ${x.name} · ${sname(x)} の往復 ${x.turn + 1}`})),
        b.results.length > 12 ? h('li', {class: 'cap', text: `ほか ${b.results.length - 12} 件`}) : null,
        b.climb.slice(0, 5).map(x => h('li', {text: `${sname(x)}: 往復 ${x.turns} で、入ったトークンが ${man(x.first)} から ${man(x.last)} へ（一番多い往復 ${man(x.peak)}）`}))))]),
  ));
  box.append(h('p', {class: 'cap'}, fold('この run の記録では数えられない物', h('ol', {}, W.uncounted.map(x => h('li', {text: x}))))));
}

// ---- run の一覧（1 行 1 本。開く命令は行を押した時だけ） ----
// 結末の列: 今の run は止まった段の語（人が止めた・落ちた）か結末の頭の語。ほかの run は結末の頭の語。語が空なら状態の語
function runsScreen() {
  const box = $('runs');
  box.append(h('section', {class: 'hero'}, h('div', {class: 'cap', text: `対象のリポジトリ ${D.target}`}),
    h('h1', {text: `${D.runs.length} 本の run。`}),
    h('p', {text: '行を押すと、その run のページを作る命令が出る（ページは 1 枚なので、ここから移れない）。'}),
    h('p', {class: 'cap', text: `このページを作った時刻 ${D.made_at}${D.commit ? ' · 工場の commit ' + D.commit : ''}`})));
  const list = h('div', {class: 'rl', role: 'list'},
    h('div', {class: 'rr rhd cap'}, ['run', '結末', '始め', '長さ', '費用'].map((x, k) => h('span', {class: k > 2 ? 'r' : null, text: x}))));
  for (const r of D.runs) {
    const me = RUN && r.id === RUN.id;
    const word = me ? runWord() : endWord(r);
    const cmd = h('div', {class: 'rcmd', hidden: true},
      h('div', {class: 'cap', text: `${r.graph}${r.waiting.length ? ' · 人の答え待ち ' + r.waiting.join('・') : ''}`}),
      r.error ? pre(r.error, 'err') : null,
      h('code', {class: 'mono', text: `uv run --isolated python3 viewer/flowview.py --target ${sh(D.target)} --run ${r.short} <出力>`}));
    const row = press(h('div', {class: 'rr' + (me ? ' cur' : ''), role: 'listitem', tabindex: 0, title: '押すと開く命令',
      onclick: () => { const o = cmd.hidden; list.querySelectorAll('.rcmd').forEach(c => c.hidden = true); cmd.hidden = !o; }},
      h('span', {class: 'mono', text: r.short}),
      h('span', {class: 'oc' + (r.status === 'failed' ? ' bad' : ''), text: word + (me ? ' · 今見ている run' : '')}),
      h('span', {class: 'cap n', text: (r.started || '').slice(5, 16)}),
      h('span', {class: 'r n', text: mins(r.seconds || 0)}), h('span', {class: 'r n', text: usd(r.cost)})));
    list.append(row, cmd);
  }
  box.append(h('div', {class: 'card'}, list));
}

// ---- ログ（段の見出しと出来事の行を詰めて並べ、最初から読める） ----
function logScreen() {
  const box = $('log');
  box.append(h('section', {class: 'hero'}, h('div', {class: 'cap', text: `run ${RUN.id.slice(0, 8)} · ${RUN.graph} · ${(RUN.started || '').replace('T', ' ').slice(0, 19)} から`}),
    h('h1', {text: `${RUN.events.length} の出来事を、段ごとに。`}),
    h('p', {text: '1 行が 1 つの出来事。行を押すと、出力・道具の呼び出し・LLM に入った物が開く。時刻は run の始めからの「分:秒」。'})));
  const groups = new Map();
  for (const e of RUN.events) { const k = e.stage || 0; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); }
  const order = [...groups].sort((a, b) => (a[0] || 99) - (b[0] || 99));
  const nameOf = k => k ? `${k} ${STAGE_ALL[k - 1].name}` : (SUMR ? '段に当たらない' : RUN.graph);
  // 段へ飛ぶ札（長いログの目次）
  if (order.length > 1) box.append(h('div', {class: 'jump'}, order.map(([k]) => h('button', {class: 'chip', text: nameOf(k), onclick: () => $('lg-' + k).scrollIntoView({block: 'start'})}))));
  const card = h('div', {class: 'card log'});
  for (const [k, es] of order) {
    // 費用は段の集計の段の費用（流れの地図と同じ値）。段の表の外の run は 1 つの見出しなので run の費用、line の run の段に当たらない出来事は出さない
    const x = k ? sumOf(STAGE_ALL[k - 1]) : null, cost = x ? x.cost : SUMR ? 0 : RUN.cost;
    card.append(h('div', {class: 'lgh', id: 'lg-' + k},
      h('span', {class: 'name', text: nameOf(k)}),
      h('span', {class: 'cap', text: `${es.length} 件${x ? RAN(x.state) ? ' · ' + mins(x.seconds || 0) : ' · 配線のノードだけが走った（段は飛んだ）' : ''}${cost ? ' · ' + usd(cost) : ''}`})));
    for (const e of es) {
      const body = h('div', {class: 'lgb', hidden: true}), it = itemAt(e.at);
      const row = press(h('div', {class: 'lgr' + (e.status === 'failed' ? ' bad' : ''), tabindex: 0, title: `${e.tokens.join(' / ')}${loopOf(e) ? ' · ' + loopOf(e) : ''}`,
        onclick: () => { if (!body.firstChild) body.append(eventView(e)); body.hidden = !body.hidden; row.classList.toggle('open', !body.hidden); }},
        h('span', {class: 'n cap', text: since(e.start)}),
        h('span', {}, kindTag(evKind(e), true)),
        h('span', {class: 'w', text: what(it) || e.tokens.join(' / ')}),
        h('span', {class: 'cap st2', text: `${loopOf(e) ? loopOf(e) + ' · ' : ''}${stWord(e.status)}`}),
        h('span', {class: 'r n cap', text: e.cost ? usd(e.cost) : mmss(dur(e))})));
      card.append(row, body);
    }
  }
  if (RUN.live) card.append(h('p', {class: 'cap foot', text: `ここまで（${D.made_at}）。run は走り中なので、この先は記録にまだ無い。`}));
  box.append(card);
  box.append(h('div', {class: 'card'}, h('div', {class: 'cap', text: '記録のほか'}), h('h2', {text: '子の run・飛んだノード・周の終わりの確かめ・置き場のファイル。'}),
    RUN.children.length ? fold(`子の run（${RUN.children.length}）`, h('ul', {}, RUN.children.map(c => h('li', {class: 'mono', text: `${c.id.slice(0, 8)} · ${c.graph} · ${RUNWORD[c.status] || c.status} · ${c.node.join(' / ')} · ${mmss(c.seconds || 0)}`})))) : null,
    fold(`飛んだノード（${RUN.skipped.length}）`, h('ul', {}, RUN.skipped.map(s => h('li', {class: 'mono', text: `${s.tokens.join(' / ')} · ${s.cause ? s.cause.expr || s.cause.kind : ''}`})))),
    fold(`繰り返しの終わりの確かめ（${RUN.checks.length}）`, RUN.checks.map(c => fold(`${c.step} ${c.label} · 終了の値 ${c.exit}`, [c.stdout && pre(c.stdout), c.stderr && pre(c.stderr, 'err')]))),
    fold(`出力が指す run の置き場のファイル（${Object.keys(RUN.artifacts).length}）`, Object.entries(RUN.artifacts).map(([k, v]) => fold(h('span', {class: 'mono', text: k}), pre(v))))));
}

// ---- 読めなかった物（0 件の時はタブを出さず、図の画面の下に 1 行。0 でない時はタブと頭の帯の件数） ----
function unreadLists() {
  const lists = [['作りの読みの問題', D.shape.problems], ['図に当たらないノード', D.unmatched], ['段の表に無い line のノード', (D.stages && D.stages.loose) || []]];
  if (RUN) {
    lists.push(['Archon の記録の読めなかった行', Object.entries(RUN.unread).map(([k, v]) => `${k}: ${v}`)], ['記録の無い run', RUN.missing_logs]);
    const ses = []; for (const [p, S] of Object.entries(RUN.sessions || {})) for (const [k, v] of Object.entries(S.unread)) if (v) ses.push(`${p} ${k}: ${v}`);
    lists.push(['会話の記録の読まない行', ses]);
  }
  return lists;
}
const UNREAD = unreadLists(), UNREAD_N = UNREAD.reduce((a, l) => a + l[1].length, 0);
function unreadScreen() {
  const box = $('unread');
  box.append(h('section', {class: 'hero'}, h('div', {class: 'cap', text: '黙って落とさない'}), h('h1', {text: `読めなかった物が ${UNREAD_N} 件。`}),
    h('p', {text: 'ページを作る時に、記録や作りの中で読めなかった物。読めなかった分だけ、ほかの画面の数が少なく出ている。'})));
  box.append(h('div', {class: 'card'}, UNREAD.map(([t, rows]) => h('div', {class: 'ur'},
    h('div', {class: 'urh'}, h('span', {text: t}), h('span', {class: 'r n' + (rows.length ? '' : ' cap'), text: rows.length ? `${rows.length} 件` : '0'})),
    rows.length ? fold('中身', h('ul', {}, rows.map(r => h('li', {class: 'mono', text: r})))) : null))));
}

// ---- 再生の帯（1 つ。図と再生のタブにだけ出す） ----
// go が位置を変え、流れの今（flowNow）を映し、図が見えている時だけ図まで動かす。見えていない時は「図が遅れている」の印を立て、図を開いた時に合わせる
function go(k) {
  if (!STEPS.length) return;
  at = Math.max(0, Math.min(STEPS.length - 1, k));
  $('p-pos').value = at; label(); flowNow();
  if ($('s-graph').hidden) { behind = true; return; }
  syncGraph();
}
function syncGraph() {
  if (at < 0 || !onRunRoot()) { paint(); return; }
  const w = STEPS[at].e.at;
  if (!w || !w.graph) { paint(); return; }
  // 今の歩の入れ子の鎖を自動で開く。前の歩で自動で開いて今の鎖に無い物は閉じる（人が開いた物は閉じない）
  const chain = chainOf(w);
  for (const k of [...SHUT]) if (!chain.includes(k)) SHUT.delete(k);
  const want = new Set(chain.filter(k => !SHUT.has(k) && !OPEN.has(k)));
  const same = want.size === AUTO.size && [...want].every(k => AUTO.has(k));
  // 図を作り直すと、選んでいた札が入れ子と一緒に消えて板が閉じる。開いていたかは作り直す前に控える
  const panelWas = !$('panel').hidden;
  if (!same) { AUTO = want; show({keepPanel: true}); } else paint();
  // 歩くたびに板は開かない。板が開いている時だけ、板を今の札の物に替える
  const el = deepestNow();
  if (el && panelWas && selId !== el.dataset.key && ITEM[el.dataset.key]) selectId(el.dataset.key);
  if (el) el.scrollIntoView({block: 'nearest', behavior: same ? SMOOTH : 'auto'});
}
// やめる: run の終わりの姿へ戻し、自動で開いた物を全部閉じる。つまみは終わりの位置に置く（← で最後の歩へ戻る）
function stopReplay() {
  play(false); at = -1; behind = false; $('p-pos').value = STEPS.length - 1; label(); flowNow();
  AUTO = new Set(); SHUT = new Set();
  if (!$('s-graph').hidden && cur) show({keepPanel: true});
}
function label() {
  const w = $('p-what');
  if (at < 0) { w.replaceChildren(h('b', {text: 'run の終わりの姿'}), ` · ${STEPS.length} 歩（ノードの始まりと終わり）。▶ で歩き始める`); return; }
  const st = STEPS[at], s = stageAt(at), it = itemAt(st.e.at);
  w.replaceChildren(h('b', {text: `${s ? `段 ${s.n} ${s.name} · ` : ''}${what(it) || st.e.tokens.join(' / ')}`}),
    ` · ${at + 1} / ${STEPS.length} · ${since(st.t)} · ${st.end ? `終わり（${stWord(st.e.status)}）` : '始まり'}${loopOf(st.e) ? ' · ' + loopOf(st.e) : ''}`,
    `${st.e.run !== RUN.id ? ' · 子の run ' + st.e.run.slice(0, 8) : ''}${st.e.at && st.e.at.graph ? foldedWire(st.e.at) ? ' · 配線の歩（図では畳んでいる）' : '' : ' · 図に当たらない'} · ${st.e.tokens.join(' / ')}`);
}
function play(on) {
  clearTimeout(playing); playing = null; $('p-play').textContent = on ? '⏸' : '▶';
  if (!on) return;
  const tick = () => { if (at >= STEPS.length - 1) { play(false); return; } go(at + 1); if (playing !== null) playing = setTimeout(tick, 600); };
  playing = setTimeout(tick, 0);
}
(() => {
  if (!STEPS.length) return;
  // 開いた時は run の終わりの姿なので、つまみは「やめる」の後と同じ終わりの位置
  $('p-pos').max = STEPS.length - 1; $('p-pos').value = STEPS.length - 1; label();
  $('p-play').onclick = () => { if (playing !== null) return play(false); if (at >= STEPS.length - 1) at = -1; play(true); };
  // 終わりの姿（at が -1）から 1 歩戻ると最後の歩
  $('p-prev').onclick = () => { play(false); go(at < 0 ? STEPS.length - 1 : at - 1); };
  $('p-next').onclick = () => { play(false); go(at + 1); };
  $('p-pos').oninput = () => { play(false); go(+$('p-pos').value); };
  $('p-off').onclick = stopReplay;
  // 鍵盤（← → 空白）は再生の帯が見えている時だけ受ける。字の欄・つまみ・押し物の上の空白は除く
  addEventListener('keydown', ev => {
    if ($('player').hidden || ev.altKey || ev.ctrlKey || ev.metaKey || ev.target.closest('input,select,textarea') || (ev.key === ' ' && ev.target.closest('button,a,summary'))) return;
    if (ev.key === 'ArrowRight') { ev.preventDefault(); $('p-next').click(); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); $('p-prev').click(); }
    else if (ev.key === ' ') { ev.preventDefault(); $('p-play').click(); }
  });
})();

// 頭の帯と再生の帯の高さを測り、送る時の余白と板の上下の端とページの下の余白に使う（決め打ちにしない）
function measure() {
  const r = document.documentElement.style;
  r.setProperty('--th', `${document.querySelector('.top').offsetHeight}px`);
  r.setProperty('--pb', $('player').hidden ? '0px' : `${$('player').querySelector('.in').offsetHeight + 12}px`);
}
new ResizeObserver(measure).observe(document.querySelector('.top'));
new ResizeObserver(measure).observe($('player').querySelector('.in'));
let edgeTimer = null;
addEventListener('resize', () => { measure(); flowNow(); clearTimeout(edgeTimer); edgeTimer = setTimeout(drawEdges, 100); });
header();
notes();
flowScreen();
if (D.target) runsScreen();
if (W) wasteScreen();
if (RUN) logScreen();
if (UNREAD_N) unreadScreen();
tab('flow');
</script>
</body>
</html>

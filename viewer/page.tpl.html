<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>works-factory の作りと run</title>
<!-- 見る道具の雛形（viewer/AGENTS.md の E25。設計は docs/design/viewer.md）。viewer/src/page.py が下の 2 つの印にデータと elkjs を埋める。
     ページは 1 枚で完結し、別のファイルからスクリプトを読まない。見た目は試験で縛らない（見ながら直す） -->
<style>
:root{
  --bg:#f2f4f7; --dot:#d0d5dd; --node:#fff; --node-b:#eaecf0; --ink:#101828; --ink2:#344054; --muted:#667085; --faint:#98a2b3;
  --panel:#fff; --panel2:#f9fafb; --line:#eaecf0; --sel:#296dff; --sel-soft:#eff4ff; --edge:#b2b8c2;
  --c-ai:#6172f3; --c-script:#2e90fa; --c-bash:#2e90fa; --c-block:#06aed4; --c-child:#0e9384; --c-gate:#f79009; --c-loop:#ee46bc; --c-halt:#f04438;
  --ok:#12b76a; --bad:#f04438; --run:#296dff; --wait:#f79009; --skip:#98a2b3; --warn-soft:#fffaeb; --bad-soft:#fef3f2;
  --f-body:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif; --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1a1a1d; --dot:#2e2e33; --node:#26262a; --node-b:#34343a; --ink:#f2f2f3; --ink2:#d0d0d5; --muted:#9a9aa3; --faint:#6f6f78;
  --panel:#202024; --panel2:#2a2a2f; --line:#34343a; --sel:#5b8bff; --sel-soft:#1f2a44; --edge:#55555e; --warn-soft:#3a2c12; --bad-soft:#43201f;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13px;line-height:1.55;overflow:hidden}
/* 高さは body でなく .app が画面の高さで持つ（ビューアが body の中身を別の要素で包んでも切れない。fixed は包みの transform で崩れるので使わない）。
   ビューアの拡大縮小の倍率に合わせた高さは script の sizeApp が置く */
.app{height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
code,pre,.mono{font-family:var(--f-mono);font-size:12px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;max-height:420px;overflow:auto}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:15px;margin:0}
.top .facts{color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.tabs button{border:0;background:transparent;padding:4px 12px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--sel-soft);color:var(--sel);font-weight:700}
.notice{padding:6px 16px;background:var(--warn-soft);border-bottom:1px solid var(--line);font-size:12.5px}
.notice code{user-select:all}
.main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;overflow:auto}
/* 図 */
.flow{display:flex;overflow:hidden}
.side{width:250px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.side input{margin:8px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit}
.side .list{overflow:auto;flex:1;padding:0 6px 12px}
.side .gh{font-size:11.5px;color:var(--muted);font-weight:700;margin:10px 6px 2px}
.side button{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:3px 6px;border-radius:6px}
.side button:hover{background:var(--panel2)}
.side button.cur{background:var(--sel-soft);color:var(--sel);font-weight:700}
.side .n{margin-left:auto;color:var(--faint);font-size:11px}
.canvas{flex:1;position:relative;overflow:hidden;cursor:grab;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:18px 18px}
.canvas.drag{cursor:grabbing}
.crumb{position:absolute;left:12px;top:10px;z-index:3;display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 10px}
.crumb a{color:var(--sel);cursor:pointer}
.crumb .home{border:1px solid var(--line);background:var(--sel-soft);color:var(--sel);border-radius:6px;padding:0 8px;font-weight:700}
.crumb .home:disabled{cursor:default;opacity:.7}
.crumb .via{color:var(--muted);font-size:11.5px}
/* 下の帯: 図の拡げと再生。板が開いている時は板の左までにする */
.dock{position:absolute;left:12px;bottom:12px;right:12px;z-index:3;display:flex;gap:10px;align-items:flex-end;pointer-events:none}
.canvas.with-panel .dock{right:calc(min(560px,100% - 20px) + 22px)}
.dock>*{pointer-events:auto}
.zoom{display:flex;gap:4px;flex:none}
.zoom button,.replay button,.replay select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 8px}
.replay{flex:1;min-width:0;max-width:760px;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:0 4px 12px -2px rgba(16,24,40,.10)}
.replay .row{display:flex;gap:4px 6px;align-items:center;min-width:0;flex-wrap:wrap}
.replay button,.replay select{white-space:nowrap;flex:none}
.replay input[type=range]{flex:1;min-width:80px;accent-color:var(--run)}
.replay .what{font-size:12px;flex:1 1 280px;min-width:0;overflow-wrap:anywhere}
.replay .key{display:inline-flex;gap:8px;color:var(--muted);font-size:11px;flex:none}
.replay .key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:-1px;border:1.5px solid var(--node-b);background:var(--node)}
.replay .key i.now{border-color:var(--run);box-shadow:0 0 0 2px color-mix(in srgb,var(--run) 30%,transparent)}
.replay .key i.run{border-color:var(--run)}
.replay .key i.yet{opacity:.35}
.replay .key i.skip{border-style:dotted;opacity:.6}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.edges path{fill:none;stroke:var(--edge);stroke-width:1.5}
.node{position:absolute;background:var(--node);border:1.5px solid var(--node-b);border-left:5px solid var(--k);border-radius:9px;padding:4px 8px;cursor:pointer;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.node .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.box{background:color-mix(in srgb,var(--k) 6%,transparent);border-style:dashed;border-left-width:1.5px;border-color:var(--k)}
.node.sel{outline:3px solid var(--sel)}
/* 再生: 今の歩のノード・走り中・まだ・飛んだ（済んだ物は普段の姿） */
.world.glide{transition:transform .35s ease}
.node.rp-yet{opacity:.35}
.node.rp-skip{opacity:.6;border-style:dotted}
.node.rp-run{border-color:var(--run)}
.node.rp-now{outline:3px solid var(--run);box-shadow:0 0 0 8px color-mix(in srgb,var(--run) 22%,transparent);z-index:2}
.node.box.rp-now{outline-style:dashed;box-shadow:none}
.node .st{position:absolute;right:6px;top:5px;width:9px;height:9px;border-radius:50%}
.st.ok{background:var(--ok)}.st.failed{background:var(--bad)}.st.running{background:var(--run)}.st.waiting{background:var(--wait)}.st.skipped{background:var(--skip)}
.k-ai{--k:var(--c-ai)}.k-script{--k:var(--c-script)}.k-bash{--k:var(--c-bash)}.k-block{--k:var(--c-block)}.k-child{--k:var(--c-child)}.k-gate{--k:var(--c-gate)}.k-loop{--k:var(--c-loop)}.k-halt{--k:var(--c-halt)}
.panel{position:absolute;top:10px;right:10px;bottom:10px;width:min(560px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 24px -4px rgba(16,24,40,.12);z-index:4;display:flex;flex-direction:column}
.panel .ph{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.panel .ph h2{font-size:16px;margin:0;overflow-wrap:anywhere}
.panel .ph .x{margin-left:auto;border:0;background:transparent;font-size:16px}
.panel .pb{overflow:auto;padding:4px 14px 18px}
h3{font-size:12px;color:var(--muted);margin:14px 0 4px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px}
.kv>b{color:var(--muted);font-weight:600}
.kv>span{overflow-wrap:anywhere}
.chip{display:inline-block;padding:0 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);margin:1px 3px 1px 0;font-size:12px}
.empty{color:var(--faint)}
.err{background:var(--bad-soft)}
details{border:1px solid var(--line);border-radius:8px;margin:4px 0;background:var(--panel)}
details>summary{cursor:pointer;padding:4px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details>div{padding:0 10px 8px}
details.focus{border-color:var(--run);box-shadow:0 0 0 2px color-mix(in srgb,var(--run) 25%,transparent)}
/* 表（短い値だけ） */
table{border-collapse:collapse;width:100%;background:var(--panel)}
th,td{text-align:left;padding:4px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel2)}
td.wrap{white-space:normal;overflow-wrap:anywhere}
.pad{padding:12px 16px}
.badge{display:inline-block;padding:0 7px;border-radius:6px;color:#fff;font-size:11.5px;font-weight:700}
.badge.ok,.badge.completed{background:var(--ok)}.badge.failed{background:var(--bad)}.badge.running,.badge.pending{background:var(--run)}
.badge.waiting,.badge.paused{background:var(--wait)}.badge.cancelled,.badge.skipped{background:var(--skip)}
tr.cur td{background:var(--sel-soft)}
.cmd{user-select:all}
/* LLM に入った物: 片の種類の色・往復の棒（cache 読み・cache 書き・入・出を同じ尺で並べる）・広い面 */
.ctx-sum{font-size:12px;color:var(--ink2);margin:2px 0 6px}
.ctx-bars{display:flex;flex-direction:column;gap:3px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:6px}
.ctx-bar{display:grid;grid-template-columns:4.5em 1fr minmax(13em,max-content);gap:8px;align-items:center;font-size:11.5px}
.ctx-bar .track{display:flex;flex-direction:column;gap:1px}
.ctx-bar .track>span{display:flex;height:11px;background:var(--panel);border-radius:3px;overflow:hidden}
.ctx-bar .track>span.o{height:4px}
.ctx-bar i,.ctx-key i{display:inline-block;height:100%;min-width:1px}
.ctx-key{display:flex;gap:12px;font-size:11px;color:var(--muted)}
.ctx-key i{width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
i.cr{background:#98a2b3}i.cw{background:#f79009}i.in{background:#296dff}i.out{background:#12b76a}
.ctx .ctx-group{font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 2px}
.ctx .ctx-bar{margin:0 0 4px}
.ctx details{margin:2px 0}
.ctx-row{display:flex;gap:10px;padding:4px 8px;border:1px dashed var(--line);border-radius:8px;margin:2px 0}
.pk{font-weight:700;border-left:4px solid var(--k,var(--faint));padding-left:6px}
.pk.k-system,.pk.k-tools,.pk.k-inject,.pk.k-prompt{--k:#7a5af8}.pk.k-user{--k:#7a5af8}.pk.k-say{--k:#12b76a}.pk.k-think{--k:#98a2b3}
.pk.k-call{--k:#2e90fa}.pk.k-result{--k:#06aed4}
.wide{position:absolute;inset:10px;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 24px -4px rgba(16,24,40,.18);display:flex;flex-direction:column}
.wide .ph{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.wide .ph h2{font-size:16px;margin:0}
.wide .ph .x{margin-left:auto;border:0;background:transparent;font-size:16px}
.wide .pb{overflow:auto;padding:8px 18px 18px}
.wide pre{max-height:none}
</style>
</head>
<body>
<script type="application/json" id="data">__DATA__</script>
<script>/*__ELK__*/</script>
<div class="app">
<div class="top">
  <h1>works-factory の作りと run</h1>
  <div class="facts" id="facts"></div>
  <div class="tabs" id="tabs"></div>
</div>
<div id="notices"></div>
<div class="main">
  <div class="screen flow" id="s-flow">
    <div class="side"><input id="find" placeholder="graph を名で絞る"><div class="list" id="graphs"></div></div>
    <div class="canvas" id="canvas">
      <div class="crumb" id="crumb"></div>
      <div class="world" id="world"></div>
      <div class="dock">
        <div class="zoom"><button id="z-in" title="拡げる">＋</button><button id="z-out" title="縮める">－</button><button id="z-fit" title="今の graph の図の全部を画面に収める（graph は移らない）">画面に収める</button></div>
        <div class="replay" id="replay" hidden>
          <div class="row"><button id="r-first" title="run の始めへ">⏮</button><button id="r-prev" title="1 つ前（←）">◀</button><button id="r-play" title="再生・止める（空白）">▶ 再生</button><button id="r-next" title="1 つ後（→）">▶|</button>
            <input type="range" id="r-pos" min="0" value="0"><select id="r-speed" title="速さ（1 秒に進む歩）"><option value="0.5">0.5 歩/秒</option><option value="1" selected>1 歩/秒</option><option value="2">2 歩/秒</option><option value="4">4 歩/秒</option><option value="10">10 歩/秒</option></select>
            <button id="r-off" title="再生をやめて、run の終わりの姿の図へ戻る">やめる</button></div>
          <div class="row"><span class="what" id="r-what"></span><span class="key"><span><i class="now"></i>今</span><span><i class="run"></i>走り中</span><span><i></i>済み</span><span><i class="yet"></i>まだ</span><span><i class="skip"></i>飛んだ</span></span></div>
        </div>
      </div>
      <div class="panel" id="panel" hidden><div class="ph"><h2 id="p-title"></h2><button class="x" id="p-close">×</button></div><div class="pb" id="p-body"></div></div>
    </div>
  </div>
  <div class="wide" id="wide" hidden><div class="ph"><h2 id="w-title"></h2><button class="x" id="w-close" title="閉じる（Esc）">×</button></div><div class="pb" id="w-body"></div></div>
  <div class="screen" id="s-runs" hidden></div>
  <div class="screen" id="s-log" hidden></div>
  <div class="screen" id="s-unread" hidden></div>
</div>
</div>
<script>
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const G = D.shape.graphs, RUN = D.run, TX = D.texts || {}, TJ = D.texts_ja || {};
const KIND = {ai: 'AI', script: 'script', bash: 'bash', block: 'block', child: '子の run', gate: '承認', loop: '繰り返し', halt: '止め', '': '読めない'};
const STATUS = {ok: '済み', failed: '落ち', running: '走り中', waiting: '待ち', skipped: '飛んだ', completed: '終わり', paused: '止まっている',
  cancelled: '止めた', pending: '始まる前'};
const NOT_RECORDED = '記録に無い';

// 字は全部 textContent で置く（記録の字を HTML として読まない）
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'text') el.textContent = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const $ = id => document.getElementById(id);
// 高さは画面の高さを、ビューアが実際に掛けた倍率で割った物（ビューアは拡大縮小で包みに scale() を掛け、その後に resize を送る。
// 100vh のままだと 100% の時しか画面に合わない）
function sizeApp() {
  const app = document.querySelector('.app'), scale = app.offsetHeight ? app.getBoundingClientRect().height / app.offsetHeight : 1;
  app.style.height = `${innerHeight / (scale || 1)}px`;
}
sizeApp();
addEventListener('resize', sizeApp);
const usd = v => v == null ? '' : '$' + Number(v).toFixed(v < 1 ? 4 : 2);
// 長さの丸め: 頭と一覧と大きな数は分を整数に（1 分未満は秒）、畳みの中は「分:秒」（clock）。同じ値はどの画面でも同じ丸めで出す
// 先に秒へ丸めてから比べる（59.5 秒を「60 秒」と出さず「1 分」にする）
const secs = v => v == null ? '' : Math.round(v) < 60 ? `${Math.round(v)} 秒` : `${Math.round(v / 60)} 分`;
// 時刻の書き方: DB の書き方（2026-10-25 01:50:54）とログの書き方（2026-10-25T01:50:54.377Z）を、秒までの前の形にそろえる（どちらも UTC）
const when = v => v ? String(v).replace('T', ' ').replace(/\.\d+/, '').replace(/Z$/, '') : '';
const num = v => v == null ? '' : Number(v).toLocaleString('ja-JP');
const badge = s => h('span', {class: 'badge ' + s, text: STATUS[s] || s});
const text = mark => TX[mark] ?? '';
const kv = rows => h('div', {class: 'kv'}, rows.filter(r => r && r[1] !== '' && r[1] != null && !(Array.isArray(r[1]) && !r[1].length))
  .map(([k, v]) => [h('b', {text: k}), h('span', {}, v instanceof Node ? v : Array.isArray(v) ? v.map(x => h('span', {class: 'chip', text: x})) : String(v))]));
const where = at => at ? `${at.graph} / ${at.node}` : '図に当たらない';
// 殻に貼る命令の引数（パスの空白や記号を殻に読ませない。flowview.py の shlex.quote と同じ形）
const sh = s => /^[\w@%+=:,./-]+$/.test(s) ? s : `'${s.replace(/'/g, `'"'"'`)}'`;
const pre = (s, cls) => h('pre', {class: cls || null, text: s});
const fold = (title, body, open) => h('details', {open: open || null}, h('summary', {}, title), h('div', {}, body));
// 日本語の写し（人が読むための射影。LLM には渡していない）。訳の無い段落は英語のまま
const ja = s => s ? fold('日本語の写し', pre(s), true) : null;
const both = mark => [pre(text(mark)), ja(TJ[mark])];

// 帯
function header() {
  $('facts').append(...[D.commit && `commit ${D.commit}`, `作った時刻 ${D.made_at}`, D.target && `対象 ${D.target}`,
    RUN && h('span', {}, `run ${RUN.id.slice(0, 8)}・${RUN.graph}・`, badge(RUN.status), ` ${usd(RUN.cost)} ${secs(RUN.seconds)}`)].filter(Boolean)
    .map(x => x instanceof Node ? x : h('span', {text: x})));
  const notes = [];
  if (RUN && RUN.live) notes.push(`この run は走り中（${STATUS[RUN.status] || RUN.status}）。ページは作った時刻 ${D.made_at} までの姿。新しい姿は同じ命令で作り直す`);
  if (RUN && RUN.waiting.length) notes.push(h('span', {}, `承認待ち（${RUN.waiting.join('・')}）。答えは殻で打つ: `, h('code', {class: 'cmd', text: RUN.answer})));
  if (D.shape_from === 'tree' && RUN) notes.push('この run の写し（run の始めに Archon が写し取った作り）が無いので、図は今の木の作りから作った');
  if (D.ja && (D.ja.md || D.ja.texts)) notes.push(`日本語の写しに訳の無い段落: 指示の md ${D.ja.md} 個・会話 ${D.ja.texts} 個（英語のまま出す。--ja-batches で束にして訳し、--ja-import で取り込む）`);
  const bad = unreadCount();
  if (bad) notes.push(`読めなかった物が ${bad} 件ある（「読めなかった物」の画面）`);
  $('notices').append(...notes.map(n => h('div', {class: 'notice'}, n)));
  const tabs = [['flow', '図'], ...(D.target ? [['runs', `run の一覧（${D.runs.length}）`]] : []), ...(RUN ? [['log', 'ログ']] : []), ['unread', '読めなかった物']];
  tabs.forEach(([id, label]) => $('tabs').append(h('button', {'data-tab': id, text: label, onclick: () => tab(id)})));
  tab('flow');
}
function tab(id) {
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === id));
  document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== 's-' + id);
  if (id === 'flow' && !cur) openGraph(firstGraph());
}

// 図: graph の一覧と道しるべ。道しるべ stack は根の graph（run の graph か line）から始まり、各段は {folder, node（外の graph の中で

const T = {x: 40, y: 60, s: 1};

const ROOT = firstGraph();

// run の出来事を図の所に寄せる（同じ graph が何度 include されても、その graph の所に全部寄せる）
const AT = {};

}

// 図: elk で並べて描く
const elk = new ELK();
const W = 220, H = 50;
async function show() {

    if (item.kind === 'loop') return {id: item.path.join('/'), children: item.kids.map(node), layoutOptions: {'elk.padding': '[top=46,left=16,bottom=16,right=16]'}};
    return {id: item.path.join('/'), width: W, height: H};

      onclick: ev => { ev.stopPropagation(); select(n.id, item); }, ondblclick: () => item.target && G[item.target] && enter(item.target, n.id)},
      h('div', {class: 't', text: item.id}), h('div', {class: 's', text: sub(item)}), RUN && h('span', {class: 'st ' + st, 'data-was': st, title: STATUS[st]}));

// 図: 動かす・拡げる
function apply() { $('world').style.transform = `translate(${T.x}px,${T.y}px) scale(${T.s})`; }

}

  T.x = 30 + Math.max(0, (room() - w * T.s) / 2); T.y = 56; apply();
}

const READABLE = 0.75;

  const w = +$('world').dataset.w || 1;
  T.s = READABLE;

}

  addEventListener('mousemove', ev => { if (from) { T.x = ev.clientX - from.x; T.y = ev.clientY - from.y; moved = true; apply(); } });
  addEventListener('mouseup', () => { from = null; c.classList.remove('drag'); });
  c.addEventListener('wheel', ev => { if (ev.target.closest('.panel')) return; ev.preventDefault(); const r = c.getBoundingClientRect();

// 再生: 終わった run を、ノードの始まりと終わりの 1 つずつを 1 歩にして時刻順に歩く。歩の出来事のノードが在る graph へ、根から
// include・workflow: を辿った道（出来事の at.via）で入り、ノードを真ん中に寄せて板に出来事を開く。繰り返しの周と子の run の出来事も、
// 同じ並びに時刻で入る（周は 1 回ずつ別の出来事）。飛んだノードは歩にせず、時刻が過ぎて、まだ走っていなければ「飛んだ」に見せる
const STEPS = [], SKIPS = [];
let at = -1, playing = null, going = 0;
if (RUN) {
  for (const e of RUN.events) {

    if (e.end) STEPS.push({t: e.end, end: true, e});
  }
  STEPS.sort((a, b) => a.t < b.t ? -1 : a.t > b.t ? 1 : 0);   // 同じ時刻は始まりが先（並べた順のまま）
  for (const s of RUN.skipped) if (s.at && s.at.graph && s.time) SKIPS.push(s);
}
// 出来事が触れる図の所: ノードの所と、そこまでに通った include のノードと、包む繰り返しの箱（道の頭）
function spots(where) {
  const out = [];
  for (const {graph, node} of [...(where.via || []), where]) {
    const parts = node.split('/');
    parts.forEach((_, i) => out.push(graph + '/' + parts.slice(0, i + 1).join('/')));
  }

}
// 歩 k までの各所の姿: now（今の歩）・waiting・running・済み（最後の状態）・skipped
function stateAt(k) {

// 図のノードに再生の姿を付ける（再生していない時は外す）
function paint() {

    el.classList.remove('rp-now', 'rp-run', 'rp-yet', 'rp-skip');
    const dot = el.querySelector('.st');
    if (!look) { if (dot) dot.className = 'st ' + (dot.dataset.was || ''); continue; }
    const st = look(cur + '/' + el.dataset.id);
    el.classList.add({now: 'rp-now', running: 'rp-run', waiting: 'rp-run', yet: 'rp-yet', skipped: 'rp-skip'}[st] || 'rp-done');
    if (dot) dot.className = 'st ' + (st === 'now' ? (STEPS[at].end ? STEPS[at].e.status : 'running') : st === 'yet' ? '' : st);

// 歩 k へ移る。graph を移る時は図を描き直す（描き直しの間に次の歩へ移ったら、古い歩は何もしない）
async function go(k) {

    if (want.map(w => w.folder + '>' + w.node).join() !== stack.map(w => w.folder + '>' + w.node).join()) {

  $('r-what').textContent = [`${at + 1} / ${STEPS.length}`, `+${clock}`, step.end ? `終わり（${STATUS[e.status] || e.status}）` : '始まり',
    e.tokens.join(' / '), e.loop.length ? `周 ${e.loop.join('.')}` : '', e.run !== RUN.id ? `子の run ${e.run.slice(0, 8)}` : '',
    e.at && e.at.graph ? '' : '図に当たらない'].filter(Boolean).join('　');

    item.desc && pre(item.desc),
    kv([['種類', KIND[item.kind] ?? item.kind], ['道', item.path.join(' / ')], ['依る', item.deps], ['when', item.when], ['trigger_rule', item.trigger],
      ['always_run', item.always ? 'はい' : ''], ['模型', item.model], ['道具', item.tools], ['禁じた道具', item.denied], ['skill', item.skills],
      ['retry', item.retry], ['script', item.script_file || item.script], ['runtime', item.runtime], ['最大', item.max], ['終わりの確かめ', item.until],
      ['先', item.target || item.outside || item.name], ['fan_out', item.fan_out], ['isolation', item.isolation], ['止めの訳', item.halt]]),
    item.target && G[item.target] && h('button', {class: 'chip', text: `${item.target} を開く`, onclick: () => enter(item.target)}),
    Object.keys(item.with || {}).length && h('h3', {text: 'with（渡す値）'}),
    Object.keys(item.with || {}).length && kv(Object.entries(item.with)),
    item.outs && item.outs.length && h('h3', {text: '出力の欄'}),
    item.outs && item.outs.length && kv(item.outs.map(f => [f[0], f[1] + (f[2] ? ' ' + f[2] : '')])),
    item.ask && [h('h3', {text: '人に聞くこと'}), pre(item.ask)],
    item.bash && [h('h3', {text: 'bash'}), pre(item.bash)],
    item.doc && [h('h3', {text: 'script の頭の説明'}), pre(item.doc)],
    item.md && [h('h3', {text: `指示 ${item.md.file || ''}`}), item.md.file ? [pre(item.md.text), ja(item.md.ja)] : h('div', {class: 'empty', text: 'md が無い'})],
    item.system_md && item.system_md.file && [h('h3', {text: `system ${item.system_md.file}`}), pre(item.system_md.text), ja(item.system_md.ja)],
    item.prompt && [h('h3', {text: 'YAML の指示の欄'}), pre(item.prompt)],
    RUN && h('h3', {text: `この run で（${at.events.length} 回）`}),
    RUN && !at.events.length && !at.skipped.length && h('div', {class: 'empty', text: 'この所の出来事は記録に無い'}),
    ...at.skipped.map(s => h('div', {}, badge('skipped'), ` ${s.tokens.join(' / ')} ${s.cause ? JSON.stringify(s.cause) : ''}`)),
    ...at.events.map(e => eventView(e, focus ? e === focus : at.events.length === 1, e === focus)),
  ].flat());
  // 再生の今の歩の出来事を板の見える所へ（scrollIntoView は包みの外の要素まで動かすので、板の中だけを動かす）
  const shown = $('p-body').querySelector('.focus');
  if (shown) $('p-body').scrollTop = shown.offsetTop - $('p-body').offsetTop - 8;
}

// 出来事（図の板とログで同じ形）
function eventView(e, open, focus) {
  const head = [badge(e.status), h('span', {class: 'mono', text: e.tokens.join(' / ')}), e.loop.length ? h('span', {text: `周 ${e.loop.join('.')}`}) : null,
    h('span', {class: 'empty', text: (e.start || '').replace('T', ' ').replace(/\..*/, '')}), e.cost ? h('span', {text: usd(e.cost)}) : null];
  const body = [
    kv([['run', e.run === RUN.id ? '' : e.run.slice(0, 8)], ['種類', e.kind], ['始め', e.start], ['終わり', e.end], ['模型', e.model], ['effort', e.effort],
      ['往復', e.turns], ['トークン', e.usage ? `入 ${num(e.usage.input)}・出 ${num(e.usage.output)}・cache 読み ${num(e.usage.cacheRead)}・cache 書き ${num(e.usage.cacheWrite)}` : ''],
      ['会話', e.session ? `${e.session}（${e.origin}）` : ''], ['図の所', where(e.at)]]),
    e.error && [h('h3', {text: '誤り'}), pre(e.error, 'err')],
    e.session && contextView(e.session),
    e.calls.length && [h('h3', {text: `道具の呼び出し（${e.calls.length}）`}),
      h('table', {}, e.calls.map(c => h('tr', {}, h('td', {text: c.name}), h('td', {text: c.status}), h('td', {class: 'wrap mono', text: c.title}))))],
    e.exec.length && [h('h3', {text: 'script と bash の出力の終わり'}), ...e.exec.map(x => fold(`${x.label} 終了の値 ${x.exit}`, [x.stdout && pre(x.stdout), x.stderr && pre(x.stderr, 'err')]))],
    e.prompts && [h('h3', {text: '組んだ指示の日本語の写し（値の記録から組み直した物）'}), ...e.prompts.map(p => fold(`${p.md} の ${p.n} 回目`,
      p.error ? pre(p.error, 'err') : [pre(p.ja.prompt), p.ja.system && [h('h3', {text: 'system'}), pre(p.ja.system)]].flat().filter(Boolean), e.prompts.length === 1))],
    e.output != null && [h('h3', {text: '出力'}), pre(pretty(e.output))],
  ];
  const out = fold(head, body.flat().filter(Boolean), open);
  if (focus) out.classList.add('focus');
  return out;
}
function pretty(s) { try { return JSON.stringify(JSON.parse(s), null, 1); } catch (_) { return s; } }

// LLM に入った物（Claude Code の会話の記録）: 初めの文脈（system・道具の一覧・添え書き・最初の指示）と、往復ごとに積まれた物（返事・考え・
// 道具の呼び出し・道具の結果）を、入った順の 1 本の並びにする。往復の頭には、その往復で LLM が読んだ入力のトークン（in・cache 読み・
// cache 書きの和。上の棒）と出したトークン（下の細い棒）を同じ尺で置き、文脈が育つ様子を上の棒の束で一目に見せる
const PIECE = {system: 'system', tools: '道具の一覧', inject: '添え書き', prompt: '最初の指示', user: '指示', say: '返事', think: '考え', call: '道具の呼び出し',
  result: '道具の結果'};
const tokensIn = u => (u.in || 0) + (u.cache_read || 0) + (u.cache_write || 0);
function contextView(preview, wide) {
  const S = (RUN.sessions || {})[preview];
  const title = h('h3', {}, `LLM に入った物（会話 ${preview}）`, ' ', !wide && S && h('button', {class: 'chip', text: '広く見る', onclick: () => wideView(preview)}));
  if (!S) return [title, h('div', {class: 'empty', text: `会話 ${preview} の記録が見つからない（Claude Code が消した古い記録は結べない）`})];
  const rec = S.recorded || {}, len = mark => text(mark).length, sum = marks => marks.reduce((n, m) => n + len(m), 0);
  const firstTurn = S.seq.findIndex(x => x[0] === 'turn'), head = firstTurn < 0 ? S.seq : S.seq.slice(0, firstTurn);
  const prompts = head.filter(x => x[0] === 'user').map(x => x[1]);
  const toolsSize = S.tools.reduce((n, t) => n + t[1], 0);
  const start = sum(S.system) + toolsSize + sum(S.inject.map(i => i[1])) + sum(prompts);
  const max = Math.max(1, ...S.turns.map(t => tokensIn(t.usage || {})));
  const piece = (kind, size, body, note) => fold([h('span', {class: 'pk k-' + kind, text: note || PIECE[kind]}), h('span', {class: 'mono empty', text: `${num(size)} 字`})], body);
  const missing = what => h('div', {class: 'ctx-row'}, h('span', {class: 'pk', text: what}), h('span', {class: 'empty', text: NOT_RECORDED}));
  const bar = (u, i) => {
    const total = tokensIn(u), before = i ? tokensIn(S.turns[i - 1].usage || {}) : 0, w = v => `${(100 * v / max).toFixed(2)}%`;
    return h('div', {class: 'ctx-bar', title: `入 ${num(u.in)}・cache 読み ${num(u.cache_read)}・cache 書き ${num(u.cache_write)}・出 ${num(u.out)}`},
      h('span', {class: 'mono', text: `往復 ${i + 1}`}),
      h('span', {class: 'track'}, h('span', {}, h('i', {class: 'cr', style: `width:${w(u.cache_read || 0)}`}), h('i', {class: 'cw', style: `width:${w(u.cache_write || 0)}`}),
        h('i', {class: 'in', style: `width:${w(u.in || 0)}`})), h('span', {class: 'o'}, h('i', {class: 'out', style: `width:${w(u.out || 0)}`}))),
      h('span', {class: 'mono', text: `入 ${num(total)}${i ? `（${total >= before ? '+' : ''}${num(total - before)}）` : ''}・出 ${num(u.out)}`}));
  };
  const rows = [h('div', {class: 'ctx-group', text: '初めの文脈'})];
  if (rec['api-request-shape'] === false) rows.push(missing('system と道具の一覧'));
  else {
    S.system.forEach((m, i) => rows.push(piece('system', len(m), both(m), `system ${i + 1}/${S.system.length}`)));
    rows.push(piece('tools', toolsSize, h('div', {}, S.tools.map(t => h('span', {class: 'chip', text: `${t[0]} ${num(t[1])} 字`}))), `道具の一覧 ${S.tools.length} 個`));
  }
  if (rec['api-request-blob'] === false) rows.push(missing('添え書き'));
  else S.inject.forEach((i, k) => rows.push(piece('inject', len(i[1]), both(i[1]), `添え書き ${k + 1}/${S.inject.length}${i[0] ? `（${i[0]}）` : ''}`)));
  prompts.forEach(m => rows.push(piece('prompt', len(m), both(m))));
  if (!prompts.length) rows.push(missing('最初の指示'));
  for (const [kind, a, b] of firstTurn < 0 ? [] : S.seq.slice(firstTurn)) {
    if (kind === 'turn') { rows.push(h('div', {class: 'ctx-group'}, `往復 ${a + 1} で積まれた物`), bar(S.turns[a].usage || {}, a)); continue; }
    if (kind === 'call') rows.push(piece('call', len(b), pre(text(b)), `道具の呼び出し ${a}`));
    else if (kind === 'user') rows.push(piece('user', len(a), both(a), '指示（後から）'));
    else rows.push(piece(kind, len(a), pre(text(a), kind === 'result' && b ? 'err' : null), kind === 'result' && b ? '道具の結果（誤り）' : null));
  }
  return [title,
    h('div', {class: 'ctx-sum'}, `初めの文脈 ${num(start)} 字（system ${S.system.length} 片・道具 ${S.tools.length}・添え書き ${S.inject.length} 片・指示 ${prompts.length}）・往復 ${S.turns.length}`,
      S.turns.length ? `・入力のトークン ${num(tokensIn(S.turns[0].usage || {}))} → ${num(tokensIn(S.turns[S.turns.length - 1].usage || {}))}` : '', S.cost != null ? `・費用 ${usd(S.cost)}` : ''),
    S.turns.length && h('div', {class: 'ctx-bars'}, S.turns.map((t, i) => bar(t.usage || {}, i)),
      h('div', {class: 'ctx-key'}, [['cr', 'cache 読み'], ['cw', 'cache 書き'], ['in', '入（cache の外）'], ['out', '出']].map(([c, l]) => h('span', {}, h('i', {class: c}), l)))),
    h('div', {class: 'ctx'}, rows)].filter(Boolean);
}
// 広い面: 板の狭さで読みにくい時に、同じ並びを図の画面いっぱいに出す
function wideView(preview) {
  $('w-title').textContent = `LLM に入った物（会話 ${preview}）`;
  $('w-body').replaceChildren(...contextView(preview, true).filter(x => x.tagName !== 'H3'));
  $('wide').hidden = false;
}

// run の一覧
function runs() {
  const out = $('s-runs');
  const cmd = id => `uv run --isolated python3 viewer/flowview.py --target ${sh(D.target)} --run ${id} <出力>`;
  out.append(h('div', {class: 'pad'}, `${D.target} の run の家の親の run（新しい順）。別の run を見るには、その行の命令を工場の clone の根で打つ（ページは 1 枚なので、ここから移れない）`),
    h('table', {}, h('tr', {}, ['id', 'graph', '状態', '待ち', '始め', 'かかった', '費用'].map(x => h('th', {text: x}))),
      D.runs.flatMap(r => [h('tr', {class: RUN && r.id === RUN.id ? 'cur' : null}, h('td', {class: 'mono', text: r.short}), h('td', {text: r.graph}),
        h('td', {}, badge(r.status)), h('td', {text: r.waiting.join('・')}), h('td', {text: when(r.started)}), h('td', {text: secs(r.seconds)}), h('td', {text: usd(r.cost)})),
        h('tr', {}, h('td', {}), h('td', {colspan: 6, class: 'wrap'}, r.error ? h('div', {class: 'err', text: r.error}) : null, h('code', {class: 'cmd', text: cmd(r.short)})))])));
}

// ログ
function log() {
  const out = $('s-log'), box = h('div', {class: 'pad'});
  box.append(kv([['run', RUN.id], ['graph', RUN.graph], ['状態', badge(RUN.status)], ['始め', when(RUN.started)], ['かかった', secs(RUN.seconds)], ['費用', usd(RUN.cost)],
    ['写し', RUN.copy]]));
  if (RUN.children.length) box.append(h('h3', {text: `子の run（${RUN.children.length}）`}),
    h('table', {}, RUN.children.map(c => h('tr', {}, h('td', {class: 'mono', text: c.id.slice(0, 8)}), h('td', {text: c.graph}), h('td', {}, badge(c.status)),
      h('td', {text: c.node.join(' / ')}), h('td', {text: secs(c.seconds)})))));
  box.append(h('h3', {text: `ノードの出来事（${RUN.events.length}・時刻順）`}), ...RUN.events.map(e => eventView(e, false)));
  if (RUN.skipped.length) box.append(h('h3', {text: `飛んだノード（${RUN.skipped.length}）`}),
    h('table', {}, RUN.skipped.map(s => h('tr', {}, h('td', {class: 'mono', text: s.tokens.join(' / ')}), h('td', {text: where(s.at)}),
      h('td', {class: 'wrap mono', text: s.cause ? JSON.stringify(s.cause) : ''})))));
  if (RUN.checks.length) box.append(h('h3', {text: `繰り返しの終わりの確かめ（${RUN.checks.length}）`}),
    ...RUN.checks.map(x => fold(`${x.step} ${x.label} 終了の値 ${x.exit}`, [x.stdout && pre(x.stdout), x.stderr && pre(x.stderr, 'err')])));
  const arts = Object.entries(RUN.artifacts);
  if (arts.length) box.append(h('h3', {text: `出力が指す run の置き場のファイル（${arts.length}）`}), ...arts.map(([k, v]) => fold(h('span', {class: 'mono', text: k}), pre(v))));
  if (RUN.live) box.append(h('div', {class: 'notice', text: `ここまで（${D.made_at}）。run は走り中なので、この先は記録にまだ無い`}));
  out.append(box);
}

// 読めなかった物（黙って落とさない）
function unreadCount() {
  let n = D.shape.problems.length + D.unmatched.length + D.stages.loose.length;
  if (RUN) { n += Object.values(RUN.unread).reduce((a, b) => a + b, 0) + RUN.missing_logs.length;
    for (const S of Object.values(RUN.sessions || {})) n += Object.values(S.unread).reduce((a, b) => a + b, 0); }
  return n;
}
function unread() {
  const box = h('div', {class: 'pad'});
  const list = (title, rows) => box.append(h('h3', {text: `${title}（${rows.length}）`}), rows.length ? h('ul', {}, rows.map(r => h('li', {class: 'mono', text: r}))) : h('div', {class: 'empty', text: 'なし'}));
  list('作りの読みの問題', D.shape.problems);
  list('図に当たらないノード', D.unmatched);
  list(`段の表（viewer/stages.json）のどの段にも無い ${D.stages.graph || 'line'} のノード（流れの画面で段に数えない）`, D.stages.loose);
  if (RUN) {
    list('Archon の記録の読めなかった行', Object.entries(RUN.unread).map(([k, v]) => `${k}: ${v}`));
    list('記録の無い run', RUN.missing_logs);
    const ses = [];
    for (const [p, S] of Object.entries(RUN.sessions || {})) for (const [k, v] of Object.entries(S.unread)) ses.push(`${p} ${k}: ${v}`);
    list('会話の記録の知らない型の行（Claude Code の記録の形は工場が止めていない。読まないと決めた型は、字を読む代わりの型が記録に在る時は数えない）', ses);
  }
  $('s-unread').append(box);
}

header();
if (D.target) runs();
if (RUN) log();
unread();
</script>
</body>

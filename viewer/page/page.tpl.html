<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>run ビューア（試作 4）</title>
<style>
/*TOKENS*/
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--fontStack-system); color: var(--fgColor-default); background: var(--bgColor-default); display: flex; flex-direction: column; overflow: hidden; font-size: 14px; }
header { padding: 5px 10px; border-bottom: 1px solid var(--borderColor-default); }
.help { display: inline-block; width: 20px; height: 20px; line-height: 18px; text-align: center; border: 1px solid var(--borderColor-default); border-radius: 50%; color: var(--fgColor-muted); cursor: help; }
header h1 { font-size: 16px; margin: 0 0 4px; }
header .sub { color: var(--fgColor-muted); }
.bar { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
.bar .sub { overflow: hidden; text-overflow: ellipsis; }
.bar button { font: inherit; font-size: 12.5px; padding: 2px 8px; border: 1px solid var(--borderColor-default); background: var(--bgColor-muted); color: var(--fgColor-default); border-radius: 6px; cursor: pointer; }
.bar button:hover { background: var(--bgColor-neutral-muted); }
.legend { display: flex; gap: 6px; margin-left: 10px; color: var(--fgColor-muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 3px; vertical-align: -1px; }
/* VS Code の HTML を見る拡張は body の中身を自分の div で包むので、flex と height: 100% に頼ると図の高さが 0 になる。高さはスクリプトが窓の下の端までに合わせる（attention の milestone-map と同じ） */
main { position: relative; display: flex; height: 600px; }
#view { flex: 1; position: relative; overflow: hidden; background: var(--bgColor-muted); cursor: grab; }
#view.drag { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.frame { position: absolute; border: 1px solid var(--borderColor-default); border-radius: 10px; background: var(--frame-bg); }
.frame.stage { background: var(--bgColor-default); border-width: 1.5px; }
.frame > .fhead { position: absolute; left: 0; right: 0; top: 0; height: 32px; padding: 6px 12px; display: flex; gap: 8px; align-items: baseline; cursor: pointer; border-bottom: 1px solid var(--borderColor-muted); white-space: nowrap; overflow: hidden; }
.frame > .fhead b { font-size: 14.5px; }
.frame > .fhead span { color: var(--fgColor-muted); font-size: 13px; }
.frame > .fhead:hover { background: var(--bgColor-neutral-muted); }
.card { position: absolute; border: 1px solid var(--borderColor-default); border-radius: 8px; background: var(--bgColor-default); box-shadow: var(--shadow); padding: 9px 12px 9px 15px; cursor: pointer; width: 290px; overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--st); }
.card .t { display: flex; gap: 6px; align-items: baseline; }
.card .t b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .k { font-size: 12px; padding: 0 5px; border-radius: 9px; border: 1px solid var(--borderColor-default); color: var(--fgColor-muted); white-space: nowrap; }
.card.ai .k { background: var(--bgColor-accent-emphasis); color: var(--fgColor-onEmphasis); border-color: transparent; }
.card.gate .k { background: var(--bgColor-severe-muted); color: var(--fgColor-severe); }
.card .m { color: var(--fgColor-muted); font-size: 13px; margin-top: 2px; white-space: nowrap; }
.card .w { font-size: 13.5px; margin-top: 4px; color: var(--fgColor-default); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.group { border-width: 1.5px; }
.card.group .open { margin-left: auto; color: var(--fgColor-accent); font-size: 12.5px; white-space: nowrap; }
.card.wire { width: 170px; padding: 3px 8px 3px 10px; opacity: .7; box-shadow: none; }
.card.wire .w, .card.wire .k { display: none; }
.card.dim, .frame.dim { opacity: .45; }
.card.sel { outline: 2px solid var(--bgColor-accent-emphasis); outline-offset: 1px; }
.st-ok { --st: var(--bgColor-success-emphasis); }
.st-failed { --st: var(--bgColor-danger-emphasis); }
.st-skipped { --st: var(--borderColor-default); }
.st-none { --st: transparent; }
.st-running, .st-waiting { --st: #d4a72c; }
.card.st-skipped, .card.st-none { background: var(--bgColor-muted); }
.card.st-skipped .t b, .card.st-none .t b { color: var(--fgColor-muted); }
.card.st-failed { background: var(--bgColor-danger-muted); }
#world.far .card .m, #world.far .card .w, #world.far .card .k, #world.far .card .open { display: none; }
#world.far .card { padding: 6px 10px 6px 14px; }
#world.far .card .t b { font-size: min(calc(14px / var(--z)), 44px); }
#world.far .card::before { width: min(calc(5px / var(--z)), 16px); }
#world.far .card.wire .t b { font-size: min(calc(11px / var(--z)), 30px); }
#world.far .frame > .fhead { height: auto; top: auto; bottom: 100%; border: 0; background: transparent; padding: 0 2px 2px; }
#world.far .frame > .fhead b { font-size: min(calc(14px / var(--z)), 150px); }
#world.vfar .card { background: var(--st) !important; border-color: transparent; }
#world.vfar .card .t b { visibility: hidden; }
#world.vfar .card.st-none, #world.vfar .card.st-skipped { background: var(--bgColor-neutral-muted) !important; }
#world.far .frame > .fhead span { display: none; }
#world.far .frame { border-width: min(calc(1.5px / var(--z)), 5px); }
.st-future { --st: transparent; }
.card.st-future, .frame.st-future { opacity: .32; border-style: dashed; box-shadow: none; }
.card.st-running { --st: #d4a72c; box-shadow: 0 0 0 3px #d4a72c55; animation: pulse 1.1s ease-in-out infinite; }
.frame.st-running { border-color: #d4a72c; border-width: 2px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px #d4a72c1a; } }
@media (prefers-reduced-motion: reduce) { .card.st-running { animation: none; } }
.card.now { outline: 3px solid #d4a72c; outline-offset: 2px; }
.frame.now > .fhead { outline: 3px solid #d4a72c; outline-offset: -2px; border-radius: 10px 10px 0 0; }
#tl { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; background: color-mix(in srgb, var(--bgColor-default) 92%, transparent); border-top: 1px solid var(--borderColor-default); padding: 6px 12px 8px; backdrop-filter: blur(4px); }
#tl .row { display: flex; gap: 8px; align-items: center; }
#tl button { font: inherit; font-size: 13px; min-width: 30px; padding: 2px 8px; border: 1px solid var(--borderColor-default); background: var(--bgColor-muted); color: var(--fgColor-default); border-radius: 6px; cursor: pointer; }
#tl button.on { background: var(--bgColor-accent-emphasis); color: var(--fgColor-onEmphasis); border-color: transparent; }
#tl select, #tl label { font: inherit; font-size: 12.5px; color: var(--fgColor-muted); }
#tl .now-t { font: 12.5px var(--fontStack-mono); color: var(--fgColor-default); white-space: nowrap; }
#tl .now-w { color: var(--fgColor-muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
#band { position: relative; height: 22px; margin-top: 6px; border-radius: 5px; background: var(--bgColor-muted); cursor: pointer; overflow: hidden; }
#band .seg { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--bgColor-default); font-size: 11px; line-height: 22px; padding-left: 4px; color: var(--fgColor-default); overflow: hidden; white-space: nowrap; }
#band .seg.wait { background-image: repeating-linear-gradient(45deg, transparent 0 4px, #0000000d 4px 8px); }
#band .cur { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #d4a72c; box-shadow: 0 0 0 1px var(--bgColor-default); }
#scrub { width: 100%; margin: 4px 0 0; accent-color: #d4a72c; }
path.e { fill: none; stroke: var(--fgColor-muted); stroke-opacity: .45; stroke-width: 1.2; }
path.e.hot { stroke: var(--bgColor-accent-emphasis); stroke-opacity: 1; stroke-width: 2; }
#side { position: absolute; right: 0; top: 0; bottom: 0; width: min(520px, 42%); border-left: 1px solid var(--borderColor-default); overflow: auto; padding: 12px 14px; background: var(--bgColor-default); box-shadow: -6px 0 18px #1f232822; transform: translateX(105%); transition: transform .15s ease; z-index: 5; }
#side.on { transform: none; }
#side .x { position: sticky; top: 0; float: right; font: inherit; font-size: 16px; border: 0; background: transparent; color: var(--fgColor-muted); cursor: pointer; }
#side h2 { font-size: 15px; margin: 0 0 4px; }
#side .what { color: var(--fgColor-muted); margin-bottom: 8px; }
#side table { border-collapse: collapse; margin-bottom: 8px; }
#side td { padding: 2px 8px 2px 0; vertical-align: top; }
#side td:first-child { color: var(--fgColor-muted); white-space: nowrap; }
#side pre { white-space: pre-wrap; background: var(--bgColor-muted); border: 1px solid var(--borderColor-muted); border-radius: 6px; padding: 8px; font: 12px var(--fontStack-mono); max-height: 420px; overflow: auto; }
#side details { margin: 6px 0; }
#side summary { cursor: pointer; }

#side.wide { width: min(1100px, 82%); }
#side .tools { position: sticky; top: 0; float: right; display: flex; gap: 2px; z-index: 2; }
#side .tools button { font: inherit; font-size: 15px; border: 0; background: var(--bgColor-default); color: var(--fgColor-muted); cursor: pointer; padding: 0 6px; border-radius: 4px; }
#side .tools button:hover { background: var(--bgColor-muted); }
.run { border: 1px solid var(--borderColor-default); border-radius: 8px; margin: 10px 0; overflow: hidden; }
.run > .rh { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--bgColor-muted); cursor: pointer; font-size: 12.5px; }
.run > .rh .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--st); flex: none; border: 1px solid var(--borderColor-default); }
.run > .rh .m { color: var(--fgColor-muted); }
.run.shut > .rb { display: none; }
.rb { padding: 8px 10px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--borderColor-default); margin-bottom: 8px; }
.tabs button { font: inherit; font-size: 12.5px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--fgColor-muted); padding: 4px 8px; cursor: pointer; }
.tabs button.on { color: var(--fgColor-default); border-bottom-color: #fd8c73; font-weight: 600; }
.tabs .n { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--bgColor-neutral-muted); font-size: 11px; font-weight: 500; }
.vals { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; align-items: start; }
.vals .k { font: 12px var(--fontStack-mono); color: var(--fgColor-accent, #4493f8); padding-top: 2px; cursor: pointer; }
.vals .v code { font: 12px var(--fontStack-mono); background: var(--bgColor-muted); border-radius: 4px; padding: 1px 5px; white-space: pre-wrap; word-break: break-word; }
.vals .v .empty { color: var(--fgColor-muted); font-style: italic; }
.vals details summary { font: 12px var(--fontStack-mono); color: var(--fgColor-muted); }
.note { color: var(--fgColor-muted); font-size: 12px; margin: 4px 0 8px; }
#side pre.prompt { max-height: 70vh; }
mark.val { background: #d4a72c38; color: var(--fgColor-default); border-bottom: 2px solid #d4a72c; border-radius: 2px; }
mark.val.flash { background: #d4a72c99; }
mark.val::before { content: attr(data-n); font: 10px var(--fontStack-mono); color: var(--fgColor-default); background: #d4a72c80; border-radius: 3px; padding: 0 3px; margin-right: 3px; }
.talk { display: flex; flex-direction: column; gap: 6px; }
.turn { border-left: 2px solid var(--borderColor-default); padding-left: 10px; transition: opacity .2s; }
.turn.later { opacity: .28; }
.turn.copied { border-left-style: dashed; }
.turn .th { font-size: 11.5px; color: var(--fgColor-muted); display: flex; gap: 8px; margin-bottom: 3px; }
.bub { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; line-height: 1.5; margin: 3px 0; }
.bub.say { background: var(--bgColor-accent-muted); border-radius: 8px; padding: 6px 9px; }
.bub.user { background: var(--bgColor-muted); border-radius: 8px; padding: 6px 9px; }
details.think > summary { font-size: 12px; color: var(--fgColor-muted); font-style: italic; }
details.think .bub { color: var(--fgColor-muted); font-style: italic; }
details.call { margin: 3px 0; border: 1px solid var(--borderColor-muted); border-radius: 6px; }
details.call > summary { list-style: none; padding: 3px 8px; font-size: 12px; display: flex; gap: 6px; align-items: baseline; }
details.call > summary::-webkit-details-marker { display: none; }
details.call .tn { font: 600 11.5px var(--fontStack-mono); padding: 0 5px; border-radius: 4px; background: var(--bgColor-neutral-muted); color: var(--fgColor-default); flex: none; }
details.call .tt { font: 11.5px var(--fontStack-mono); color: var(--fgColor-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
details.call .tm { font-size: 11px; color: var(--fgColor-muted); flex: none; }
details.call.err { border-color: #ff818266; }
details.call.err .tn { background: var(--bgColor-danger-muted); color: var(--fgColor-danger); }
details.call.agent .tn { background: #8250df2e; color: var(--fgColor-done); }
details.call > div { padding: 4px 8px 8px; }
details.call b { font-size: 11.5px; color: var(--fgColor-muted); font-weight: 600; }
details.call pre { max-height: 300px !important; }
.sub-talk { margin: 6px 0 2px 4px; padding-left: 10px; border-left: 2px solid #c297ff; }
.find { display: flex; gap: 6px; margin-bottom: 6px; }
.find input { flex: 1; font: inherit; font-size: 12.5px; padding: 3px 7px; border: 1px solid var(--borderColor-default); border-radius: 6px; background: var(--bgColor-default); color: var(--fgColor-default); }
.hidefind { display: none !important; }
@keyframes pop { from { opacity: 0; } to { opacity: 1; } }
.card.pop, .frame.pop { animation: pop .35s ease-out both; }
/* 出入口（受けた・返した）の札 */
.card.pin, .card.pout { width: 300px; padding: 8px 10px 8px 13px; border-style: solid; background: var(--bgColor-muted); }
.card.pin::before, .card.pout::before { background: #8c959f; }
.card.pin .t b, .card.pout .t b { font-size: 13.5px; }
.prow { display: grid; grid-template-columns: max-content 1fr; gap: 0 8px; font: 11.5px var(--fontStack-mono); line-height: 1.55; margin-top: 4px; }
.prow .pn { color: var(--fgColor-accent); }
.prow .pv { color: var(--fgColor-default); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .pv.e { color: var(--fgColor-muted); font-style: italic; }
.prow .pv .from { color: var(--fgColor-done); }
.pmore { font-size: 11.5px; color: var(--fgColor-muted); margin-top: 3px; }
.card .io { font-size: 12px; color: var(--fgColor-muted); margin-top: 3px; white-space: nowrap; }
.card .io b { color: var(--fgColor-default); font-weight: 600; }
#world.far .card .io, #world.far .prow, #world.far .pmore { display: none; }
/* 分岐の札（カードの上の左） */
.bchip { position: absolute; font-size: 11.5px; line-height: 18px; padding: 0 7px; border-radius: 9px; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; pointer-events: none; border: 1px solid transparent; }
.bchip.yes { background: #1f883d26; color: var(--fgColor-success); border-color: #1f883d55; }
.bchip.no { background: var(--bgColor-neutral-muted); color: var(--fgColor-muted); border-color: var(--borderColor-default); }
.bchip.up { background: var(--bgColor-neutral-muted); color: var(--fgColor-muted); border-style: dashed; border-color: var(--borderColor-default); }
.bchip.bad { background: var(--bgColor-danger-muted); color: var(--fgColor-danger); border-color: var(--fgColor-danger); }
#world.far .bchip { display: none; }
#world.vfar .bchip { display: none; }
path.e.skip { stroke-dasharray: 5 5; stroke-opacity: .3; }
path.e.swon { stroke-width: 3; stroke: var(--bgColor-accent-emphasis); stroke-opacity: .9; }
.card.sw { width: 210px; border: 1.5px solid var(--bgColor-accent-emphasis); border-radius: 22px; background: color-mix(in srgb, var(--bgColor-accent-emphasis) 8%, var(--bgColor-default)); padding: 7px 14px; }
.card.sw.st-skipped, .card.sw.st-future { border-color: var(--borderColor-default); background: var(--bgColor-muted); }
.card.sw .dia { color: var(--fgColor-accent); font-size: 16px; margin-right: 4px; }
.card.sw .arms { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.card.sw .arm { font-size: 11.5px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--borderColor-default); color: var(--fgColor-muted); }
.card.sw .arm.on { border-color: var(--bgColor-accent-emphasis); color: var(--fgColor-accent); font-weight: 600; }
.elab.swl { font-weight: 600; }
.elab.swl:not(.on) { opacity: .55; }
.elab { position: absolute; transform: translate(-50%, -50%); font: 11px var(--fontStack-mono); background: var(--bgColor-default); color: var(--fgColor-done); border: 1px solid var(--borderColor-muted); border-radius: 8px; padding: 0 6px; white-space: nowrap; pointer-events: none; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
#world.far .elab { display: none; }
#side .ports { display: grid; grid-template-columns: max-content max-content 1fr; gap: 3px 10px; font-size: 12px; align-items: start; margin-bottom: 8px; }
#side .ports .pn { font: 12px var(--fontStack-mono); color: var(--fgColor-accent); }
#side .ports .ps { color: var(--fgColor-done); font-size: 11.5px; white-space: nowrap; }
#side .ports .ps a { color: inherit; cursor: pointer; text-decoration: underline dotted; }
#side .ports code { font: 12px var(--fontStack-mono); background: var(--bgColor-muted); border-radius: 4px; padding: 1px 5px; white-space: pre-wrap; word-break: break-word; }
#side .why { border: 1px solid var(--borderColor-default); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
#side .why.yes { border-left: 4px solid var(--fgColor-success); } #side .why.no { border-left: 4px solid var(--fgColor-muted); } #side .why.bad { border-left: 4px solid var(--fgColor-danger); }
#side .why code { font: 12px var(--fontStack-mono); white-space: pre-wrap; word-break: break-word; }
#side .why .v { background: #d4a72c38; border-radius: 3px; padding: 0 3px; }
#side a.jump { color: var(--fgColor-accent); cursor: pointer; }
.info { cursor: pointer; color: var(--fgColor-accent); font-size: 13px; padding: 0 3px; border-radius: 4px; }
.info:hover { background: var(--bgColor-accent-muted); }
.card .t .info { margin-left: 2px; }
#world.far .info { display: none; }
.bchip.ans { background: var(--bgColor-severe-muted, #fff1e5); color: var(--fgColor-severe); border-color: var(--fgColor-severe); }
.card .rej { display: inline-block; margin-left: 6px; font-size: 11.5px; padding: 0 6px; border-radius: 9px; background: var(--bgColor-danger-muted); color: var(--fgColor-danger); }
.card .rnd { display: inline-block; margin-left: 6px; font-size: 11.5px; padding: 0 6px; border-radius: 9px; background: var(--bgColor-neutral-muted); color: var(--fgColor-default); }
#where { position: absolute; left: 10px; top: 8px; z-index: 3; font-size: 12.5px; color: var(--fgColor-muted); background: var(--bgColor-default); border: 1px solid var(--borderColor-muted); border-radius: 8px; padding: 3px 9px; pointer-events: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-shadow: var(--shadow); }
#where b { color: var(--fgColor-default); }
#where:empty { display: none; }
#side .role { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 9px; margin: 2px 0 6px; border: 1px solid var(--borderColor-default); }
#side .role.ai { background: var(--bgColor-accent-muted); } #side .role.code { background: var(--bgColor-neutral-muted); } #side .role.human { background: var(--bgColor-severe-muted, #fff1e5); } #side .role.wire { background: transparent; border-style: dashed; }
#side h3 { font-size: 13.5px; margin: 12px 0 4px; }
#side .sumrow { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; }
#side .sumrow > span:nth-child(odd) { color: var(--fgColor-muted); white-space: nowrap; }
#side .item { border: 1px solid var(--borderColor-muted); border-radius: 8px; padding: 6px 9px; margin: 5px 0; font-size: 12.5px; }
#side .item .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
#side .item .h .m { color: var(--fgColor-muted); font-size: 11.5px; }
#side .item.bad { border-left: 4px solid var(--fgColor-danger); } #side .item.ans { border-left: 4px solid var(--fgColor-severe); } #side .item.cost { border-left: 4px solid var(--fgColor-accent); }
#side .item .body { white-space: pre-wrap; word-break: break-word; margin-top: 3px; max-height: 9.5em; overflow: auto; }
#side pre.cmd { font-size: 11.5px; max-height: 260px; user-select: all; }
#side .warn { color: var(--fgColor-danger); font-size: 12px; margin: 4px 0; }
#side code.path { font: 12px var(--fontStack-mono); background: var(--bgColor-muted); border-radius: 4px; padding: 1px 5px; user-select: all; }
#mini { position: absolute; left: 10px; bottom: 96px; width: 200px; height: 130px; opacity: .92; background: var(--bgColor-default); border: 1px solid var(--borderColor-default); border-radius: 6px; box-shadow: var(--shadow); }
</style>
</head>
<body>
<header>
  <div class="bar"><b id="title"></b><span class="sub" id="sub"></span><span style="flex:1"></span>

const boxOf = n => n.classList.contains("frame") ? { x: n.offsetLeft, y: n.offsetTop, w: Math.min(n.offsetWidth, 520), h: Math.min(n.offsetHeight, 160) } : { x: n.offsetLeft, y: n.offsetTop, w: n.offsetWidth, h: n.offsetHeight };
let tw = null, aim = null;   // 動いている途中の滑らかな動きと、その行き先
function stopTween() { if (tw) { cancelAnimationFrame(tw); tw = null; } aim = null; }
function tween(nx, ny, ns, ms) {
  // 画面の真ん中が通る道を世界の座標で補間する。行き先が 1 画面より遠い時は、途中で少し引いて（両端が見える所まで）飛ぶ。いきなり横へ流れて見えないように
  stopTween(); aim = { tx: nx, ty: ny, scale: ns }; const a = { tx, ty, scale }, s0 = performance.now();
  const Wc = view.clientWidth / 2, Hc = view.clientHeight / 2;
  const c0 = { x: (Wc - a.tx) / a.scale, y: (Hc - a.ty) / a.scale }, c1 = { x: (Wc - nx) / ns, y: (Hc - ny) / ns };
  const dw = Math.hypot(c1.x - c0.x, c1.y - c0.y), far = dw * Math.min(a.scale, ns) > view.clientWidth * 0.7;
  const u0 = 1 / a.scale, u1 = 1 / ns, sm = Math.max(0.12, Math.min(a.scale, ns, view.clientWidth * 0.75 / Math.max(1, dw)));
  const bump = far ? Math.max(0, 1 / sm - (u0 + u1) / 2) : 0;
  if (far) ms = Math.min(1500, Math.max(ms * 1.6, 800));
  const f = t => { const p = Math.min(1, (t - s0) / ms), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    const u = u0 + (u1 - u0) * e + bump * 4 * e * (1 - e), sc = 1 / u, cx = c0.x + (c1.x - c0.x) * e, cy = c0.y + (c1.y - c0.y) * e;
    if (p >= 1) { tx = nx; ty = ny; scale = ns; } else { scale = sc; tx = Wc - cx * sc; ty = Hc - cy * sc; }
    apply(); tw = p < 1 ? requestAnimationFrame(f) : null; if (!tw) aim = null; };

}
function camera(keys, main) { // keys の見えている物を、画面（右の欄と時間の帯を除いた所）に収める
  const els = [...new Set(keys.map(repOf))].map(elOf).filter(Boolean); if (!els.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of els) { const b = boxOf(n); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); }
  const side = $("side"), sw = side.classList.contains("on") ? side.offsetWidth : 0;
  const W = view.clientWidth - sw, H = view.clientHeight - $("tl").offsetHeight;
  const fitS = Math.min(1, W * 0.8 / (x1 - x0), H * 0.72 / (y1 - y0));
  const at = aim || { tx, ty, scale };   // 動いている途中なら、行き先で考える
  let s = at.scale, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  if (fitS < 0.4) { // 全部は読める大きさに収まらない: 一番新しい物を真ん中に
    s = 0.55; const m = elOf(repOf(main)); if (m) { const b = boxOf(m); cx = b.x + b.w / 2; cy = b.y + b.h / 2; }
  } else if (s > fitS || s < Math.min(0.6, fitS)) s = Math.min(fitS, 0.85);
  // 今の位置で収まっていて、大きさも変えないなら動かさない（細かく揺らさない）
  const inX = x0 * at.scale + at.tx >= W * 0.08 && x1 * at.scale + at.tx <= W * 0.92, inY = y0 * at.scale + at.ty >= H * 0.1 && y1 * at.scale + at.ty <= H * 0.9;
  if (Math.abs(s - at.scale) < 0.01 && (fitS >= 0.4 ? inX && inY : (() => { const m = elOf(repOf(main)); if (!m) return true; const b = boxOf(m), mx = (b.x + b.w / 2) * at.scale + at.tx, my = (b.y + b.h / 2) * at.scale + at.ty; return mx > W * 0.25 && mx < W * 0.75 && my > H * 0.2 && my < H * 0.8; })())) return;
  const ms = rp.timer ? Math.max(140, Math.min(700, 900 / Number($("rp-speed").value) * 0.9)) : 300;
  tween(W / 2 - cx * s, H / 2 - cy * s, s, ms);
}
function go(i) {
  rp.i = Math.max(0, Math.min(steps.length - 1, i)); rp.on = rp.i < steps.length - 1 || rp.timer != null; scrub.value = rp.i;
  const t = now(); cur.style.left = pct(t) + "%";
  const run = rp.on ? running() : [];
  let tg = run.length ? run : rp.on ? changedAt(t) : [];
  if (rp.on && !tg.length) { const l = lastStarted(t); if (l) tg = [l]; }
  const main = [...tg].sort((a, b) => startOf(b, t) - startOf(a, t))[0] || null;
  $("rp-t").textContent = rp.on ? `${hhmmss(t)}（${plus(t)}）` : "最終状態";
  const skippedNow = !run.length && tg.length && tg.every(k => stateAt(k) === "skipped");
  $("rp-w").textContent = rp.on ? (main ? (run.length ? "実行中: " : skippedNow ? "スキップ: " : "直前の変化: ") + [...ancestors(main), main].map(x => O[x].name).join(" › ") + (tg.length > 1 ? ` ほか ${tg.length - 1} 個` : "") : "") : `${steps.length} ステップ・スライダーか ▶ で再生`;
  const following = $("rp-follow").checked && rp.on;
  // 並べ直しの前に、今の物がどこに見えていたか（閉じた枠ならその枠のカード）を覚える。並べ直した後、今の物をそこに置き直すので、
  // 枠はその場から広がって見え、図が跳ばない
  const preEl = main ? elOf(repOf(main)) : null;
  const pre = preEl ? { x: preEl.offsetLeft + preEl.offsetWidth / 2, y: preEl.offsetTop + preEl.offsetHeight / 2 } : null;
  let changed = false;
  if (following && $("rp-open").checked) {
    // 開くのは動いている物の枠。動いている物が無い歩（スキップ・終わっただけ）は、開いた枠を閉じずに、動いた物の枠を足すだけにする
    const keep = run.length ? [] : [...rp.auto];
    const want = new Set([...keep, ...tg.filter(k => stateAt(k) !== "skipped").slice(0, 12).flatMap(ancestors)]);
    // 自動で開いた枠は、再生の間は閉じない（閉じると図の形が大きく変わり、画面が跳ぶ）。再生を終えた時にまとめて閉じる
    for (const a of want) if (!open.has(a)) { open.add(a); rp.auto.add(a); changed = true; }
  }
  if (!rp.on || !$("rp-open").checked) { for (const a of rp.auto) open.delete(a); if (rp.auto.size) changed = true; rp.auto.clear(); }
  if (changed) {
    stopTween();
    layout(null, true, true);
    const postEl = main ? elOf(repOf(main)) : null;
    if (pre && postEl && rp.on) { tx += (pre.x - (postEl.offsetLeft + postEl.offsetWidth / 2)) * scale; ty += (pre.y - (postEl.offsetTop + postEl.offsetHeight / 2)) * scale; apply(); }
    flip();
  } else restyle();
  for (const c of world.querySelectorAll(".card.now, .frame.now")) c.classList.remove("now");
  if (main) { const c = elOf(repOf(main)); if (c) c.classList.add("now"); }   // 閉じた枠の中なら、その枠のカード
  if (following && tg.length) camera(tg, main);
  lateTurns();
}
function play() { if (rp.timer) { clearInterval(rp.timer); rp.timer = null; $("rp-play").textContent = "▶"; $("rp-play").classList.remove("on"); return; }
  if (rp.i >= steps.length - 1) rp.i = -1;
  $("rp-play").textContent = "❚❚"; $("rp-play").classList.add("on");
  rp.timer = setInterval(() => { if (rp.i >= steps.length - 2) { play(); go(steps.length - 2); return; } go(rp.i + 1); }, 900 / Number($("rp-speed").value)); }
$("rp-play").onclick = play;
$("rp-prev").onclick = () => go((rp.on ? rp.i : steps.length - 1) - 1);
$("rp-next").onclick = () => go(rp.i + 1);
$("rp-stop").onclick = () => { if (rp.timer) play(); rp.on = false; go(steps.length - 1); };
$("rp-speed").onchange = () => { if (rp.timer) { play(); play(); } };
scrub.oninput = () => go(Number(scrub.value));
band.onclick = ev => { const r = band.getBoundingClientRect(); const t = t0 + (ev.clientX - r.left) / r.width * (t1 - t0); let i = steps.findIndex(x => x > t) - 1; if (i < 0) i = 0; go(i); };
document.addEventListener("keydown", ev => { if (ev.target.closest("input,select")) return; if (ev.key === " ") { ev.preventDefault(); play(); } else if (ev.key === "ArrowRight") go(rp.i + 1); else if (ev.key === "ArrowLeft") go((rp.on ? rp.i : steps.length - 1) - 1); });
go(steps.length - 1);
$("fit").onclick = fit;
$("io-t").onclick = ev => { io = !io; ev.target.textContent = io ? "ノードビュー" : "I/O ビュー"; layout(selected && O[selected] && !hidden(selected) ? selected : null, true); };
$("sum-t").onclick = () => summaryPanel();
$("closeall").onclick = () => { open.clear(); open.add(ROOT); selected = null; layout(); };
$("openstages").onclick = () => { for (const k of O[ROOT].kids) open.add(k); layout(); fit(); };
$("wires-t").onclick = ev => { hideWire = !hideWire; ev.target.textContent = hideWire ? "接続スクリプトを表示" : "接続スクリプトを隠す"; layout(selected && !hidden(selected) ? selected : null); };
function fillHeight() { const m = document.querySelector("main"); const r = m.getBoundingClientRect(), sc = m.offsetWidth ? r.width / m.offsetWidth : 1; m.style.height = Math.max(300, (window.innerHeight - r.top) / (sc || 1) - 2) + "px"; }
window.addEventListener("resize", () => { fillHeight(); mini(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") $("side").classList.remove("on"); });
});
</script>

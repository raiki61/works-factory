  outcome: stopped_by_line
  stop_reason: ''
  machine: {type: archon_artifact, run_id: dry-run, path: report/report.machine.json}
  human: {type: archon_artifact, run_id: dry-run, path: report/report.md}
  detail: null
  next_request: null
  prior_failures: null
  report: ['- 報告']
judge__ins: {spec: 型に合わない, world: false, web: 'on'}

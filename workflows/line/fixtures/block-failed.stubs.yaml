# judge の中の node が落ちた（judge の入口の node ins に output_format に合わない stub を置いて落とす。workflow test は型に合わない stub の
# node を落ちた node にし、ins の出力を when か all_done で読む node も落ちる）。返す node は飛ばされ、後ろが飛び、collect・report・後始末・result は走る。
fixture:
  expect: failed
  inputs: {request: .archon/workflows/works-factory/line/fixtures/request.json}
  reached: [collect, report__finish, sweep-children, result]
  fail-node: [judge__ins]
exec-code: true
gate-start: {decision: approve, text: ''}
test-gate-base__intake: {ok: true, reason: ''}
test-gate-base__run:
  by: engine
  material: {status: clean, checked: 'suite: exit 0'}
  runs:
  - {name: suite, exit: 0, how: direct}
  skipped_steps: []
  same_as: null
  log: test-gate-base/logs/checks.log
  junit_steps: []
  fingerprint_before: {head: hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh, diff_hash: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd}
  fingerprint_after: {head: hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh, diff_hash: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd}
test-gate-base__result:
  mode: base
  ok: true
  green: true
  red_cause: ''
  ran_steps:
    ran: [suite]
    unran: []
  baseline: {type: archon_artifact, run_id: dry-run, path: test-gate-base/baseline.json}
  fingerprint: null
  test_outcomes: null
  evidence: {type: archon_artifact, run_id: dry-run, path: test-gate-base/evidence.json}
  by: engine
  suites_line: '走らせた: suite（exit 0・direct）／走らせなかった: 無い'
  log: test-gate-base/logs/checks.log
  baseline_line: ''
  reason: ''
  suite: ''
  suite_note: ''
  related: {applied: false, whole: false, files: [], left: [], far: [], reasons: [], ran: none}
  report: ['試験の関門（base）: 緑']
report__facts: {outcome: stopped_by_line, ok: false, stop_reason: '', machine: null, next_request: null, prior_failures: null, ai_go: false, stamp: ''}
report__finish:

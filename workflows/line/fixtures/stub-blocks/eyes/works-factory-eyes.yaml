# 線の筋書きだけで使う eyes の代わり（tests/e2e/test_line_scenarios.py が本物のブロックの置き場に写す）。
# 返す値は筋書きの stub が決める。中の節 inner が落ちると返す節 verdict が飛ばされる形を筋書きで作るため、節を 2 つにする。
# 型の写しを持たない（output_format を書かない。持ち主の決め io-in-output-format）。inner の字は、線が渡した入力を
# 筋書きの resolved-text-contains で照らすために、全部の include が渡す入力を並べる。
name: works-factory-eyes
description: 線の筋書きだけで使う eyes の代わり
returns: verdict

nodes:
  - id: inner
    script: |
      import sys
      sys.exit("代わりのブロックの中の節。筋書きが stub で差す")
      # start=$INPUTS.start
      # units=$INPUTS.units
      # judgment=$INPUTS.judgment
      # purpose=$INPUTS.purpose
      # world=$INPUTS.world
      # plan=$INPUTS.plan
      # ripple=$INPUTS.ripple
      # depth=$INPUTS.depth
      # design=$INPUTS.design
      # diff=$INPUTS.diff
      # changed=$INPUTS.changed
      # fix_units=$INPUTS.fix_units
      # green_ok=$INPUTS.green_ok
      # plan_questions=$INPUTS.plan_questions
      # answers=$INPUTS.answers
    runtime: uv
    timeout: 1728000000

  - id: verdict
    script: |
      import sys
      sys.exit("代わりのブロックの返す節。筋書きが stub で差す")
    runtime: uv
    depends_on: [inner]
    timeout: 1728000000

# line の standalone の筋書き（docs/design/line.md の 11 節・README の 7.1 の 4）。入力は依頼のファイルと test_cmd だけ。
# include した block の中は、各 block の筋書きの台本を include の id を頭に付けて使う（judge の graph は判定が直す単位を出さない
# no-open-units の台本、ほかは standalone の台本）。line の script と、台本にしない block の script は本物で回す。
# dry-run は include の中の loop の本体に include の道を渡さない（README 13 章）ので、report の書き手の loop の本体（write-prep・
# write・cold-prep・cold・write-accept。loop の本体の id には頭が付かない）は台本にする。
# 道: 起動の承認ノードを通し、直す前のテスト・判定（直す単位が無い）・段の表・独立設計の後、直す物が無い周の形で fix-in・fixed・
# 判定の受け渡し・最後のテスト・独立の目を回し、最後の承認ノードを通って報告と result まで届く（封じと置きは直す物が無いので飛ぶ）。
# 判定の台本の pointer は先のファイルを持たないので、line の script はそれを読めない訳を承認ノードと報告の行に書いて進む
fixture:
  expect: completed
  reached:
  - testcmd
  - start
  - answer-start
  - test-gate-base__result
  - judge__verdict
  - tiers
  - independent-design__finish
  - design-in
  - fix-in
  - fixed
  - judged
  - test-gate-final__result
  - eyes-in
  - eyes__verdict
  - ask-final
  - answer-final
  - collect
  - report__finish
  - sweep-children
  - result
  inputs:
    request: .archon/workflows/works-factory/line/fixtures/request.json
    test_cmd: 'true'
exec-code: true

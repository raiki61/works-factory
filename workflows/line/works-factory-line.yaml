name: works-factory-line
description: |
  works-factory のメイングラフ。修正依頼か差分を受け、8 つのサブグラフ（judge・plan・plan-review・fix・test-gate・eyes・report・merge）を
  include: で並べ、承認ノード・計画の往復・一度だけの include（案の直しと 2 度目の修正・再審）・深さの上げ直し・無人の方針を持ち、
  どの道でも報告を出す。順と承認ノードは docs/design.md の「メイングラフ」、サブグラフとの受け渡しは同じ文書の「サブグラフの出力の約束」。
  YAML は配線だけで、決めはメイングラフの script（workflows/line/scripts/）、確かめは lib/ が持つ。
  サブグラフに渡す飛ばされうる値は、返しのノード（埋め P2: answer-*・collect）が `{from, if_skipped: null}` で受けて明示の値で返し直す。
  サブグラフと計画の往復の出力は受け皿のノード（<include の id>-out・plan-rounds-out・plan-rounds-review-out）が受け直し、collect はそこからだけ読む
  （受けるノードが落ちても受け皿が飛ばされるだけで、報告まで届く）。
  出力はメイングラフのノード result（結末の語と、結末が fixed・fixed_needs_check の時に真の fixed）。

interactive: true

inputs:
  request:
    default: ""
    description: 修正依頼のファイル（findings の JSON の配列か、{findings, pr, issue, answers, prior_failures} の形）のパス。相対なら対象の根から。依頼の行か差分の少なくとも 1 つが要る（どちらも無ければ start が AI の前で止める）
  base:
    default: ""
    description: 差分の根を名指す版（枝・タグ・commit）。差分の根は base と HEAD の merge-base。pr と一緒には名指さない
  pr:
    default: ""
    description: PR の番号。base の版と head は start が run の中で gh で読み、読めなければ・head が対象の HEAD と違えば止める。base と一緒には名指さない
  spec:
    default: ""
    description: 仕様の段を挟むか（空か on）。依頼の文が要り、無人の run・固定材料とは組めない
  test_cmd:
    default: ""
    description: テストのコマンド（対象の根で走らせる 1 行）。test-gate が読む
  tdd_suite:
    default: ""
    description: テストの実行器（JUnit XML の書き先を第 1 引数に受ける実行ファイル。対象の根から）。空なら修正の段の TDD のループを飛ばす
  final_gate:
    default: ""
    description: 最後の承認ノードの開き方。always（空の既定）・when_needed・protected_only（lib/gatepolicy.py）。守りのパスの当たりと申し出はどれでも開く
  unattended:
    default: ""
    description: 無人の run か（空か true）。true は人が答えない run で、台帳の問いは承認ノードに載せず、承認ノードを開くはずの時は開かずに止める（needs-human）
  design_only:
    default: ""
    description: 設計だけの run か（空か true）。true は修正前の承認ノードを必ず開く
  thickness:
    default: ""
    description: 手厚さ（深さ）。空・自動は機械が単位ごとに決める。軽量・標準は全部の単位をその深さに固定する。重厚は受けない
  features_off:
    default: ""
    description: 切る機能（語をカンマか空白で区切った 1 行。語と既定は lib/entry.py の FEATURES・FEATURE_DEFAULTS）。知らない語は start が止める
  features_on:
    default: ""
    description: 入れる機能（features_off と同じ語）。features_off と同じ語を名指せば start が止める
  policy_md:
    default: ""
    description: 人の方針の文書のパス（空なら既定の置き場）。相対なら対象の根から。名指した文書が無ければ start が止める
  fix_fixture:
    default: ""
    description: 固定材料のフォルダ（前の run の修正の前の写し）。その道はまだ無く、空でなければ start が止める
  lang:
    default: ""
    description: 報告と、承認ノード・報告に載る役の文の言語。空は依頼文の言語

returns: result
outcome_field: fixed

nodes:
  # 1 始め。入力をそろえ、始めの記録を書く。受けなければ ok: false で、後ろは when: で飛ぶ（AI を起こす前に止める）
  - id: start
    script: start
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        stop_reason: { type: string }
        reason: { type: string }
        record: { type: [object, "null"] }
        prior_failures: { type: [object, "null"] }
        ask: { type: boolean }
        gate_text: { type: string }
        unattended: { type: boolean }
        design_only: { type: boolean }
        final_gate: { type: string }
        spec: { type: boolean }
      required: [ok, stop_reason, reason, record, prior_failures, ask, gate_text, unattended, design_only, final_gate, spec]

  # 2 起動の関所
  - id: gate-start
    approval:
      message: "$start.output.gate_text"
      decisions: [{ id: approve }, { id: continue }, { id: stop }, { id: reject }]
    idle_timeout: 1728000000
    depends_on: [start]
    when: "$start.output.ask == true"

  - id: answer-start
    script: gate_answer
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        go: { type: boolean }
        answer: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [go, answer, stop_reason]
    mutates_checkout: false
    depends_on: [start, gate-start]
    trigger_rule: none_failed_min_one_success
    with:
      gate: { from: "$gate-start.output", if_skipped: null }
      go: "$start.output.ok"
      stop_reason: "$start.output.stop_reason"
      place: gate-start

  # 3 直す前の結末
  - id: test-gate-base
    include: works-factory-test-gate
    depends_on: [answer-start]
    when: "$answer-start.output.go == true"
    with:
      mode: base
      start: "$start.output.record"
      baseline: null

  - id: test-gate-base-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [test-gate-base]
    with:
      got_mode: "$test-gate-base.output.mode"
      got_ok: "$test-gate-base.output.ok"
      got_green: "$test-gate-base.output.green"
      got_red_cause: "$test-gate-base.output.red_cause"
      got_ran_steps: "$test-gate-base.output.ran_steps"
      got_baseline: "$test-gate-base.output.baseline"
      got_fingerprint: "$test-gate-base.output.fingerprint"
      got_test_outcomes: "$test-gate-base.output.test_outcomes"
      got_evidence: "$test-gate-base.output.evidence"
      got_by: "$test-gate-base.output.by"
      got_suites_line: "$test-gate-base.output.suites_line"
      got_log: "$test-gate-base.output.log"
      got_baseline_line: "$test-gate-base.output.baseline_line"
      got_reason: "$test-gate-base.output.reason"

  # 4 判定
  - id: judge
    include: works-factory-judge
    depends_on: [test-gate-base]
    when: "$test-gate-base.output.ok == true"
    with:
      start: "$start.output.record"
      baseline: "$test-gate-base.output.baseline"
      objection: ""
      prior_failures: "$start.output.prior_failures"

  - id: judge-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [judge]
    with:
      got_ready: "$judge.output.ready"
      got_stop_reason: "$judge.output.stop_reason"
      got_units: "$judge.output.units"
      got_judgment: "$judge.output.judgment"
      got_purpose: "$judge.output.purpose"
      got_world: "$judge.output.world"
      got_spec: "$judge.output.spec"
      got_out_of_purpose: "$judge.output.out_of_purpose"
      got_rejudge_verdict: "$judge.output.rejudge_verdict"
      got_depth: "$judge.output.depth"
      got_depth_why: "$judge.output.depth_why"

  # 5' 直す物が無い周（判定が直す単位を出さず、止めてもいない）は修正案を作らず、最後の R2 が要る独立設計だけを作る（元
  # works/darkfactory/lib/line_edge.py:1107-1119 の plan_edge）。後ろは fixed が直す物の無い形で受けて、最後のテストと独立の目で周を締める。
  # 計画の直す義務が 0 件の周（plan-out の nothing_owed。元 line_edge.py:1109-1114 の空の修正）も同じ尾を通る。判定は単位を出したので
  # 結末は round_limit。when は判定が ready でない句を先に置く: 飛ばされた plan-rounds の欄は読むと落ち、評価は偽の句で止まる
  - id: design-only
    include: works-factory-plan-review
    depends_on: [judge, plan-rounds]
    trigger_rule: none_failed_min_one_success
    when: "$judge.output.ready == false && $judge.output.stop_reason == '' || $judge.output.ready == true && $plan-rounds.output.nothing_owed == true"
    with:
      mode: design
      start: "$start.output.record"
      units: "$judge.output.units"
      judgment: "$judge.output.judgment"
      purpose: "$judge.output.purpose"
      world: "$judge.output.world"
      plan: "null"
      structure: "null"
      ripple: "null"
      answers: "$answer-start.output.answer"

  - id: design-only-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [design-only]
    with:
      got_pass: "$design-only.output.pass"
      got_stalled: "$design-only.output.stalled"
      got_review: "$design-only.output.review"
      got_design: "$design-only.output.design"
      got_gate_axes: "$design-only.output.gate_axes"
      got_ask_human: "$design-only.output.ask_human"
      got_questions: "$design-only.output.questions"

  # 5 計画の往復。中の節は外から見えないので、本体の終わりの返しの節 plan-out が返りを欄ごとに受けて返す
  - id: plan-rounds
    depends_on: [judge]
    when: "$judge.output.ready == true"
    timeout: 1728000000
    loop_group:
      max_iterations: 20
      until_bash: 'done=$plan-out.output.done; [ "$done" = "true" ]'
      nodes:
        - id: plan
          include: works-factory-plan
          with:
            start: "$start.output.record"
            units: "$judge.output.units"
            judgment: "$judge.output.judgment"
            world: "$judge.output.world"
            spec: "$judge.output.spec"
            review: "$LOOP_PREV.plan-out.output.review"
            ruling: []
            conflicts: null
            prior_failures: "$start.output.prior_failures"

        # run の頭の深さが軽量で、計画の単位が全部軽量で、前の周の事前審査が無いなら、事前審査の輪を飛ばす
        # （docs/design.md の「深さで飛ばすノードの表」）
        - id: plan-review-due
          script: plan_review_due
          runtime: uv
          timeout: 1728000000
          output_format:
            type: object
            properties:
              skip: { type: boolean }
              why: { type: string }
              stop_reason: { type: string }
            required: [skip, why, stop_reason]
          mutates_checkout: false
          depends_on: [plan]
          with:
            head_depth: "$judge.output.depth"
            ready: "$plan.output.ready"
            plan_depth: "$plan.output.depth"
            prior_review: "$LOOP_PREV.plan-out.output.review"

        - id: plan-review-run
          include: works-factory-plan-review
          depends_on: [plan, plan-review-due]
          when: "$plan.output.ready == true"
          with:
            start: "$start.output.record"
            units: "$judge.output.units"
            judgment: "$judge.output.judgment"
            purpose: "$judge.output.purpose"
            world: "$judge.output.world"
            plan: "$plan.output.plan"
            structure: "$plan.output.structure"
            ripple: "$plan.output.ripple"
            answers: "$answer-start.output.answer"
            ruling: []
            round_limit: 20
            depth_skip: "$plan-review-due.output.skip"
            depth_why: "$plan-review-due.output.why"

        - id: plan-out
          script: plan_out
          runtime: uv
          timeout: 1728000000
          output_format:
            type: object
            properties:
              ready: {}
              plan: {}
              structure: {}
              ripple: {}
              depth: {}
              round: {}
              pass: {}
              stalled: {}
              review: {}
              design: {}
              gate_axes: {}
              ask_human: {}
              questions: {}
              depth_skip: {}
              depth_why: {}
              nothing_owed: { type: boolean }
              done: { type: boolean }
              stop_reason: { type: string }
            required: [ready, plan, structure, ripple, depth, round, pass, stalled, review, design, gate_axes, ask_human, questions,
                       depth_skip, depth_why, nothing_owed, done, stop_reason]
          mutates_checkout: false
          depends_on: [plan, plan-review-due, plan-review-run]
          trigger_rule: none_failed_min_one_success
          with:
            round_limit: 20
            ready: "$plan.output.ready"
            plan: "$plan.output.plan"
            structure: "$plan.output.structure"
            ripple: "$plan.output.ripple"
            depth: "$plan.output.depth"
            round: "$plan.output.round"
            pass: { from: "$plan-review-run.output.pass", if_skipped: null }
            stalled: { from: "$plan-review-run.output.stalled", if_skipped: null }
            review: { from: "$plan-review-run.output.review", if_skipped: null }
            design: { from: "$plan-review-run.output.design", if_skipped: null }
            gate_axes: { from: "$plan-review-run.output.gate_axes", if_skipped: null }
            ask_human: { from: "$plan-review-run.output.ask_human", if_skipped: null }
            questions: { from: "$plan-review-run.output.questions", if_skipped: null }
            depth_skip: { from: "$plan-review-due.output.skip", if_skipped: null }
            depth_why: { from: "$plan-review-due.output.why", if_skipped: null }

  - id: plan-rounds-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [plan-rounds]
    with:
      got_ready: "$plan-rounds.output.ready"
      got_plan: "$plan-rounds.output.plan"
      got_structure: "$plan-rounds.output.structure"
      got_ripple: "$plan-rounds.output.ripple"
      got_depth: "$plan-rounds.output.depth"
      got_round: "$plan-rounds.output.round"
      got_depth_skip: "$plan-rounds.output.depth_skip"
      got_depth_why: "$plan-rounds.output.depth_why"

  - id: plan-rounds-review-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [plan-rounds]
    with:
      got_pass: "$plan-rounds.output.pass"
      got_stalled: "$plan-rounds.output.stalled"
      got_review: "$plan-rounds.output.review"
      got_design: "$plan-rounds.output.design"
      got_gate_axes: "$plan-rounds.output.gate_axes"
      got_ask_human: "$plan-rounds.output.ask_human"
      got_questions: "$plan-rounds.output.questions"

  # 6 修正前の関所
  - id: ask-before-fix
    script: ask_before_fix
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        open: { type: boolean }
        go: { type: boolean }
        stop_reason: { type: string }
        text: { type: string }
        deferred: { type: array }
        asked: { type: array }
      required: [open, go, stop_reason, text, deferred, asked]
    mutates_checkout: false
    depends_on: [plan-rounds]
    with:
      ready: "$plan-rounds.output.ready"
      pass: "$plan-rounds.output.pass"
      stalled: "$plan-rounds.output.stalled"
      ask_human: "$plan-rounds.output.ask_human"
      gate_axes: "$plan-rounds.output.gate_axes"
      questions: "$plan-rounds.output.questions"
      unattended: "$start.output.unattended"
      design_only: "$start.output.design_only"

  - id: gate-before-fix
    approval:
      message: "$ask-before-fix.output.text"
      decisions: [{ id: approve }, { id: continue }, { id: stop }, { id: reject }]
    idle_timeout: 1728000000
    depends_on: [ask-before-fix]
    when: "$ask-before-fix.output.open == true"

  - id: answer-before-fix
    script: before_fix_answer
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        go: { type: boolean }
        answer: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [go, answer, stop_reason]
    mutates_checkout: false
    depends_on: [ask-before-fix, gate-before-fix]
    trigger_rule: none_failed_min_one_success
    with:
      gate: { from: "$gate-before-fix.output", if_skipped: null }
      go: "$ask-before-fix.output.go"
      stop_reason: "$ask-before-fix.output.stop_reason"
      place: gate-before-fix
      asked: "$ask-before-fix.output.asked"
      start: "$start.output.record"

  # 7 修正。裁定が計画の項目の誤りとしたら案の直しとその後の 2 度目の修正を、修正役の異議（1 回目か 2 度目）が在れば再審を、1 度ずつ差し込む
  - id: fix
    include: works-factory-fix
    depends_on: [answer-before-fix]
    when: "$answer-before-fix.output.go == true"
    with:
      start: "$start.output.record"
      baseline: "$test-gate-base.output.baseline"
      units: "$judge.output.units"
      judgment: "$judge.output.judgment"
      plan: "$plan-rounds.output.plan"
      ripple: "$plan-rounds.output.ripple"
      depth: "$plan-rounds.output.depth"
      answers: "$answer-before-fix.output.answer"
      plan_review: "$plan-rounds.output.review"

  - id: fix-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [fix]
    with:
      got_done: "$fix.output.done"
      got_units: "$fix.output.units"
      got_groups: "$fix.output.groups"
      got_conflicts: "$fix.output.conflicts"
      got_replan_items: "$fix.output.replan_items"
      got_objection: "$fix.output.objection"
      got_diff: "$fix.output.diff"
      got_allowed_test_changes: "$fix.output.allowed_test_changes"
      got_changed: "$fix.output.changed"
      got_x_scalars: "$fix.output.x_scalars"
      got_delta_review: "$fix.output.delta_review"
      got_handoffs: "$fix.output.handoffs"
      got_mismatched: "$fix.output.mismatched"
      got_stop_reason: "$fix.output.stop_reason"

  - id: after-fix
    script: after_fix
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        replan: { type: boolean }
        stop_reason: { type: string }
      required: [replan, stop_reason]
    mutates_checkout: false
    depends_on: [fix]
    with:
      replan_items: "$fix.output.replan_items"

  - id: replan
    include: works-factory-plan
    depends_on: [after-fix]
    when: "$after-fix.output.replan == true"
    with:
      start: "$start.output.record"
      units: "$judge.output.units"
      judgment: "$judge.output.judgment"
      world: "$judge.output.world"
      spec: "$judge.output.spec"
      review: ""
      ruling: "$fix.output.replan_items"
      conflicts: "$fix.output.conflicts"
      prior_failures: "$start.output.prior_failures"

  - id: replan-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [replan]
    with:
      got_ready: "$replan.output.ready"
      got_plan: "$replan.output.plan"
      got_structure: "$replan.output.structure"
      got_ripple: "$replan.output.ripple"
      got_depth: "$replan.output.depth"
      got_round: "$replan.output.round"

  - id: replan-review
    include: works-factory-plan-review
    depends_on: [replan]
    when: "$replan.output.ready == true"
    with:
      start: "$start.output.record"
      units: "$judge.output.units"
      judgment: "$judge.output.judgment"
      purpose: "$judge.output.purpose"
      world: "$judge.output.world"
      plan: "$replan.output.plan"
      structure: "$replan.output.structure"
      ripple: "$replan.output.ripple"
      answers: "$answer-start.output.answer"
      ruling: "$fix.output.replan_items"
      conflicts: "$fix.output.conflicts"
      gate_answers: "$answer-before-fix.output.answer"

  - id: replan-review-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [replan-review]
    with:
      got_pass: "$replan-review.output.pass"
      got_stalled: "$replan-review.output.stalled"
      got_review: "$replan-review.output.review"
      got_design: "$replan-review.output.design"
      got_gate_axes: "$replan-review.output.gate_axes"
      got_ask_human: "$replan-review.output.ask_human"
      got_questions: "$replan-review.output.questions"

  - id: ask-replan
    script: ask_replan
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        open: { type: boolean }
        go: { type: boolean }
        stop_reason: { type: string }
        text: { type: string }
        widened: { type: array }
        asked: { type: array }
      required: [open, go, stop_reason, text, widened, asked]
    mutates_checkout: false
    depends_on: [replan-review]
    with:
      old_plan: "$plan-rounds.output.plan"
      new_plan: "$replan.output.plan"
      items: "$fix.output.replan_items"
      ask_human: "$replan-review.output.ask_human"
      questions: "$replan-review.output.questions"
      conflicts: "$fix.output.conflicts"
      unattended: "$start.output.unattended"

  - id: gate-replan
    approval:
      message: "$ask-replan.output.text"
      decisions: [{ id: approve }, { id: continue }, { id: stop }, { id: reject }]
    idle_timeout: 1728000000
    depends_on: [ask-replan]
    when: "$ask-replan.output.open == true"

  - id: answer-replan
    script: replan_answer
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        go: { type: boolean }
        answer: { type: [object, "null"] }
        stop_reason: { type: string }
        fix_answers: { type: [object, "null"] }
        fix_notes: { type: string }
        fix_ripple: { type: [object, "null"] }
      required: [go, answer, stop_reason, fix_answers, fix_notes, fix_ripple]
    mutates_checkout: false
    depends_on: [ask-replan, gate-replan]
    trigger_rule: none_failed_min_one_success
    with:
      gate: { from: "$gate-replan.output", if_skipped: null }
      go: "$ask-replan.output.go"
      stop_reason: "$ask-replan.output.stop_reason"
      place: gate-replan
      before_fix: "$answer-before-fix.output.answer"
      asked: "$ask-replan.output.asked"
      review: { from: "$replan-review.output.review", if_skipped: null }
      plan: "$replan.output.plan"
      items: "$fix.output.replan_items"
      ripple: "$replan.output.ripple"
      first_ripple: "$plan-rounds.output.ripple"

  - id: refix-run
    include: works-factory-fix
    depends_on: [answer-replan]
    when: "$answer-replan.output.go == true"
    with:
      start: "$start.output.record"
      baseline: "$test-gate-base.output.baseline"
      units: "$judge.output.units"
      judgment: "$judge.output.judgment"
      plan: "$replan.output.plan"
      ripple: "$answer-replan.output.fix_ripple"
      depth: "$replan.output.depth"
      answers: "$answer-replan.output.fix_answers"
      only_items: "$fix.output.replan_items"
      prior_conflicts: "$fix.output.conflicts"
      plan_review: "$replan-review.output.review"
      notes: "$answer-replan.output.fix_notes"

  - id: fixed
    script: fixed
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        units: { type: array }
        groups: {}
        conflicts: { type: array }
        replan_items: {}
        objection: {}
        diff: {}
        diffs: { type: array }
        allowed_test_changes: {}
        changed: {}
        x_scalars: { type: object }
        delta_review: {}
        handoffs: { type: array }
        mismatched: { type: array }
        done: { type: boolean }
        go: { type: boolean }
        rejudge: { type: boolean }
        refixed: { type: boolean }
        plan: {}
        ripple: {}
        design: {}
        plan_questions: {}
        answer: {}
        no_fix: { type: boolean }
        review_skipped: { type: boolean }
        stop_reason: { type: string }
      required: [units, groups, conflicts, replan_items, objection, diff, diffs, allowed_test_changes, changed, x_scalars, delta_review,
                 handoffs, mismatched,
                 done, go, rejudge, refixed, plan, ripple, design, plan_questions, answer, no_fix, review_skipped, stop_reason]
    mutates_checkout: false
    depends_on: [after-fix, refix-run, replan-out, design-only]
    trigger_rule: none_failed_min_one_success
    with:
      fix_done: { from: "$fix.output.done", if_skipped: null }
      fix_units: { from: "$fix.output.units", if_skipped: null }
      fix_groups: { from: "$fix.output.groups", if_skipped: null }
      fix_conflicts: { from: "$fix.output.conflicts", if_skipped: null }
      fix_replan_items: { from: "$fix.output.replan_items", if_skipped: null }
      fix_objection: { from: "$fix.output.objection", if_skipped: null }
      fix_diff: { from: "$fix.output.diff", if_skipped: null }
      fix_allowed_test_changes: { from: "$fix.output.allowed_test_changes", if_skipped: null }
      fix_changed: { from: "$fix.output.changed", if_skipped: null }
      fix_x_scalars: { from: "$fix.output.x_scalars", if_skipped: null }
      fix_delta_review: { from: "$fix.output.delta_review", if_skipped: null }
      fix_handoffs: { from: "$fix.output.handoffs", if_skipped: null }
      fix_mismatched: { from: "$fix.output.mismatched", if_skipped: null }
      fix_stop_reason: { from: "$fix.output.stop_reason", if_skipped: null }
      refix_done: { from: "$refix-run.output.done", if_skipped: null }
      refix_units: { from: "$refix-run.output.units", if_skipped: null }
      refix_groups: { from: "$refix-run.output.groups", if_skipped: null }
      refix_conflicts: { from: "$refix-run.output.conflicts", if_skipped: null }
      refix_replan_items: { from: "$refix-run.output.replan_items", if_skipped: null }
      refix_objection: { from: "$refix-run.output.objection", if_skipped: null }
      refix_diff: { from: "$refix-run.output.diff", if_skipped: null }
      refix_allowed_test_changes: { from: "$refix-run.output.allowed_test_changes", if_skipped: null }
      refix_changed: { from: "$refix-run.output.changed", if_skipped: null }
      refix_x_scalars: { from: "$refix-run.output.x_scalars", if_skipped: null }
      refix_delta_review: { from: "$refix-run.output.delta_review", if_skipped: null }
      refix_handoffs: { from: "$refix-run.output.handoffs", if_skipped: null }
      refix_mismatched: { from: "$refix-run.output.mismatched", if_skipped: null }
      refix_stop_reason: { from: "$refix-run.output.stop_reason", if_skipped: null }
      replan: { from: "$after-fix.output.replan", if_skipped: null }
      stop_after_fix: { from: "$after-fix.output.stop_reason", if_skipped: null }
      plan: { from: "$plan-rounds.output.plan", if_skipped: null }
      ripple: { from: "$plan-rounds.output.ripple", if_skipped: null }
      replanned: { from: "$replan-out.output.got", if_skipped: null }
      design: { from: "$plan-rounds.output.design", if_skipped: null }
      plan_questions: { from: "$plan-rounds.output.questions", if_skipped: null }
      answer: { from: "$answer-before-fix.output.answer", if_skipped: null }
      no_fix_design: { from: "$design-only.output.design", if_skipped: null }
      review_skipped: { from: "$plan-rounds.output.depth_skip", if_skipped: null }

  # 7b 承認済みの受け入れ条件のテストの照らし（spec=on の run だけ中身が在る。spec=on なのに判定の指しが無ければ問う）
  - id: spec-check
    script: spec_check
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        questions: { type: array }
        stop_reason: { type: string }
        unchecked: { type: boolean }
      required: [questions, stop_reason, unchecked]
    mutates_checkout: false
    depends_on: [fixed]
    with:
      spec: { from: "$judge.output.spec", if_skipped: null }
      spec_on: "$start.output.spec"

  # 再審は 2 度目の修正の後（元 works/darkfactory/darkfactory.yaml:827 の h-rejudge は refit の後）。1 回目と 2 度目の修正役の異議を 1 度だけ再審する
  - id: rejudge-run
    include: works-factory-judge
    depends_on: [fixed]
    when: "$fixed.output.rejudge == true"
    with:
      start: "$start.output.record"
      baseline: "$test-gate-base.output.baseline"
      objection: "$fixed.output.objection"
      prior_failures: "$start.output.prior_failures"

  - id: rejudge-run-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [rejudge-run]
    with:
      got_ready: "$rejudge-run.output.ready"
      got_stop_reason: "$rejudge-run.output.stop_reason"
      got_units: "$rejudge-run.output.units"
      got_judgment: "$rejudge-run.output.judgment"
      got_purpose: "$rejudge-run.output.purpose"
      got_world: "$rejudge-run.output.world"
      got_spec: "$rejudge-run.output.spec"
      got_out_of_purpose: "$rejudge-run.output.out_of_purpose"
      got_rejudge_verdict: "$rejudge-run.output.rejudge_verdict"
      got_depth: "$rejudge-run.output.depth"
      got_depth_why: "$rejudge-run.output.depth_why"

  - id: judged
    script: judged
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        units: {}
        judgment: {}
        purpose: {}
        world: {}
        rejudge_verdict: {}
        rejudged: { type: boolean }
        new_open_units: { type: array }
        lowered: { type: array }
        unnamed_changed: { type: array }
        unread: { type: string }
        stop_reason: { type: string }
      required: [units, judgment, purpose, world, rejudge_verdict, rejudged, new_open_units, lowered, unnamed_changed, unread,
                 stop_reason]
    mutates_checkout: false
    depends_on: [fixed, rejudge-run]
    trigger_rule: none_failed_min_one_success
    with:
      judge_units: "$judge.output.units"
      judge_judgment: "$judge.output.judgment"
      judge_purpose: "$judge.output.purpose"
      judge_world: "$judge.output.world"
      judge_rejudge_verdict: "$judge.output.rejudge_verdict"
      rejudge_units: { from: "$rejudge-run.output.units", if_skipped: null }
      rejudge_judgment: { from: "$rejudge-run.output.judgment", if_skipped: null }
      rejudge_purpose: { from: "$rejudge-run.output.purpose", if_skipped: null }
      rejudge_world: { from: "$rejudge-run.output.world", if_skipped: null }
      rejudge_rejudge_verdict: { from: "$rejudge-run.output.rejudge_verdict", if_skipped: null }
      rejudge_stop_reason: { from: "$rejudge-run.output.stop_reason", if_skipped: null }
      objection: "$fixed.output.objection"

  - id: redepth
    script: redepth
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        depth: { type: array }
        skip_optional: { type: string }
        raised: { type: array }
        counted: { type: string }
        stop_reason: { type: string }
      required: [depth, skip_optional, raised, counted, stop_reason]
    mutates_checkout: false
    depends_on: [judged]
    with:
      depth: { from: "$plan-rounds.output.depth", if_skipped: null }
      replan_depth: { from: "$replan.output.depth", if_skipped: null }
      units: "$fixed.output.units"
      conflicts: "$fixed.output.conflicts"
      plan: "$fixed.output.plan"
      diff: "$fixed.output.diff"
      judgment: "$judged.output.judgment"
      start: "$start.output.record"
      answer: { from: "$answer-before-fix.output.answer", if_skipped: null }
      ties_judgment: "$judge.output.judgment"
      replanned: { from: "$after-fix.output.replan", if_skipped: null }
      rejudged: "$fixed.output.rejudge"

  # 8 試験の関門（final）
  - id: test-gate-final
    include: works-factory-test-gate
    depends_on: [redepth, spec-check]
    when: "$fixed.output.go == true && $judged.output.stop_reason == '' && $redepth.output.stop_reason == ''"
    with:
      mode: final
      start: "$start.output.record"
      baseline: "$test-gate-base.output.baseline"

  - id: test-gate-final-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [test-gate-final]
    with:
      got_mode: "$test-gate-final.output.mode"
      got_ok: "$test-gate-final.output.ok"
      got_green: "$test-gate-final.output.green"
      got_red_cause: "$test-gate-final.output.red_cause"
      got_ran_steps: "$test-gate-final.output.ran_steps"
      got_baseline: "$test-gate-final.output.baseline"
      got_fingerprint: "$test-gate-final.output.fingerprint"
      got_test_outcomes: "$test-gate-final.output.test_outcomes"
      got_evidence: "$test-gate-final.output.evidence"
      got_by: "$test-gate-final.output.by"
      got_suites_line: "$test-gate-final.output.suites_line"
      got_log: "$test-gate-final.output.log"
      got_baseline_line: "$test-gate-final.output.baseline_line"
      got_reason: "$test-gate-final.output.reason"

  # 9 独立の目
  - id: eyes
    include: works-factory-eyes
    depends_on: [test-gate-final]
    with:
      start: "$start.output.record"
      units: "$judged.output.units"
      judgment: "$judged.output.judgment"
      purpose: "$judged.output.purpose"
      world: "$judged.output.world"
      plan: "$fixed.output.plan"
      ripple: "$fixed.output.ripple"
      depth: "$redepth.output.depth"
      design: "$fixed.output.design"
      changed: "$fixed.output.changed"
      x_scalars: "$fixed.output.x_scalars"
      fix_units: "$fixed.output.units"
      green_ok: "$test-gate-final.output.ok"
      test_outcomes: "$test-gate-final.output.test_outcomes"
      diffs: "$fixed.output.diffs"
      plan_questions: "$fixed.output.plan_questions"
      answers: "$fixed.output.answer"
      start_answers: "$answer-start.output.answer"
      review_skipped: "$fixed.output.review_skipped"

  - id: eyes-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [eyes]
    with:
      got_ok: "$eyes.output.ok"
      got_r1: "$eyes.output.r1"
      got_r2: "$eyes.output.r2"
      got_r3: "$eyes.output.r3"
      got_r4: "$eyes.output.r4"
      got_questions: "$eyes.output.questions"
      got_premise_check: "$eyes.output.premise_check"
      got_structure_after: "$eyes.output.structure_after"
      got_protected_hits: "$eyes.output.protected_hits"
      got_notes: "$eyes.output.notes"

  # 10 封じる
  - id: merge-seal
    include: works-factory-merge
    depends_on: [eyes]
    when: "$fixed.output.no_fix == false"
    with:
      mode: seal
      start: "$start.output.record"
      fingerprint: "$test-gate-final.output.fingerprint"
      green_ok: "$test-gate-final.output.ok"
      eyes_ok: "$eyes.output.ok"

  - id: merge-seal-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [merge-seal]
    with:
      got_mode: "$merge-seal.output.mode"
      got_ok: "$merge-seal.output.ok"
      got_hash: "$merge-seal.output.hash"
      got_diff: "$merge-seal.output.diff"
      got_protected_hits: "$merge-seal.output.protected_hits"
      got_reason: "$merge-seal.output.reason"

  # 11 最後の関所
  - id: ask-final
    script: ask_final
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        open: { type: boolean }
        go: { type: boolean }
        stop_reason: { type: string }
        text: { type: string }
        reasons: { type: array }
      required: [open, go, stop_reason, text, reasons]
    mutates_checkout: false
    depends_on: [eyes, merge-seal]
    trigger_rule: none_failed_min_one_success
    with:
      final_gate: "$start.output.final_gate"
      unattended: "$start.output.unattended"
      tests_ok: "$test-gate-final.output.ok"
      green: "$test-gate-final.output.green"
      red_cause: "$test-gate-final.output.red_cause"
      ran_steps: "$test-gate-final.output.ran_steps"
      by: "$test-gate-final.output.by"
      suites_line: "$test-gate-final.output.suites_line"
      log: "$test-gate-final.output.log"
      baseline_line: "$test-gate-final.output.baseline_line"
      tests_reason: "$test-gate-final.output.reason"
      protected_hits: { from: "$merge-seal.output.protected_hits", if_skipped: [] }
      conflicts: "$fixed.output.conflicts"
      fix_diffs: "$fixed.output.diffs"
      handoffs: "$fixed.output.handoffs"
      mismatched: "$fixed.output.mismatched"
      r1: "$eyes.output.r1"
      r2: "$eyes.output.r2"
      r3: "$eyes.output.r3"
      r4: "$eyes.output.r4"
      premise_check: "$eyes.output.premise_check"
      questions: "$eyes.output.questions"
      eye_notes: "$eyes.output.notes"
      objection: "$fixed.output.objection"
      rejudge_verdict: "$judged.output.rejudge_verdict"
      sealed: { from: "$merge-seal.output.ok", if_skipped: true }
      seal_reason: { from: "$merge-seal.output.reason", if_skipped: "" }
      hash: { from: "$merge-seal.output.hash", if_skipped: "" }
      sealed_diff: { from: "$merge-seal.output.diff", if_skipped: null }
      structure_after: "$eyes.output.structure_after"
      structure: { from: "$plan-rounds.output.structure", if_skipped: null }
      judgment: "$judged.output.judgment"
      units: "$judged.output.units"
      rejudged: "$judged.output.rejudged"
      ties_judgment: "$judge.output.judgment"
      first_units: "$judge.output.units"
      fix_units: "$fixed.output.units"
      groups: "$fixed.output.groups"
      delta_review: "$fixed.output.delta_review"
      replan_items: "$fixed.output.replan_items"
      refixed: "$fixed.output.refixed"
      replan_answer: { from: "$answer-replan.output.answer", if_skipped: null }
      widened: { from: "$ask-replan.output.widened", if_skipped: null }
      plan_review: { from: "$plan-rounds.output.review", if_skipped: null }
      replan_review: { from: "$replan-review.output.review", if_skipped: null }
      start: "$start.output.record"
      before_fix_answer: { from: "$answer-before-fix.output.answer", if_skipped: null }
      spec_changed: { from: "$spec-check.output.questions", if_skipped: [] }
      spec_unchecked: { from: "$spec-check.output.unchecked", if_skipped: false }

  - id: gate-final
    approval:
      message: "$ask-final.output.text"
      decisions: [{ id: approve }, { id: continue }, { id: stop }, { id: reject }]
    idle_timeout: 1728000000
    depends_on: [ask-final]
    when: "$ask-final.output.open == true"

  - id: answer-final
    script: gate_answer
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        go: { type: boolean }
        answer: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [go, answer, stop_reason]
    mutates_checkout: false
    depends_on: [ask-final, gate-final]
    trigger_rule: none_failed_min_one_success
    with:
      gate: { from: "$gate-final.output", if_skipped: null }
      go: "$ask-final.output.go"
      stop_reason: "$ask-final.output.stop_reason"
      place: gate-final

  # 12 外へ 1 度だけ書く（既定は差分を run の置き場に置くだけ。E17）
  - id: merge-apply
    include: works-factory-merge
    depends_on: [answer-final]
    when: "$answer-final.output.go == true && $fixed.output.no_fix == false"
    with:
      mode: apply
      start: "$start.output.record"
      fingerprint: "$test-gate-final.output.fingerprint"
      green_ok: "$test-gate-final.output.ok"
      eyes_ok: "$eyes.output.ok"
      sealed_hash: "$merge-seal.output.hash"
      answer: "$answer-final.output.answer"
      r2: "$eyes.output.r2"

  - id: merge-apply-out
    script: returned
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        got: { type: [object, "null"] }
        stop_reason: { type: string }
      required: [got, stop_reason]
    mutates_checkout: false
    depends_on: [merge-apply]
    with:
      got_mode: "$merge-apply.output.mode"
      got_ok: "$merge-apply.output.ok"
      got_hash: "$merge-apply.output.hash"
      got_diff: "$merge-apply.output.diff"
      got_protected_hits: "$merge-apply.output.protected_hits"
      got_reason: "$merge-apply.output.reason"

  # 13 報告。前の段が落ちても飛ばされても走る。resume でも collect と result は回し直す（always_run。report は include で、Archon は
  # include の always_run を捨てるので、回し直した collect の返りが変われば Archon が report の中の控えを捨てて回し直す）
  - id: collect
    script: collect
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        start: {}
        test_gate_base: {}
        judge: {}
        rejudge: {}
        plan: {}
        plan_review: {}
        replan: {}
        replan_review: {}
        fix: {}
        test_gate_final: {}
        eyes: {}
        merge_seal: {}
        merge_apply: {}
        gate_start: {}
        gate_before_fix: {}
        gate_replan: {}
        gate_final: {}
        stops: { type: object }
        deferred: { type: array }
        widened: { type: array }
        final_reasons: { type: array }
        optional: { type: array }
        prior_failures: {}
        redepth: {}
        spec_changed: { type: array }
        spec_unchecked: {}
      required: [start, test_gate_base, judge, rejudge, plan, plan_review, replan, replan_review, fix, test_gate_final, eyes, merge_seal, merge_apply, gate_start, gate_before_fix, gate_replan, gate_final,
                 stops, deferred, widened, final_reasons, optional, prior_failures, redepth, spec_changed, spec_unchecked]
    mutates_checkout: false
    depends_on: [start, answer-start, test-gate-base-out, judge-out, design-only-out, plan-rounds-out, plan-rounds-review-out, ask-before-fix,
                 answer-before-fix, fix-out, after-fix, rejudge-run-out, judged, replan-out, replan-review-out, ask-replan, answer-replan,
                 fixed, spec-check, redepth, test-gate-final-out, eyes-out, merge-seal-out, ask-final, answer-final, merge-apply-out]
    trigger_rule: all_done
    always_run: true
    with:
      start: { from: "$start.output.record", if_skipped: null }
      fixed: { from: "$fixed.output", if_skipped: null }
      gate_start: { from: "$answer-start.output.answer", if_skipped: null }
      gate_before_fix: { from: "$answer-before-fix.output.answer", if_skipped: null }
      gate_replan: { from: "$answer-replan.output.answer", if_skipped: null }
      gate_final: { from: "$answer-final.output.answer", if_skipped: null }
      test_gate_base: { from: "$test-gate-base-out.output", if_skipped: null }
      judge: { from: "$judge-out.output", if_skipped: null }
      rejudge: { from: "$rejudge-run-out.output", if_skipped: null }
      plan: { from: "$plan-rounds-out.output", if_skipped: null }
      plan_review: { from: "$plan-rounds-review-out.output", if_skipped: null }
      design_only: { from: "$design-only-out.output", if_skipped: null }
      replan: { from: "$replan-out.output", if_skipped: null }
      replan_review: { from: "$replan-review-out.output", if_skipped: null }
      fix: { from: "$fix-out.output", if_skipped: null }
      test_gate_final: { from: "$test-gate-final-out.output", if_skipped: null }
      eyes: { from: "$eyes-out.output", if_skipped: null }
      merge_seal: { from: "$merge-seal-out.output", if_skipped: null }
      merge_apply: { from: "$merge-apply-out.output", if_skipped: null }
      stop_start: { from: "$start.output.stop_reason", if_skipped: null }
      stop_answer_start: { from: "$answer-start.output.stop_reason", if_skipped: null }
      stop_ask_before_fix: { from: "$ask-before-fix.output.stop_reason", if_skipped: null }
      stop_answer_before_fix: { from: "$answer-before-fix.output.stop_reason", if_skipped: null }
      stop_after_fix: { from: "$after-fix.output.stop_reason", if_skipped: null }
      stop_judged: { from: "$judged.output.stop_reason", if_skipped: null }
      stop_ask_replan: { from: "$ask-replan.output.stop_reason", if_skipped: null }
      stop_answer_replan: { from: "$answer-replan.output.stop_reason", if_skipped: null }
      stop_fixed: { from: "$fixed.output.stop_reason", if_skipped: null }
      stop_redepth: { from: "$redepth.output.stop_reason", if_skipped: null }
      stop_spec_check: { from: "$spec-check.output.stop_reason", if_skipped: null }
      stop_ask_final: { from: "$ask-final.output.stop_reason", if_skipped: null }
      stop_answer_final: { from: "$answer-final.output.stop_reason", if_skipped: null }
      deferred: { from: "$ask-before-fix.output.deferred", if_skipped: null }
      widened: { from: "$ask-replan.output.widened", if_skipped: null }
      final_reasons: { from: "$ask-final.output.reasons", if_skipped: null }
      spec_changed: { from: "$spec-check.output.questions", if_skipped: null }
      spec_unchecked: { from: "$spec-check.output.unchecked", if_skipped: null }
      prior_failures: { from: "$start.output.prior_failures", if_skipped: null }
      redepth: { from: "$redepth.output", if_skipped: null }
      # 受け止める段の宣言（ここが 1 か所。落ちても線が先へ進めてよい段の節の id の頭。宣言の外の落ちは途中で終わった run に数える。
      # 元は線の YAML の節の description の [optional]: 世界の解・構造の実測・レンズ・直した後の構造・独立の目。run の頭の深さの段は
      # 落ちても判定が標準で進む）
      optional: '["judge__world", "rejudge-run__world", "world-classes", "world-judge", "plan__structure", "replan__structure", "structure-eye", "fix__lens", "refix-run__lens", "eyes__", "judge__head-depth", "head-depth"]'

  - id: report
    include: works-factory-report
    depends_on: [collect]
    trigger_rule: all_done
    with:
      start: "$collect.output.start"
      test-gate-base: "$collect.output.test_gate_base"
      judge: "$collect.output.judge"
      rejudge: "$collect.output.rejudge"
      plan: "$collect.output.plan"
      plan-review: "$collect.output.plan_review"
      replan: "$collect.output.replan"
      replan-review: "$collect.output.replan_review"
      fix: "$collect.output.fix"
      test-gate-final: "$collect.output.test_gate_final"
      eyes: "$collect.output.eyes"
      merge-seal: "$collect.output.merge_seal"
      merge-apply: "$collect.output.merge_apply"
      gate-start: "$collect.output.gate_start"
      gate-before-fix: "$collect.output.gate_before_fix"
      gate-replan: "$collect.output.gate_replan"
      gate-final: "$collect.output.gate_final"
      stops: "$collect.output.stops"
      prior-failures: "$collect.output.prior_failures"
      deferred: "$collect.output.deferred"
      widened: "$collect.output.widened"
      final-reasons: "$collect.output.final_reasons"
      spec-changed: "$collect.output.spec_changed"
      spec-unchecked: "$collect.output.spec_unchecked"
      redepth: "$collect.output.redepth"
      optional: "$collect.output.optional"

  # 後始末。fix の並べ（groups-par）の子の run が残した作業ツリーと枝を消す（issue #113）。消すのはこの run の子で status が
  # completed の物で、子を起こした fan_out の節と join が済んだ物だけ（再開が join を走らせ直しうる間は残す）。落ちない（返りの error に畳む）ので run の結末を変えず、返り {cleaned, left, error} は result が線の返りに載せる
  - id: sweep-children
    script: sweep_children
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        cleaned: { type: array, items: { type: object } }
        left: { type: array, items: { type: object } }
        error: { type: string }
      required: [cleaned, left, error]
    mutates_checkout: false
    depends_on: [report]
    trigger_rule: all_done

  # 線の返す節
  - id: result
    script: result
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        fixed: { type: boolean }
        ok: {}
        outcome: {}
        stop_reason: {}
        report: {}
        report_ai: {}
        next_request: {}
        prior_failures: {}
        apply: { type: [object, "null"] }
        sealed: { type: [object, "null"] }
        r2_status: { type: [string, "null"] }
        final_answer: { type: [object, "null"] }
        children: { type: [object, "null"] }
      required: [fixed, ok, outcome, stop_reason, report, report_ai, next_request, prior_failures, apply, sealed, r2_status,
                 final_answer, children]
    mutates_checkout: false
    depends_on: [collect, report, sweep-children]
    trigger_rule: all_done
    always_run: true
    with:
      ok: { from: "$report.output.ok", if_skipped: null }
      outcome: { from: "$report.output.outcome", if_skipped: null }
      stop_reason: { from: "$report.output.stop_reason", if_skipped: null }
      report: { from: "$report.output.report", if_skipped: null }
      report_ai: { from: "$report.output.report_ai", if_skipped: null }
      next_request: { from: "$report.output.next_request", if_skipped: null }
      prior_failures: { from: "$report.output.prior_failures", if_skipped: null }
      merge_apply: { from: "$collect.output.merge_apply", if_skipped: null }
      merge_seal: { from: "$collect.output.merge_seal", if_skipped: null }
      eyes: { from: "$collect.output.eyes", if_skipped: null }
      gate_final: { from: "$collect.output.gate_final", if_skipped: null }
      children: { from: "$sweep-children.output", if_skipped: null }

name: works-factory-line
description: '工場のメイングラフ（docs/design/line.md の 1〜11 章）。修正依頼か差分を受け、block を include で並べて直しを作り、承認ノード 4 つ（対話モードの run は計画の往復の末尾の設計の相談の承認ノードも）で人に見せ、差分を封じて置き、どの道でも報告を出す。判定と独立の目はそれぞれ 1 つの include（judge と eyes の graph）で呼ぶ。line が持つのは流れだけ: どの block をいつ回すか・承認ノードと無人の方針・計画の往復の記録と止め・一度だけの include（案の直し・2 度目の修正・再審・修正の後の並行 PR の確かめ直し）・深さの表と 1 回の上げ直し・始めの記録（block には port の値で配る）・報告への受け渡し。AI の node は持たない'
inputs:
  request: {default: '', description: 'json(shared:request.schema.json): 修正依頼のファイル（findings の JSON の配列か {findings, pr, issue, answers, prior_failures, constraints} の形）。相対なら対象の根から。依頼の行か差分の少なくとも 1 つが要る'}
  base: {default: '', description: 'text: 差分の根を名指す版（枝・タグ・commit）。差分の根は base と HEAD の merge-base。pr と一緒には名指さない'}
  pr: {default: '', description: 'text: PR の番号。base の版と head は run の中で gh で読む。base と一緒には名指さない'}
  spec: {default: '', description: 'text: 仕様の段を挟むか（空か on）。依頼の文が要り、無人の run・固定材料とは組めない'}
  test_cmd: {default: '', description: 'text: テストのコマンド（対象の根で走らせる 1 行）。試験の関門が読む'}
  tdd_suite: {default: '', description: 'text: テストの実行器（JUnit XML の書き先を第 1 引数に受ける実行ファイル。対象の根から）。空なら直す前のテストの後に、同じ test_cmd で前に照らしを通った取り置きを使い、無ければ AI の手番 1 回が test_cmd と CI の定義から書く。走らせて JUnit XML が出て試験が 1 件以上の時だけ修正の段の TDD のループを回す'}
  final_gate: {default: '', description: 'text: 最後の承認ノードの開き方。always（空の既定。無人の run の空の既定は when_needed）・when_needed・protected_only。守りのパスの当たりと申し出はどれでも開く'}
  unattended: {default: '', description: 'text: 無人の run か（空か true）。true は人が答えない run で、台帳の問いは承認ノードに載せず（判定の推しつきの分かれ道の問いは推しを答えに採って直す義務に戻し）、承認ノードを開くはずの時は項目の全部の推しが通すならその推しで進み、そうでなければ開かずに止める（needs-human）'}
  design_talk: {default: '', description: 'text: 対話モード（設計を人と相談する run）か（空か true）。true で無人でない run は、計画の往復が止まる周ごとに設計案と事前審査の結果を設計の相談の承認ノードで見せ、修正要望（revise と一言）なら設計し直して事前審査をやり直し、合意なら修正前の承認ノードで聞き直さずに修正へ進む。無人の run の true は修正前の承認ノードを必ず開く（開けずに止まる）'}
  thickness: {default: '', description: 'text: 手厚さ（深さ）。空・自動は機械が単位ごとに決める。軽量・標準は全部の単位をその深さに固定する。重厚は単位を標準に固定する。段ごとに省く物・足す物は docs/design/line.md の 5.1 の表'}
  features_off: {default: '', description: 'text: 切る機能（語をカンマか空白で区切った 1 行。語と既定は lib/entry.py の FEATURES・FEATURE_DEFAULTS）。知らない語は start が止める'}
  features_on: {default: '', description: 'text: 入れる機能（features_off と同じ語）。features_off と同じ語を名指せば start が止める'}
  policy_md: {default: '', description: 'text: 人の方針の文書のパス（空なら既定の置き場）。相対なら対象の根から。名指した文書が無ければ start が止める'}
  fix_fixture: {default: '', description: 'text: 固定材料のフォルダ（前の run の報告の「固定材料」の行。前の run の修正の前の写し）。名指すと判定と修正案を作り直さずに修正から始める。相対なら対象の根から。無いフォルダ・写しと違う木や依頼や入力は start が AI の前で止める。spec と周の鎖とは組めない'}
  lang: {default: '', description: 'text: 報告と、承認ノード・報告に載る役の文の言語。空は依頼文の言語'}
  spec_table: {default: '', description: 'file: 仕様駆動の道の表（docs/design/spec-driven.md の 2.3）。相対なら対象の根から。名指すと、人と会話で回した計画の往復を工場の中で回し直さず、判定の役を 1 回回して表と設計書から修正へ進む。request・pr・base・spec・fix_fixture とは組めず、周の鎖の子では使えない'}
  deliver: {default: '', description: 'text: 出口の語（lib/entry.py の DELIVERS）。空は封じた差分を run の置き場に置くだけ（既定）。pr は最後の承認ノードの後に、照らした差分を run の枝に修正案の項目ごとの commit で積み（分けられなければ 1 つの commit）、push して対象の既定の枝へ向けた PR を作る（merge はしない）。知らない語は start が止める'}
returns: result
outcome_field: fixed
nodes:
  # 0 test_cmd の形の確かめ。対象の手元を試す形なら testcmd-stop が理由の文で run を止める（AI を起こす前）
  - id: testcmd
    script: testcmd
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [stop, reason]
      properties:
        stop: {type: boolean}
        reason: {type: string}
  - id: testcmd-stop
    cancel: "$testcmd.output.reason"
    depends_on: [testcmd]
    when: "$testcmd.output.stop == true"
  # 1 始め。入力を確かめ、始めの記録を書き、block に配る値を ports に並べる（docs/design/line.md の 1.6）。受けなければ ok: false で、後ろは when: で飛ぶ
  - id: start
    # mutates_checkout を書かない（tests/layers/scan.py の CHANGE_CHECKOUT。今の line と同じ）
    script: start
    runtime: uv
    depends_on: [testcmd]
    when: "$testcmd.output.stop == false"
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop_reason, reason, record, prior_failures, ask, gate_text, unattended, design_talk, final_gate, from_fixture, fixture,
                 from_spec, ports]
      properties:
        ok: {type: boolean}
        stop_reason: {type: string}
        reason: {type: string}
        record:
          # pointer の欄の書き方の本体はここ 1 か所（ほかは <<: *pointer_or_null で受け、description に指す先の form を書く）
          <<: &pointer_or_null
            type: [object, 'null']
            additionalProperties: false
            required: [type, run_id, path]
            properties:
              type: {type: string, enum: [archon_artifact]}
              run_id: {type: string}
              path: {type: string}
          description: 'json(start-record.schema.json): 始めの記録（run directory の根の r1/start.json）'
        prior_failures: {<<: *pointer_or_null, description: 'json(shared:prior-failures.schema.json): 依頼の prior_failures の写し。無ければ null'}
        ask: {type: boolean}
        gate_text: {type: string}
        unattended: {type: boolean}
        design_talk: {type: boolean}
        final_gate: {type: string}
        from_fixture: {type: boolean}
        fixture: {<<: *pointer_or_null, description: 'json(received.schema.json): 固定材料の run の運ぶ値（fixture-carried.json）。ほかの run は null'}
        from_spec: {type: boolean}
        ports:
          type: object
          additionalProperties: false
          required: [request, request_file, pr_text, carried, carried_measured, base, base_rev, request_origin, base_label, review_rev, entry,
                     lang, web, world, spec, has_checks, thickness, forced, design_talk, unattended, policy, test_cmd, tdd_suite, reuse_dir,
                     user_env_dir, run_id, deliver, parallel, verify_by_tier, tree_named, takes_push, request_scope, prior_rows,
                     request_answers, spec_table, routes, theme, theme_text, theme_request]
          properties:
            request: {<<: *pointer_or_null, description: 'json(shared:request.schema.json): 依頼の写し（run directory の根の request.json。依頼のファイルが無い run は空の配列）。拒んだ run は null'}
            request_file: {type: string, description: 'json(shared:request.schema.json): 依頼のファイルの絶対パス（役が Read して <絶対パス>:<行> で名指す）。無い run は空の字'}
            pr_text: {type: string}
            carried: {<<: *pointer_or_null, description: 'json(shared:constraints.schema.json): 前の run が運んだ前提の実測の行（carried.json。無ければ空の配列）。拒んだ run は null'}
            carried_measured: {type: boolean}
            base: {type: string}
            base_rev: {type: string}
            request_origin: {type: string}
            base_label: {type: string}
            review_rev: {type: string}
            entry: {type: string}
            lang: {type: string}
            web: {type: string}
            world: {type: boolean}
            spec: {type: boolean}
            has_checks: {type: boolean}
            thickness: {type: string}
            forced: {type: string}
            design_talk: {type: boolean}
            unattended: {type: boolean}
            policy: {type: string, description: 'file: 人の方針の文書を run の頭で固めた写しのパス。無ければ空の字'}
            test_cmd: {type: string}
            tdd_suite: {type: string}
            reuse_dir: {type: string}
            user_env_dir: {type: string}
            run_id: {type: string}
            deliver: {type: string}
            parallel: {type: boolean}
            verify_by_tier:
              type: object
              properties: {軽量: {type: boolean}, 標準: {type: boolean}, 重厚: {type: boolean}}
            tree_named: {type: string}
            takes_push: {type: boolean}
            request_scope: {type: boolean}
            prior_rows: {type: array, items: {type: object, properties: {where: {type: string}, text: {type: string}}}}
            request_answers: {type: array, items: {type: object, properties: {question: {type: string}, text: {type: string}}}}
            spec_table: {type: string, description: 'file: 仕様駆動の道の表（YAML）のパス。名指していない run は空の字'}
            routes: {type: string, enum: [auto, plan]}
            theme: {type: string, description: 'file: テーマの写し（run directory の根の theme.md）のパス。テーマの run でなければ空の字'}
            theme_text: {type: string}
            theme_request: {<<: *pointer_or_null, description: 'json(shared:request.schema.json): テーマを 1 行の依頼の行にした写し。テーマの run でなければ null'}
  # 2 起動の承認ノード（docs/design/line.md の 2 節の 1）
  - id: gate-start
    wait:
      attention: "$start.output.gate_text"
      form: select
      options: [{id: approve}, {id: continue}, {id: stop}, {id: reject}]
    depends_on: [start]
    when: "$start.output.ask == true"
  - id: answer-start
    # 承認ノードの答えの受け方の本体はここ 1 か所。answer-final は <<: *gate_answer で受ける
    <<: &gate_answer
      script: gate_answer
      runtime: uv
      mutates_checkout: false
      output_format:
        type: object
        additionalProperties: false
        required: [go, answer, stop_reason]
        properties:
          go: {type: boolean}
          answer: &answer
            type: [object, 'null']
            properties:
              decision: {type: string}
              text: {type: string}
              asked: {type: array, items: {type: string}}
              pushed: {type: array, items: &push_row {type: object, description: 'json(lib:push-row.schema.json): 無人の run が採った推しの行'}}
          stop_reason: {type: string}
    depends_on: [start, gate-start]
    trigger_rule: none_failed_min_one_success
    with:
      gate: {from: "$gate-start.output", if_skipped: null}
      go: "$start.output.ok"
      stop_reason: "$start.output.stop_reason"
      place: "gate-start"
      final: "false"
  # 2.5 仕様駆動の道の入口（docs/design/spec-driven.md の 6.2 の足す node の 1）。表の中身の確かめ（2.3 の 1〜5）を、AI の段を中に持つ
  # 試験の段より前にする。依頼の文の run は飛ぶ
  - id: spec-entry
    include: works-factory-spec-driven
    depends_on: [answer-start]
    when: "$answer-start.output.go == true && $start.output.from_spec == true"
    with:
      mode: "entry"
      table: "$start.output.ports.spec_table"
  # 2.7 設計の段（テーマの run だけ。docs/design/line.md の 3.3 節）。頭で世界の解と独立設計を 1 度ずつ回し、書き手（theme）と事前審査の形 theme の
  # 往復を回す。止まる周に本体の唯一の終わりの関所 gate-theme で持ち主に聞き（無人の run は開かない）、合意したら theme-descend が承認された
  # 設計の変える所を依頼の行にして降りる。依頼の出どころは request-in の 1 つで、判定から後ろはそこから読む
  - id: theme-world
    include: works-factory-world
    depends_on: [answer-start]
    when: "$answer-start.output.go == true && $start.output.ports.theme != ''"
    with:
      request: "$start.output.ports.theme_request"
      purpose: "$start.output.ports.theme_text"
      web: "$start.output.ports.web"
      lang: "$start.output.ports.lang"
  - id: theme-world-out
    # 受け皿の本体はここ 1 か所。ほかは <<: *receiver で受け、id・depends_on・with だけを書く（names は運ぶ欄の名）
    <<: &receiver
      script: returned
      runtime: uv
      mutates_checkout: false
      output_format: &received
        type: object
        additionalProperties: false
        required: [got, why]
        properties:
          got: {type: [object, 'null'], description: '受けた block の出力の、names の欄を選んだ物（受け手が ports.picked で名を選ぶ。form は受け皿ごとに output_format で書き替える）。飛ばされた block は null'}
          why: {type: string}
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-world): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [theme-world]
    with:
      got: "$theme-world.output"
      names: "ok status reason rows classes dropped report"
  - id: theme-world-in
    # 返しの本体はここ 1 か所（docs/design/line.md の 1.5 の relay）。ほかは <<: *relay で受け、output_format だけを書き替える
    <<: &relay
      script: relay
      runtime: uv
      mutates_checkout: false
    depends_on: [answer-start, theme-world]
    trigger_rule: none_failed_min_one_success
    when: "$answer-start.output.go == true && $start.output.ports.theme != ''"
    with:
      got: {from: "$theme-world.output", if_skipped: null}
      field: "rows"
    output_format:
      type: object
      additionalProperties: false
      required: [rows, stop_reason]
      properties:
        rows: {<<: *pointer_or_null, description: 'jsonl(lib:world-row.schema.json): テーマの世界の解の行。世界の解が走らなければ null'}
        stop_reason: {type: string}
  - id: theme-blind
    include: works-factory-independent-design
    depends_on: [answer-start]
    when: "$answer-start.output.go == true && $start.output.ports.theme != ''"
    with:
      purpose: "$start.output.ports.theme_text"
      answers: "$answer-start.output.answer"
      request: "$start.output.ports.request_file"
      policy: "$start.output.ports.policy"
      base: "$start.output.ports.base"
      head: "$start.output.ports.base_rev"
      lang: "$start.output.ports.lang"
  - id: theme-blind-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-independent-design): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [theme-blind]
    with:
      got: "$theme-blind.output"
      names: "ok status stands design premises reason downgrades report"
  - id: theme-design-in
    <<: *relay
    depends_on: [answer-start, theme-blind]
    trigger_rule: none_failed_min_one_success
    when: "$answer-start.output.go == true && $start.output.ports.theme != ''"
    with:
      got: {from: "$theme-blind.output", if_skipped: null}
      field: "design reason"
    output_format:
      type: object
      additionalProperties: false
      required: [design, reason, stop_reason]
      properties:
        design: {<<: *pointer_or_null, description: 'json(shared:design.schema.json): テーマの独立設計の返答。走らなければ null'}
        reason: {type: [string, 'null']}
        stop_reason: {type: string}
  - id: theme-rounds
    depends_on: [theme-world-in, theme-design-in]
    when: "$answer-start.output.go == true && $start.output.ports.theme != '' && $theme-world-in.output.stop_reason == '' && $theme-design-in.output.stop_reason == ''"
    loop_group:
      max_iterations: 22   # 往復の安全の上限 rounds.LIMIT（20）と、一言の空の revise で聞き直す周 talk.EMPTY_LIMIT（2）。plan-rounds と同じ数え
      until_bash: 'done=$theme-talk.output.done; [ "$done" = "true" ]'
      nodes:
        - id: theme-turn
          script: theme_turn
          runtime: uv
          mutates_checkout: false
          with:
            answer: "$LOOP_PREV.gate-theme.output"
            previous: "$LOOP_PREV.theme-talk.output"
            last: "$LOOP_PREV.theme-turn.output"
            ports: "$start.output.ports"
          output_format:
            type: object
            additionalProperties: false
            required: [plan, answer, prior_design, record, answers, recorded, asks, talks, notes, timeline, stop_reason, reason]
            properties:
              plan: {type: boolean}
              notes: {type: array, items: {type: string}}
              timeline: {type: array, items: &event {type: object, properties: {kind: {type: string}, by: {type: string}, line: {type: string}, n: {type: [integer, 'null']}, key: {type: string}, pass: {type: integer}}}}
              answer: &talked {type: [object, 'null'], properties: {round: {type: [integer, 'null']}, decision: {type: string}, text: {type: string}, asked: {type: array, items: {type: string}}, by: {type: string}, bad: {type: string}}}
              prior_design: {<<: *pointer_or_null, description: 'json(shared:theme-design.schema.json): この周の書き手の port prior_design（前の周の設計の案）。1 周目は null'}
              record: {<<: *pointer_or_null, description: 'json(shared:plan-converge.schema.json): この周の事前審査と theme-out の port prior の往復の記録。1 周目は null'}
              answers: {type: array, description: 'json(shared:human-answers.schema.json): 人の答えの行（依頼の answers と承認ノードの答えのセクション。id H<n>）', items: {type: object}}
              recorded: &recorded
                type: array
                description: 'json(shared:recorded.schema.json): 記録された方針の行（lib/policy.py の recorded）'
                items:
                  type: object
                  properties: {source: {type: string}, name: {type: string}, text: {type: string}, lines: {type: integer}, alias: {type: string}}
              asks: {type: array, items: &asked_again {type: object, properties: {n: {type: integer}, key: {type: string}, round: {type: [integer, 'null']}, text: {type: string}, note: {type: boolean}}}}
              talks: {type: array, items: *talked}
              stop_reason: {type: string}
              reason: {type: string}
        - id: theme
          include: works-factory-theme
          depends_on: [theme-turn]
          when: "$theme-turn.output.plan == true"
          with:
            theme: "$start.output.ports.theme"
            prior: "$theme-turn.output.record"
            prior_design: "$theme-turn.output.prior_design"
            answers: "$theme-turn.output.answers"
            world_rows: "$theme-world-in.output.rows"
            policy: "$start.output.ports.policy"
            recorded: "$theme-turn.output.recorded"
            base: "$start.output.ports.base_rev"
            lang: "$start.output.ports.lang"
        - id: theme-review
          include: works-factory-plan-review
          depends_on: [theme]
          when: "$theme.output.ok == true"
          with:
            theme_doc: "$theme.output.design_md"
            purpose: "$start.output.ports.theme_text"
            design: "$theme-design-in.output.design"
            design_why: "$theme-design-in.output.reason"
            world_rows: "$theme-world-in.output.rows"
            prior: "$theme-turn.output.record"
            policy: "$start.output.ports.policy"
            recorded: "$theme-turn.output.recorded"
            request: "$start.output.ports.request_file"
            review_rev: "$start.output.ports.review_rev"
            diff_base: "$start.output.ports.base"
            lang: "$start.output.ports.lang"
        - id: theme-out
          script: theme_out
          runtime: uv
          mutates_checkout: false
          depends_on: [theme, theme-review]
          trigger_rule: none_failed_min_one_success
          with:
            design: "$theme.output"
            review: {from: "$theme-review.output", if_skipped: null}
            prior: "$theme-turn.output.record"
          output_format:
            type: object
            additionalProperties: false
            required: [done, ok, status, round, prior_design, record, design, design_md, review, stalled, capped, review_status, review_reason,
                       reason, report, stop_reason]
            properties: &theme_out_props
              done: {type: boolean}
              ok: {type: boolean}
              status: {type: string}
              round: {type: integer}
              prior_design: {<<: *pointer_or_null, description: 'json(shared:theme-design.schema.json): 次の周の書き手に渡す前の周の設計の案。案ができなかった周は null'}
              record: {<<: *pointer_or_null, description: 'json(shared:plan-converge.schema.json): 設計の往復の記録 theme-converge.json'}
              design: {<<: *pointer_or_null, description: 'json(shared:theme-design.schema.json): この周の設計の案'}
              design_md: {<<: *pointer_or_null, description: 'file: この周の設計の案の md'}
              review: {<<: *pointer_or_null, description: 'json(shared:plan-review-reply.schema.json): この周の事前審査の返答'}
              stalled: {type: boolean}
              capped: {type: boolean}
              review_status: {type: string}
              review_reason: {type: string}
              reason: {type: string}
              report: {type: array, items: {type: string}, description: 'この周の設計の案の書き手の block の報告の行（報告の「設計の段」のセクションに出す）'}
              stop_reason: {type: string}
        # 往復の返り（本体の唯一の終わりの関所が依る node）。theme-out の欄と設計の相談の欄
        - id: theme-talk
          script: theme_talk
          runtime: uv
          mutates_checkout: false
          depends_on: [theme-turn, theme-out]
          trigger_rule: none_failed_min_one_success
          with:
            turn: "$theme-turn.output"
            theme_out: {from: "$theme-out.output", if_skipped: null}
            previous: "$LOOP_PREV.theme-talk.output"
            ports: "$start.output.ports"
          output_format:
            type: object
            additionalProperties: false
            required: [done, ok, status, round, prior_design, record, design, design_md, review, stalled, capped, review_status, review_reason,
                       reason, report, stop_reason, open, text, asked, agreed, talks, notes, shown, timeline]
            properties: &theme_talk_props
              <<: *theme_out_props
              open: {type: boolean}
              text: {type: string}
              asked: {type: array, items: {type: string}}
              agreed: *talked
              talks: {type: array, items: *talked}
              notes: {type: array, items: {type: string}}
              shown: {type: string}
              timeline: {type: array, items: *event}
        # 設計の段の関所（本体の唯一の終わり）。人の居る run の止まる周だけ開く。revise は設計し直し（redesign は持たない）
        - id: gate-theme
          depends_on: [theme-talk]
          when: "$theme-talk.output.open == true"
          wait:
            attention: "$theme-talk.output.text"
            form: select
            options: [{id: approve}, {id: continue}, {id: stop}, {id: reject}, {id: revise}]
  - id: theme-rounds-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], additionalProperties: false, properties: {<<: *theme_talk_props, optional: {type: 'null', description: '受け皿の returned が足す欄（往復は落ちてよい node を宣言しないので null）'}}}, why: {type: string}}}
    depends_on: [theme-rounds]
    with:
      got: "$theme-rounds.output"
      names: "done ok status round prior_design record design design_md review stalled capped review_status review_reason reason report
        stop_reason open text asked agreed talks notes shown timeline"
  - id: theme-descend
    script: theme_descend
    runtime: uv
    mutates_checkout: false
    depends_on: [theme-rounds-out]
    when: "$answer-start.output.go == true && $start.output.ports.theme != ''"
    with:
      rounds: "$theme-rounds-out.output.got"
      ports: "$start.output.ports"
    output_format:
      type: object
      additionalProperties: false
      required: [go, stop_reason, reason, answer, no_change, request, request_file, request_answers, approved, rows, notes, report]
      properties:
        go: {type: boolean}
        stop_reason: {type: string}
        reason: {type: string}
        answer: *answer
        no_change: {type: boolean}
        request: {<<: *pointer_or_null, description: 'json(shared:request.schema.json): 承認された設計の変える所を依頼の行にした依頼のファイル。降りなければ null'}
        request_file: {type: string, description: 'json(shared:request.schema.json): 同じ依頼のファイルの絶対パス。降りなければ空の字'}
        request_answers: {type: array, items: {type: object, properties: {question: {type: string}, text: {type: string}}}}
        approved: {type: string, description: 'file: 承認された設計の md の写しのパス。無ければ空の字'}
        rows: {type: integer}
        notes: {type: array, items: {type: string}}
        report: {type: array, items: {type: string}}
  # 2.8 依頼の出どころ（どの run も 1 度。docs/design/line.md の 3.3 節）。判定から後ろは依頼をここからだけ読む
  - id: request-in
    script: request_in
    runtime: uv
    mutates_checkout: false
    depends_on: [answer-start, theme-descend]
    trigger_rule: none_failed_min_one_success
    when: "$answer-start.output.go == true"
    with:
      ports: "$start.output.ports"
      theme: {from: "$theme-descend.output", if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [go, stop_reason, reason, request, request_file, request_answers, entry, request_origin, request_scope, prior_rows, notes]
      properties:
        go: {type: boolean}
        stop_reason: {type: string}
        reason: {type: string}
        request: {<<: *pointer_or_null, description: 'json(shared:request.schema.json): この run の依頼の写し（テーマの run は降りた依頼）。無ければ null'}
        request_file: {type: string, description: 'json(shared:request.schema.json): 依頼のファイルの絶対パス。無い run は空の字'}
        request_answers: {type: array, items: {type: object, properties: {question: {type: string}, text: {type: string}}}}
        entry: {type: string}
        request_origin: {type: string}
        request_scope: {type: boolean}
        prior_rows: {type: array, items: {type: object, properties: {where: {type: string}, text: {type: string}}}}
        notes: {type: array, items: {type: string}}
  # 3 直す前の結末（固定材料の run は飛ぶ）。仕様駆動の run は入口の確かめが通った時だけ。when: は括弧を持てないので OR-of-AND で書き、
  # 飛ばされうる spec-entry を読む節は || の後ろに置く（依頼の文の run は前の節で打ち切り、spec-entry を読まない）。始めで止まった run は
  # request-in が飛ぶので、各節は answer-start を先に読んで打ち切る
  - id: test-gate-base
    include: works-factory-test-gate
    depends_on: [answer-start, spec-entry, request-in]
    trigger_rule: none_failed_min_one_success
    when: "$answer-start.output.go == true && $request-in.output.go == true && $start.output.from_fixture == false && $start.output.from_spec == false || $answer-start.output.go == true && $request-in.output.go == true && $start.output.from_fixture == false && $spec-entry.output.ok == true"
    with:
      mode: "base"
      test_cmd: "$start.output.ports.test_cmd"
      tdd_suite: "$start.output.ports.tdd_suite"
      base: "$start.output.ports.base_rev"
      entry_base: "$start.output.ports.base"
      request: "$request-in.output.request"
      request_scope: "$request-in.output.request_scope"
      reuse_dir: "$start.output.ports.reuse_dir"
      reuse_key: "$start.output.ports.run_id"
      user_env_dir: "$start.output.ports.user_env_dir"
      lang: "$start.output.ports.lang"
  - id: test-gate-base-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-test-gate): 受けた block の出力の、names の欄を選んだ物（受け手が ports.picked で名を選ぶ）。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [test-gate-base]
    with:
      got: "$test-gate-base.output"
      names: "mode ok green red_cause ran_steps baseline fingerprint test_outcomes evidence by suites_line log baseline_line reason suite suite_note related report"
  - id: spec-entry-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-spec-driven): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [spec-entry]
    with:
      got: "$spec-entry.output"
      names: "ok stop_reason reason request origin purpose spec spec_files tdd out_of_scope mismatches report"
  # 4 判定のまとめ（docs/design/judge-eyes.md の 1 節）。仕様駆動の run では回さない（判定の役だけを spec-diagnose で 1 回）
  - id: judge
    include: works-factory-judge
    depends_on: [test-gate-base]
    when: "$test-gate-base.output.ok == true && $start.output.from_spec == false"
    with:
      request: "$request-in.output.request"
      pr_text: "$start.output.ports.pr_text"
      carried: "$start.output.ports.carried"
      base: "$start.output.ports.base"
      entry: "$request-in.output.entry"
      web: "$start.output.ports.web"
      world: "$start.output.ports.world"
      spec: "$start.output.ports.spec"
      has_checks: "$start.output.ports.has_checks"
      thickness: "$start.output.ports.thickness"
      design_only: "$start.output.ports.design_talk"
      verify_by_tier: "$start.output.ports.verify_by_tier"
      user_env_dir: "$start.output.ports.user_env_dir"
      request_origin: "$request-in.output.request_origin"
      baseline: "$test-gate-base.output.baseline"
      policy: "$start.output.ports.policy"
      lang: "$start.output.ports.lang"
  - id: judge-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-judge): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [judge]
    with:
      got: "$judge.output"
      names: "ok stop_reason reason ready units questions judgment answer_ties out_of_purpose materials brief inputs purpose purpose_text purpose_source
        means purpose_review constraints world world_state spec spec_rows spec_origin excluded pr_drafts downgrades decisions tier tier_why
        row_asks tier_record verify verify_why report sections"
  # 5 段 → 回す物の表（docs/design/line.md の 5.1）
  - id: tiers
    script: tiers
    runtime: uv
    mutates_checkout: false
    depends_on: [judge]
    when: "$judge.output.ok == true"
    with:
      tier: "$judge.output.tier"
      tree_named: "$start.output.ports.tree_named"
      record: "$start.output.record"
    output_format:
      type: object
      additionalProperties: false
      required: [tier, omits, merge, tree, adds, lines, stop_reason]
      properties:
        tier: {type: string}
        omits: {type: boolean}
        merge: {type: boolean}
        tree: {type: string, enum: ['on', 'off', 'auto']}
        adds: {type: array, items: {type: string}}
        lines: {type: array, items: {type: string}}
        stop_reason: {type: string}
  # 6 計画の周の前の支度と構造の目。計画の 1 回目の周が修正案の役を起こす run でだけ、判定が切った単位を run に 1 回だけ測って見る
  - id: owed
    script: owed
    runtime: uv
    mutates_checkout: false
    depends_on: [judge, answer-start]
    when: "$judge.output.ready == true"
    with:
      judgment: "$judge.output.judgment"
      answer_ties: "$judge.output.answer_ties"
      materials: "$judge.output.materials"
      world: "$judge.output.world"
      decisions: "$judge.output.decisions"
      answer: "$answer-start.output.answer"
      record: "$start.output.record"
      ports: "$start.output.ports"
      request: "$request-in.output"
    output_format:
      type: object
      additionalProperties: false
      required: [owed, why, recorded, stop_reason]
      properties:
        owed: {type: boolean}
        why: {type: string}
        recorded: *recorded
        stop_reason: {type: string}
  - id: structure
    include: works-factory-structure
    depends_on: [owed]
    when: "$owed.output.owed == true"
    with:
      mode: "before"
      units: "$judge.output.units"
      intent: "[]"
      policy: "$start.output.ports.policy"
      lang: "$start.output.ports.lang"
  - id: structure-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-structure): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [structure]
    with:
      got: "$structure.output"
      names: "ok status reason structure after dirty escalate report"
  - id: structure-in
    <<: *relay
    depends_on: [judge, structure]
    trigger_rule: none_failed_min_one_success
    when: "$judge.output.ready == true"
    with:
      got: {from: "$structure.output", if_skipped: null}
      field: "structure"
    output_format:
      type: object
      additionalProperties: false
      required: [structure, stop_reason]
      properties:
        structure: {<<: *pointer_or_null, description: 'json(shared:structure-state.schema.json): 構造の目の控え。構造の目が走らなければ null'}
        stop_reason: {type: string}
  # 7 独立設計（判定の後に 1 回。どの周でも。直す物が無い周の R2 も読む）
  - id: independent-design
    include: works-factory-independent-design
    depends_on: [judge, answer-start]
    when: "$judge.output.ok == true"
    with:
      purpose: "$judge.output.purpose_text"
      purpose_source: "$judge.output.purpose_source"
      purpose_review: "$judge.output.purpose_review"
      constraints: "$judge.output.constraints"
      answers: "$answer-start.output.answer"
      request: "$request-in.output.request_file"
      policy: "$start.output.ports.policy"
      base: "$start.output.ports.base"
      head: "$start.output.ports.base_rev"
      lang: "$start.output.ports.lang"
  - id: independent-design-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-independent-design): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [independent-design]
    with:
      got: "$independent-design.output"
      names: "ok status stands design premises reason downgrades report"
  - id: design-in
    <<: *relay
    depends_on: [judge, independent-design]
    trigger_rule: none_failed_min_one_success
    when: "$judge.output.ok == true"
    with:
      got: {from: "$independent-design.output", if_skipped: null}
      field: "design reason premises"
    output_format:
      type: object
      additionalProperties: false
      required: [design, reason, premises, stop_reason]
      properties:
        design: {<<: *pointer_or_null, description: 'json(shared:design.schema.json): 独立設計の返答。独立設計が走らなければ null'}
        reason: {type: [string, 'null']}
        premises: {<<: *pointer_or_null, description: 'json(shared:design-premises.schema.json): 独立設計が読んだ人の決めた前提。無ければ null'}
        stop_reason: {type: string}
  # 8 計画の往復（docs/design/line.md の 3 節）。本体に AI の node を直に置かない。止め時は plan-out が決め、往復の返りは design-talk。
  # 対話モードの run（design_talk で無人でない）だけ、止まる周に本体の唯一の終わりの関所 gate-design で設計を相談する（3.1 節。答えは
  # 次の周の頭の design-turn が読む。until_bash は飛びうる関所の出力を読まない）。対話モードは人の指摘の受け箱を周の頭で拾い、周ごとの設計を
  # 控えに書いて告げ、指摘が 1 つも入らなかった run だけ関所で待つ（3.1 節・#830）。通常の run は関所がいつも飛び、往復は今と同じ
  - id: plan-rounds
    depends_on: [judge, judge-out, owed, structure-in, design-in, tiers]
    when: "$judge.output.ready == true && $owed.output.stop_reason == '' && $structure-in.output.stop_reason == '' && $tiers.output.stop_reason == ''"
    loop_group:
      max_iterations: 22   # 往復の安全の上限 rounds.LIMIT（20）と、一言の空の revise で聞き直す周 talk.EMPTY_LIMIT（2）
      until_bash: 'done=$design-talk.output.done; [ "$done" = "true" ]'
      nodes:
        - id: design-turn
          script: design_turn
          runtime: uv
          mutates_checkout: false
          with:
            answer: "$LOOP_PREV.gate-design.output"
            previous: "$LOOP_PREV.design-talk.output"
            last: "$LOOP_PREV.design-turn.output"
            ports: "$start.output.ports"
            recorded: "$owed.output.recorded"
            request: "$request-in.output"
          output_format:
            type: object
            additionalProperties: false
            required: [plan, answer, plan_prior, record, answers, recorded, asks, talks, notes, timeline, stop_reason, reason]
            properties:
              plan: {type: boolean}
              notes: {type: array, items: {type: string}}
              timeline: {type: array, items: *event}
              answer: *talked
              plan_prior: {<<: *pointer_or_null, description: 'json(shared:plan-prior.schema.json): この周の plan の port prior（前の周の値か、修正要望を差し込んだ写し）。1 周目は null'}
              record: {<<: *pointer_or_null, description: 'json(shared:plan-converge.schema.json): この周の事前審査と plan-out の port prior の往復の記録。1 周目は null'}
              answers: {type: array, items: {type: object, properties: {question: {type: string}, text: {type: string}}}}
              recorded: *recorded
              asks: {type: array, items: *asked_again}
              talks: {type: array, items: *talked}
              stop_reason: {type: string}
              reason: {type: string}
        - id: plan
          include: works-factory-plan
          depends_on: [design-turn]
          when: "$design-turn.output.plan == true"
          with:
            judgment: "$judge.output.judgment"
            units: "$judge.output.units"
            answer_ties: "$judge.output.answer_ties"
            materials: "$judge.output.materials"
            answers: "$design-turn.output.answers"
            takes_push: "$start.output.ports.takes_push"
            verify: "$judge.output.verify"
            excluded: "$judge.output.excluded"
            depth_record: "$judge.output.tier_record"
            decisions: "$judge.output.decisions"
            world_rows: "$judge.output.world"
            structure: "$structure-in.output.structure"
            spec: "$judge.output.spec"
            policy: "$start.output.ports.policy"
            prior_failures: "$request-in.output.prior_rows"
            prior: "$design-turn.output.plan_prior"
            ruling: "[]"
            base: "$start.output.ports.base_rev"
            review_rev: "$start.output.ports.review_rev"
            diff_base: "$start.output.ports.base"
            lang: "$start.output.ports.lang"
        - id: plan-review-run
          include: works-factory-plan-review
          depends_on: [plan]
          when: "$plan.output.ok == true"
          with:
            plan: "$plan.output.fix_plan"
            fields: "$plan.output.plan"
            judgment: "$judge.output.judgment"
            purpose: "$judge.output.purpose_text"
            design: "$design-in.output.design"
            design_why: "$design-in.output.reason"
            world_rows: "$judge.output.world"
            means: "$judge.output.means"
            structure: "$structure-in.output.structure"
            ripple: "$plan.output.ripple"
            prior: "$design-turn.output.record"
            tree: "$tiers.output.tree"
            excluded: "$judge.output.excluded"
            policy: "$start.output.ports.policy"
            recorded: "$design-turn.output.recorded"
            request: "$request-in.output.request_file"
            review_rev: "$start.output.ports.review_rev"
            diff_base: "$start.output.ports.base"
            lang: "$start.output.ports.lang"
        - id: plan-out
          script: plan_out
          runtime: uv
          mutates_checkout: false
          depends_on: [plan, plan-review-run]
          trigger_rule: none_failed_min_one_success
          with:
            plan: "$plan.output"
            review: {from: "$plan-review-run.output", if_skipped: null}
            prior: "$design-turn.output.record"
            unattended: "$start.output.ports.unattended"
          output_format: &plan_out_shape
            type: object
            additionalProperties: false
            required: [done, ok, status, round, plan_prior, record, plan, fix_plan, reply, handoffs, ripple, owed, gave_up, stalled, capped,
                       review, asks, deviations, review_status, review_reason, stop_reason]
            properties: &plan_out_props
              done: {type: boolean}
              ok: {type: boolean}
              status: {type: string}
              round: {type: integer}
              plan_prior: {<<: *pointer_or_null, description: 'json(shared:plan-prior.schema.json): 次の周の plan の port prior。計画ができなかった周は null'}
              record: {<<: *pointer_or_null, description: 'json(shared:plan-converge.schema.json): 往復の記録 plan-converge.json'}
              plan: {<<: *pointer_or_null, description: 'json(shared:plan-fields.schema.json): この周の修正案の欄の控え'}
              fix_plan: {<<: *pointer_or_null, description: 'json(shared:fix-plan.schema.json): この周の修正案の出力'}
              reply: {<<: *pointer_or_null, description: 'json(shared:plan-reply.schema.json): この周の受け付けた修正案'}
              handoffs: &handoffs {type: array, items: {type: object, properties: {round: {type: integer}, handoff: {<<: *pointer_or_null, description: 'json(shared:handoff.schema.json): その周の引き継ぎのメモ'}}}}
              ripple: {<<: *pointer_or_null, description: 'json(shared:ripple.schema.json): この周の波及の一覧'}
              owed: &owed {type: array, items: {type: string}}
              gave_up: {type: [array, 'null'], items: {type: object, properties: {item: {type: integer}, why: {type: string}, ruling: {type: string}}}}
              stalled: {type: boolean}
              capped: {type: boolean}
              review: {<<: *pointer_or_null, description: 'json(shared:plan-review-reply.schema.json): この周の事前審査の返答（止まった案を推しで進める周は保留の穴を足した写し）'}
              asks: {type: array, items: {type: object, description: 'json(lib:ask-row.schema.json): 事前審査の出力の asks の行を写した物'}}
              deviations: {type: array, items: {type: object, properties: {source: {type: string}}}}
              review_status: {type: string}
              review_reason: {type: string}
              stop_reason: {type: string}
        # 往復の返り（本体の唯一の終わりの関所が依る node）。plan-out の欄と設計の相談の欄。plan-out が飛ぶ周（答えた後の周）も走る
        - id: design-talk
          script: design_talk
          runtime: uv
          mutates_checkout: false
          depends_on: [design-turn, plan-out]
          trigger_rule: none_failed_min_one_success
          with:
            turn: "$design-turn.output"
            plan_out: {from: "$plan-out.output", if_skipped: null}
            previous: "$LOOP_PREV.design-talk.output"
            structure: "$structure-in.output.structure"
            judge: "$judge-out.output.got"
            record: "$start.output.record"
            ports: "$start.output.ports"
            request: "$request-in.output"
          output_format:   # 往復の loop_group の出力（欄は plan-rounds-out が &design_talk_props で受ける）
            type: object
            additionalProperties: false
            required: [done, ok, status, round, plan_prior, record, plan, fix_plan, reply, handoffs, ripple, owed, gave_up, stalled, capped,
                       review, asks, deviations, review_status, review_reason, stop_reason, open, text, asked, agreed, talks, notes, shown,
                       timeline]
            properties: &design_talk_props
              <<: *plan_out_props
              open: {type: boolean}
              text: {type: string}
              asked: {type: array, items: {type: string}}
              agreed: *talked
              talks: {type: array, items: *talked}
              notes: {type: array, items: {type: string}}
              shown: {type: string}
              timeline: {type: array, items: *event}
        # 設計の相談の関所（本体の唯一の終わり。docs/design/line.md の 3.1 節）。対話モードの run の止まる周だけ開く。revise は設計し直し
        - id: gate-design
          depends_on: [design-talk]
          when: "$design-talk.output.open == true"
          wait:
            attention: "$design-talk.output.text"
            form: select
            options: [{id: approve}, {id: continue}, {id: stop}, {id: reject}, {id: revise}, {id: redesign}]
  - id: plan-rounds-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], additionalProperties: false, properties: {<<: *design_talk_props, optional: {type: 'null', description: '受け皿の returned が足す欄（往復は落ちてよい node を宣言しないので null）'}}}, why: {type: string}}}
    depends_on: [plan-rounds]
    with:
      got: "$plan-rounds.output"
      names: "done ok status round plan_prior record plan fix_plan reply handoffs ripple owed gave_up stalled capped review asks deviations
        review_status review_reason stop_reason open text asked agreed talks notes shown timeline"
  # 8.5 設計へ戻す（テーマの run で、計画の承認ノード gate-design に redesign と答えた時だけ書き出す。docs/design/line.md の 3.3 節）。
  # run を閉じるのは修正前の承認ノード（agreed の redesign は通す語でないので human:gate-design で止める）
  - id: theme-return
    script: theme_return
    runtime: uv
    mutates_checkout: false
    depends_on: [plan-rounds-out, theme-descend]
    when: "$start.output.ports.theme != ''"
    with:
      rounds: "$plan-rounds-out.output.got"
      ports: "$start.output.ports"
      record: "$start.output.record"
      descended: "$theme-descend.output"
    output_format:
      type: object
      additionalProperties: false
      required: [back, next, command, reason, report]
      properties:
        back: {type: boolean}
        next: {type: string}
        command: {type: string}
        reason: {type: string}
        report: {type: array, items: {type: string}}
  # 9 修正前の承認ノード（docs/design/line.md の 2 節の 2）。軸・項目・聞かずに通した行は line が組む
  - id: ask-before-fix
    # 本体はここ 1 か所。仕様駆動の run の spec-ask-before-fix は <<: *ask_before_fix で受ける
    <<: &ask_before_fix
      script: ask_before_fix
      runtime: uv
      mutates_checkout: false
      output_format:
        type: object
        additionalProperties: false
        required: [open, go, stop_reason, text, deferred, asked, pushed, passes, policy_changed, agreed]
        properties:
          open: {type: boolean}
          go: {type: boolean}
          stop_reason: {type: string}
          reason: {type: string}
          text: {type: string}
          deferred: {type: array, items: {type: string}}
          asked: {type: array, items: {type: string}}
          pushed: &pushed {type: [object, 'null'], properties: {decision: {type: string}, text: {type: string}, pushed: {type: array, items: *push_row}}}
          passes: {type: array, items: &passed {type: object, properties: {node: {type: string}, round: {type: [integer, 'null']}, by: {type: string}, item: {type: string}, decided_by: {type: string}}}}
          policy_changed: {type: boolean}
          agreed: *talked
    depends_on: [plan-rounds-out, judge-out, structure-in]
    with:
      rounds: "$plan-rounds-out.output.got"
      structure: "$structure-in.output.structure"
      judge: "$judge-out.output.got"
      record: "$start.output.record"
      ports: "$start.output.ports"
      request: "$request-in.output"
  - id: gate-before-fix
    wait:
      # form と options の本体はここ 1 か所。spec-gate-before-fix は attention だけを替えて受ける
      <<: &before_fix_wait
        form: select
        options: [{id: approve}, {id: continue}, {id: stop}, {id: reject}]
      attention: "$ask-before-fix.output.text"
    depends_on: [ask-before-fix]
    when: "$ask-before-fix.output.open == true"
  - id: answer-before-fix
    # 本体はここ 1 か所。spec-answer-before-fix は <<: *before_fix_answer で受ける
    <<: &before_fix_answer
      script: before_fix_answer
      runtime: uv
      mutates_checkout: false
      output_format:
        type: object
        additionalProperties: false
        required: [go, answer, stop_reason, policy]
        properties:
          go: {type: boolean}
          answer: *answer
          stop_reason: {type: string}
          policy: {type: string, description: 'file: 修正前の答えが固め直した方針の写しのパス（固め直さなければ配る値の写し）'}
    depends_on: [ask-before-fix, gate-before-fix]
    trigger_rule: none_failed_min_one_success
    with:
      gate: {from: "$gate-before-fix.output", if_skipped: null}
      go: "$ask-before-fix.output.go"
      stop_reason: "$ask-before-fix.output.stop_reason"
      place: "gate-before-fix"
      asked: "$ask-before-fix.output.asked"
      pushed: "$ask-before-fix.output.pushed"
      policy_changed: "$ask-before-fix.output.policy_changed"
      agreed: "$ask-before-fix.output.agreed"
      record: "$start.output.record"
      ports: "$start.output.ports"
  # 9.5 仕様駆動の道（docs/design/spec-driven.md の 6.2 の足す node の 3〜11）。判定の役と計画の部品を 1 回ずつ通し、仕様とリポジトリの
  # 食い違いを照らし、今の受け皿の形に組み直して、今と同じ条件で修正前の承認ノードを出す。依頼の文の run は全部飛ぶ
  - id: spec-diagnose
    include: works-factory-diagnose
    depends_on: [spec-entry, test-gate-base]
    when: "$spec-entry.output.ok == true && $test-gate-base.output.ok == true"
    with:
      request: "$spec-entry.output.request"
      request_origin: "$spec-entry.output.origin"
      base: "$start.output.ports.base"
      purpose: "$spec-entry.output.purpose"
      request_files: "$spec-entry.output.spec_files"
      baseline: "$test-gate-base.output.baseline"
      policy: "$start.output.ports.policy"
      lang: "$start.output.ports.lang"
  - id: spec-diagnose-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-diagnose): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [spec-diagnose]
    with:
      got: "$spec-diagnose.output"
      names: "ok status mode stop_reason reason ready judgment units questions inputs brief materials out_of_purpose answer_ties rejudge_verdict
        rejudge_exit rejudge_diff downgrades report"
  - id: spec-plan
    include: works-factory-plan
    depends_on: [spec-entry, spec-diagnose]
    when: "$spec-diagnose.output.ready == true"
    with:
      judgment: "$spec-diagnose.output.judgment"
      units: "$spec-diagnose.output.units"
      answer_ties: "$spec-diagnose.output.answer_ties"
      materials: "$spec-diagnose.output.materials"
      answers: "$request-in.output.request_answers"
      takes_push: "$start.output.ports.takes_push"
      spec_doc: "$spec-entry.output.spec"
      routes: "spec"
      policy: "$start.output.ports.policy"
      ruling: "[]"
      base: "$start.output.ports.base_rev"
      review_rev: "$start.output.ports.review_rev"
      diff_base: "$start.output.ports.base"
      lang: "$start.output.ports.lang"
  - id: spec-plan-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-plan): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [spec-plan]
    with:
      got: "$spec-plan.output"
      names: "ok status reason mode round owed plan fix_plan reply handoff replan ripple rejects gave_up report"
  - id: spec-check
    include: works-factory-spec-driven
    depends_on: [spec-entry, test-gate-base, spec-diagnose, spec-plan]
    trigger_rule: none_failed_min_one_success
    # trigger_rule が緩いので、依頼の文の run は when: の頭の from_spec == false で打ち切る（飛ばされた spec-entry を読まない）
    when: "$start.output.from_spec == true && $spec-entry.output.ok == true && $test-gate-base.output.ok == true"
    with:
      mode: "check"
      tdd: "$spec-entry.output.tdd"
      out_of_scope: "$spec-entry.output.out_of_scope"
      out_of_purpose: {from: "$spec-diagnose.output.out_of_purpose", if_skipped: null}
      ready: {from: "$spec-diagnose.output.ready", if_skipped: null}
      plan: {from: "$spec-plan.output.plan", if_skipped: null}
      plan_ok: {from: "$spec-plan.output.ok", if_skipped: null}
      base: "$start.output.ports.base_rev"
  - id: spec-check-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-spec-driven): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [spec-check]
    with:
      got: "$spec-check.output"
      names: "ok stop_reason reason request origin purpose spec spec_files tdd out_of_scope mismatches report"
  - id: spec-rounds
    script: spec_rounds
    runtime: uv
    mutates_checkout: false
    depends_on: [spec-check, spec-diagnose-out, spec-plan-out, spec-entry-out]
    when: "$spec-check.output.ok == true"
    with:
      diagnose: "$spec-diagnose-out.output.got"
      plan: "$spec-plan-out.output.got"
      entry: "$spec-entry-out.output.got"
      ports: "$start.output.ports"
    output_format:
      type: object
      additionalProperties: false
      required: [judge, rounds, stop_reason, reason]
      properties:
        judge: {type: [object, 'null'], description: 'json(returns:works-factory-judge): judge-out の got と同じ欄の組（src/specrounds.py の judge_part）'}
        rounds: {<<: *plan_out_shape, type: [object, 'null']}  # plan-out の出力と同じ欄の組（rounds_part）
        stop_reason: {type: string}
        reason: {type: string}
  - id: spec-ask-before-fix
    <<: *ask_before_fix
    depends_on: [spec-rounds]
    with:
      rounds: "$spec-rounds.output.rounds"
      structure: ""
      judge: "$spec-rounds.output.judge"
      record: "$start.output.record"
      ports: "$start.output.ports"
      request: "$request-in.output"
  - id: spec-gate-before-fix
    wait:
      <<: *before_fix_wait
      attention: "$spec-ask-before-fix.output.text"
    # 待つ node が 2 つ同時に走らないよう、今の gate-before-fix の後ろに並べる（Archon の読み込みの決まり）。依頼の文の run は when: の頭の
    # from_spec == false で打ち切り、飛ばされた spec-ask-before-fix の出力を読まない
    depends_on: [spec-ask-before-fix, gate-before-fix]
    trigger_rule: none_failed_min_one_success
    when: "$start.output.from_spec == true && $spec-ask-before-fix.output.open == true"
  - id: spec-answer-before-fix
    <<: *before_fix_answer
    depends_on: [spec-ask-before-fix, spec-gate-before-fix]
    trigger_rule: none_failed_min_one_success
    with:
      gate: {from: "$spec-gate-before-fix.output", if_skipped: null}
      go: "$spec-ask-before-fix.output.go"
      stop_reason: "$spec-ask-before-fix.output.stop_reason"
      place: "gate-before-fix"
      asked: "$spec-ask-before-fix.output.asked"
      pushed: "$spec-ask-before-fix.output.pushed"
      policy_changed: "$spec-ask-before-fix.output.policy_changed"
      agreed: "$spec-ask-before-fix.output.agreed"
      record: "$start.output.record"
      ports: "$start.output.ports"
  # 10 修正の段へ運ぶ値を 1 か所に集める（docs/design/line.md の 4.1・5.2）。修正から後ろの node は判定・構造の目・独立設計・計画の値をここから読む
  - id: fix-in
    script: fix_in
    runtime: uv
    mutates_checkout: false
    depends_on: [answer-start, test-gate-base-out, judge-out, tiers, owed, structure-out, design-in, plan-rounds-out, ask-before-fix,
                 answer-before-fix, spec-rounds, spec-ask-before-fix, spec-answer-before-fix]
    trigger_rule: none_failed_min_one_success
    with:
      fixture: "$start.output.fixture"
      start_go: "$answer-start.output.go"
      ports: "$start.output.ports"
      record: "$start.output.record"
      test_gate_base: {from: "$test-gate-base-out.output.got", if_skipped: null}
      judge: {from: "$judge-out.output.got", if_skipped: null}
      tiers: {from: "$tiers.output", if_skipped: null}
      structure: {from: "$structure-out.output.got", if_skipped: null}
      design: {from: "$design-in.output", if_skipped: null}
      rounds: {from: "$plan-rounds-out.output.got", if_skipped: null}
      before_fix_go: {from: "$answer-before-fix.output.go", if_skipped: null}
      before_fix_answer: {from: "$answer-before-fix.output.answer", if_skipped: null}
      before_fix_policy: {from: "$answer-before-fix.output.policy", if_skipped: null}
      deferred: {from: "$ask-before-fix.output.deferred", if_skipped: null}
      passes: {from: "$ask-before-fix.output.passes", if_skipped: null}
      recorded: {from: "$owed.output.recorded", if_skipped: null}
      # 仕様駆動の run だけ（ほかの run は null）。判定の部と往復の部は spec-rounds、修正前の承認の答えは spec- の付いた 3 つから
      spec: {from: "$spec-rounds.output", if_skipped: null}
      spec_before_fix_go: {from: "$spec-answer-before-fix.output.go", if_skipped: null}
      spec_before_fix_answer: {from: "$spec-answer-before-fix.output.answer", if_skipped: null}
      spec_before_fix_policy: {from: "$spec-answer-before-fix.output.policy", if_skipped: null}
      spec_deferred: {from: "$spec-ask-before-fix.output.deferred", if_skipped: null}
      spec_passes: {from: "$spec-ask-before-fix.output.passes", if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [go, no_fix, stop_reason, reason, received, policy, answer, deferred, passes, baseline, suite, suite_made, judgment, units, answer_ties, materials,
                 out_of_purpose, verify, excluded, tier_record, decisions, world, spec, purpose, purpose_text, means, constraints, brief,
                 inputs, recorded, structure, design, design_reason, design_premises, plan, fix_plan, ripple, reply, review, record, handoffs, owed,
                 round, units_tier, skip_rerun, switches]
      properties:
        go: {type: boolean}
        no_fix: {type: boolean}
        stop_reason: {type: string}
        reason: {type: string}
        received: {type: [object, 'null'], description: 'json(received.schema.json): 固定材料の run で start が置いた運ぶ値。ほかの run は null'}
        policy: {type: string, description: 'file: 方針の文書の写しのパス（修正前の答えが固め直した物か、配る値の写し）'}
        answer: *answer
        deferred: {type: array, items: {type: string}}
        passes: {type: array, items: *passed}
        baseline: {<<: *pointer_or_null, description: 'json(lib:baseline.schema.json): 直す前の試験の結末。試験の関門が書かなかった run は null'}
        suite: {type: string}
        suite_made: {type: boolean}   # suite が試験の関門の用意した実行器（修正の段が壊れを書き直させてよい。docs/design/fix.md の 19 節）
        judgment: {<<: *pointer_or_null, description: 'json(shared:judgment.schema.json): 判定'}
        units: {type: array, description: 'json(shared:units.schema.json): 判定が切った根本の単位の目録'}
        answer_ties: {<<: *pointer_or_null, description: 'json(shared:answer-ties.schema.json): 依頼の答えを判定の問いと単位に結んだ行'}
        materials: {<<: *pointer_or_null, description: 'json(shared:materials-state.schema.json): 判定の素材の状態'}
        out_of_purpose: {<<: *pointer_or_null, description: 'json(lib:out-of-purpose.schema.json): 判定が目的の外とした行の控え'}
        verify: {<<: *pointer_or_null, description: 'json(shared:verify.schema.json): 判定の裏取りの申し送り'}
        excluded: {<<: *pointer_or_null, description: 'json(shared:excluded.schema.json): 並行 PR と重なるので外した範囲'}
        tier_record: {<<: *pointer_or_null, description: 'json(shared:depth-record.schema.json): run の頭の深さの控え'}
        decisions: {<<: *pointer_or_null, description: 'json(shared:material.schema.json): 先行議論の突合の素材'}
        world: {<<: *pointer_or_null, description: 'jsonl(lib:world-row.schema.json): 世界の解の行'}
        spec: {<<: *pointer_or_null, description: 'json(shared:spec.schema.json): 固めた仕様'}
        purpose: {<<: *pointer_or_null, description: 'json(shared:purpose.schema.json): 固めた目的'}
        purpose_text: {type: string}
        means: {type: array, items: {type: string}}
        constraints: {<<: *pointer_or_null, description: 'json(shared:constraints.schema.json): 前提の実測の行'}
        brief: {<<: *pointer_or_null, description: 'file: 1 回目の判定役に渡した指示'}
        inputs: {<<: *pointer_or_null, description: 'json(shared:diagnose-input.schema.json): 1 回目の判定役が読んだ材料'}
        recorded: *recorded
        structure: {<<: *pointer_or_null, description: 'json(shared:structure-state.schema.json): 構造の目の控え'}
        design: {<<: *pointer_or_null, description: 'json(shared:design.schema.json): 独立設計の返答'}
        design_reason: {type: string}
        design_premises: {<<: *pointer_or_null, description: 'json(shared:design-premises.schema.json): 独立設計が読んだ人の決めた前提'}
        plan: {<<: *pointer_or_null, description: 'json(shared:plan-fields.schema.json): 承認済みの修正案の欄の控え'}
        fix_plan: {<<: *pointer_or_null, description: 'json(shared:fix-plan.schema.json): 承認済みの修正案の出力'}
        ripple: {<<: *pointer_or_null, description: 'json(shared:ripple.schema.json): 波及の一覧'}
        reply: {<<: *pointer_or_null, description: 'json(shared:plan-reply.schema.json): 受け付けた修正案'}
        review: {<<: *pointer_or_null, description: 'json(shared:plan-review-reply.schema.json): 事前審査の返答'}
        record: {<<: *pointer_or_null, description: 'json(shared:plan-converge.schema.json): 往復の記録'}
        handoffs: *handoffs
        owed: *owed
        round: {type: [integer, 'null']}
        units_tier: {type: array, items: &unit_tier {type: object, properties: {unit_id: {type: string}, depth: {type: [string, 'null']}, why: {type: string}}}}
        skip_rerun: {type: array, items: {type: string}}
        switches: {type: object, properties: {tier: {type: [string, 'null']}, omits: {type: boolean}, merge: {type: boolean}, tree: {type: string}, adds: {type: array, items: {type: string}}, lines: {type: array, items: {type: string}}}}
  # 11 修正（1 回目）
  - id: fix
    include: works-factory-fix
    depends_on: [fix-in]
    when: "$fix-in.output.go == true && $fix-in.output.no_fix == false"
    with:
      mode: "whole"
      routes: "$start.output.ports.routes"
      judgment: "$fix-in.output.judgment"
      answer_ties: "$fix-in.output.answer_ties"
      materials: "$fix-in.output.materials"
      plan: "$fix-in.output.plan"
      fix_plan: "$fix-in.output.fix_plan"
      ripple: "$fix-in.output.ripple"
      plan_review: "$fix-in.output.review"
      answers: "$fix-in.output.answer"
      request_answers: "$request-in.output.request_answers"
      unattended: "$start.output.ports.unattended"
      parallel: "$start.output.ports.parallel"
      test_cmd: "$start.output.ports.test_cmd"
      reuse_dir: "$start.output.ports.reuse_dir"
      reuse_key: "$start.output.ports.run_id"
      user_env_dir: "$start.output.ports.user_env_dir"
      lang: "$start.output.ports.lang"
      policy: "$fix-in.output.policy"
      request: "$request-in.output.request_file"
      baseline: "$fix-in.output.baseline"
      tdd_suite: "$fix-in.output.suite"
      suite_made: "$fix-in.output.suite_made"
      skip_rerun: "$fix-in.output.skip_rerun"
      excluded: "$fix-in.output.excluded"
  - id: fix-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-fix): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [fix]
    with:
      got: "$fix.output"
      names: "ok reason units groups conflicts carry replan_items objection diff start_tree reply ruled_reply scope checked allowed_test_changes
        changed x_scalars handoffs handoff_titles mismatched plan_declared stop_reason allowed_tests accept_trace closure tdd_unit tdd frozen removed
        tdd_refused item_claims freeze_off removed_tests untested report"
  # 12 案の直しを差し込むか（run に 1 度）と、案の直しの plan に渡す前の周（docs/design/line.md の 4.2）
  - id: after-fix
    script: after_fix
    runtime: uv
    mutates_checkout: false
    depends_on: [fix]
    with:
      from_spec: "$start.output.from_spec"
      replan_items: "$fix.output.replan_items"
      rounds: "$fix-in.output.record"
      plan: "$fix-in.output.plan"
      fix_plan: "$fix-in.output.fix_plan"
      ripple: "$fix-in.output.ripple"
      reply: "$fix-in.output.reply"
      handoffs: "$fix-in.output.handoffs"
      round: "$fix-in.output.round"
    output_format:
      type: object
      additionalProperties: false
      required: [replan, prior, stop_reason]
      properties:
        replan: {type: boolean}
        prior: {<<: *pointer_or_null, description: 'json(shared:plan-prior.schema.json): 案の直しの plan の port prior（replan-prior.json）。案の直しへ進まなければ null'}
        stop_reason: {type: string}
  # 13 修正の後の上げ直し。run に 1 回、1 回目の修正の段と差分の審査の間（docs/design/line.md の 5.3）
  - id: raise
    script: raise_depth
    runtime: uv
    mutates_checkout: false
    depends_on: [fix-in, fix, after-fix]
    when: "$fix-in.output.go == true"
    with:
      fix: "$fix.output"
      replan: "$after-fix.output.replan"
      units_tier: "$fix-in.output.units_tier"
      switches: "$fix-in.output.switches"
      judgment: "$fix-in.output.judgment"
      plan: "$fix-in.output.plan"
      answer_ties: "$fix-in.output.answer_ties"
      materials: "$fix-in.output.materials"
      tier_record: "$fix-in.output.tier_record"
      answer: "$fix-in.output.answer"
      record: "$start.output.record"
      ports: "$start.output.ports"
      request: "$request-in.output"
    output_format:
      type: object
      additionalProperties: false
      required: [units, checks, skip_why, eyes_due, raised, counted, lines, stop_reason]
      properties:
        units: {type: array, items: *unit_tier}
        checks: {type: boolean}
        skip_why: {type: string}
        eyes_due: {type: boolean}
        raised: {type: array, items: {type: string}}
        counted: {type: string}
        lines: {type: array, items: {type: string}}
        stop_reason: {type: string}
  # 14 1 回目の段の差分の審査。回すのは、深さで省かない（raise.checks）・修正の段の変更の確かめが通った（fix.checked.ok）・
  # 戻せず当たったままの組が無い（fix.stop_reason が空。止めの語 works:unrestored でない）時だけ（docs/design/line.md の 4.5。
  # delta-review と lens の設計書の 1.6 が今の delta-cut から line へ移した 3 つ）。lens と delta-review は同じ when: を持つ
  - id: lens
    include: works-factory-lens
    depends_on: [raise]
    when: "$raise.output.checks == true && $fix.output.ok == true && $fix.output.checked.ok == true && $fix.output.stop_reason == ''"
    with:
      base: "$fix.output.start_tree"
      lang: "$start.output.ports.lang"
  - id: lens-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-lens): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [lens]
    with:
      got: "$lens.output"
      names: "ok status reason rows ran failed not_routed carry report"
  - id: lens-in
    <<: *relay
    depends_on: [raise, lens-out]
    trigger_rule: none_failed_min_one_success
    with:
      got: {from: "$lens-out.output.got", if_skipped: null}
      field: "rows"
    output_format:
      type: object
      additionalProperties: false
      required: [rows, stop_reason]
      properties:
        rows: {<<: *pointer_or_null, description: 'json(shared:lens-rows.schema.json): レンズの控え。レンズが走らなければ null'}
        stop_reason: {type: string}
  - id: delta-review
    include: works-factory-delta-review
    depends_on: [lens-in]
    when: "$raise.output.checks == true && $fix.output.ok == true && $fix.output.checked.ok == true && $fix.output.stop_reason == ''"
    with:
      base: "$fix.output.start_tree"
      plan: "$fix.output.scope"
      lens_rows: "$lens-in.output.rows"
      fix_reply: "$fix.output.reply"
      permits: "$fix.output.allowed_tests"
      plan_review: "$fix-in.output.review"
      policy: "$fix-in.output.policy"
      request: "$request-in.output.request"
      lang: "$start.output.ports.lang"
  - id: delta-review-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-delta-review): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [delta-review]
    with:
      got: "$delta-review.output"
      names: "ok status reason rounds pass holes diff carry report"
  # 15 案の直し（一度だけ。docs/design/line.md の 4.2）。作業ツリーを変える手直しの後に回す
  - id: replan
    include: works-factory-plan
    depends_on: [after-fix, delta-review-out]
    trigger_rule: none_failed_min_one_success
    when: "$after-fix.output.replan == true"
    with:
      judgment: "$fix-in.output.judgment"
      units: "$fix-in.output.units"
      answer_ties: "$fix-in.output.answer_ties"
      materials: "$fix-in.output.materials"
      answers: "$request-in.output.request_answers"
      takes_push: "$start.output.ports.takes_push"
      verify: "$fix-in.output.verify"
      excluded: "$fix-in.output.excluded"
      depth_record: "$fix-in.output.tier_record"
      decisions: "$fix-in.output.decisions"
      world_rows: "$fix-in.output.world"
      structure: "$fix-in.output.structure"
      spec: "$fix-in.output.spec"
      policy: "$fix-in.output.policy"
      prior_failures: "$request-in.output.prior_rows"
      prior: "$after-fix.output.prior"
      ruling: "$fix.output.replan_items"
      conflicts: "$fix.output.conflicts"
      base: "$start.output.ports.base_rev"
      review_rev: "$start.output.ports.review_rev"
      diff_base: "$start.output.ports.base"
      lang: "$start.output.ports.lang"
  - id: replan-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-plan): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [replan]
    with:
      got: "$replan.output"
      names: "ok status reason mode round owed plan fix_plan reply handoff replan ripple rejects gave_up report"
  - id: replan-review
    include: works-factory-plan-review
    depends_on: [replan]
    when: "$replan.output.ok == true"
    with:
      plan: "$replan.output.fix_plan"
      fields: "$replan.output.plan"
      judgment: "$fix-in.output.judgment"
      purpose: "$fix-in.output.purpose_text"
      design: "$fix-in.output.design"
      design_why: "$fix-in.output.design_reason"
      world_rows: "$fix-in.output.world"
      means: "$fix-in.output.means"
      structure: "$fix-in.output.structure"
      ripple: "$replan.output.ripple"
      prior: "$fix-in.output.record"
      tree: "off"
      excluded: "$fix-in.output.excluded"
      policy: "$fix-in.output.policy"
      recorded: "$fix-in.output.recorded"
      request: "$request-in.output.request_file"
      review_rev: "$start.output.ports.review_rev"
      diff_base: "$start.output.ports.base"
      ruling: "$fix.output.replan_items"
      conflicts: "$fix.output.conflicts"
      lang: "$start.output.ports.lang"
  - id: replan-review-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-plan-review): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [replan-review]
    with:
      got: "$replan-review.output"
      names: "ok status form round reason holes blocks pass asks deviations replan gave_up reads report"
  - id: ask-replan
    script: ask_replan
    runtime: uv
    mutates_checkout: false
    depends_on: [replan-out, replan-review-out]
    trigger_rule: none_failed_min_one_success
    with:
      replan: "$replan-out.output.got"
      review: {from: "$replan-review-out.output.got", if_skipped: null}
      old_plan: "$fix-in.output.plan"
      items: "$fix.output.replan_items"
      conflicts: "$fix.output.conflicts"
      before_fix: "$fix-in.output.answer"
      record: "$start.output.record"
      ports: "$start.output.ports"
    output_format:
      type: object
      additionalProperties: false
      required: [open, go, stop_reason, text, widened, asked, pushed]
      properties:
        open: {type: boolean}
        go: {type: boolean}
        stop_reason: {type: string}
        text: {type: string}
        widened: {type: array, items: {type: string}}
        asked: {type: array, items: {type: string}}
        pushed: *pushed
  - id: gate-replan
    wait:
      attention: "$ask-replan.output.text"
      form: select
      options: [{id: approve}, {id: continue}, {id: stop}, {id: reject}]
    depends_on: [ask-replan]
    when: "$ask-replan.output.open == true"
  - id: answer-replan
    script: replan_answer
    runtime: uv
    mutates_checkout: false
    depends_on: [ask-replan, gate-replan]
    trigger_rule: none_failed_min_one_success
    with:
      gate: {from: "$gate-replan.output", if_skipped: null}
      go: "$ask-replan.output.go"
      stop_reason: "$ask-replan.output.stop_reason"
      place: "gate-replan"
      before_fix: "$fix-in.output.answer"
      asked: "$ask-replan.output.asked"
      pushed: "$ask-replan.output.pushed"
      replan: "$replan-out.output.got"
      review: {from: "$replan-review-out.output.got", if_skipped: null}
      items: "$fix.output.replan_items"
      first_ripple: "$fix-in.output.ripple"
      units_tier: "$fix-in.output.units_tier"
    output_format:
      type: object
      additionalProperties: false
      required: [go, answer, stop_reason, fix_answers, fix_notes, fix_ripple, plan_review, units_tier, skip_rerun]
      properties:
        go: {type: boolean}
        answer: *answer
        stop_reason: {type: string}
        fix_answers: *answer
        fix_notes: {type: string}
        fix_ripple: {<<: *pointer_or_null, description: 'json(shared:ripple.schema.json): 2 度目の修正に渡す波及の一覧（作り直した物か 1 回目の物）'}
        plan_review: {<<: *pointer_or_null, description: 'json(shared:plan-review-reply.schema.json): 案の直しの事前審査の返答'}
        units_tier: {type: array, items: *unit_tier}
        skip_rerun: {type: array, items: {type: string}}
  - id: refix-run
    include: works-factory-fix
    depends_on: [answer-replan]
    when: "$answer-replan.output.go == true"
    with:
      mode: "whole"
      routes: "$start.output.ports.routes"
      judgment: "$fix-in.output.judgment"
      answer_ties: "$fix-in.output.answer_ties"
      materials: "$fix-in.output.materials"
      plan: "$replan.output.plan"
      fix_plan: "$replan.output.fix_plan"
      ripple: "$answer-replan.output.fix_ripple"
      plan_review: "$answer-replan.output.plan_review"
      answers: "$answer-replan.output.fix_answers"
      notes: "$answer-replan.output.fix_notes"
      only_items: "$fix.output.replan_items"
      prior: "$fix.output.carry"
      request_answers: "$request-in.output.request_answers"
      unattended: "$start.output.ports.unattended"
      parallel: "$start.output.ports.parallel"
      test_cmd: "$start.output.ports.test_cmd"
      reuse_dir: "$start.output.ports.reuse_dir"
      reuse_key: "$start.output.ports.run_id"
      user_env_dir: "$start.output.ports.user_env_dir"
      lang: "$start.output.ports.lang"
      policy: "$fix-in.output.policy"
      request: "$request-in.output.request_file"
      baseline: "$fix-in.output.baseline"
      tdd_suite: "$fix-in.output.suite"
      suite_made: "$fix-in.output.suite_made"
      skip_rerun: "$answer-replan.output.skip_rerun"
      excluded: "$fix-in.output.excluded"
  - id: refix-run-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-fix): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [refix-run]
    with:
      got: "$refix-run.output"
      names: "ok reason units groups conflicts carry replan_items objection diff start_tree reply ruled_reply scope checked allowed_test_changes
        changed x_scalars handoffs handoff_titles mismatched plan_declared stop_reason allowed_tests accept_trace closure tdd_unit tdd frozen removed
        tdd_refused item_claims freeze_off removed_tests untested report"
  # 16 2 度目の段の差分の審査（2 度目の修正が走った時だけ）。形と when: の決めは 14 と同じで、値は 2 度目の fix から。上げ直しはしない
  - id: lens-2
    include: works-factory-lens
    depends_on: [refix-run, raise]
    when: "$raise.output.checks == true && $refix-run.output.ok == true && $refix-run.output.checked.ok == true && $refix-run.output.stop_reason == ''"
    with:
      base: "$refix-run.output.start_tree"
      lang: "$start.output.ports.lang"
  - id: lens-2-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-lens): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [lens-2]
    with:
      got: "$lens-2.output"
      names: "ok status reason rows ran failed not_routed carry report"
  - id: lens-2-in
    <<: *relay
    depends_on: [refix-run, lens-2-out]
    trigger_rule: none_failed_min_one_success
    with:
      got: {from: "$lens-2-out.output.got", if_skipped: null}
      field: "rows"
    output_format:
      type: object
      additionalProperties: false
      required: [rows, stop_reason]
      properties:
        rows: {<<: *pointer_or_null, description: 'json(shared:lens-rows.schema.json): レンズの控え。レンズが走らなければ null'}
        stop_reason: {type: string}
  - id: delta-review-2
    include: works-factory-delta-review
    depends_on: [lens-2-in, raise]
    when: "$raise.output.checks == true && $refix-run.output.ok == true && $refix-run.output.checked.ok == true && $refix-run.output.stop_reason == ''"
    with:
      base: "$refix-run.output.start_tree"
      plan: "$refix-run.output.scope"
      lens_rows: "$lens-2-in.output.rows"
      fix_reply: "$refix-run.output.reply"
      permits: "$refix-run.output.allowed_tests"
      plan_review: "$answer-replan.output.plan_review"
      policy: "$fix-in.output.policy"
      request: "$request-in.output.request"
      lang: "$start.output.ports.lang"
  - id: delta-review-2-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-delta-review): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [delta-review-2]
    with:
      got: "$delta-review-2.output"
      names: "ok status reason rounds pass holes diff carry report"
  # 17 2 つの修正の段と、段ごとの差分の審査を合わせる（docs/design/line.md の 4.3）
  - id: fixed
    script: fixed
    runtime: uv
    mutates_checkout: false
    depends_on: [fix-in, after-fix, raise, fix-out, lens-out, delta-review-out, replan-out, refix-run-out, lens-2-out, delta-review-2-out]
    trigger_rule: none_failed_min_one_success
    with:
      from_spec: "$start.output.from_spec"
      fix_in: "$fix-in.output"
      fix: {from: "$fix-out.output.got", if_skipped: null}
      after_fix: {from: "$after-fix.output", if_skipped: null}
      raise: {from: "$raise.output", if_skipped: null}
      lens: {from: "$lens-out.output.got", if_skipped: null}
      delta: {from: "$delta-review-out.output.got", if_skipped: null}
      replan: {from: "$replan-out.output.got", if_skipped: null}
      refix: {from: "$refix-run-out.output.got", if_skipped: null}
      lens_2: {from: "$lens-2-out.output.got", if_skipped: null}
      delta_2: {from: "$delta-review-2-out.output.got", if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [go, done, held, no_fix, diffed, checks, eyes_due, skip_why, rejudge, refixed, stages, carry, tdd, units, groups, conflicts,
                 replan_items, objection, diff, item_claims, allowed_test_changes, changed, x_scalars, handoffs, handoff_titles, mismatched, plan_declared,
                 plan, ripple, left, stop_reason]
      properties:
        go: {type: boolean}
        done: {type: boolean}
        held: {type: boolean}
        no_fix: {type: boolean}
        diffed: {type: boolean}
        checks: {type: boolean}
        eyes_due: {type: boolean}
        skip_why: {type: string}
        rejudge: {type: boolean}
        refixed: {type: boolean}
        stages: {type: array, items: {type: object, properties: {stage: {type: integer}, fix: {type: [object, 'null'], description: 'json(returns:works-factory-fix): 段の修正の出力（受け皿の got）'}, lens: {type: [object, 'null'], description: 'json(returns:works-factory-lens): 段の観点の出力（受け皿の got）'}, delta: {type: [object, 'null'], description: 'json(returns:works-factory-delta-review): 段の差分の審査の出力（受け皿の got）'}}}}
        carry: {type: array, items: &where_text {type: object, required: [where, text], properties: {where: {type: string}, text: {type: string}}}}
        tdd: {type: array, description: 'json(shared:tdd.schema.json): 修正の段ごとの TDD の記録'}
        units: {type: array, description: 'json(shared:fixes.schema.json): 修正の単位ごとの結末', items: {type: object, properties: {unit_id: {type: string}, group_id: {type: string}, status: {type: string}, reason: {type: string}}}}
        groups: {type: array, items: {type: object, properties: {group_id: {type: string}, unit_ids: {type: array, items: {type: string}}, returned: {type: boolean}, reason: {type: string}}}}
        conflicts: {type: array, items: {<<: *pointer_or_null, description: 'json(lib:conflicts.schema.json): 最後の修正の段の申し出と裁定の控え'}}
        replan_items: {type: array, items: {type: string}}
        objection: {type: string}
        diff: {<<: *pointer_or_null, description: 'file: 最後の段の差分（差分の審査が直した差分が在ればそれ）'}
        item_claims: {type: [object, 'null'], properties: {items: {type: [array, 'null'], items: {type: object, properties: {item: {type: integer}, unit_keys: {type: array, items: {type: string}}, approach: {type: string}, after: {type: array, items: {type: integer}}}}}, claims: {type: array, items: {type: object, properties: {unit_key: {type: string}, files: {type: array, items: {type: string}}}}}, unread: {type: array, items: {type: string}}}}
        allowed_test_changes: {type: array, items: {type: string}}
        changed: {type: [object, 'null'], description: 'json(shared:fix-marks.schema.json): 最後の修正の段の修正の印'}
        x_scalars: {type: object, description: 'json(shared:scalars.schema.json): 修正役が足した規模の数値の欄'}
        handoffs: {type: array, items: {type: string}}
        handoff_titles: {type: object, patternProperties: {'^.+$': {type: string}}}
        mismatched: {type: array, items: {type: string}}
        plan_declared: {type: array, description: 'json(shared:declared.schema.json): 直さずに残すと答えた事前審査の block の行', items: {type: string}}
        plan: {<<: *pointer_or_null, description: 'json(shared:plan-fields.schema.json): 修正が使った修正案の欄の控え（案の直しの後はその物）'}
        ripple: {<<: *pointer_or_null, description: 'json(shared:ripple.schema.json): 修正が使った波及の一覧'}
        left: {type: array, items: {type: object, properties: {where: {type: string}, text: {type: string}}}}
        stop_reason: {type: string}
  # 18 修正の後の読むだけの 3 つ（互いを待たない。作業ツリーを変える手直しの後に置く）。parallel-pr-after は飛びうる request-in より前に fixed を読む
  - id: parallel-pr-after
    include: works-factory-parallel-pr
    depends_on: [fixed]
    when: "$fixed.output.diffed == true && $request-in.output.entry != ''"
    with:
      request: "$request-in.output.request"
      base: "$start.output.ports.base_rev"
      changed: "[]"
      lang: "$start.output.ports.lang"
  - id: parallel-pr-after-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-parallel-pr): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [parallel-pr-after]
    with:
      got: "$parallel-pr-after.output"
      names: "ok status stop_reason reason material excluded drafts reads downgrades report"
  - id: rejudge-run
    include: works-factory-diagnose
    depends_on: [fixed]
    when: "$fixed.output.rejudge == true"
    with:
      request: "$request-in.output.request"
      objection: "$fixed.output.objection"
      prior: "$fix-in.output.judgment"
      prior_brief: "$fix-in.output.brief"
      prior_inputs: "$fix-in.output.inputs"
      world_rows: "$fix-in.output.world"
      purpose: "$fix-in.output.purpose"
      policy: "$fix-in.output.policy"
      spec: "$fix-in.output.spec"
      verify: "$fix-in.output.verify"
      excluded: "$fix-in.output.excluded"
      lang: "$start.output.ports.lang"
  - id: rejudge-run-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-diagnose): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [rejudge-run]
    with:
      got: "$rejudge-run.output"
      names: "ok status mode stop_reason reason ready judgment units questions inputs brief materials out_of_purpose answer_ties rejudge_verdict
        rejudge_exit rejudge_diff downgrades report"
  - id: spec-check-run
    include: works-factory-spec
    depends_on: [fixed]
    when: "$start.output.ports.spec == true"
    with:
      mode: "check"
      spec: "$fix-in.output.spec"
      user_env_dir: "$start.output.ports.user_env_dir"
      lang: "$start.output.ports.lang"
  - id: spec-check-run-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-spec): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [spec-check-run]
    with:
      got: "$spec-check-run.output"
      names: "ok status stop_reason reason spec added_rows added_origin questions unchecked report"
  # 19 判定（再審が走れば再審）を後ろへ渡す（docs/design/line.md の 4.4）。再審の返す node が落ちても落ちないように受け皿を読む
  - id: judged
    script: judged
    runtime: uv
    mutates_checkout: false
    depends_on: [fixed, rejudge-run-out]
    trigger_rule: none_failed_min_one_success
    with:
      fix_in: "$fix-in.output"
      rejudge_due: "$fixed.output.rejudge"
      objection: "$fixed.output.objection"
      fixed_units: "$fixed.output.units"
      rejudge: {from: "$rejudge-run-out.output.got", if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [units, judgment, answer_ties, materials, out_of_purpose, rejudged, rejudge_verdict, rejudge_exit, rejudge_diff, new_open_units,
                 lowered, unnamed_changed, unread, lines, carry, stop_reason]
      properties:
        units: {type: array, description: 'json(shared:units.schema.json): 判定（再審が走れば再審）の単位の目録'}
        judgment: {<<: *pointer_or_null, description: 'json(shared:judgment.schema.json): 判定（再審が走れば再審の物）'}
        answer_ties: {<<: *pointer_or_null, description: 'json(shared:answer-ties.schema.json): 依頼の答えの結び'}
        materials: {<<: *pointer_or_null, description: 'json(shared:materials-state.schema.json): 判定の素材の状態'}
        out_of_purpose: {<<: *pointer_or_null, description: 'json(lib:out-of-purpose.schema.json): 目的の外の行の控え'}
        rejudged: {type: boolean}
        rejudge_verdict: {type: [string, 'null']}
        rejudge_exit: {<<: *pointer_or_null, description: 'json(shared:rejudge-exit.schema.json): 再審の出口'}
        rejudge_diff: {<<: *pointer_or_null, description: 'file: 再審が読んだ差分'}
        new_open_units: {type: array, items: {type: string}}
        lowered: {type: array, items: {type: string}}
        unnamed_changed: {type: array, items: {type: string}}
        unread: {type: string}
        lines: {type: array, items: {type: string}}
        carry: {type: array, items: *where_text}
        stop_reason: {type: string}
  # 20 試験の関門（final）。上げ直しの止めは fixed.go が偽にして運ぶ
  - id: test-gate-final
    include: works-factory-test-gate
    depends_on: [judged, parallel-pr-after-out, spec-check-run-out]
    trigger_rule: none_failed_min_one_success
    when: "$fixed.output.go == true && $judged.output.stop_reason == ''"
    with:
      mode: "final"
      test_cmd: "$start.output.ports.test_cmd"
      tdd_suite: "$fix-in.output.suite"
      base: "$start.output.ports.base_rev"
      entry_base: "$start.output.ports.base"
      request: "$request-in.output.request"
      request_scope: "$request-in.output.request_scope"
      baseline: "$fix-in.output.baseline"
      reuse_dir: "$start.output.ports.reuse_dir"
      reuse_key: "$start.output.ports.run_id"
      user_env_dir: "$start.output.ports.user_env_dir"
      lang: "$start.output.ports.lang"
  - id: test-gate-final-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-test-gate): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [test-gate-final]
    with:
      got: "$test-gate-final.output"
      names: "mode ok green red_cause ran_steps baseline fingerprint test_outcomes evidence by suites_line log baseline_line reason suite suite_note related report"
  # 21 独立の目のまとめ（docs/design/judge-eyes.md の 2 節）。回すか・まとめるかは eyes-in が組む（docs/design/line.md の 5.4）
  - id: eyes-in
    script: eyes_in
    runtime: uv
    mutates_checkout: false
    depends_on: [test-gate-final-out]
    with:
      fix_in: "$fix-in.output"
      fixed: "$fixed.output"
      start_answer: {from: "$answer-start.output.answer", if_skipped: null}
      replan_review: {from: "$replan-review-out.output.got", if_skipped: null}
      judged: "$judged.output"
      ports: "$start.output.ports"
      request: "$request-in.output"
    output_format:
      type: object
      additionalProperties: false
      required: [merge, policy, review, pushes, answers, asked, notes]
      properties:
        merge: {type: boolean}
        policy: {type: string, description: 'file: 方針の文書の写しのパス（無ければ空の字）'}
        review: {type: object, description: 'json(shared:plan-verdict.schema.json): 修正が使った修正案の事前審査の最後の往復の結論'}
        pushes: {type: array, description: 'json(shared:pushes.schema.json): 無人の run が採った推しの文', items: {type: string}}
        answers: {type: object, description: 'json(shared:gate-answers.schema.json): 承認ノードの人の答え {start, before_fix}', properties: {start: *answer, before_fix: *answer}}
        asked: {type: array, description: 'json(shared:asked.schema.json): 修正前の承認ノードで聞いた項目', items: {type: object, properties: {kind: {type: string}, text: {type: string}}}}
        notes: {type: array, items: {type: string}}
  - id: eyes
    include: works-factory-eyes
    depends_on: [eyes-in]
    with:
      run: "$fixed.output.eyes_due"
      merge: "$eyes-in.output.merge"
      skip_why: "$fixed.output.skip_why"
      base: "$start.output.ports.base"
      head: "$start.output.ports.base_rev"
      base_label: "$start.output.ports.base_label"
      units: "$judged.output.units"
      judgment: "$judged.output.judgment"
      purpose: "$fix-in.output.purpose_text"
      plan: "$fixed.output.plan"
      ripple: "$fixed.output.ripple"
      fixes: "$fixed.output.units"
      x_scalars: "$fixed.output.x_scalars"
      changed: "$fixed.output.changed"
      declared: "$fixed.output.plan_declared"
      tdd: "$fixed.output.tdd"
      design: "$fix-in.output.design"
      design_reason: "$fix-in.output.design_reason"
      design_premises: "$fix-in.output.design_premises"
      constraints: "$fix-in.output.constraints"
      world_rows: "$fix-in.output.world"
      green: "$test-gate-final.output.ok"
      checks: "$test-gate-final.output.evidence"
      test_outcomes: "$test-gate-final.output.test_outcomes"
      policy: "$eyes-in.output.policy"
      review: "$eyes-in.output.review"
      pushes: "$eyes-in.output.pushes"
      answers: "$eyes-in.output.answers"
      asked: "$eyes-in.output.asked"
      request: "$request-in.output.request_file"
      decisions: "$fix-in.output.decisions"
      intent: "[]"
      lang: "$start.output.ports.lang"
  - id: eyes-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-eyes): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [eyes]
    with:
      got: "$eyes.output"
      names: "ok r1 r2 r3 r4 questions passes premise_check notes after dirty escalate after_ok report sections"
  # 22 封じる（直す物が無い周は飛ぶ）。depends_on は eyes でなく受け皿の eyes-out（eyes の返す node が落ちても封じの node を待たせ
  # 続けない）。with: の eyes_ok・fingerprint・green_ok は eyes と test-gate-final の返りの欄を直に読む（main の線と同じ式）
  - id: merge-seal
    include: works-factory-merge
    depends_on: [eyes-out]
    when: "$fixed.output.no_fix == false"
    with:
      mode: "seal"
      base: "$start.output.ports.base_rev"
      fingerprint: "$test-gate-final.output.fingerprint"
      green_ok: "$test-gate-final.output.ok"
      eyes_ok: "$eyes.output.ok"
  - id: merge-seal-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-merge): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [merge-seal]
    with:
      got: "$merge-seal.output"
      names: "mode ok hash diff protected_hits protected_count reason deliver report"
  # 23 最後の承認ノード（docs/design/line.md の 2 節の 4）。受け皿の got だけを読み、置く段に渡す値も返す（受け皿の got の中の欄は with: で読めない）
  - id: ask-final
    script: ask_final
    runtime: uv
    mutates_checkout: false
    depends_on: [eyes-out, merge-seal-out]
    trigger_rule: none_failed_min_one_success
    with:
      fix_in: "$fix-in.output"
      fixed: "$fixed.output"
      judged: "$judged.output"
      tests: {from: "$test-gate-final-out.output.got", if_skipped: null}
      eyes: {from: "$eyes-out.output.got", if_skipped: null}
      seal: {from: "$merge-seal-out.output.got", if_skipped: null}
      spec_check: {from: "$spec-check-run-out.output.got", if_skipped: null}
      parallel_after: {from: "$parallel-pr-after-out.output.got", if_skipped: null}
      replan_review: {from: "$replan-review-out.output.got", if_skipped: null}
      replan_answer: {from: "$answer-replan.output.answer", if_skipped: null}
      widened: {from: "$ask-replan.output.widened", if_skipped: null}
      start_answer: {from: "$answer-start.output.answer", if_skipped: null}
      record: "$start.output.record"
      final_gate: "$start.output.final_gate"
      ports: "$start.output.ports"
      request: "$request-in.output"
    output_format:
      type: object
      additionalProperties: false
      required: [open, go, stop_reason, text, reasons, sealed_hash, fingerprint, green_ok, eyes_ok, r2]
      properties:
        open: {type: boolean}
        go: {type: boolean}
        stop_reason: {type: string}
        text: {type: string}
        reasons: {type: array, items: {type: string}}
        sealed_hash: {type: string}
        fingerprint: {type: [object, 'null'], properties: {head: {type: string}, diff_hash: {type: string}}}
        green_ok: {type: boolean}
        eyes_ok: {type: boolean}
        r2: {type: [object, 'null'], properties: {status: {type: string}, reason: {type: string}}}
  - id: gate-final
    wait:
      attention: "$ask-final.output.text"
      form: select
      options: [{id: approve}, {id: continue}, {id: stop}, {id: reject}]
    depends_on: [ask-final]
    when: "$ask-final.output.open == true"
  - id: answer-final
    <<: *gate_answer
    depends_on: [ask-final, gate-final]
    trigger_rule: none_failed_min_one_success
    with:
      gate: {from: "$gate-final.output", if_skipped: null}
      go: "$ask-final.output.go"
      stop_reason: "$ask-final.output.stop_reason"
      place: "gate-final"
      final: "true"
  # 24 外へ 1 度だけ書く（既定は差分を run の置き場に置くだけ。出口の語 pr の時だけ run の枝に積んで PR を作る。E17）
  - id: merge-apply
    include: works-factory-merge
    depends_on: [answer-final]
    when: "$answer-final.output.go == true && $fixed.output.no_fix == false"
    with:
      mode: "apply"
      base: "$start.output.ports.base_rev"
      fingerprint: "$ask-final.output.fingerprint"
      green_ok: "$ask-final.output.green_ok"
      eyes_ok: "$ask-final.output.eyes_ok"
      sealed_hash: "$ask-final.output.sealed_hash"
      answer: "$answer-final.output.answer"
      r2: "$ask-final.output.r2"
      deliver: "$start.output.ports.deliver"
      request: "$request-in.output.request_file"
      user_env_dir: "$start.output.ports.user_env_dir"
      items: "$fixed.output.item_claims"
  - id: merge-apply-out
    <<: *receiver
    output_format: {<<: *received, properties: {got: {type: [object, 'null'], description: 'json(returns:works-factory-merge): 出力の names の欄。飛ばされた block は null'}, why: {type: string}}}
    depends_on: [merge-apply]
    with:
      got: "$merge-apply.output"
      names: "mode ok hash diff protected_hits protected_count reason deliver report"
  # 25 報告へ渡す 2 つの形（sections・facts）を組む（docs/design/line.md の 7 節）。前の段が落ちても飛ばされても走る。resume でも
  # 回し直す（always_run。report は include で、Archon は include の always_run を捨てるので、collect の返りが変われば report が回し直る）
  - id: collect
    script: collect
    runtime: uv
    mutates_checkout: false
    depends_on: [testcmd, start, answer-start, test-gate-base-out, judge-out, tiers, owed, structure-out, structure-in, independent-design-out,
                 design-in, plan-rounds-out, ask-before-fix, answer-before-fix, fix-in, fix-out, after-fix, raise, lens-out, lens-in,
                 delta-review-out, replan-out, replan-review-out, ask-replan, answer-replan, refix-run-out, lens-2-out, lens-2-in,
                 delta-review-2-out, fixed, parallel-pr-after-out, rejudge-run-out, spec-check-run-out, judged, test-gate-final-out, eyes-in,
                 eyes-out, merge-seal-out, ask-final, answer-final, merge-apply-out, spec-entry-out, spec-diagnose-out, spec-plan-out,
                 spec-check-out, spec-rounds, spec-ask-before-fix, spec-answer-before-fix, theme-world-out, theme-world-in, theme-blind-out, theme-design-in,
                 theme-rounds-out, theme-descend, request-in, theme-return]
    trigger_rule: all_done
    always_run: true
    with:
      notices: {from: "$testcmd.output.reason", if_skipped: null}
      start: {from: "$start.output", if_skipped: null}
      answer_start: {from: "$answer-start.output", if_skipped: null}
      test_gate_base: {from: "$test-gate-base-out.output.got", if_skipped: null}
      judge: {from: "$judge-out.output.got", if_skipped: null}
      tiers: {from: "$tiers.output", if_skipped: null}
      owed: {from: "$owed.output", if_skipped: null}
      structure: {from: "$structure-out.output.got", if_skipped: null}
      structure_in: {from: "$structure-in.output", if_skipped: null}
      independent_design: {from: "$independent-design-out.output.got", if_skipped: null}
      design_in: {from: "$design-in.output", if_skipped: null}
      rounds: {from: "$plan-rounds-out.output.got", if_skipped: null}
      ask_before_fix: {from: "$ask-before-fix.output", if_skipped: null}
      answer_before_fix: {from: "$answer-before-fix.output", if_skipped: null}
      fix_in: {from: "$fix-in.output", if_skipped: null}
      fix: {from: "$fix-out.output.got", if_skipped: null}
      after_fix: {from: "$after-fix.output", if_skipped: null}
      raise: {from: "$raise.output", if_skipped: null}
      lens: {from: "$lens-out.output.got", if_skipped: null}
      lens_in: {from: "$lens-in.output", if_skipped: null}
      delta: {from: "$delta-review-out.output.got", if_skipped: null}
      replan: {from: "$replan-out.output.got", if_skipped: null}
      replan_review: {from: "$replan-review-out.output.got", if_skipped: null}
      ask_replan: {from: "$ask-replan.output", if_skipped: null}
      answer_replan: {from: "$answer-replan.output", if_skipped: null}
      refix: {from: "$refix-run-out.output.got", if_skipped: null}
      lens_2: {from: "$lens-2-out.output.got", if_skipped: null}
      lens_2_in: {from: "$lens-2-in.output", if_skipped: null}
      delta_2: {from: "$delta-review-2-out.output.got", if_skipped: null}
      fixed: {from: "$fixed.output", if_skipped: null}
      parallel_after: {from: "$parallel-pr-after-out.output.got", if_skipped: null}
      rejudge: {from: "$rejudge-run-out.output.got", if_skipped: null}
      spec_check: {from: "$spec-check-run-out.output.got", if_skipped: null}
      judged: {from: "$judged.output", if_skipped: null}
      test_gate_final: {from: "$test-gate-final-out.output.got", if_skipped: null}
      eyes_in: {from: "$eyes-in.output", if_skipped: null}
      eyes: {from: "$eyes-out.output.got", if_skipped: null}
      merge_seal: {from: "$merge-seal-out.output.got", if_skipped: null}
      ask_final: {from: "$ask-final.output", if_skipped: null}
      answer_final: {from: "$answer-final.output", if_skipped: null}
      merge_apply: {from: "$merge-apply-out.output.got", if_skipped: null}
      # 仕様駆動の run だけ（ほかの run は null。docs/design/spec-driven.md の 6.2 の変える node の 7）
      spec_entry: {from: "$spec-entry-out.output.got", if_skipped: null}
      spec_diagnose: {from: "$spec-diagnose-out.output.got", if_skipped: null}
      spec_driven_check: {from: "$spec-check-out.output.got", if_skipped: null}
      spec_rounds: {from: "$spec-rounds.output", if_skipped: null}
      spec_ask_before_fix: {from: "$spec-ask-before-fix.output", if_skipped: null}
      spec_answer_before_fix: {from: "$spec-answer-before-fix.output", if_skipped: null}
      # テーマの run だけ（ほかの run は request-in のほか null。docs/design/line.md の 3.3 節）
      theme_world_in: {from: "$theme-world-in.output", if_skipped: null}
      theme_blind: {from: "$theme-blind-out.output.got", if_skipped: null}
      theme_design_in: {from: "$theme-design-in.output", if_skipped: null}
      theme_rounds: {from: "$theme-rounds-out.output.got", if_skipped: null}
      theme_descend: {from: "$theme-descend.output", if_skipped: null}
      request_in: {from: "$request-in.output", if_skipped: null}
      theme_return: {from: "$theme-return.output", if_skipped: null}
      # 受け止める段の宣言: include 丸ごと受け止める段だけをここに書く（docs/design/line.md の 7.2 の optional）。block の中の node は
      # 各 block が返りの欄 optional で宣言し、collect が include の頭を付けて合わせる
      optional: '["eyes__", "lens__", "lens-2__"]'
    output_format:
      type: object
      additionalProperties: false
      required: [sections, facts]
      properties:
        sections:
          <<: *pointer_or_null
          type: object
          description: 'json(shared:sections.schema.json): 報告のセクションの並び（report-in/sections.json）'
        facts:
          <<: *pointer_or_null
          type: object
          description: 'json(shared:facts.schema.json): 結末と冒頭 3 行を決める事実（report-in/facts.json）'
  # 26 報告（どの道でも走る）
  - id: report
    include: works-factory-report
    depends_on: [collect]
    trigger_rule: all_done
    with:
      sections: "$collect.output.sections"
      facts: "$collect.output.facts"
      lang: "$INPUTS.lang"
  # 27 後始末。fix の組の子の run が残した作業ツリーと枝を消す。消すのはこの run の子で status が completed の物で、子を起こした node と
  # 同じ include の中の node が全部 completed になった物だけ（再開がそれを走らせ直しうる間は残す）。落ちない（返りの error に畳む）
  - id: sweep-children
    script: sweep_children
    runtime: uv
    mutates_checkout: false
    depends_on: [report]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [cleaned, left, error]
      properties:
        cleaned: {type: array, items: &swept {type: object, properties: {branch: {type: string}, run_id: {type: string}, node: {type: string}, reason: {type: string}}}}
        left: {type: array, items: *swept}
        error: {type: string}
  # 28 line の返す node（docs/design/line.md の 1.2 の出力。欄の名は今のまま）
  - id: result
    script: result
    runtime: uv
    mutates_checkout: false
    depends_on: [collect, report, sweep-children]
    trigger_rule: all_done
    always_run: true
    with:
      report: {from: "$report.output", if_skipped: null}
      merge_apply: {from: "$merge-apply-out.output.got", if_skipped: null}
      merge_seal: {from: "$merge-seal-out.output.got", if_skipped: null}
      eyes: {from: "$eyes-out.output.got", if_skipped: null}
      answer_final: {from: "$answer-final.output.answer", if_skipped: null}
      spec_check: {from: "$spec-check-run-out.output.got", if_skipped: null}
      children: {from: "$sweep-children.output", if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [fixed, ok, outcome, stop_reason, report, report_ai, report_detail, report_lines, next_request, prior_failures, apply,
                 sealed, r2_status, final_answer, spec_questions, children]
      properties:
        fixed: {type: boolean}
        ok: {type: boolean}
        outcome: {type: string}
        stop_reason: {type: string}
        report: {<<: *pointer_or_null, description: 'file: 機械の報告（md）。報告が書けなければ null'}
        report_ai: {<<: *pointer_or_null, description: 'file: 人に向けた報告（md）'}
        report_detail: {<<: *pointer_or_null, description: 'file: 人に向けた報告の詳しい中身（md）'}
        report_lines: {type: array, items: {type: string}}
        next_request: {<<: *pointer_or_null, description: 'json(lib:next-request.schema.json): 次の run の依頼の下書き'}
        prior_failures: {<<: *pointer_or_null, description: 'json(lib:prior-failures.schema.json): この run で最後まで通らなかった物の行'}
        apply: {type: [object, 'null'], properties: {ok: {type: [boolean, 'null']}, hash: {type: [string, 'null']}, diff: {<<: *pointer_or_null, description: 'file: 封じた差分'}, reason: {type: [string, 'null']}}}
        sealed: {type: [object, 'null'], properties: {ok: {type: [boolean, 'null']}, hash: {type: [string, 'null']}, diff: {<<: *pointer_or_null, description: 'file: 封じた差分'}}}
        r2_status: {type: [string, 'null']}
        final_answer: *answer
        spec_questions: {type: integer}
        children: {type: [object, 'null'], properties: {cleaned: {type: array, items: *swept}, left: {type: array, items: *swept}, error: {type: string}}}

# 初見の読み手の指摘が貼っていない印（M99）を指す道: 機械が組んだ頭の行の印の集合に無い指摘は本文の指摘として扱う（fail-closed）ので、
# 受け付けは書き手に出し直させる（kind cold の拒否を控えに積む）。run は止まらず、出口が機械の報告を指して返る（人に向けた報告はまだ無い）
fixture:
  expect: completed
  reached: [facts, write-prep, write, cold-prep, cold, write-accept, finish]
  inputs:
    sections: '[{"title": "直した所", "lines": ["単位 u1: 直した"]}]'
    facts: '{"start_ok": true, "proved": true}'
  resolved-text-contains:
    cold: 'You have no context: you are given none of the history, the record, or the diff.'
exec-code: true
write:
  text: 平均の関数を直した。単位 u1 は直って、最後のテストまで通った。
  terms: []
  handoff: {read: [], kept: [], set_aside: [], open: []}
cold:
  verdict: redesign-needed
  stops:
    - {line: M99, text: 何の話か分からない}
  guessed: []
  decidable: false

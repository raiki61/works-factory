# 止め札で止めた run（最後の関所の止める語で、文が request: で始まる）。ほかの入力は空。facts と report の script が本当に走り、
# 結末は stopped_by_request（持ち主の決め report-on-stop: 止めた run も報告を出す）。書き手のループの節 write（include の fan_out）は
# dry-run が模擬できずに落とすので、返す節は機械の報告を返す
fixture:
  expect: failed
  fail-node: write
  reached: [facts, report]
  inputs:
    gate-final: '{"decision":"stop","text":"request: 止め札"}'
exec-code: true

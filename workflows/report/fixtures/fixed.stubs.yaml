# 結果を名乗れる run（ai_go: true）は書き手のループの節 write（include の fan_out）に届く。dry-run は届く fan_out を模擬できずに落とし
# （止めた Archon の dry-run.ts）、中継 write-out が飛ばされ、返す節は書き手の答え無しで返る。ループの中の通しは report-write の筋書きが、
# ループが落ちても run が落ちないことは tests/workflows/test_report.py の本物の run が持つ
fixture:
  expect: failed
  fail-node: write
  reached: [facts, report]
facts:
  outcome: fixed
  ok: true
  stop_reason: ""
  report: {type: archon_artifact, run_id: fixture-run, path: report/report.md}
  next_request: null
  prior_failures: null
  ai_go: true
  facts_file: report/report.md
  stamp: "works-factory-report / run fixture-run / 周 1 / グラフの版 000000000000"
  lang_line: ""
report:
  outcome: fixed
  stop_reason: ""
  report: {type: archon_artifact, run_id: fixture-run, path: report/report.md}
  report_ai: null
  next_request: null
  prior_failures: null
  ok: true

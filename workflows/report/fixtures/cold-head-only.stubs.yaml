# 初見の読み手の指摘が機械が組んだ頭の行の印（M1）だけの道: 台本は redesign-needed を返すが、指摘がすべて貼った機械の行の印を指すので、
# 受け付けは書き手に書き直させず（輪は 1 周で終わる）1 回目で受け取って印を残す。結末は fixed で、人に向けた報告が書かれる
fixture:
  expect: completed
  reached: [facts, write-prep, write, cold-prep, cold, write-accept, finish]
  inputs:
    sections: '[{"title": "直した所", "lines": ["単位 u1: 直した"]}]'
    facts: '{"start_ok": true, "proved": true}'
  resolved-text-contains:
    cold: 'M1 | # 報告'
exec-code: true
write:
  text: 平均の関数を直した。単位 u1 は直って、最後のテストまで通った。
  terms: []
  handoff: {read: [], kept: [], set_aside: [], open: []}
cold:
  verdict: redesign-needed
  stops:
    - {line: M1, text: 題の run が何の run か分からない}
  guessed: []
  decidable: false

name: works-factory-report
description: |
  報告のサブグラフ。メイングラフの最後で、前の段が落ちても飛ばされても走る。結末の 10 語と止めの語を決め、機械の報告・次の run の依頼の
  下書き・前の失敗の行を run の置き場の report/ に書く（facts）。報告の冒頭 3 行（起きたこと・差分を当ててよいか・人が決めることの
  1 件 1 行）は facts が組む。結果を名乗れる run では、書き手が平易な要約・人が決めること・本文を書き、道具を持たない初見の読み手が
  頭だけを読んで確かめる（write。書き手のループは works-factory-report-write で、fan_out の join: all_done で回すので、ループが落ちても run は
  落ちない。3 回目は通らなくても受け取って印を付け、人に向けた報告の冒頭で言う）。
  出力ノード report は落ちない: 人に向けた報告（report-ai.md。詳しい中身は隣の report-detail.md）が無くても機械の報告を返す。書き手の
  ループが落ちた時は、機械の報告の冒頭の後ろに AI の本文が無い訳（落ちた誤りの文の 1 行目）を足して返す。型つきの成果物の一覧（tdd-unit・green-cert・eye-verdict）は
  with: でなく facts が $TYPED_ARTIFACTS_FILE から読む（workflows/AGENTS.md の E5）。

inputs:
  start: {default: ""}
  test-gate-base: {default: ""}
  judge: {default: ""}
  rejudge: {default: ""}
  plan: {default: ""}
  plan-review: {default: ""}
  replan: {default: ""}
  replan-review: {default: ""}
  fix: {default: ""}
  test-gate-final: {default: ""}
  eyes: {default: ""}
  merge-seal: {default: ""}
  merge-apply: {default: ""}
  gate-start: {default: ""}
  gate-before-fix: {default: ""}
  gate-replan: {default: ""}
  gate-final: {default: ""}
  stops: {default: ""}
  prior-failures: {default: ""}
  deferred: {default: ""}
  widened: {default: ""}
  final-reasons: {default: ""}
  spec-changed: {default: ""}
  spec-unchecked: {default: ""}
  redepth: {default: ""}
  optional: {default: ""}
  notices: {default: ""}

returns: report
outcome_field: ok

nodes:
  - id: facts
    script: facts
    runtime: uv
    timeout: 1728000000
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [outcome, ok, stop_reason, report, next_request, prior_failures, ai_go, facts_file, stamp, lang_line]
      properties:
        outcome: {type: string}
        ok: {type: boolean}
        stop_reason: {type: string}
        report: {type: [object, "null"]}
        next_request: {type: [object, "null"]}
        prior_failures: {type: [object, "null"]}
        ai_go: {type: boolean}
        facts_file: {type: string}
        stamp: {type: string}
        lang_line: {type: string}

  # 書き手のループは別のサブグラフで、1 つの項目の fan_out の join: all_done で回す。ループの中の役が落ちても（提供元の誤りなど）このノードは済み、
  # 出力の配列の項目が印 archon_failed と誤りの文になる。落ちたノードは fan_out の中の物で、run の落ちに数えない（#702）
  - id: write
    include: works-factory-report-write
    depends_on: [facts]
    when: "$facts.output.ai_go == 'true'"
    fan_out:
      items: '["$facts.output.facts_file"]'
      as: facts_file
      max_parallel: 1
      join: all_done
    with:
      outcome: $facts.output.outcome
      stop_reason: $facts.output.stop_reason
      lang_line: $facts.output.lang_line

  # write の出力の配列を受け、書き手の答えのポインタか、ループが落ちた誤りの文の 1 行目にする。write が飛ばされた・落ちた時は飛ばされ、
  # report は if_skipped: null で受ける（落ちたノードの出力は if_skipped の結びでも読めない）
  - id: write-out
    script: write_out
    runtime: uv
    timeout: 1728000000
    mutates_checkout: false
    depends_on: [write]
    with:
      got: $write.output
    output_format:
      type: object
      additionalProperties: false
      required: [ai, fell]
      properties:
        ai:
          type: [object, "null"]
          required: [type, run_id, path]
          properties:
            type: {const: archon_artifact}
            run_id: {type: string}
            path: {type: string}
        fell: {type: string}

  - id: report
    script: collect
    runtime: uv
    timeout: 1728000000
    mutates_checkout: false
    depends_on: [facts, write-out]
    trigger_rule: all_done
    with:
      facts: $facts.output
      write: {from: "$write-out.output", if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [outcome, stop_reason, report, report_ai, next_request, prior_failures, ok]
      properties:
        outcome:
          type: string
          enum: [fixed, fixed_needs_check, no_fix_needed, round_limit, stopped_by_request, stopped_by_human, stopped_by_line,
                 needs_human, record_invalid, interrupted]
        stop_reason: {type: string}
        report:
          type: object
          required: [type, run_id, path]
          properties:
            type: {const: archon_artifact}
            run_id: {type: string}
            path: {type: string}
        report_ai:
          type: [object, "null"]
          required: [type, run_id, path]
          properties:
            type: {const: archon_artifact}
            run_id: {type: string}
            path: {type: string}
        next_request:
          type: [object, "null"]
          required: [type, run_id, path]
          properties:
            type: {const: archon_artifact}
            run_id: {type: string}
            path: {type: string}
        prior_failures:
          type: [object, "null"]
          required: [type, run_id, path]
          properties:
            type: {const: archon_artifact}
            run_id: {type: string}
            path: {type: string}
        ok: {type: boolean}

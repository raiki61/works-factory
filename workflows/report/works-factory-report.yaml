name: works-factory-report
description: |
  報告の block（docs/design/report.md）。run の最後に、graph が渡した事実から結末の 10 語と止めた段の語を決め、機械の報告（冒頭 3 行・人が決める物・
  止めたか・見る所・役が呼んだ道具・graph が渡したセクションの全部・次の run に引き継ぐ落ちた理由・模型・費用・注意）と、次の run の依頼の下書き・
  前の失敗の行を place に書く（facts）。結果を名乗れる run では、書き手が平易な要約・人が決めること・本文を書き、道具を持たない初見の読み手が
  頭だけを読んで確かめる（write-loop。3 回目は通らなくても受け取って印を付け、人に向けた報告の冒頭で言う。読み手が止まったのが
  機械が組んだ行だけなら、書き手には直せないので、その回に書き直させずに受け取って同じ印を付ける）。
  出口 finish は落ちない: 人に向けた報告（report-ai.md。詳しい中身は隣の report-detail.md）が無くても機械の報告を返す。書き手のループが落ちた
  run は failed で終わり、finish は機械の報告の冒頭に本文が無い訳を置く（使用枠の切れなら、別のアカウントで resume すると write-loop と finish が
  走り直して本文が載る）。単独の run でも、graph から include されても回る

inputs:
  sections:
    required: true
    description: 'json(sections.schema.json): 報告のセクションの配列 [{title, lines, files?}]。機械の報告に、この並びのまま 1 セクションずつ載る。各 block の出力の report の欄を graph が並べた物。files は書き手が読むファイル [{label, ref}]（ref は Archon の pointer かファイルの絶対パスの字）'
  facts:
    default: '{}'
    description: 'json(facts.schema.json): 結末と冒頭 3 行を決める事実のオブジェクト（欄は設計書の 1.2）。空のオブジェクトは事実が渡されていない（結末は record_invalid）'
  lang:
    default: ''
    description: 'text: 書き手が書く本文の言語。空は依頼の言語'

returns: finish
outcome_field: ok

nodes:
  - id: facts
    script: facts
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [outcome, ok, stop_reason, machine, next_request, prior_failures, ai_go, stamp]
      properties:
        outcome: {type: string}
        ok: {type: boolean}
        stop_reason: {type: string}
        machine: {type: [object, "null"]}
        next_request: {type: [object, "null"]}
        prior_failures: {type: [object, "null"]}
        ai_go: {type: boolean}
        stamp: {type: string}

  - id: write-loop
    depends_on: [facts]
    when: "$facts.output.ai_go == 'true'"
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: done=$write-accept.output.done; test "$done" = true
      nodes:
        - id: write-prep
          script: write_prep
          runtime: uv
          mutates_checkout: false
          output_format:
            type: object
            additionalProperties: false
            required: [prompt]
            properties: {prompt: {type: string, minLength: 1}}

        - id: write
          prompt: "$write-prep.output.prompt"
          depends_on: [write-prep]
          model: '@wf-report'
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          settingSources: [user]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          mutates_checkout: false
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            required: [text, handoff]
            additionalProperties: false
            properties:
              text: {type: string, minLength: 1}
              terms:
                type: array
                items:
                  type: object
                  required: [term, definition]
                  additionalProperties: false
                  properties:
                    term: {type: string, minLength: 1}
                    definition: {type: string, minLength: 1}
              handoff:
                type: object
                additionalProperties: false
                required: [read, kept, set_aside, open]
                properties:
                  read:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [path, lines, why]
                      properties:
                        path: {type: string, minLength: 1}
                        lines: {type: string, minLength: 1}
                        why: {type: string, minLength: 1}
                  kept:
                    type: array
                    items: {type: string, minLength: 1}
                  set_aside:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [option, why]
                      properties:
                        option: {type: string, minLength: 1}
                        why: {type: string, minLength: 1}
                  open:
                    type: array
                    items: {type: string, minLength: 1}

        - id: cold-prep
          script: cold_prep
          runtime: uv
          mutates_checkout: false
          depends_on: [write]
          with:
            writer: $write.output
          output_format:
            type: object
            additionalProperties: false
            required: [prompt]
            properties: {prompt: {type: string, minLength: 1}}

        - id: cold
          prompt: "$cold-prep.output.prompt"
          depends_on: [cold-prep]
          context: fresh
          model: '@wf-report'
          allowed_tools: []
          settingSources: [user]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          mutates_checkout: false
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            required: [verdict, stops, guessed, machine_lines, decidable]
            additionalProperties: false
            properties:
              verdict: {type: string, enum: [pass, redesign-needed]}
              stops: {type: array, items: {type: string}}
              guessed: {type: array, items: {type: string}}
              machine_lines: {type: array, items: {type: string}}
              decidable: {type: boolean}

        - id: write-accept
          script: write_accept
          runtime: uv
          mutates_checkout: false
          depends_on: [write, cold]
          with:
            reply: $write.output
            cold: $cold.output
          output_format:
            type: object
            additionalProperties: false
            required: [done, ok, reason, kind, prev_file]
            properties:
              done: {type: boolean}
              ok: {type: boolean}
              reason: {type: string}
              kind: {type: string}
              prev_file: {type: string}

  - id: finish
    script: finish
    runtime: uv
    mutates_checkout: false
    depends_on: [facts, write-loop]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, outcome, stop_reason, machine, human, detail, next_request, prior_failures, report]
      properties:
        ok: {type: boolean}
        outcome:
          type: string
          enum: [fixed, fixed_needs_check, no_fix_needed, round_limit, stopped_by_request, stopped_by_human, stopped_by_line,
                 needs_human, record_invalid, interrupted]
        stop_reason: {type: string}
        machine:
          type: object
          required: [type, run_id, path]
          properties:
            type: {const: archon_artifact}
            run_id: {type: string}
            path: {type: string}
        human:
          type: [object, "null"]
          required: [type, run_id, path]
          properties:
            type: {const: archon_artifact}
            run_id: {type: string}
            path: {type: string}
        detail:
          type: [object, "null"]
          required: [type, run_id, path]
          properties:
            type: {const: archon_artifact}
            run_id: {type: string}
            path: {type: string}
        next_request:
          type: [object, "null"]
          required: [type, run_id, path]
          properties:
            type: {const: archon_artifact}
            run_id: {type: string}
            path: {type: string}
        prior_failures:
          type: [object, "null"]
          required: [type, run_id, path]
          properties:
            type: {const: archon_artifact}
            run_id: {type: string}
            path: {type: string}
        report: {type: array, items: {type: string}}

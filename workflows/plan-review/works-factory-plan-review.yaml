name: works-factory-plan-review
description: >-
  事前審査のサブグラフ。書く前に修正案を叩く。目的の文だけから作る独立設計（R2）を 1 度だけ作り、修正案と構造で突き合わせ、
  写し・塞がない入口・契約のずれ・死んだ道・範囲の膨張・後退・方針とのぶつかり・先行例の出典の当たりを、書かれる前に予測する。
  1 回の include がメイングラフの計画の往復（plan → plan-review）の 1 往復で、block（直しへ進めない穴）が無ければ通し、同じ block が続くか
  開いた block が前の往復より減らないか往復の安全の上限の周に届いたら止めた（stalled）と返す。修正前の承認ノード（メイングラフの 6）の 4 つの軸と人への問いを返す。共有ボードは持たず、入力のポインタの先を run の
  置き場の plan-review/ に写して lib/boardview.py の見え方で今の works の部品に渡す。

# 値は線の with: が渡す JSON の字（指し札と配列は JSON の字）。start・answers・ruling・conflicts・gate_answers は約束に足した入力で、
# 線が渡す前も既定で動く
inputs:
  units:
    required: true
    description: 単位の目録（配列）。判定の単位は judgment のポインタの先から読む
  judgment:
    required: true
    description: 判定のポインタ（judgment.json。隣の premises.json・materials.json・purpose-review.json を名で開く）
  purpose:
    required: true
    description: 目的の固定のポインタ（purpose.json）
  world:
    required: true
    description: 世界の解の行のポインタか null
  plan:
    required: true
    description: 修正案のポインタ（plan-fields.json。隣の p2.fix_plan.json を名で開く）
  structure:
    required: true
    description: 構造の目の控えのポインタ（structure-state.json。隣の design.jsonl を名で開く）
  ripple:
    required: true
    description: 波及の一覧のポインタ（ripple.json）
  start:
    default: "null"
    description: 始めの記録のポインタ（無人の印・設計だけ・依頼のファイル・方針の文書・事前審査の木・固めた版）
  answers:
    default: "null"
    description: 始めの承認ノードの答え（独立設計に貼る）
  ruling:
    default: "[]"
    description: 裁かれた計画の項目の番号の字の並び（修正の段が返した直し直しの項目の番号。承認済みの修正案の 1 から数えた番号。番号でない行と案の外の番号は拒む）。案の直しの事前審査の時だけ空でない
  conflicts:
    default: "null"
    description: 修正の段の申し出と裁定のポインタ（conflicts.json。案の直しの事前審査の時だけ。項目ごとの申し出と裁定の文を貼る）か null
  mode:
    default: ""
    description: >-
      include の形。空は事前審査、design は直す物が無い周（判定が直す単位を出さなかったか、計画の直す義務が 0 件だった）の
      include で、修正案・構造の目の控え・波及の一覧の 3 つの入力は null で、これらを読まずに独立設計だけを作り、事前審査を回さず、通った形と独立設計 design
      を返す（最後の R2 が要る設計）
  gate_answers:
    default: "null"
    description: >-
      修正前の承認ノードの答え {decision, text, asked: [通した行の文…]} か、その並びか null（通した行を聞き直さず、方針の変化を通したら
      その版を固め直す）
  head_depth:
    default: ""
    description: >-
      run の頭の深さの段の語。事前審査の木を決める時に、始めの記録に review_tree の名指しが無ければ、段の足し（lib/depth.py の TIERS）を引く。
      空は足し無し。形 review の時だけ効く
  round_limit:
    default: "null"
    description: >-
      計画の往復のループの安全の上限（ループの max_iterations と同じ数）か null（ループの外の案の直しの事前審査）。計画の周 round がこの数の
      往復は、ループがもう 1 周回せないので開いた block が減っていても止める

returns: review
outcome_field: pass

nodes:
  # 入力の指し札の先を置き場に写し、見え方の材料を置く。独立設計を回すか（同じ run に設計の控えが無く、目的が使える時だけ）と、
  # 事前審査を木にするか（始めの記録の review_tree の名指し、無ければ入力 head_depth の段の足し、それも無ければ auto は開いた項目が
  # 2 つ以上）を決める。落ちずに ok で答える
  - id: open
    script: pass_open
    runtime: uv
    timeout: 1728000000
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [ok, r2_go, tree, k, form, reason]
      properties:
        ok: {type: boolean}
        r2_go: {type: boolean}
        tree: {type: boolean}
        k: {type: integer}
        form: {type: string, enum: [review, replan, design, ""]}
        reason: {type: string}

  # 独立設計（道具ゼロの役。目的の文と実測した制約と人が決めた前提だけを受ける）。3 回とも拒まれても止めない
  - id: r2-design-loop
    depends_on: [open]
    when: "$open.output.r2_go == true"
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: done=$r2-accept.output.done; test "$done" = true
      nodes:
        - id: r2-prep
          script: r2_prep
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          output_format:
            type: object
            additionalProperties: false
            required: [prompt]
            properties:
              prompt: {type: string}
        - id: r2-design
          command: r2-design
          depends_on: [r2-prep]
          model: opus
          effort: high
          allowed_tools: []
          settingSources: [user]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          mutates_checkout: false
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          # 既定の system prompt（claude_code）は作業ツリーの git の様子（枝・最近の commit）を入れるので、役の前付けだけに替える
          # （r2.design の禁: リポジトリ・履歴。今の works の包みは道具ゼロの役を Git の外の置き場で起こしていた）
          systemPrompt: |-
            この役は blind-judge。渡されたものだけから独立に導出する、または渡された 2 つを突き合わせる役である。

            - この役は道具を一切持たない。実装・文書・履歴・web のどれも開けない。渡されたものが世界の全部である。道具を呼ぼうとするな。
            - 渡されていないものを推測で再構成するな。「現状はこうなっているはずだ」と補った瞬間、独立導出は追認になる。
            - 導出に入る前に、問いそのものの実在を疑え。問いが立っていない（前提が偽か、答えが要らない）と判断したら、導出に進まず、問いが立たないことと根拠を、呼び出し側が指示した返答の型の中の当たる欄（無ければ理由の欄）に書いて返せ。
            - 突合を任されたときは構造を比べろ。表現の違いは差ではない。
            - 返答に無言の省略を作るな。判定は指示された語彙だけで書き、理由を必ず添えろ。
          # 差し込みの頭の script（scripts/pass_open.py の node_schema）が読むので JSON の形で書く
          output_format: {
                "type": "object",
                "additionalProperties": false,
                "required": ["question_stands", "reason", "design"],
                "properties": {
                  "question_stands": {"type": "boolean"},
                  "reason": {"type": "string", "minLength": 1, "pattern": "\\S"},
                  "premise_invalid_reason": {"type": "string"},
                  "design": {"type": "string"}
                }
              }
        - id: r2-accept
          script: r2_accept
          runtime: uv
          timeout: 1728000000
          depends_on: [r2-design]
          mutates_checkout: false
          with:
            status_guarded: true
            reply: $r2-design.output
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, give_up, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}

  # 事前審査（役 1 つか、項目ごとの下請けを並べる束ね役）。輪の中の節は輪の前の節の出力に結ばず、plan-review/ のファイルを読む。
  - id: review-loop
    depends_on: [open, r2-design-loop]
    trigger_rule: all_done
    when: "$open.output.ok == true && $open.output.form != 'design'"
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: done=$review-accept.output.done; test "$done" = true
      nodes:
        - id: review-prep
          script: review_prep
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          output_format:
            type: object
            additionalProperties: false
            required: [prompt_file]
            properties:
              prompt_file: {type: string}
        - id: plan-review
          command: plan-review
          depends_on: [review-prep]
          model: opus
          effort: high
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch, Agent, Write]
          settingSources: [user]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          context: fresh
          mutates_checkout: false
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          # 差し込みの頭の script（scripts/pass_open.py の node_schema）が読むので JSON の形で書く。faces の行の決め手の欄は gatemarks.MARK_SCHEMA、
          # resolved・items・design_map・origins は converge の壁打ちと束ね役と出自の欄
          output_format: {
                "type": "object",
                "additionalProperties": false,
                "required": ["faces", "shrink", "reason"],
                "properties": {
                  "faces": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["key", "unit_keys", "kind", "where", "why", "severity"],
                      "properties": {
                        "key": {"type": "string", "minLength": 8, "pattern": "\\S[\\s\\S]{6,}\\S"},
                        "unit_keys": {"type": "array", "minItems": 1, "items": {"type": ["integer", "string"], "minLength": 1, "pattern": "\\S", "minimum": 1}},
                        "kind": {"type": "string", "enum": ["copy", "entrance", "contract_drift", "dead_path", "scope_creep", "regression", "policy", "precedent"]},
                        "where": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"},
                        "why": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                        "severity": {"type": "string", "enum": ["block", "suggest"]},
                        "no_add": {"type": "string"},
                        "decided_by": {"type": "string"},
                        "undecided_because": {"type": "string"},
                        "fences": {"type": "array", "uniqueItems": true, "items": {"type": "string", "enum": ["external_write", "irreversible", "policy_doc", "widen_protection", "web_doubt"]}},
                        "world": {"type": "string"},
                        "recommend": {
                          "type": "object",
                          "additionalProperties": false,
                          "required": ["answer", "note", "why"],
                          "properties": {
                            "answer": {"type": "string", "enum": ["continue", "stop"]},
                            "note": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"},
                            "why": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"}
                          }
                        },
                        "no_narrow": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"}
                      }
                    }
                  },
                  "shrink": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["key", "unit_keys", "alternative", "why"],
                      "properties": {
                        "key": {"type": "string", "minLength": 8, "pattern": "\\S[\\s\\S]{6,}\\S"},
                        "unit_keys": {"type": "array", "minItems": 1, "items": {"type": ["integer", "string"], "minLength": 1, "pattern": "\\S", "minimum": 1}},
                        "alternative": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                        "why": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"}
                      }
                    }
                  },
                  "faces_none": {"type": "string"},
                  "reason": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                  "resolved": {"type": "array", "items": {"type": "string"}},
                  "items": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["item", "verdict", "blocks"],
                      "properties": {
                        "item": {"type": "integer", "minimum": 1},
                        "verdict": {"type": "string", "enum": ["clean", "block"]},
                        "blocks": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "additionalProperties": false,
                            "required": ["key", "why"],
                            "properties": {"key": {"type": "string"}, "why": {"type": "string"}}
                          }
                        }
                      }
                    }
                  },
                  "design_map": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["item", "name", "design_quote", "why"],
                      "properties": {
                        "item": {"type": "integer", "minimum": 1},
                        "name": {"type": "string", "minLength": 1, "pattern": "\\S"},
                        "design_quote": {"type": ["string", "null"]},
                        "why": {"type": "string", "minLength": 10, "pattern": "\\S[\\s\\S]{8,}\\S"}
                      }
                    }
                  },
                  "origins": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["key", "origin"],
                      "properties": {
                        "key": {"type": "string"},
                        "origin": {"type": "string", "enum": ["missed", "introduced", "rephrased"]},
                        "of": {"type": "string"}
                      }
                    }
                  }
                }
              }
        - id: review-accept
          script: review_accept
          runtime: uv
          timeout: 1728000000
          depends_on: [plan-review]
          mutates_checkout: false
          with:
            status_guarded: true
            reply: $plan-review.output
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, give_up, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}

  # 読んだ証拠: この差し込みの事前審査の役が、機械が渡したパス（材料・方針の文書）を読んだかを、隔離した設定のフックの記録から
  # 集めて pass-<k>/ に書き、束ね役が起こした下請けの数を trace に残す（受け付けの条件にしない。返す節に結ばない。落ちない）
  - id: review-reads
    script: review_reads
    runtime: uv
    timeout: 1728000000
    depends_on: [open, review-loop]
    trigger_rule: all_done
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [ok, missing, index_file, reason]
      properties:
        ok: {type: boolean}
        missing: {type: array, items: {type: string}}
        index_file: {type: string}
        reason: {type: string}

  # 返す節。往復の控え・受けた返答・設計の控え・拒みの控えだけを読む。落ちない（中の誤りは偽の結末と訳で返す）
  - id: review
    script: result
    runtime: uv
    timeout: 1728000000
    depends_on: [review-loop]
    trigger_rule: all_done
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [pass, stalled, review, design, gate_axes, ask_human, questions]
      properties:
        pass: {type: boolean}
        stalled: {type: boolean}
        review:
          type: object
          additionalProperties: false
          required: [type, run_id, path]
          properties:
            type: {type: string, enum: [archon_artifact]}
            run_id: {type: string}
            path: {type: string}
        design:
          type: object
          additionalProperties: false
          required: [type, run_id, path]
          properties:
            type: {type: string, enum: [archon_artifact]}
            run_id: {type: string}
            path: {type: string}
        gate_axes:
          type: object
          additionalProperties: false
          required: [obvious, world, clean, not_overkill]
          properties:
            obvious:
              type: object
              additionalProperties: false
              required: [ok, note]
              properties:
                ok: {type: boolean}
                note: {type: string}
            world:
              type: object
              additionalProperties: false
              required: [ok, note]
              properties:
                ok: {type: boolean}
                note: {type: string}
            clean:
              type: object
              additionalProperties: false
              required: [ok, note]
              properties:
                ok: {type: boolean}
                note: {type: string}
            not_overkill:
              type: object
              additionalProperties: false
              required: [ok, note]
              properties:
                ok: {type: boolean}
                note: {type: string}
        ask_human: {type: boolean}
        # 関所の項目 {kind（lib/gatemarks.py の KIND_WORDS の種類）, text}
        questions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, text]
            properties:
              kind: {type: string}
              text: {type: string}

name: works-factory-plan-review
description: '事前審査の block（docs/design/plan-review.md）。書く前の修正案（か方針の文だけ）を、判定をした役とは別の目が 8 種の確かめ（写し・入口・契約のずれ・死んだ道・範囲の膨張と最小性・後退・方針・先行例の出典）で叩き、直しが作る穴を書かれる前に予測して別案を挙げさせる。独立設計が立てば案を設計と構造で突き合わせ、2 往復目からは前の往復の穴の行き先と変わった文だけを見る。返答を機械が照らし、通らなければ理由つきで出し直させる。往復を続けるか・承認ノードで聞くかは決めず、1 往復分の事実（穴・往復の記録に足す行の材料・人に回しうる行とその決め手の照らし・定石からの外れ）を返す。単独の run でも、graph から include されても回る'
inputs:
  proposal:
    default: ''
    description: 'text: 審査する方針の文（字）。修正案を審査する時は入力 plan に渡す（ここに修正案の JSON の値・pointer・パスを渡しても修正案として読む）。plan・proposal_file と一緒には名指さない。どれも空なら入口が止める'
  plan: {default: '', description: 'json(shared:fix-plan.schema.json): 審査する修正案（項目の行の plan と、前の往復の穴への答え block_answers を持つ）。pointer・パス・値のどれか。空の字は方針の文を審査する（proposal か proposal_file）'}
  proposal_file: {default: '', description: 'file: 方針の文のファイル。在れば中身を形 text の方針の文として読む（JSON の形でも方針の文）。proposal と一緒には名指さない。空は proposal を読む'}
  fields: {default: '', description: 'json(shared:plan-fields.schema.json): 修正案の項目ごとの works の欄（{round, fields, amended?}）。pointer・パス・値のどれか。proposal が修正案の時は要る。空の字は渡されていない（形 text では読まない）'}
  judgment: {default: '', description: 'json(shared:judgment.schema.json): 判定の出力（units・questions・precedents・framing・one_shot を読む）。pointer・パス・値のどれか。形 plan と replan では要る。空の字は渡されていない（形 text では読まない）'}
  purpose: {default: '', description: 'text: 元の目的の 1 文。空は渡されていない'}
  design: {default: '', description: 'json(shared:design.schema.json): 独立設計の返答 {question_stands, reason, premise_invalid_reason?, design, elements?}。pointer・パス・値のどれか。空の字は設計が無い'}
  design_why: {default: '', description: 'text: 設計が無い訳の 1 行（設計を作る側が返した訳）。空で設計も無ければ「独立設計の出力が渡されていない」と読む'}
  world_rows: {default: '', description: 'jsonl(lib:world-row.schema.json): 世界の解の行（world.jsonl）。空は世界の解の行が無い run（人に回しうる行の世界の軸は今どおりの決まり）'}
  means: {default: '[]', description: 'json(stated-means.schema.json): 依頼が示した解き方の文の配列（世界の解からの外れの決め手にならない物）。空の配列は示していない'}
  structure: {default: '', description: 'json(shared:structure-state.schema.json): 構造の目の控え（{status, reason, design_file, …}。design_file が設計の行の jsonl を指す）。空は構造の目が走っていない（控えを failed として写す）'}
  ripple: {default: '', description: 'json(shared:ripple.schema.json): 修正案の項目ごとの波及の一覧（{items, overlaps, error?}）。空は一覧が無い（材料に一覧が無い訳を書く）'}
  prior: {default: '', description: 'json(shared:plan-converge.schema.json): 前の往復までの往復の記録（往復の記録の形に、先行例の出典の確かめの控え precedent_checks を足した物）。空は 1 往復目（形 replan では承認済みの案が無いので failed）'}
  tree: {default: 'auto', description: 'choice(on|off|auto): 項目ごとの下請けで木にするか。auto は開いた項目が 2 つ以上なら木。形 plan の時だけ効く'}
  excluded: {default: '', description: 'json(shared:excluded.schema.json): 並行 PR と重なるので外した範囲。在れば役の頭に名指す。空は無い'}
  policy: {default: '', description: 'file: 人の方針の文書を run の頭で固めた写し。空は方針が無い'}
  recorded: {default: '[]', description: 'json(shared:recorded.schema.json): 記録された方針の行の配列 [{source, name, text, lines?, alias?}]（承認ノードの人の答えの行を含めて組んだ物）。空の配列で policy が在れば、方針の文書の行だけを入口が組む'}
  request: {default: '', description: 'json(shared:request.schema.json): 依頼のファイル（決め手の出どころの依頼の引用を照らす元）。空は無い'}
  review_rev: {default: '', description: 'text: 役が読む版（固めた版の commit）。空は HEAD'}
  diff_base: {default: '', description: 'text: 材料の BASE（入口の差分の根。後退の比べの基準）。空は review_rev と同じ'}
  ruling: {default: '', description: 'text: 裁かれた修正案の項目の番号（JSON の配列か、, で区切った番号の字。承認済みの案の 1 から数える）。空は形 replan でない'}
  conflicts: {default: '', description: 'json(lib:conflicts.schema.json): 修正の段の申し出と裁定（{items: [...]}）。形 replan の時だけ読む。空は無い'}
  lang: {default: '', description: 'text: 人に見せる欄の言語。空は依頼の言語'}
returns: finish
outcome_field: ok
nodes:
  # port を読み、形を決め、place のこの block のファイルを名で消して材料を写し、intake.json を書く。後ろの script は port を読まずに intake.json を読む
  - id: intake
    script: intake
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [due, form, tree, k, reason]
      properties:
        due: {type: boolean}
        form:
          type: string
          enum: ['', plan, replan, text]
        tree: {type: boolean}
        k: {type: integer, minimum: 0}
        reason: {type: string}

  # 修正案の審査の輪（形 plan と replan）。受け付けの拒否の回数では諦めず、受け付けの網（lib の rolekit.NET_AFTER。max_iterations と同じ数で、
  # 届けば工場の不具合）の回の拒否で受け付けが done（give_up）を出して輪を抜ける。役は単独の組（review／review-fix）と束ね役の組
  # （review-tree／review-tree-fix）で、review-prep の tree と resubmit で振り分ける。拒まれた後は組の出し直しの役が同じ会話の続きで
  # 拒まれた欄だけを返し、受け付けが前の答えと合わせる。本体は層ごとに 1 つの node の鎖（並んだ層は会話を切る。#571）
  - id: review-loop
    depends_on: [intake]
    when: "$intake.output.due == true && $intake.output.form != 'text'"
    loop_group:
      max_iterations: 20
      fresh_context: false
      until_bash: done=$review-accept.output.done; test "$done" = true
      nodes:
        - id: review-prep
          script: review_prep
          runtime: uv
          mutates_checkout: false
          with:
            prev: "$LOOP_PREV.review-accept.output.ok"
          output_format:
            type: object
            additionalProperties: false
            required: [prompt, resubmit, tree]
            properties:
              prompt: {type: string}   # 1 回目の役の指示（出し直しの周は ""。出し直しの役の指示は review-fix-prep が組む）
              resubmit: {type: boolean}
              tree: {type: boolean}
        # output_format は src/files.py の node_schema が読むので JSON の流れの書き方で書く。根の欄は要ると書かない（出し直しの役と同じ形にして、
        # 会話の続きの最初の要求でキャッシュを効かせる。#832）。要る欄は受け付けが確かめる（src/files.py の REVIEW_REQUIRED）
        - id: review
          prompt: "$review-prep.output.prompt"
          depends_on: [review-prep]
          when: "$review-prep.output.resubmit != true && $review-prep.output.tree != true"
          context: fresh
          <<: &review_launch
            model: '@wf-plan-review'
            allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch, Agent, Write]
            settingSources: [user]
            sandbox: {enabled: true, allowUnsandboxedCommands: false}
            mutates_checkout: false
            idle_timeout: 1728000000
            retry: {max_attempts: 2, on_error: all}
          output_format: {
                "type": "object",
                "additionalProperties": false,
                "required": [],
                "properties": {
                  "faces": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["key", "unit_keys", "kind", "where", "why", "severity", "reach"],
                      "properties": {
                        "key": {"type": "string", "minLength": 8, "pattern": "\\S[\\s\\S]{6,}\\S"},
                        "unit_keys": {
                          "type": "array",
                          "minItems": 1,
                          "items": {"type": ["integer", "string"], "minLength": 1, "pattern": "\\S", "minimum": 1}
                        },
                        "kind": {
                          "type": "string",
                          "enum": ["copy", "entrance", "contract_drift", "dead_path", "scope_creep", "regression", "policy", "precedent"]
                        },
                        "where": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"},
                        "why": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                        "severity": {"type": "string", "enum": ["block", "suggest"]},
                        "reach": {"type": "string", "enum": ["breaks_fix", "loses_behavior", "against_policy", "forces_redesign", "peripheral"]},
                        "no_add": {"type": "string"},
                        "decided_by": {"type": "string"},
                        "undecided_because": {"type": "string"},
                        "fences": {
                          "type": "array",
                          "items": {"type": "string", "enum": ["external_write", "irreversible", "policy_doc", "widen_protection", "web_doubt"]}
                        },
                        "world": {"type": "string"},
                        "recommend": {
                          "type": "object",
                          "additionalProperties": false,
                          "required": ["answer", "note", "why"],
                          "properties": {
                            "answer": {"type": "string", "enum": ["continue", "stop"]},
                            "note": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"},
                            "why": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"}
                          }
                        },
                        "no_narrow": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"}
                      }
                    }
                  },
                  "shrink": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["key", "unit_keys", "alternative", "why"],
                      "properties": {
                        "key": {"type": "string", "minLength": 8, "pattern": "\\S[\\s\\S]{6,}\\S"},
                        "unit_keys": {
                          "type": "array",
                          "minItems": 1,
                          "items": {"type": ["integer", "string"], "minLength": 1, "pattern": "\\S", "minimum": 1}
                        },
                        "alternative": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                        "why": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"}
                      }
                    }
                  },
                  "faces_none": {"type": "string"},
                  "reason": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                  "resolved": {"type": "array", "items": {"type": "string"}},
                  "stuck_recommend": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["answer", "note", "why"],
                    "properties": {
                      "answer": {"type": "string", "enum": ["continue", "stop"]},
                      "note": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"},
                      "why": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"}
                    }
                  },
                  "design_map": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["item", "path", "symbol", "design_ref", "design_quote", "why"],
                      "properties": {
                        "item": {"type": ["integer", "null"], "minimum": 1},
                        "path": {"type": ["string", "null"]},
                        "symbol": {"type": ["string", "null"]},
                        "design_ref": {"type": ["string", "null"], "pattern": "^D[0-9]+$"},
                        "design_quote": {"type": ["string", "null"]},
                        "why": {"type": "string", "minLength": 10, "pattern": "\\S[\\s\\S]{8,}\\S"}
                      }
                    }
                  },
                  "origins": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["key", "origin"],
                      "properties": {
                        "key": {"type": "string"},
                        "origin": {"type": "string", "enum": ["missed", "introduced", "rephrased"]},
                        "of": {"type": "string"},
                        "quote": {"type": "string"}
                      }
                    }
                  }
                }
              }
        # 出し直しの役の指示は review-prep と別の prep が組む（出し直しの周だけ回る）。筋書きは review-prep を差し替えて出し直しの周を作り、
        # この prep が本当に指示を組むことを見る（輪の 2 周目は dry-run で回らない）。review の後ろの層に置く
        - id: review-fix-prep
          script: review_fix_prep
          runtime: uv
          mutates_checkout: false
          depends_on: [review-prep, review]
          trigger_rule: none_failed_min_one_success
          when: "$review-prep.output.resubmit == true"
          output_format:
            type: object
            additionalProperties: false
            required: [prompt]
            properties:
              prompt: {type: string, minLength: 1}
        # review の会話の続きの出し直しの役。型は review の型と同じ（#832）
        - id: review-fix
          prompt: "$review-fix-prep.output.prompt"
          depends_on: [review-prep, review-fix-prep, review]
          trigger_rule: none_failed_min_one_success
          when: "$review-prep.output.resubmit == true && $review-prep.output.tree != true"
          <<: *review_launch
          output_format: {
                "type": "object",
                "additionalProperties": false,
                "required": [],
                "properties": {
                  "faces": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["key", "unit_keys", "kind", "where", "why", "severity", "reach"],
                      "properties": {
                        "key": {"type": "string", "minLength": 8, "pattern": "\\S[\\s\\S]{6,}\\S"},
                        "unit_keys": {
                          "type": "array",
                          "minItems": 1,
                          "items": {"type": ["integer", "string"], "minLength": 1, "pattern": "\\S", "minimum": 1}
                        },
                        "kind": {
                          "type": "string",
                          "enum": ["copy", "entrance", "contract_drift", "dead_path", "scope_creep", "regression", "policy", "precedent"]
                        },
                        "where": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"},
                        "why": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                        "severity": {"type": "string", "enum": ["block", "suggest"]},
                        "reach": {"type": "string", "enum": ["breaks_fix", "loses_behavior", "against_policy", "forces_redesign", "peripheral"]},
                        "no_add": {"type": "string"},
                        "decided_by": {"type": "string"},
                        "undecided_because": {"type": "string"},
                        "fences": {
                          "type": "array",
                          "items": {"type": "string", "enum": ["external_write", "irreversible", "policy_doc", "widen_protection", "web_doubt"]}
                        },
                        "world": {"type": "string"},
                        "recommend": {
                          "type": "object",
                          "additionalProperties": false,
                          "required": ["answer", "note", "why"],
                          "properties": {
                            "answer": {"type": "string", "enum": ["continue", "stop"]},
                            "note": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"},
                            "why": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"}
                          }
                        },
                        "no_narrow": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"}
                      }
                    }
                  },
                  "shrink": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["key", "unit_keys", "alternative", "why"],
                      "properties": {
                        "key": {"type": "string", "minLength": 8, "pattern": "\\S[\\s\\S]{6,}\\S"},
                        "unit_keys": {
                          "type": "array",
                          "minItems": 1,
                          "items": {"type": ["integer", "string"], "minLength": 1, "pattern": "\\S", "minimum": 1}
                        },
                        "alternative": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                        "why": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"}
                      }
                    }
                  },
                  "faces_none": {"type": "string"},
                  "reason": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                  "resolved": {"type": "array", "items": {"type": "string"}},
                  "stuck_recommend": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["answer", "note", "why"],
                    "properties": {
                      "answer": {"type": "string", "enum": ["continue", "stop"]},
                      "note": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"},
                      "why": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"}
                    }
                  },
                  "design_map": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["item", "path", "symbol", "design_ref", "design_quote", "why"],
                      "properties": {
                        "item": {"type": ["integer", "null"], "minimum": 1},
                        "path": {"type": ["string", "null"]},
                        "symbol": {"type": ["string", "null"]},
                        "design_ref": {"type": ["string", "null"], "pattern": "^D[0-9]+$"},
                        "design_quote": {"type": ["string", "null"]},
                        "why": {"type": "string", "minLength": 10, "pattern": "\\S[\\s\\S]{8,}\\S"}
                      }
                    }
                  },
                  "origins": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["key", "origin"],
                      "properties": {
                        "key": {"type": "string"},
                        "origin": {"type": "string", "enum": ["missed", "introduced", "rephrased"]},
                        "of": {"type": "string"},
                        "quote": {"type": "string"}
                      }
                    }
                  }
                }
              }
        # 束ね役（intake の tree が真の往復）。型は束ね役が書く欄だけ（faces・shrink・origins は受け付けが下請けの答えのファイルから組む）。
        # review と同じく根の欄は要ると書かず、受け付けが確かめる（src/files.py の TREE_REQUIRED）。review-tree-fix の型はこれと同じ
        - id: review-tree
          prompt: "$review-prep.output.prompt"
          depends_on: [review-prep, review-fix]
          trigger_rule: none_failed_min_one_success
          when: "$review-prep.output.resubmit != true && $review-prep.output.tree == true"
          context: fresh
          <<: *review_launch
          output_format: {
                "type": "object",
                "additionalProperties": false,
                "required": [],
                "properties": {
                  "reason": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                  "items": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["item", "verdict", "blocks"],
                      "properties": {
                        "item": {"type": "integer", "minimum": 1},
                        "verdict": {"type": "string", "enum": ["clean", "block"]},
                        "blocks": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "additionalProperties": false,
                            "required": ["key", "why"],
                            "properties": {"key": {"type": "string"}, "why": {"type": "string"}}
                          }
                        }
                      }
                    }
                  },
                  "stuck_recommend": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["answer", "note", "why"],
                    "properties": {
                      "answer": {"type": "string", "enum": ["continue", "stop"]},
                      "note": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"},
                      "why": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"}
                    }
                  }
                }
              }
        - id: review-tree-fix
          prompt: "$review-fix-prep.output.prompt"
          depends_on: [review-prep, review-fix-prep, review-tree]
          trigger_rule: none_failed_min_one_success
          when: "$review-prep.output.resubmit == true && $review-prep.output.tree == true"
          <<: *review_launch
          output_format: {
                "type": "object",
                "additionalProperties": false,
                "required": [],
                "properties": {
                  "reason": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                  "items": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["item", "verdict", "blocks"],
                      "properties": {
                        "item": {"type": "integer", "minimum": 1},
                        "verdict": {"type": "string", "enum": ["clean", "block"]},
                        "blocks": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "additionalProperties": false,
                            "required": ["key", "why"],
                            "properties": {"key": {"type": "string"}, "why": {"type": "string"}}
                          }
                        }
                      }
                    }
                  },
                  "stuck_recommend": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["answer", "note", "why"],
                    "properties": {
                      "answer": {"type": "string", "enum": ["continue", "stop"]},
                      "note": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"},
                      "why": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"}
                    }
                  }
                }
              }
        - id: review-accept
          script: review_accept
          runtime: uv
          depends_on: [review, review-fix, review-tree, review-tree-fix]
          trigger_rule: none_failed_min_one_success
          mutates_checkout: false
          with:
            status_guarded: true
            reply: {from: "$review.output", if_skipped: null}
            fix_reply: {from: "$review-fix.output", if_skipped: null}
            tree_reply: {from: "$review-tree.output", if_skipped: null}
            tree_fix_reply: {from: "$review-tree-fix.output", if_skipped: null}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, give_up, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}

  # 方針の文だけの審査の輪（形 text）。lib の rolekit.GIVE_UP_AFTER 回で諦める。拒まれた後は同じ会話の続きで丸ごと出し直す
  - id: text-loop
    depends_on: [intake]
    when: "$intake.output.due == true && $intake.output.form == 'text'"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: done=$text-accept.output.done; test "$done" = true
      nodes:
        - id: text-prep
          script: text_prep
          runtime: uv
          mutates_checkout: false
          output_format:
            type: object
            additionalProperties: false
            required: [prompt]
            properties:
              prompt: {type: string, minLength: 1}
        - id: review-text
          prompt: "$text-prep.output.prompt"
          depends_on: [text-prep]
          model: '@wf-plan-review'
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          settingSources: [user]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          mutates_checkout: false
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format: {
                "type": "object",
                "additionalProperties": false,
                "required": ["faces", "shrink", "reason"],
                "properties": {
                  "faces": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["key", "kind", "where", "why", "severity", "reach"],
                      "properties": {
                        "key": {"type": "string", "minLength": 8, "pattern": "\\S[\\s\\S]{6,}\\S"},
                        "kind": {
                          "type": "string",
                          "enum": ["copy", "entrance", "contract_drift", "dead_path", "scope_creep", "regression", "policy", "precedent"]
                        },
                        "where": {"type": "string", "minLength": 4, "pattern": "\\S[\\s\\S]{2,}\\S"},
                        "why": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                        "severity": {"type": "string", "enum": ["block", "suggest"]},
                        "reach": {"type": "string", "enum": ["breaks_fix", "loses_behavior", "against_policy", "forces_redesign", "peripheral"]},
                        "no_add": {"type": "string"},
                        "decided_by": {"type": "string"},
                        "fences": {
                          "type": "array",
                          "items": {"type": "string", "enum": ["external_write", "irreversible", "policy_doc", "widen_protection", "web_doubt"]}
                        }
                      }
                    }
                  },
                  "shrink": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["key", "alternative", "why"],
                      "properties": {
                        "key": {"type": "string", "minLength": 8, "pattern": "\\S[\\s\\S]{6,}\\S"},
                        "alternative": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"},
                        "why": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"}
                      }
                    }
                  },
                  "faces_none": {"type": "string"},
                  "reason": {"type": "string", "minLength": 20, "pattern": "\\S[\\s\\S]{18,}\\S"}
                }
              }
        - id: text-accept
          script: text_accept
          runtime: uv
          depends_on: [review-text]
          mutates_checkout: false
          with:
            status_guarded: true
            reply: "$review-text.output"
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, give_up, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}

  # 読んだ証拠（受け付けの条件にしない）。審査の役が機械の渡したパス（材料のファイル・方針の写し）を読んだかを、フックの記録から集めて
  # place の reads-<役>.json と索引に書き、木の往復は束ね役が起こした下請けの数を trace に残す。役の輪が落ちても走り、落ちない
  - id: review-reads
    script: review_reads
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, review-loop, text-loop]
    trigger_rule: all_done
    when: "$intake.output.due == true"
    output_format:
      type: object
      additionalProperties: false
      required: [ok, missing, index_file, reason]
      properties:
        ok: {type: boolean}
        missing:
          type: array
          items: {type: string}
        index_file: {type: string}
        reason: {type: string}

  # 出口。どの段が落ちても落ちない
  - id: finish
    script: finish
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, review-loop, text-loop, review-reads]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, status, form, round, reason, holes, blocks, pass, asks, deviations, replan, gave_up, reads, report]
      properties:
        ok: {type: boolean}
        status:
          type: string
          enum: [ok, gave_up, failed]
        form:
          type: string
          enum: ['', plan, replan, text]
        round: {type: integer, minimum: 0}
        reason: {type: string}
        holes:
          <<: &pointer
            type: [object, 'null']
            additionalProperties: false
            required: [type, run_id, path]
            properties:
              type:
                type: string
                enum: [archon_artifact]
              run_id: {type: string}
              path: {type: string}
          description: 'json(shared:plan-review-reply.schema.json): 事前審査の返答（review.json）。返答が無ければ null'
        blocks:
          type: array
          items: {type: string}
        pass:
          <<: *pointer
          description: 'json(shared:plan-review-pass.schema.json): この往復の控え（pass.json。形 plan で受けた時だけ）。無ければ null'
        asks:
          type: array
          items:
            type: object
            required: [kind, node, text, units, mark, decided, why]
            properties:
              kind: {type: string}
              node: {type: string}
              text: {type: string}
              units:
                type: array
                items: {type: string}
              mark:
                type: object
                properties:
                  decided_by: {type: string}
                  undecided_because: {type: string}
                  fences: {type: array, items: {type: string}}
                  world: {type: string}
                  recommend: {type: object, properties: {answer: {type: string}, note: {type: string}, why: {type: string}}}
                  no_narrow: {type: string}
              decided: {type: boolean}
              why:
                type: object
                patternProperties:
                  '^.+$': {type: array, items: {type: string}}
        deviations:
          type: array
          items:
            type: object
            required: [source]
            properties:
              source:
                type: string
                enum: [world, design]
        replan:
          type: array
          items:
            type: object
            required: [item, units, contract_changed, human, widened]
            properties:
              item: {type: integer}
              units:
                type: array
                items: {type: string}
              contract_changed:
                type: array
                items: {type: string}
              human:
                type: array
                items:
                  type: object
                  properties:
                    key: {type: string}
                    kind: {type: string}
                    why: {type: string}
              widened:
                type: [object, 'null']
                properties:
                  allowed_paths: {type: array, items: {type: string}}
                  out_of_scope: {type: array, items: {type: string}}
        gave_up:
          type: [array, 'null']
          items:
            type: object
            required: [item, why, ruling]
            properties:
              item: {type: integer}
              why: {type: string}
              ruling: {type: string}
        reads:
          <<: *pointer
          description: 'json(shared:reads.schema.json): 役が渡し物を読んだ証拠（reads-<役>.json）。無ければ null'
        report:
          type: array
          items: {type: string}

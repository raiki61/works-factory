# 筋書き: 同じ単位と HEAD の控えを使い回した周。構造の目の輪が飛び、structure-state と返す節には届く
round: {round: 2, mode: plan, dir: plan/r2, go: true}
structure-measure: {structure_file: plan/structure/k/structure.json, design_file: plan/structure/k/design.jsonl, eye: false, reused: true}
structure-state: {state_file: plan/structure/k/structure-state.json}
ripple-units: {ripple_file: plan/r2/ripple-units.json}
plan-prep: {brief: plan/r2/brief-1.md, attempt: 1, resubmit: false}
plan-writer:
  plan:
    - unit_keys: [1]
      approach: "stub: mean の分母を len(xs) に直す"
      files:
        - {path: stats.py, op: modify, responsibility: "stub: 平均の分母の式を直す", symbols: [], home: {concept: "stub: 平均の分母の式", why: "stub: 式は stats.py にある"}, considered: [{path: test_stats.py, why_not: "stub: 試験のファイルに式は置かない"}]}
      shrink_first: "stub: 足す物は無い。式を 1 か所直すだけで足りる"
      narrows: []
      route: direct
      route_why: "stub: 式を 1 か所直すだけ"
      tests: []
      rewrite_tests: []
      refactor: {declared: false, why: ""}
      allowed_paths: [stats.py]
      out_of_scope: []
plan-accept: {ok: true, done: true, give_up: false, reason: "", attempt: 1}
ripple-items: {ripple_file: plan/r2/ripple.json}
plan-reads: {ok: true, missing: [], index_file: plan/r2/reads-plan-block.json, reason: ""}
plan:
  ready: true
  plan: {type: archon_artifact, run_id: fixture-run, path: plan/r2/plan-fields.json}
  structure: {type: archon_artifact, run_id: fixture-run, path: plan/structure/k/structure-state.json}
  ripple: {type: archon_artifact, run_id: fixture-run, path: plan/r2/ripple.json}
  depth: []
  round: 2
fixture:
  expect: completed
  reached: [structure-state, plan]

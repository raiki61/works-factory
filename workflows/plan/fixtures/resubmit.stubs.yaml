# 出し直しの役の指示を本当の prep で組んだと照らす筋書き。dry-run の輪は 1 周で、1 周目の plan-prep は受け付けの ok を空で受けるので、本当の plan-prep は出し直しにならない。
# そこでこの筋書きだけ plan-prep を {prompt: "", resubmit: true} で差し替え、plan-fix-prep は本当に走らせる。受け付けは合わせる元の控えが無いので拒み、
# 出口が status failed（訳 NO_PLAN）を返す（run は completed）
fixture:
  expect: completed
  reached: [plan-fix-prep, plan-writer-fix, plan-accept, finish]
  inputs:
    judgment: '{"units": [{"key": "stats.py mean: 分母が 1 少ない", "label": "block", "disposition": "do-now"}], "questions": []}'
  resolved-text-contains:
    plan-writer-fix: "For `plan`, the rule above that a field you return replaces the previous field as a whole does not apply; `plan` is merged by the rules below."
exec-code: true
plan-prep: {prompt: '', resubmit: true}
plan-writer-fix: {}

name: works-factory-plan
description: |
  計画のブロック（線が include で差し込む部品。単独では回さない）。判定（judge）が切った単位を、直す前に設計として固める:
  単位が名指すファイルを機械で実測して構造の目（道具なしの別の会話）が直しが構造を汚すかを判定し、修正案の役が項目ごとに
  書いてよい範囲・受け入れテスト・定石と構造の行への従うか外れの訳を書き、受け付けが機械で照らし、波及の一覧（変える名の
  呼び出し元と試験）を機械で出す。案の直し（fix の裁定の後の 1 度）は同じブロックを ruling の入力つきで差し込む（形 replan）。
  事前審査との往復は線が持ち、このブロックは 1 回の案を作って返す。2 往復目からは受けた review を周のフォルダに写し、
  前の周の案と指摘を材料のファイルで渡して新しい会話で直させる（会話の続きでは起こさない）。
  置き場は run の置き場の plan/ の下だけ（周ごとの plan/r<k>/ と、使い回す構造の実測の plan/structure/<鍵>/）。
  返す節 plan は落ちない（中の誤りを捕まえて ready: false と、在って空でない指し札を返す）。

inputs:
  start:
    default: ""
    description: 始めの記録の指し札（線の start の record）。欄 policy_md・thickness・test_cmd・tdd_suite・base_rev・lang を読む
  units:
    default: "[]"
    description: 単位の目録（judge の units。[{id, paths, summary}]）
  judgment:
    default: ""
    description: 受け付けた判定の指し札（judge の judgment。judgment.json と、隣の judge-verify.json・pr-excluded.json）
  world:
    default: "null"
    description: 定石の行の指し札（judge の world。world-row の行の並び）。無ければ null
  spec:
    default: "null"
    description: 仕様の指し札（judge の spec）。無ければ null
  review:
    default: ""
    description: 事前審査の指摘の指し札（plan-review の review。往復の 2 回目から。空の字と null は事前審査がまだ無い）
  ruling:
    default: "[]"
    description: 案の直しで直す項目の番号の字の並び（fix の replan_items）。空でなければ形 replan
  conflicts:
    default: "null"
    description: 申し出と裁定の行の指し札（fix の conflicts。conflicts.json）。案の直しの時だけ

returns: plan
outcome_field: ready

nodes:
  # この差し込みの周の番号 k（plan/r*/ の数 + 1。往復と案の直しを通して数える）と形を決め、置き場 plan/r<k>/ を作る。
  # go は役を起こすか（形 plan は直す義務の単位が在り行き止まりが無い時、形 replan は直す元の案と渡す項目が在る時）
  - id: round
    script: round
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      additionalProperties: false
      required: [round, mode, dir, go]
      properties:
        round: {type: integer, minimum: 1}
        mode: {type: string, enum: [plan, replan]}
        dir: {type: string}
        go: {type: boolean}

  # 段 A の実測。paths の在る単位だけを plan/structure/<鍵>/ で測る（鍵は単位の目録と HEAD）。同じ鍵の控えが在れば測らず目も
  # 起こさない（reused）。案の直しは 1 回目の実測と目の行をそのまま使う
  - id: structure-measure
    script: structure_measure
    runtime: uv
    timeout: 1728000000
    depends_on: [round]
    with:
      dir: $round.output.dir
    output_format:
      type: object
      additionalProperties: false
      required: [structure_file, design_file, eye, reused]
      properties:
        structure_file: {type: string}
        design_file: {type: string}
        eye: {type: boolean}
        reused: {type: boolean}

  # 構造の目の輪。拒否の後は同じ会話で出し直させ、3 回目の拒否で受け付けが done（give_up）を出して輪を抜ける
  # （max_iterations で落とさない）
  - id: structure-eye-loop
    depends_on: [structure-measure]
    when: "$structure-measure.output.eye == true"
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: 'done=$structure-eye-accept.output.done; test "$done" = true'
      nodes:
        - id: structure-eye-prep
          script: eye_prep
          runtime: uv
          timeout: 1728000000
          with:
            structure_file: $structure-measure.output.structure_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt, prompt_file, attempt]
            properties:
              prompt: {type: string}
              prompt_file: {type: string}
              attempt: {type: integer}
        - id: structure-eye
          command: structure-eye
          depends_on: [structure-eye-prep]
          model: opus
          effort: high
          allowed_tools: []
          settingSources: [user]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          mutates_checkout: false
          idle_timeout: 1728000000
          # 行の形は lib/design-row.schema.json から route_reason を除いた物（受け付けが行き先の訳を足す）
          output_format:
            type: object
            required: [rows]
            additionalProperties: false
            properties:
              rows:
                type: array
                items:
                  type: object
                  required: [unit_id, verdict, faces, evidence, reason]
                  additionalProperties: false
                  properties:
                    unit_id: {type: string, minLength: 1}
                    verdict: {type: string, enum: [汚れる, 汚れない]}
                    faces: {type: array, items: {type: integer, minimum: 1, maximum: 6}}
                    evidence: {type: array, items: {type: string}}
                    reason: {type: string, minLength: 1}
                    chosen: {type: string}
                    rejected:
                      type: array
                      items:
                        type: object
                        required: [option, cost]
                        additionalProperties: false
                        properties:
                          option: {type: string}
                          cost: {type: string}
                    chosen_reason: {type: string}
                    route: {type: string, enum: [自分で決める, 人に上げる]}
                    undecided_because: {type: string}
        - id: structure-eye-accept
          script: eye_accept
          runtime: uv
          timeout: 1728000000
          depends_on: [structure-eye]
          with:
            structure_file: $structure-measure.output.structure_file
            design_file: $structure-measure.output.design_file
            reply: $structure-eye.output
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, give_up, reason, attempt]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}
              attempt: {type: integer}

  # 構造の目の控え structure-state.json（返り structure の指し札の先）。目が飛んだ・落ちた・3 回拒まれた周も書く
  # （実測が落ちた・目を起こす周なのに目の受け付けが済んでいない周は status: failed）。使い回しの周は書き直さない
  - id: structure-state
    script: structure_state
    runtime: uv
    timeout: 1728000000
    depends_on: [round, structure-measure, structure-eye-loop]
    trigger_rule: all_done
    with:
      dir: $round.output.dir
    output_format:
      type: object
      additionalProperties: false
      required: [state_file]
      properties:
        state_file: {type: string}

  # 修正案の役が案を書く前に読む、単位の名の波及の一覧（形 replan では作らない）
  - id: ripple-units
    script: ripple_units
    runtime: uv
    timeout: 1728000000
    depends_on: [round]
    when: "$round.output.mode == 'plan' && $round.output.go == true"
    with:
      dir: $round.output.dir
    output_format:
      type: object
      additionalProperties: false
      required: [ripple_file]
      properties:
        ripple_file: {type: string}

  # 修正案の輪。拒否の後は新しい会話で、前の拒否の理由のファイルを材料の頭の 1 行が名指す。3 回目の拒否で受け付けが
  # done（give_up）を出して輪を抜ける（max_iterations で落とさない）
  - id: plan-loop
    depends_on: [round, structure-state, ripple-units]
    trigger_rule: none_failed_min_one_success
    when: "$round.output.go == true"
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: 'done=$plan-accept.output.done; test "$done" = true'
      nodes:
        - id: plan-prep
          script: plan_prep
          runtime: uv
          timeout: 1728000000
          with:
            dir: $round.output.dir
          output_format:
            type: object
            additionalProperties: false
            required: [brief, attempt]
            properties:
              brief: {type: string}
              attempt: {type: integer}
        - id: plan-writer
          command: fix-plan
          depends_on: [plan-prep]
          model: opus
          effort: medium
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          settingSources: [user]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          mutates_checkout: false
          idle_timeout: 1728000000
          # 今の works の blk-plan.yaml の修正案の役の型（plan[] の項目の欄と works の欄、narrows の行の関所の決め手の欄）。
          # 2 往復目からの block への答え block_answers は任意の欄（converge.ANSWER_SCHEMA と同じ形）
          output_format:
            type: object
            additionalProperties: false
            required:
            - plan
            properties:
              plan:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - unit_keys
                  - approach
                  - adds
                  - removes
                  - shrink_first
                  - narrows
                  - route
                  - tests
                  - rewrite_tests
                  - refactor
                  - allowed_paths
                  - out_of_scope
                  properties:
                    unit_keys:
                      type: array
                      minItems: 1
                      items:
                        type: [integer, string]
                        minLength: 1
                        minimum: 1
                    approach:
                      type: string
                      minLength: 20
                    adds:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - kind
                        - name
                        - canonical
                        properties:
                          kind:
                            type: string
                            enum:
                            - function
                            - record_field
                            - guard
                            - prompt
                            - doc
                            - cli
                            - arm
                            - test
                            - config
                            - other
                          name:
                            type: string
                            minLength: 1
                          canonical:
                            type: string
                            minLength: 4
                    removes:
                      type: array
                      items:
                        type: string
                        minLength: 1
                    shrink_first:
                      type: string
                      minLength: 20
                    narrows:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - what
                        - why
                        - no_narrow
                        properties:
                          what:
                            type: string
                            minLength: 4
                          why:
                            type: string
                            minLength: 10
                          decided_by:
                            type: string
                          undecided_because:
                            type: string
                          fences:
                            type: array
                            uniqueItems: true
                            items:
                              type: string
                              enum:
                              - external_write
                              - irreversible
                              - policy_doc
                              - widen_protection
                              - web_doubt
                          world:
                            type: string
                          recommend:
                            type: object
                            additionalProperties: false
                            required:
                            - answer
                            - note
                            - why
                            properties:
                              answer:
                                type: string
                                enum:
                                - continue
                                - stop
                              note:
                                type: string
                                minLength: 4
                              why:
                                type: string
                                minLength: 4
                          no_narrow:
                            type: string
                            minLength: 20
                    route:
                      type: string
                      enum:
                      - tdd
                      - direct
                    route_why:
                      type: string
                    tests:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - behavior
                        - path
                        - red_kind
                        - red_why
                        properties:
                          id:
                            type: string
                            pattern: '::'
                          behavior:
                            type: string
                            minLength: 10
                          path:
                            type: string
                            minLength: 10
                          red_kind:
                            type: string
                            enum:
                            - assertion
                            - exception
                          red_why:
                            type: string
                            minLength: 10
                    rewrite_tests:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - behavior
                        - old
                        - new
                        properties:
                          id:
                            type: string
                            pattern: '::'
                          behavior:
                            type: string
                            minLength: 10
                          old:
                            type: string
                            minLength: 4
                          new:
                            type: string
                            minLength: 10
                    refactor:
                      type: object
                      additionalProperties: false
                      required:
                      - declared
                      - why
                      properties:
                        declared:
                          type: boolean
                        why:
                          type: string
                    allowed_paths:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                    out_of_scope:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - glob
                        - why
                        properties:
                          glob:
                            type: string
                            minLength: 1
                          why:
                            type: string
                            minLength: 10
                    structure:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          row:
                            type: string
                            minLength: 1
                          prescription:
                            type: string
                            minLength: 1
                          world:
                            type: string
                            minLength: 1
                          follows:
                            type: boolean
                          deviation:
                            type: string
              block_answers:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [key, handled, how]
                  properties:
                    key: {type: string, minLength: 8}
                    handled: {type: string, enum: [fixed, disputed]}
                    how: {type: string, minLength: 10}
        - id: plan-accept
          script: plan_accept
          runtime: uv
          timeout: 1728000000
          depends_on: [plan-writer]
          with:
            dir: $round.output.dir
            reply: $plan-writer.output
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, give_up, reason, attempt]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}
              attempt: {type: integer}

  # 受け付けた案の項目ごとの波及の一覧 ripple.json（返り ripple の指し札の先）。案が無い周は {items: [], error: <訳>}
  - id: ripple-items
    script: ripple_items
    runtime: uv
    timeout: 1728000000
    depends_on: [round, plan-loop]
    trigger_rule: all_done
    with:
      dir: $round.output.dir
    output_format:
      type: object
      additionalProperties: false
      required: [ripple_file]
      properties:
        ripple_file: {type: string}

  # 返す節。落ちない（中の誤りを捕まえて ready: false と、在って空でない指し札の先を返す。訳は plan/r<k>/collect-error.txt）
  - id: plan
    script: plan_collect
    runtime: uv
    timeout: 1728000000
    depends_on: [round, structure-state, ripple-items]
    trigger_rule: all_done
    with:
      dir: $round.output.dir
    output_format:
      type: object
      additionalProperties: false
      required: [ready, plan, structure, ripple, depth, round]
      properties:
        ready: {type: boolean}
        plan: &pointer
          type: object
          additionalProperties: false
          required: [type, run_id, path]
          properties:
            type: {type: string, enum: [archon_artifact]}
            run_id: {type: string}
            path: {type: string}
        structure: *pointer
        ripple: *pointer
        depth:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [unit_id, depth, why]
            properties:
              unit_id: {type: string}
              depth: {type: string, enum: [軽量, 標準]}
              why: {type: string}
        round: {type: integer, minimum: 1}

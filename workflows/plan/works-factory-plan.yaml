name: works-factory-plan
description: |
  計画のサブグラフ（メイングラフが include する部品。単独では回さない）。判定（judge）が切った単位を、直す前に設計として固める:
  単位が名指すファイルを機械で実測して構造の目（道具なしの別の会話）が直しが構造を汚すかを判定し、修正案の役が項目ごとに
  書いてよい範囲・受け入れテスト・定石と構造の行への従うか外れの訳を書き、受け付けが機械で照らし、波及の一覧（変える名の
  呼び出し元と試験）を機械で出す。案の直し（fix の裁定の後の 1 度）は同じサブグラフを ruling の入力つきで include する（形 replan）。
  事前審査との往復はメイングラフが持ち、このサブグラフは 1 回の案を作って返す。2 往復目からは受けた review を周のフォルダに写し、
  前の周の案と指摘を材料のファイルで渡して新しい会話で直させる（周をまたいで会話を続ける仕組みは止めた Archon に無い）。
  同じ周の中で受け付けに拒まれた後の出し直しは、修正案の役の会話の続きで拒まれた所だけを返させ、受け付けが前の答えと合わせる。
  置き場は run の置き場の plan/ の下だけ（周ごとの plan/r<k>/ と、使い回す構造の実測の plan/structure/<鍵>/）。
  出力ノード plan は落ちない（中の誤りを捕まえて ready: false と、在って空でないポインタを返す）。

inputs:
  start:
    default: ""
    description: 始めの記録のポインタ。欄 policy_md・thickness・test_cmd・tdd_suite・base_rev・review_rev・input.base.rev・lang を読む
  units:
    default: "[]"
    description: 単位の目録（[{id, paths, summary}]）
  judgment:
    default: ""
    description: 受け付けた判定のポインタ（judgment.json と、隣の judge-verify.json・pr-excluded.json）
  world:
    default: "null"
    description: 定石の行のポインタ（world-row の行の並び）。無ければ null
  spec:
    default: "null"
    description: 仕様のポインタ。無ければ null
  review:
    default: ""
    description: 事前審査の指摘のポインタ（往復の 2 回目から。空の字と null は事前審査がまだ無い）
  ruling:
    default: "[]"
    description: 案の直しで直す項目の番号の字の並び。空でなければ形 replan
  conflicts:
    default: "null"
    description: 申し出と裁定の行のポインタ（conflicts.json）。案の直しの時だけ
  prior_failures:
    default: "null"
    description: 前の run で最後まで通らなかった物の行のポインタ（[{where, text}]。lib/carry の prior-failures-in.json の形）。無ければ null

returns: plan
outcome_field: ready

nodes:
  # この差し込みの周の番号 k（plan/r*/ の数 + 1。往復と案の直しを通して数える）と形を決め、置き場 plan/r<k>/ を作る。
  # go は役を起こすか（形 plan は直す義務の単位が在り行き止まりが無い時、形 replan は直す元の案と渡す項目が在る時）。
  # 返す節が dir を束ねるので落ちない（中の誤りは go: false と round.json の why に残す）
  - id: round
    script: round
    runtime: uv
    mutates_checkout: false
    timeout: 1728000000
    output_format:
      type: object
      additionalProperties: false
      required: [round, mode, dir, go]
      properties:
        round: {type: integer, minimum: 1}
        mode: {type: string, enum: [plan, replan]}
        dir: {type: string}
        go: {type: boolean}

  # 段 A の実測。paths の在る単位だけを plan/structure/<鍵>/ で測る（鍵は単位の目録と HEAD）。同じ鍵の控えが在れば測らず目も
  # 起こさない（reused）。案の直しは直す元の周の実測と目の行をそのまま使う。役を起こさない周（go: false）は測らず、目も起こさない
  - id: structure-measure
    script: structure_measure
    runtime: uv
    mutates_checkout: false
    timeout: 1728000000
    depends_on: [round]
    when: "$round.output.go == true"
    with:
      dir: $round.output.dir
    output_format:
      type: object
      additionalProperties: false
      required: [structure_file, design_file, eye, reused]
      properties:
        structure_file: {type: string}
        design_file: {type: string}
        eye: {type: boolean}
        reused: {type: boolean}

  # 構造の目の輪。拒否の後は同じ会話で出し直させ、3 回目の拒否で受け付けが done（give_up）を出して輪を抜ける
  # （max_iterations で落とさない）
  - id: structure-eye-loop
    depends_on: [structure-measure]
    when: "$structure-measure.output.eye == true"
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: 'done=$structure-eye-accept.output.done; test "$done" = true'
      nodes:
        - id: structure-eye-prep
          script: eye_prep
          runtime: uv
          mutates_checkout: false
          timeout: 1728000000
          with:
            structure_file: $structure-measure.output.structure_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt, prompt_file, attempt]
            properties:
              prompt: {type: string}
              prompt_file: {type: string}
              attempt: {type: integer}
        - id: structure-eye
          command: structure-eye
          depends_on: [structure-eye-prep]
          model: opus
          effort: high
          allowed_tools: []
          settingSources: [user]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          mutates_checkout: false
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          # 行の形は lib/design-row.schema.json から route_reason（受け付けが足す）と precedents を除き、route を任意にした物
          # （今の works の structure-eye の型。持ち主との一致は試験が見る）
          output_format:
            type: object
            required: [rows]
            additionalProperties: false
            properties:
              rows:
                type: array
                items:
                  type: object
                  required: [unit_id, verdict, faces, evidence, reason]
                  additionalProperties: false
                  properties:
                    unit_id: {type: string, minLength: 1, pattern: '\S'}
                    verdict: {type: string, enum: [汚れる, 汚れない]}
                    faces: {type: array, items: {type: integer, minimum: 1, maximum: 6}}
                    evidence: {type: array, items: {type: string}}
                    reason: {type: string, minLength: 1, pattern: '\S'}
                    chosen: {type: string}
                    rejected:
                      type: array
                      items:
                        type: object
                        required: [option, cost]
                        additionalProperties: false
                        properties:
                          option: {type: string}
                          cost: {type: string}
                    chosen_reason: {type: string}
                    route: {type: string, enum: [自分で決める, 人に上げる]}
                    undecided_because: {type: string}
        - id: structure-eye-accept
          script: eye_accept
          runtime: uv
          mutates_checkout: false
          timeout: 1728000000
          depends_on: [structure-eye]
          with:
            structure_file: $structure-measure.output.structure_file
            design_file: $structure-measure.output.design_file
            reply: $structure-eye.output
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, give_up, reason, attempt]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}
              attempt: {type: integer}

  # 構造の目の控え structure-state.json（返り structure の指し札の先）。目が飛んだ・落ちた・3 回拒まれた周も書く
  # （実測が落ちた・目を起こす周なのに目の受け付けが済んでいない周・役を起こさない周は status: failed）。使い回しの周は書き直さない
  - id: structure-state
    script: structure_state
    runtime: uv
    mutates_checkout: false
    timeout: 1728000000
    depends_on: [round, structure-measure, structure-eye-loop]
    trigger_rule: all_done
    with:
      dir: $round.output.dir
    output_format:
      type: object
      additionalProperties: false
      required: [state_file]
      properties:
        state_file: {type: string}

  # 修正案の役が案を書く前に読む、単位の名の波及の一覧（形 replan では作らない）
  - id: ripple-units
    script: ripple_units
    runtime: uv
    mutates_checkout: false
    timeout: 1728000000
    depends_on: [round]
    when: "$round.output.mode == 'plan' && $round.output.go == true"
    with:
      dir: $round.output.dir
    output_format:
      type: object
      additionalProperties: false
      required: [ripple_file]
      properties:
        ripple_file: {type: string}

  # 修正案の輪。1 回目は修正案の役 plan-writer が新しい会話で全部の材料から案を書く。拒否の後は出し直しの役 plan-writer-fix が
  # 同じ会話の続きで拒まれた所だけを返し、受け付けが前の答えの控えと合わせてから全体を照らす（振り分けは plan-prep の resubmit。
  # 並んだ層は会話を切るので plan-writer-fix は plan-writer の後ろの層に置く）。3 回目の拒否で受け付けが done（give_up）を出して
  # 輪を抜ける（max_iterations で落とさない）
  - id: plan-loop
    depends_on: [round, structure-state, ripple-units]
    trigger_rule: none_failed_min_one_success
    when: "$round.output.go == true"
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: 'done=$plan-accept.output.done; test "$done" = true'
      nodes:
        - id: plan-prep
          script: plan_prep
          runtime: uv
          mutates_checkout: false
          timeout: 1728000000
          with:
            dir: $round.output.dir
            prev: "$LOOP_PREV.plan-accept.output.ok"
          output_format:
            type: object
            additionalProperties: false
            required: [brief, attempt, resubmit]
            properties:
              brief: {type: string}
              attempt: {type: integer}
              resubmit: {type: boolean}
        # 模型・道具・設定は出し直しの役 plan-writer-fix と同じ（merge key の錨 writer_launch）
        - id: plan-writer
          command: fix-plan
          depends_on: [plan-prep]
          when: "$plan-prep.output.resubmit != true"
          <<: &writer_launch
            model: opus
            effort: medium
            allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
            settingSources: [user]
            sandbox: {enabled: true, allowUnsandboxedCommands: false}
            mutates_checkout: false
            idle_timeout: 1728000000
            retry: {max_attempts: 2, on_error: all}
          # 今の works の blk-plan.yaml の修正案の役の型（plan[] の項目の欄と works の欄、narrows の行の関所の決め手の欄）。
          # 2 往復目からの block への答え block_answers は任意の欄（converge.ANSWER_SCHEMA と同じ形）。欄の型は planmarks.FIELD_SCHEMA（depends_on を含む）・FILES_SCHEMA（files）・
          # gatemarks.MARK_SCHEMA・NO_NARROW_SCHEMA の写しで、持ち主との一致は試験が見る
          output_format: &plan_reply
            type: object
            additionalProperties: false
            required:
            - plan
            properties: &plan_reply_props
              plan:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - unit_keys
                  - approach
                  - files
                  - shrink_first
                  - narrows
                  - route
                  - tests
                  - rewrite_tests
                  - refactor
                  - allowed_paths
                  - out_of_scope
                  properties:
                    unit_keys:
                      type: array
                      minItems: 1
                      items:
                        type: [integer, string]
                        minLength: 1
                        minimum: 1
                    approach:
                      type: string
                      minLength: 20
                    files:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - path
                        - op
                        - responsibility
                        - symbols
                        - canonical
                        properties:
                          path:
                            type: string
                            minLength: 1
                          op:
                            type: string
                            enum:
                            - create
                            - modify
                            - delete
                            - rename
                          from:
                            type: string
                            minLength: 1
                          responsibility:
                            type: string
                            minLength: 4
                          symbols:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              required:
                              - name
                              - kind
                              - change
                              properties:
                                name:
                                  type: string
                                  minLength: 1
                                kind:
                                  type: string
                                  enum:
                                  - function
                                  - record_field
                                  - guard
                                  - prompt
                                  - doc
                                  - cli
                                  - arm
                                  - test
                                  - config
                                  - other
                                change:
                                  type: string
                                  enum:
                                  - add
                                  - remove
                                why: &id001
                                  type: string
                                  minLength: 10
                                replaced_by:
                                  type: string
                                  minLength: 1
                          canonical:
                            type: string
                            minLength: 4
                          why: *id001
                          replaced_by:
                            type: string
                            minLength: 1
                    shrink_first:
                      type: string
                      minLength: 20
                    narrows:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - what
                        - why
                        - no_narrow
                        properties:
                          what:
                            type: string
                            minLength: 4
                          why:
                            type: string
                            minLength: 10
                          decided_by:
                            type: string
                          undecided_because:
                            type: string
                          fences:
                            type: array
                            uniqueItems: true
                            items:
                              type: string
                              enum:
                              - external_write
                              - irreversible
                              - policy_doc
                              - widen_protection
                              - web_doubt
                          world:
                            type: string
                          recommend:
                            type: object
                            additionalProperties: false
                            required:
                            - answer
                            - note
                            - why
                            properties:
                              answer:
                                type: string
                                enum:
                                - continue
                                - stop
                              note:
                                type: string
                                minLength: 4
                              why:
                                type: string
                                minLength: 4
                          no_narrow:
                            type: string
                            minLength: 20
                    route:
                      type: string
                      enum:
                      - tdd
                      - direct
                    route_why:
                      type: string
                    tests:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - behavior
                        - path
                        - red_kind
                        - red_why
                        properties:
                          id:
                            type: string
                            pattern: '::'
                          behavior:
                            type: string
                            minLength: 10
                          path:
                            type: string
                            minLength: 10
                          red_kind:
                            type: string
                            enum:
                            - assertion
                            - exception
                          red_why:
                            type: string
                            minLength: 10
                    rewrite_tests:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - behavior
                        - old
                        - new
                        properties:
                          id:
                            type: string
                            pattern: '::'
                          behavior:
                            type: string
                            minLength: 10
                          old:
                            type: string
                            minLength: 4
                          new:
                            type: string
                            minLength: 10
                    refactor:
                      type: object
                      additionalProperties: false
                      required:
                      - declared
                      - why
                      properties:
                        declared:
                          type: boolean
                        why:
                          type: string
                    allowed_paths:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                    out_of_scope:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - glob
                        - why
                        properties:
                          glob:
                            type: string
                            minLength: 1
                          why:
                            type: string
                            minLength: 10
                    structure:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          row:
                            type: string
                            minLength: 1
                          prescription:
                            type: string
                            minLength: 1
                          world:
                            type: string
                            minLength: 1
                          follows:
                            type: boolean
                          deviation:
                            type: string
                    depends_on:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - unit
                        - receives
                        properties:
                          unit:
                            type:
                            - integer
                            - string
                            minLength: 1
                            minimum: 1
                          receives:
                            type: array
                            minItems: 1
                            items:
                              type: string
                              minLength: 1
              block_answers:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [key, handled, how]
                  properties:
                    key: {type: string, minLength: 8}
                    handled: {type: string, enum: [fixed, disputed]}
                    how: {type: string, minLength: 10}
        # 拒まれた後の出し直しの役（plan-writer の会話の続き）。型は plan-writer の型から required を外し、whole_plan を足した物
        - id: plan-writer-fix
          prompt: 前の回の返答は受け付けで拒まれた。この会話の続きで直す。指示書 `$plan-prep.output.brief` を Read で全部読み、その指示に従え。返すのは指示書の返し方の形の JSON だけ。
          depends_on: [plan-prep, plan-writer]
          trigger_rule: none_failed_min_one_success
          when: "$plan-prep.output.resubmit == true"
          <<: *writer_launch
          output_format:
            <<: *plan_reply
            required: []
            properties:
              <<: *plan_reply_props
              whole_plan: {type: boolean}
        - id: plan-accept
          script: plan_accept
          runtime: uv
          mutates_checkout: false
          timeout: 1728000000
          depends_on: [plan-writer, plan-writer-fix]
          trigger_rule: none_failed_min_one_success
          with:
            status_guarded: true
            dir: $round.output.dir
            reply: {from: "$plan-writer.output", if_skipped: null}
            fix_reply: {from: "$plan-writer-fix.output", if_skipped: null}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, give_up, reason, attempt]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}
              attempt: {type: integer}

  # 受け付けた案の項目ごとの波及の一覧 ripple.json（返り ripple の指し札の先）。案が無い周は {items: [], error: <訳>}
  - id: ripple-items
    script: ripple_items
    runtime: uv
    mutates_checkout: false
    timeout: 1728000000
    depends_on: [round, plan-loop]
    trigger_rule: all_done
    with:
      dir: $round.output.dir
    output_format:
      type: object
      additionalProperties: false
      required: [ripple_file]
      properties:
        ripple_file: {type: string}

  # 読んだ証拠: この周に起こした修正案の役が、機械が渡したパス（材料・前の拒否の理由・方針の文書）を読んだかを、隔離した設定の
  # フックの記録から集めて周のフォルダに書く（受け付けの条件にしない。返す節に結ばない。役を起こさない周も、輪が落ちた周も走って
  # 書く。周を開く節が落ちた周は dir が無いので飛ぶ（one_success）。落ちない）
  - id: plan-reads
    script: plan_reads
    runtime: uv
    mutates_checkout: false
    timeout: 1728000000
    depends_on: [round, plan-loop]
    trigger_rule: one_success
    with:
      dir: $round.output.dir
    output_format:
      type: object
      additionalProperties: false
      required: [ok, missing, index_file, reason]
      properties:
        ok: {type: boolean}
        missing: {type: array, items: {type: string}}
        index_file: {type: string}
        reason: {type: string}

  # 返す節。落ちない（中の誤りを捕まえて ready: false と、在って空でない指し札の先を返す。誤りの訳は plan/r<k>/collect-error.txt）
  - id: plan
    script: plan_collect
    runtime: uv
    mutates_checkout: false
    timeout: 1728000000
    depends_on: [round, structure-state, ripple-items]
    trigger_rule: all_done
    with:
      dir: $round.output.dir
    output_format:
      type: object
      additionalProperties: false
      required: [ready, plan, structure, ripple, depth, round]
      properties:
        ready: {type: boolean}
        plan: &pointer
          type: object
          additionalProperties: false
          required: [type, run_id, path]
          properties:
            type: {type: string, enum: [archon_artifact]}
            run_id: {type: string}
            path: {type: string}
        structure: *pointer
        ripple: *pointer
        depth:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [unit_id, depth, why]
            properties:
              unit_id: {type: string}
              depth: {type: string, enum: [軽量, 標準]}
              why: {type: string}
        round: {type: integer, minimum: 1}

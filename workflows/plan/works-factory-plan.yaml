name: works-factory-plan
description: |
  修正案の block（docs/design/plan.md）。判定が切った直す単位を、直す前に設計として固める。修正案の役が項目ごとに書いてよい範囲・受け入れテスト・
  定石と構造の目の行への答えを書き、受け付けが機械で照らし、波及の一覧（変える名の呼び出し元と試験）を機械で出す。承認済みの案の一部の項目を直す
  「案の直し」は、同じ block を ruling つきで回す（形 replan）。審査との往復の記録と止めは、この block を呼ぶ graph が持ち、この block は前の周を port prior で
  受けて 1 周分の案を作る。拒まれた後の出し直しは、修正案の役の会話の続きで拒まれた所だけを返させ、受け付けが前の答えと合わせる。
  出口 finish は落ちない（中の誤りを捕まえて status failed と、在って空でない pointer を出す）。単独の run でも、graph から include されても回る

inputs:
  judgment: {default: '', description: 'json(shared:judgment.schema.json): 受け付けた判定（欄 units・questions・framing・one_shot・one_shot_closes・precedents を読む）。pointer・パス・値のどれか。空の字は判定が無い（形 plan では役を起こさない。形 replan では処方とライブラリの文書と項目の brief だけに使う）'}
  units: {default: '[]', description: 'json(shared:units.schema.json): 直しの単位の目録の配列 [{id, paths, summary}]。空の配列は目録が無い'}
  answer_ties: {default: '', description: 'json(shared:answer-ties.schema.json): 依頼の答えを判定の問いと単位に結んだ行のファイル（answer-ties.json の形）。空は結びが無い（答えを字の一致だけで数える）'}
  materials: {default: '', description: 'json(shared:materials-state.schema.json): 判定の素材の状態のファイル（素材の名 → {status, …}）。空は素材の状態が無い'}
  answers: {default: '[]', description: 'json(shared:request-answers.schema.json): 依頼の answers の行の配列 [{question, text, …}]。空の配列は答えが無い'}
  takes_push: {default: 'false', description: 'flag: 判定が保留にした分かれ道の問いの推しを、答えとして数えるか（無人の run の方針。直す義務の数えに効く）'}
  verify: {default: '', description: 'json(shared:verify.schema.json): 判定の単位の裏取りの申し送り（{units: [...], synergy: {...}}）。空は申し送りが無い'}
  excluded: {default: '', description: 'json(shared:excluded.schema.json): 並行 PR と重なるので外した範囲のファイル。空は外した範囲が無い'}
  depth_record: {default: '', description: 'json(shared:depth-record.schema.json): run の頭の深さの控え（行ごとの未知の種類と引用）。空は控えが無い'}
  decisions: {default: '', description: 'json(shared:material.schema.json): 決定記録の突合の返答（reply.settled が決着済みの論点）。空は突合が無い'}
  world_rows: {default: '', description: 'jsonl(lib:world-row.schema.json): 世界の解の行の JSON Lines（world.jsonl）。空は行が無い'}
  structure: {default: '', description: 'json(shared:structure-state.schema.json): 構造の目の控え（{status, reason, design_file, skipped, …}）。空は構造の目の行が無い'}
  spec: {default: '', description: 'json(shared:spec.schema.json): 固めた仕様（requirements・acceptance を持つ spec.json）。空は仕様が無い'}
  spec_doc: {default: '', description: 'file: 人と固めた仕様の本文（設計書の本文と表の md。字のまま貼る）。空は渡されていない'}
  policy: {default: '', description: 'file: 人の方針の文書の固めた写し。空は方針の文書が無い'}
  prior_failures: {default: '[]', description: 'json(shared:prior-failures.schema.json): 前の run で最後まで通らなかった物の行の配列 [{where, text}]。空の配列は無い'}
  prior: {default: '', description: 'json(shared:plan-prior.schema.json): 前の周（形 plan では直前の計画の周と、それへの事前審査。形 replan では直す元の承認済みの案の周）。pointer・パス・値のどれか。空の字は前の周が無い（1 周目）'}
  ruling: {default: '[]', description: 'json(shared:replan-items.schema.json): 案の直しで直す項目の番号（1 始まり。整数か数字の字）の配列。空の配列は案の直しでない（形 plan）'}
  conflicts: {default: '', description: 'json(lib:conflicts.schema.json): 項目の誤りの申し出と、その裁定の行のファイル（{items: [...]}）。形 replan だけが読む。空は行が無い'}
  base: {default: '', description: 'text: 修正前の HEAD の版（受け入れテストの定義と修正前のテストの中身を引く版）。空は HEAD'}
  review_rev: {default: '', description: 'text: 役が読む版。空は base、それも空なら HEAD'}
  diff_base: {default: '', description: 'text: 材料の BASE（入口の差分の根）。空は base、それも空なら読む版'}
  routes: {default: 'auto', description: 'choice(auto|spec): 行の route の決め方。auto は今の指示のまま。spec は固めた仕様（入力 spec の JSON か spec_doc の本文）の「TDD で直す所」が名指す行だけを tdd にし、ほかを direct にする'}
  lang: {default: '', description: 'text: 人に見せる欄（approach・shrink_first・各 why・why_not・no_narrow・undecided_because・world・deviation・narrows の what・recommend の note と why・block_answers の how・handoff）の言語。空は依頼の言語'}
returns: finish
outcome_field: ok

nodes:
  # 周を開く。port を読み、周のフォルダ r<k>/ を作り、形（ruling が空でなければ replan）と役を起こすかを決める。落ちない
  - id: intake
    script: intake
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [go, mode, round, reason]
      properties:
        go: {type: boolean}
        mode: {type: string, enum: [plan, replan]}
        round: {type: integer, minimum: 1}
        reason: {type: string}

  # 修正案の役が案を書く前に読む、単位の名の波及の一覧（形 replan では作らない）
  - id: ripple-units
    script: ripple_units
    runtime: uv
    mutates_checkout: false
    depends_on: [intake]
    when: "$intake.output.go == true && $intake.output.mode == 'plan'"
    output_format:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: {type: boolean}

  # 修正案の輪。1 回目は修正案の役 plan-writer が全部の材料から案を書く。拒否の後は出し直しの役 plan-writer-fix が同じ会話の続きで拒まれた所だけを
  # 返し、受け付けが前の答えの控えと合わせてから全体を照らす（振り分けは plan-prep の resubmit。会話を切らないよう、続きの役の直前の層は node 1 つ）。
  # 拒否の回数では諦めず、受け付けの網（rolekit.NET_AFTER。輪の max_iterations と同じ数で、届けば工場の不具合）の回の拒否で受け付けが done・give_up を
  # 出して輪を抜ける（max_iterations で落とさない）
  - id: plan-loop
    depends_on: [intake, ripple-units]
    trigger_rule: none_failed_min_one_success
    when: "$intake.output.go == true"
    loop_group:
      max_iterations: 20
      fresh_context: false
      until_bash: 'done=$plan-accept.output.done; test "$done" = true'
      nodes:
        - id: plan-prep
          script: plan_prep
          runtime: uv
          mutates_checkout: false
          with:
            prev: "$LOOP_PREV.plan-accept.output.ok"
          output_format:
            type: object
            additionalProperties: false
            required: [prompt, resubmit]
            properties:
              prompt: {type: string}
              resubmit: {type: boolean}
        # 模型・道具・設定は出し直しの役 plan-writer-fix と同じ（merge key の錨 writer_launch）
        - id: plan-writer
          prompt: "$plan-prep.output.prompt"
          depends_on: [plan-prep]
          when: "$plan-prep.output.resubmit != true"
          <<: &writer_launch
            model: '@wf-plan-writer'
            allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
            settingSources: [user]
            sandbox: {enabled: true, allowUnsandboxedCommands: false}
            mutates_checkout: false
            idle_timeout: 1728000000
            retry: {max_attempts: 2, on_error: all}
          # 修正案の役の型（plan[] の項目の欄と works の欄、narrows の行の決め手の欄）。2 往復目からの答えの要る穴への答え block_answers は任意の欄
          # （converge.ANSWER_SCHEMA の写し）。次の周の自分へ運ぶ引き継ぎのメモ handoff も任意の欄（handoff.SCHEMA の写し）。欄の型は
          # planmarks.FIELD_SCHEMA（depends_on を含む）・FILES_SCHEMA・gatemarks.MARK_SCHEMA・NO_NARROW_SCHEMA の写しで、持ち主との一致は試験が見る。
          # 型は出し直しの役 plan-writer-fix と同じ（違うと会話の続きの最初の要求でキャッシュが効かない。#832）。そのため根の欄 plan を
          # 要ると書かず、出し直しの役だけが書く whole_plan も持つ。plan の欠けと 1 回目の whole_plan は受け付けが拒む（src/files.py の REQUIRED・src/take.py の accept）
          output_format: &plan_reply
            type: object
            additionalProperties: false
            required: []
            properties:
              plan:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - unit_keys
                  - approach
                  - files
                  - shrink_first
                  - narrows
                  - route
                  - tests
                  - rewrite_tests
                  - refactor
                  - allowed_paths
                  - out_of_scope
                  properties:
                    unit_keys:
                      type: array
                      minItems: 1
                      items:
                        type: [integer, string]
                        minLength: 1
                        minimum: 1
                    approach:
                      type: string
                      minLength: 20
                    files:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - path
                        - op
                        - responsibility
                        - symbols
                        - home
                        - considered
                        properties:
                          path:
                            type: string
                            minLength: 1
                          op:
                            type: string
                            enum:
                            - create
                            - modify
                            - delete
                            - rename
                          from:
                            type: string
                            minLength: 1
                          responsibility:
                            type: string
                            minLength: 4
                          symbols:
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              required:
                              - name
                              - change
                              properties:
                                name:
                                  type: string
                                  minLength: 1
                                change:
                                  type: string
                                  enum:
                                  - add
                                  - remove
                                why: &id001
                                  type: string
                                  minLength: 10
                                replaced_by:
                                  type: string
                                  minLength: 1
                          home:
                            type: object
                            additionalProperties: false
                            required:
                            - concept
                            - why
                            properties:
                              concept:
                                type: string
                                minLength: 1
                              why:
                                type: string
                                minLength: 1
                          considered:
                            type: array
                            minItems: 1
                            items:
                              type: object
                              additionalProperties: false
                              required:
                              - path
                              - why_not
                              properties:
                                path:
                                  type: string
                                  minLength: 1
                                why_not: *id001
                          why: *id001
                          replaced_by:
                            type: string
                            minLength: 1
                    shrink_first:
                      type: string
                      minLength: 20
                    narrows:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - what
                        - why
                        - no_narrow
                        properties:
                          what:
                            type: string
                            minLength: 4
                          why:
                            type: string
                            minLength: 10
                          decided_by:
                            type: string
                          undecided_because:
                            type: string
                          fences:
                            type: array
                            uniqueItems: true
                            items:
                              type: string
                              enum:
                              - external_write
                              - irreversible
                              - policy_doc
                              - widen_protection
                              - web_doubt
                          world:
                            type: string
                          recommend:
                            type: object
                            additionalProperties: false
                            required:
                            - answer
                            - note
                            - why
                            properties:
                              answer:
                                type: string
                                enum:
                                - continue
                                - stop
                              note:
                                type: string
                                minLength: 4
                              why:
                                type: string
                                minLength: 4
                          no_narrow:
                            type: string
                            minLength: 20
                    route:
                      type: string
                      enum:
                      - tdd
                      - direct
                      - static
                      - tidy
                      - pin
                    route_why:
                      type: string
                    tests:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - behavior
                        - path
                        - red_kind
                        - red_why
                        properties:
                          id:
                            type: string
                            pattern: '::'
                          behavior:
                            type: string
                            minLength: 10
                          path:
                            type: string
                            minLength: 10
                          red_kind:
                            type: string
                            enum:
                            - assertion
                            - exception
                          red_why:
                            type: string
                            minLength: 10
                    rewrite_tests:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - behavior
                        - old
                        - new
                        properties:
                          id:
                            type: string
                            pattern: '::'
                          behavior:
                            type: string
                            minLength: 10
                          old:
                            type: string
                            minLength: 4
                          new:
                            type: string
                            minLength: 10
                    refactor:
                      type: object
                      additionalProperties: false
                      required:
                      - declared
                      - why
                      properties:
                        declared:
                          type: boolean
                        why:
                          type: string
                    allowed_paths:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                    out_of_scope:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - glob
                        - why
                        properties:
                          glob:
                            type: string
                            minLength: 1
                          why:
                            type: string
                            minLength: 10
                    structure:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          row:
                            type: string
                            minLength: 1
                          prescription:
                            type: string
                            minLength: 1
                          world:
                            type: string
                            minLength: 1
                          follows:
                            type: boolean
                          deviation:
                            type: string
                    depends_on:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - unit
                        - receives
                        properties:
                          unit:
                            type:
                            - integer
                            - string
                            minLength: 1
                            minimum: 1
                          receives:
                            type: array
                            minItems: 1
                            items:
                              type: string
                              minLength: 1
              block_answers:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [key, handled, how]
                  properties:
                    key: {type: string, minLength: 8}
                    handled: {type: string, enum: [fixed, disputed]}
                    how: {type: string, minLength: 10}
              handoff:
                type: object
                additionalProperties: false
                required: [read, kept, set_aside, open]
                properties:
                  read:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [path, lines, why]
                      properties:
                        path: {type: string, minLength: 1}
                        lines: {type: string, minLength: 1}
                        why: {type: string, minLength: 1}
                  kept:
                    type: array
                    items: {type: string, minLength: 1}
                  set_aside:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [option, why]
                      properties:
                        option: {type: string, minLength: 1}
                        why: {type: string, minLength: 1}
                  open:
                    type: array
                    items: {type: string, minLength: 1}
              whole_plan: {type: boolean}
              # 人の答えや依頼が照らせと指した文書を読めない時の申し出（steps.CANNOT_READ）。在れば受け付けは案を照らさずに止める
              cannot_read:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [path, why]
                  properties:
                    path: {type: string, minLength: 1}
                    why: {type: string, minLength: 10}
        - id: plan-fix-prep
          script: fix_prep
          runtime: uv
          mutates_checkout: false
          depends_on: [plan-prep, plan-writer]
          trigger_rule: none_failed_min_one_success
          when: "$plan-prep.output.resubmit == true"
          output_format:
            type: object
            additionalProperties: false
            required: [prompt]
            properties:
              prompt: {type: string, minLength: 1}
        # 拒まれた後の出し直しの役（plan-writer の会話の続き）。型は plan-writer の型と同じ（#832）
        - id: plan-writer-fix
          prompt: "$plan-fix-prep.output.prompt"
          depends_on: [plan-prep, plan-fix-prep]
          when: "$plan-prep.output.resubmit == true"
          <<: *writer_launch
          output_format: *plan_reply
        - id: plan-accept
          script: plan_accept
          runtime: uv
          mutates_checkout: false
          depends_on: [plan-writer, plan-writer-fix]
          trigger_rule: none_failed_min_one_success
          with:
            reply: {from: "$plan-writer.output", if_skipped: null}
            fix_reply: {from: "$plan-writer-fix.output", if_skipped: null}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, give_up, reason, attempt]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}
              attempt: {type: integer}

  # 受け付けた案の項目ごとの波及の一覧 ripple.json。案が無い周は {items: [], error: <訳>}
  - id: ripple-items
    script: ripple_items
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, plan-loop]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: {type: boolean}

  # 出口。落ちない（中の誤りを捕まえて status failed と、在って空でない pointer の先を返す。誤りの訳は r<k>/finish-error.txt）
  - id: finish
    script: finish
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, ripple-items]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, status, reason, mode, round, owed, plan, fix_plan, reply, handoff, replan, ripple, rejects, gave_up, report]
      properties:
        ok: {type: boolean}
        status:
          type: string
          enum: [ok, nothing_owed, held, gave_up, failed]
        reason: {type: string}
        mode: {type: string, enum: [plan, replan]}
        round: {type: integer, minimum: 1}
        owed:
          type: array
          items: {type: string}
        plan:
          <<: &pointer_or_null
            type: [object, 'null']
            additionalProperties: false
            required: [type, run_id, path]
            properties: &pointer_fields
              type: {type: string, enum: [archon_artifact]}
              run_id: {type: string}
              path: {type: string}
          description: 'json(shared:plan-fields.schema.json): 修正案の欄の控え（plan-fields.json。案が無い周は fields が空）。lib が読めず照らせない出口は null'
        fix_plan:
          <<: *pointer_or_null
          description: 'json(shared:fix-plan.schema.json): 承認する修正案の出力（p2.fix_plan.json）。受けた案が無ければ null'
        reply:
          <<: *pointer_or_null
          description: 'json(shared:plan-reply.schema.json): 受け付けた修正案（reply.json。事前審査が審査する物）。受けた案が無ければ null'
        handoff:
          <<: *pointer_or_null
          description: 'json(shared:handoff.schema.json): 引き継ぎのメモ（handoff.json）。無ければ null'
        replan:
          <<: *pointer_or_null
          description: 'json(shared:replan.schema.json): 案の直しの行（replan.json。形 replan の時だけ）。無ければ null'
        ripple:
          <<: *pointer_or_null
          description: 'json(shared:ripple.schema.json): 項目ごとの波及の一覧（ripple.json。案が無い周は items が空で error に訳）。lib が読めず照らせない出口は null'
        rejects:
          type: array
          items:
            type: object
            required: [at, reason]
            properties:
              at: {type: [string, 'null'], description: '拒んだ時刻（ISO 8601。前の版の控えから読み替えた行は null。rolekit.reject_rows）'}
              reason: {type: string}
              kind: {type: string}
        gave_up:
          type: [array, 'null']
          items:
            type: object
            additionalProperties: false
            required: [item, why, ruling]
            properties:
              item: {type: integer}
              why: {type: string}
              ruling: {type: string}
        report:
          type: array
          items: {type: string}

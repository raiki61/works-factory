name: works-factory-structure
description: '構造の目の block（docs/design/structure.md）。直しの単位ごとに、直しが対象のリポジトリの構造を汚すか（書いた意図に反するか、設計の考えを知る場所を増やすか）を、書いた意図と機械の実測を見せた道具なしの目に判じさせる。直す前（修正案の前に単位を見る）と直した後（差分を見る）を mode で選ぶ。汚れると見た単位には推しの避け方を書かせ、決め手を当たっても避け方が決まらない単位だけを人に上げる行にさせる。落ちず、控えと報告の行を返す。単独の run でも、graph から include されても回る'
inputs:
  mode:
    default: before
    description: 'choice(before|after): before は直す前に単位を測って見る。after は base から今の作業ツリーまでの差分を測って見る'
  units:
    default: '[]'
    description: 'json(shared:units.schema.json): 直しの単位の配列 [{id, paths, summary}]。before では paths が空の単位は測らずに skipped に名指す。after では空の配列でよく、その時は差分の全体を 1 つの単位（id は diff）として見る'
  intent:
    default: '[]'
    description: 'json(intent.schema.json): 書いた意図の文書のパスの配列（作業ツリーの根からの相対）。空の配列なら決まった名（ARCHITECTURE.md・AGENTS.md）で探す'
  policy:
    default: ''
    description: 'file: 人が run に固めた方針の文書。空の字は、方針の文書が渡されていない'
  base:
    default: ''
    description: 'text: after の時の直す前の版の commit。before では読まない'
  plan:
    default: ''
    description: 'file: after の時の修正案の欄のファイル（plan-fields.json。欄 fields）。構造の目の避け方から外れた訳を読む。空の字は、修正案が渡されていない。before では読まない'
  lang:
    default: ''
    description: 'text: 人に見せる欄（reason・chosen・chosen_reason・rejected・undecided_because）の言語。空は共通の既定（依頼の言語）'
returns: finish
outcome_field: ok
nodes:
  - id: measure
    script: survey
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [eye, reason]
      properties:
        eye: {type: boolean}
        reason: {type: string}
  - id: structure-eye-loop
    depends_on: [measure]
    when: "$measure.output.eye == true"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: 'done=$structure-eye-accept.output.done; test "$done" = true'
      nodes:
        - id: structure-eye-prep
          script: prep
          runtime: uv
          mutates_checkout: false
          output_format:
            type: object
            additionalProperties: false
            required: [prompt, attempt]
            properties:
              prompt: {type: string, minLength: 1}
              attempt: {type: integer}
        - id: structure-eye
          prompt: "$structure-eye-prep.output.prompt"
          depends_on: [structure-eye-prep]
          model: '@wf-plan-structure'
          allowed_tools: []
          settingSources: [user]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          mutates_checkout: false
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            required: [rows]
            additionalProperties: false
            properties:
              rows:
                type: array
                items:
                  type: object
                  required: [unit_id, verdict, faces, evidence, reason]
                  additionalProperties: false
                  properties:
                    unit_id: {type: string, minLength: 1, pattern: '\S'}
                    verdict: {type: string, enum: [汚れる, 汚れない]}
                    faces: {type: array, items: {type: integer, minimum: 1, maximum: 6}}
                    evidence: {type: array, items: {type: string}}
                    reason: {type: string, minLength: 1, pattern: '\S'}
                    chosen: {type: string}
                    rejected:
                      type: array
                      items:
                        type: object
                        required: [option, cost]
                        additionalProperties: false
                        properties:
                          option: {type: string}
                          cost: {type: string}
                    chosen_reason: {type: string}
                    route: {type: string, enum: [自分で決める, 人に上げる]}
                    undecided_because: {type: string}
                    intent:
                      type: array
                      items:
                        type: object
                        required: [path, quote]
                        additionalProperties: false
                        properties:
                          path: {type: string, minLength: 1, pattern: '\S'}
                          quote: {type: string, minLength: 1, pattern: '\S'}
        - id: structure-eye-accept
          script: take
          runtime: uv
          mutates_checkout: false
          depends_on: [structure-eye]
          with: {reply: $structure-eye.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, give_up, reason, attempt]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}
              attempt: {type: integer}
  - id: finish
    script: finish
    runtime: uv
    mutates_checkout: false
    depends_on: [measure, structure-eye-loop]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, status, reason, structure, after, dirty, escalate, optional, report]
      properties:
        ok: {type: boolean}
        status:
          type: string
          enum: [ok, failed]
        reason: {type: string}
        structure:
          type: [object, 'null']
          properties:
            type:
              type: string
              enum: [archon_artifact]
            run_id: {type: string}
            path: {type: string}
        after:
          type: [object, 'null']
          properties:
            type:
              type: string
              enum: [archon_artifact]
            run_id: {type: string}
            path: {type: string}
        dirty: {type: integer}
        escalate: {type: integer}
        optional:
          type: array
          items:
            type: object
            properties:
              node: {type: string}
              bare: {type: boolean}
        report:
          type: array
          items: {type: string}

name: works-factory-structure
description: |
  構造のサブグラフ（メイングラフが include する部品。単独では回さない）。判定が切った単位が名指すファイルを機械で実測し（段 A）、
  構造の目（道具なしの別の会話）が直しが構造を汚すかを単位ごとに判定して、構造の目の控えを 1 つ返す。run に 1 回だけ走る
  （単位が変わるのは再審の後だけで、その後に計画は走らない。元の works の blk-structure）。
  置き場は run の置き場の structure/ の下だけ（名の住処は lib/structfile.py）。
  出力ノード structure は落ちない（中の誤りを捕まえて ok: false と、在って空でない控えの指し札を返す）。

inputs:
  start:
    default: ""
    description: 始めの記録のポインタ。欄 policy（固めた方針の文書の写し）を読む
  units:
    default: "[]"
    description: 単位の目録（[{id, paths, summary}]）。paths が空の単位は測らない

returns: structure
outcome_field: ok

nodes:
  # 段 A の実測。paths の在る単位を structure/ で測る
  - id: structure-measure
    script: structure_measure
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [structure_file, design_file, eye]
      properties:
        structure_file: {type: string}
        design_file: {type: string}
        eye: {type: boolean}

  # 構造の目の輪。拒否の後は同じ会話で出し直させ、3 回目の拒否で受け付けが done（give_up）を出して輪を抜ける
  # （max_iterations で落とさない）
  - id: structure-eye-loop
    depends_on: [structure-measure]
    when: "$structure-measure.output.eye == true"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: 'done=$structure-eye-accept.output.done; test "$done" = true'
      nodes:
        - id: structure-eye-prep
          script: eye_prep
          runtime: uv
          mutates_checkout: false
          with:
            structure_file: $structure-measure.output.structure_file
          output_format:
            type: object
            additionalProperties: false
            required: [prompt, prompt_file, attempt]
            properties:
              prompt: {type: string}
              prompt_file: {type: string}
              attempt: {type: integer}
        - id: structure-eye
          command: structure-eye
          depends_on: [structure-eye-prep]
          model: '@wf-plan-structure'
          allowed_tools: []
          settingSources: [user]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          mutates_checkout: false
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          # 行の形は lib/design-row.schema.json から route_reason（受け付けが足す）と precedents を除き、route を任意にした物
          # （今の works の structure-eye の型。持ち主との一致は試験が見る）
          output_format:
            type: object
            required: [rows]
            additionalProperties: false
            properties:
              rows:
                type: array
                items:
                  type: object
                  required: [unit_id, verdict, faces, evidence, reason]
                  additionalProperties: false
                  properties:
                    unit_id: {type: string, minLength: 1, pattern: '\S'}
                    verdict: {type: string, enum: [汚れる, 汚れない]}
                    faces: {type: array, items: {type: integer, minimum: 1, maximum: 6}}
                    evidence: {type: array, items: {type: string}}
                    reason: {type: string, minLength: 1, pattern: '\S'}
                    chosen: {type: string}
                    rejected:
                      type: array
                      items:
                        type: object
                        required: [option, cost]
                        additionalProperties: false
                        properties:
                          option: {type: string}
                          cost: {type: string}
                    chosen_reason: {type: string}
                    route: {type: string, enum: [自分で決める, 人に上げる]}
                    undecided_because: {type: string}
        - id: structure-eye-accept
          script: eye_accept
          runtime: uv
          mutates_checkout: false
          depends_on: [structure-eye]
          with:
            structure_file: $structure-measure.output.structure_file
            design_file: $structure-measure.output.design_file
            reply: $structure-eye.output
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, give_up, reason, attempt]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}
              attempt: {type: integer}

  # 返す節。構造の目の控え structure-state.json を書いて指す（目が飛んだ・落ちた・3 回拒まれた run も書く。実測が落ちた・目を起こす
  # run なのに目の受け付けが済んでいない run は status: failed で ok: false）。落ちない（中の誤りは訳つきの failed の控えと ok: false）。
  # optional は、このブロックの中の節が落ちても線が先へ進めてよい宣言（構造の実測と構造の目。落ちても修正案は構造の目の行なしで進む）。
  # [{node, bare}] の JSON の字で、node は自分の中の節の id かその頭（区切り - で終わる物は頭）、bare はループの中の節で、記録の step に
  # include の前付けの無い素の id で載るか。線は受け皿で受け、include の id の頭を付けて報告へ渡す
  - id: structure
    script: structure_collect
    runtime: uv
    mutates_checkout: false
    depends_on: [structure-measure, structure-eye-loop]
    trigger_rule: all_done
    with:
      optional: '[{"node": "structure-", "bare": false}, {"node": "structure-eye", "bare": true}, {"node": "structure-eye-", "bare": true}]'
    output_format:
      type: object
      additionalProperties: false
      required: [ok, structure]
      properties:
        optional: {type: array}
        ok: {type: boolean}
        structure:
          type: object
          additionalProperties: false
          required: [type, run_id, path]
          properties:
            type: {type: string, enum: [archon_artifact]}
            run_id: {type: string}
            path: {type: string}

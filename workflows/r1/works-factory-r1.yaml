name: works-factory-r1
description: '独立の目 R1 最小性とコメントの block（docs/design/r1.md）。直しを作った役と別の新しい会話で、読むだけの 2 つの役が累積差分を見る: 前段は足したか書き換えたコメントの削除候補と残すコメントの運ぶ事実を、2 段目は累積差分が最小か・処方が正当化されているか・問いの台帳が逃げ道になっていないかを判じる。作り直しが要るかは目の札でなく、組み直す設計の点の名指しの有無で機械が決める。前段が取れなくても 2 段目は回る。落ちず、判定の行と報告の行を出す。単独の run でも、graph から include されても回る'
inputs:
  base: {default: '', description: 'text: 累積差分の根の commit（入口の差分の根。差分の run では PR の根）。累積差分はここから作業ツリーの今の姿まで（未追跡の新しいファイルも入る）。空は HEAD'}
  purpose: {default: '', description: 'text: 凍結した目的の 1 文。空は渡されていない'}
  units: {default: '[]', description: 'json(shared:units.schema.json): 判定が切った根本の単位の目録 [{id, summary, paths}]。空の配列は渡されていない'}
  judgment: {default: '', description: 'json(shared:judgment.schema.json): 判定の出力（judgment.json。役が欄 questions〔問いの台帳〕を Read する）。空は渡されていない'}
  fixes: {default: '[]', description: 'json(shared:fixes.schema.json): この run の修正の単位ごとの結末 [{unit_id, group_id, status, reason}]。空の配列は渡されていない'}
  x_scalars: {default: '{}', description: 'json(shared:scalars.schema.json): 修正役が足した規模の数値の欄（名は x_ で始まる）の object（値は数。形の外の値は入口で落ち、R1 は回らない）。空の object は無い'}
  green: {default: 'true', description: 'flag: 修正の後の最後の試験の緑が認証されたか。偽なら目の指示に「最後のテストの認証が通っていない」の 1 文を足す'}
  checks: {default: '', description: 'file: 最後の試験の証拠の文（走らせ方とログの置き場を書いた md）。空は渡されていない'}
  after: {default: '', description: 'json(shared:structure-after.schema.json): 直した後の構造の実測の控え（名は structure-after.json）。空は測っていない'}
  review: {default: '{}', description: 'json(shared:plan-verdict.schema.json): 修正が使った修正案を審査した事前審査の最後の往復の結論 {round, verdict, blocks, why}。空のオブジェクトは渡されていない'}
  policy: {default: '', description: 'file: 人の方針の文書を run の頭で固めた写し。空は方針の文書が無い'}
  lang: {default: '', description: 'text: 人に見せる欄（candidates の reason・kept の fact・reason・redesign_points・deletions の why・ledger_audit・increments・candidates_note）の言語。空は依頼の言語'}
returns: finish
outcome_field: ok
nodes:
  - id: intake
    script: intake
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [due, reason]
      properties:
        due: {type: boolean}
        reason: {type: string}

  - id: r1-comments-prep
    script: comments_prep
    runtime: uv
    mutates_checkout: false
    depends_on: [intake]
    when: "$intake.output.due == true"
    output_format:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt: {type: string, minLength: 1}

  - id: r1-comments
    prompt: "$r1-comments-prep.output.prompt"
    depends_on: [r1-comments-prep]
    model: '@wf-eyes-read'
    context: fresh
    settingSources: [user]
    sandbox: {enabled: true, allowUnsandboxedCommands: false}
    allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
    mutates_checkout: false
    idle_timeout: 1728000000
    retry: {max_attempts: 2, on_error: all}
    output_format:
      type: object
      required: [candidates, kept]
      additionalProperties: false
      properties:
        candidates:
          type: array
          items:
            type: object
            required: [where, comment, same_content_at, reason]
            additionalProperties: false
            properties:
              where: {type: string}
              comment: {type: string}
              same_content_at: {type: string}
              reason: {type: string}
        kept:
          type: array
          items:
            type: object
            required: [where, fact]
            additionalProperties: false
            properties:
              where: {type: string}
              fact: {type: string}

  - id: r1-comments-save
    script: save
    runtime: uv
    mutates_checkout: false
    depends_on: [r1-comments]
    with:
      name: r1-comments
      reply: $r1-comments.output
    output_format:
      type: object
      additionalProperties: false
      required: [saved]
      properties:
        saved: {type: boolean}

  # 削除候補が取れなくても 2 段目を止めない（候補はファイルで読む）
  - id: r1-minimality-prep
    script: minimality_prep
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, r1-comments-save]
    trigger_rule: all_done
    when: "$intake.output.due == true"
    output_format:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt: {type: string, minLength: 1}

  - id: r1-minimality
    prompt: "$r1-minimality-prep.output.prompt"
    depends_on: [r1-minimality-prep]
    model: '@wf-eyes-core'
    context: fresh
    settingSources: [user]
    sandbox: {enabled: true, allowUnsandboxedCommands: false}
    allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
    mutates_checkout: false
    idle_timeout: 1728000000
    retry: {max_attempts: 2, on_error: all}
    output_format:
      type: object
      required: [status, reason, deletions, ledger_audit, increments]
      additionalProperties: false
      properties:
        status: {type: string, enum: [pass, fix-needed, redesign-needed, unverifiable]}
        reason: {type: string, minLength: 1}
        # 零処方で閉じない設計の点の名指し。在れば機械が redesign-needed にし、無い redesign-needed は fix-needed に倒す（lib/eyekit.py の verdict_row）
        redesign_points: {type: array, items: {type: string, minLength: 1}}
        deletions:
          type: array
          items:
            type: object
            required: [where, why]
            additionalProperties: false
            properties:
              # where の minLength: 照合される側（p2.diagnose.carried_r1[].where）は minLength を持つのに、正本のこちらが持たないと、空文字が schema を通ったうえで数える口から黙って落ち、次の周の judge はその候補について 1 行も書かなくてよくなる（実測 2026-09-16・静的）
              where:
                type: string
                minLength: 1
              why: {type: string}
        ledger_audit: {type: array, items: {type: string}}
        increments: {type: array, items: {type: string}}
        candidates_note: {type: string}

  - id: r1-minimality-save
    script: save
    runtime: uv
    mutates_checkout: false
    depends_on: [r1-minimality]
    with:
      name: r1-minimality
      reply: $r1-minimality.output
    output_format:
      type: object
      additionalProperties: false
      required: [saved]
      properties:
        saved: {type: boolean}

  - id: finish
    script: finish
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, r1-comments-save, r1-minimality-save]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, status, reason, verdict, questions, report]
      properties:
        ok: {type: boolean}
        status:
          type: string
          enum: [ran, failed]
        reason: {type: string}
        verdict:
          type: object
          additionalProperties: false
          required: [status, reason]
          properties:
            status:
              type: string
              enum: [pass, fix-needed, redesign-needed, unverifiable]
            reason: {type: string}
        questions:
          type: array
          items: {type: string}
        report:
          type: array
          items: {type: string}

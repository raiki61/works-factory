# 筋書き pass: 判定の道を通しで。並行 PR は機械で決まり、前提・目的・素材 1 本・診断を通り、開いた単位の在る判定で返る。
# 筋書きが見るのは配線だけ（振る舞いは tests/workflows/test_judge.py の子のプロセスの試験と lib/tests/test_judge_accept.py）
fixture:
  expect: completed
  reached: [intake, head-depth-accept, pr-scan, premises-accept, purpose-accept, material-route, prior-decisions-accept, diagnose-prep, diagnose-accept, verify-prep, verify-merge, verdict]
intake: {go: true, mode: judge, spec: false, world: false, verify: false, reason: ''}
head-depth-prep: {go: true, brief_file: /tmp/judge/depth-head-brief.md, reason: ''}
head-depth-reject: {reason: '', "lang_line": ""}
head-depth:
  depth: 標準
  why: 筋書きの役は標準を返す
  items: []
head-depth-accept: &id001 {ok: true, done: true, reason: ''}
pr-scan: {go: true, go_role: false, reason: 開いている PR に交差が無い}
premises:
  constraints: []
premises-reject: {reason: '', "lang_line": ""}
premises-accept: *id001
purpose-prep: {go: true, brief_file: /tmp/judge/purpose-brief.md, reason: ''}
purpose:
  purpose_text: 平均と範囲の関数が正しい値を返す
  source: ①PR 説明
  known_weaknesses: []
  source_files: []
  means: []
purpose-reject: {reason: '', "lang_line": ""}
purpose-accept: *id001
material-route: {prior_decisions: true, purpose_review: false, local_review: false, consistency_bypass: false, hygiene: false, external_standards: false, procedure_trace: false, gate_efficacy: false, test_double_fidelity: false, main_path_observation: false, provenance: false, reason: 差分の空の run で依頼の在る入口}
prior-decisions-prep: {brief_file: /tmp/judge/material-prior-decisions-brief.md, brief: '', review_md: '', repo_review_md: '', reason: '', "lang_line": ""}
prior-decisions:
  material: {status: clean, checked: 先行議論を探したが今回の変更と食い違う決定は無い}
  checked: true
  searched: [リポジトリの履歴]
  settled: []
prior-decisions-accept: *id001
diagnose-prep: {go: true, brief_file: /tmp/judge/diagnose-brief.md, review_md: /tmp/lib/REVIEW.md, repo_review_md: '', reason: ''}
diagnose:
  units:
  - {key: 'stats.py mean: 分母が len(xs) - 1', label: block}
  questions: []
  framing: 分母の取り違え
  one_shot: 分母を len(xs) にする
  materials_missing: []
  carried_r1: []
  one_shot_closes: ['stats.py mean: 分母が len(xs) - 1']
  precedents: []
diagnose-reject: {reason: '', "lang_line": ""}
diagnose-accept: *id001
verify-prep: {go: false, prompt_file: '', reason: 開いた単位が 2 つ未満, "lang_line": ""}
verify-merge: {ok: true, reason: ''}
verdict:
  depth: 標準
  depth_why: 筋書きの stub
  ready: true
  stop_reason: ''
  units:
  - id: 'stats.py mean: 分母が len(xs) - 1'
    paths: [stats.py]
    summary: 分母の取り違え
  judgment: {type: archon_artifact, run_id: fixture, path: judge/judgment.json}
  purpose: {type: archon_artifact, run_id: fixture, path: judge/purpose.json}
  world: null
  spec: null
  out_of_purpose: null
  rejudge_verdict: null

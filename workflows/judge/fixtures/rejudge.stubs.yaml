# 筋書き rejudge: 再審の道（入力 objection を与える）。判定の道の役は起きず、再審の役だけが起きる
fixture:
  expect: completed
  inputs: {objection: 単位 1 は clamp の欠陥と同じ根で、分けると二度直す}
  reached: [intake, rejudge-prep, rejudge-accept, verdict]
intake: {go: true, mode: rejudge, spec: false, world: false, verify: false, reason: ''}
rejudge-prep: {go: true, brief_file: /tmp/rejudge/brief.md, reason: ''}
rejudge:
  verdict: 一部採る
  new_facts: 修正役が示した clamp の行は判定の後に見つかった別の現れ
  reason: 異議の半分は判定の見落とし
  units:
  - {key: 'stats.py mean: 分母が len(xs) - 1', label: block}
rejudge-reject: {reason: '', "lang_line": ""}
rejudge-accept: {ok: true, done: true, reason: ''}
verdict:
  depth: 標準
  depth_why: 筋書きの stub
  ready: true
  stop_reason: ''
  units:
  - id: 'stats.py mean: 分母が len(xs) - 1'
    paths: [stats.py]
    summary: 分母の取り違え
  judgment: {type: archon_artifact, run_id: fixture, path: rejudge/judgment.json}
  purpose: {type: archon_artifact, run_id: fixture, path: judge/purpose.json}
  world: null
  spec: null
  out_of_purpose: null
  rejudge_verdict: 一部採る

        lang_line: {type: string}
  - id: judge-verify
    command: judge-verify
    depends_on: [verify-prep]
    when: $verify-prep.output.go == true
    model: opus
    effort: high
    context: fresh
    settingSources: [user]
    allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch, Agent, Write]
    mutates_checkout: false
    sandbox: {enabled: true, allowUnsandboxedCommands: false}
    idle_timeout: 1728000000
    retry: {max_attempts: 2, on_error: all}
    output_format:
      type: object
      additionalProperties: false
      required: [summary]
      properties:
        summary: {type: string, minLength: 10}
  - id: verify-merge
    script: verify
    runtime: uv
    timeout: 1728000000
    depends_on: [verify-prep, judge-verify]
    trigger_rule: all_done
    mutates_checkout: false
    with: {status_guarded: true, stage: merge}
    output_format:
      type: object
      additionalProperties: false
      required: [ok, reason]
      properties:
        ok: {type: boolean}
        reason: {type: string}
  - id: rejudge-prep
    script: rejudge_prep
    runtime: uv
    timeout: 1728000000
    depends_on: [intake]
    when: $intake.output.go == true && $intake.output.mode == 'rejudge'
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [go, brief_file, reason]
      properties:
        go: {type: boolean}
        brief_file: {type: string}
        reason: {type: string}
  - id: rejudge-loop
    depends_on: [rejudge-prep]
    when: $rejudge-prep.output.go == true
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: done=$rejudge-accept.output.done; test "$done" = true
      nodes:
        - id: rejudge-reject
          script: rejects
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          with: {board: rejudge, accept: rejudge}
          output_format:
            type: object
            additionalProperties: false
            required: [reason, lang_line]
            properties: {reason: {type: string}, lang_line: {type: string}}
        - id: rejudge
          command: rejudge
          depends_on: [rejudge-reject]
          model: opus
          effort: high
          context: fresh
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            required: [verdict, new_facts, units]
            additionalProperties: false
            properties:
              verdict:
                type: string
                enum: [採る, 退ける, 一部採る]
              new_facts: {type: string, minLength: 20, pattern: '\S[\s\S]{18,}\S'}
              reason: {type: string}
              units:
                type: array
                items:
                  type: object
                  required: [key, label]
                  additionalProperties: true
                  properties:
                    key: {type: string, minLength: 1, pattern: '\S'}
                    label:
                      type: string
                      enum: [block, suggest, nit, question, info]
                    disposition:
                      type: string
                      enum: [do-now, defer]
                    reason: {type: string}
                    reopen_evidence: {type: string}
                    origin_analysis: {type: string}
                    why_chain:
                      type: array
                      items: {type: string}
                    prescriptions:
                      type: array
                      items: {type: string}
                    closed_note: {type: string}
                    class_query:
                      type: object
                      required: [how, counts, total]
                      additionalProperties: false
                      properties:
                        how:
                          type: object
                          required: [patterns, paths, count]
                          additionalProperties: false
                          properties:
                            patterns:
                              type: array
                              minItems: 1
                              maxItems: 20
                              items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]*[^\s\x00][^\n\r\x00]*$'}
                            fixed: {type: boolean}
                            paths:
                              type: array
                              minItems: 1
                              maxItems: 50
                              items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]*[^\s\x00][^\n\r\x00]*$'}
                            count:
                              type: string
                              enum: [lines, files]
                            untracked: {type: boolean}
                            ignore_case: {type: boolean}
                            word: {type: boolean}
                        counts:
                          type: string
                          enum: [defects, population]
                        total: {type: integer, minimum: 0}
                        note: {type: string}
                        hits:
                          type: array
                          maxItems: 20
                          items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]*[^\s\x00][^\n\r\x00]*$'}
                        misses:
                          type: array
                          maxItems: 20
                          items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]*[^\s\x00][^\n\r\x00]*$'}
                        examples_unavailable: {type: string, minLength: 10, pattern: '\S[\s\S]{8,}\S'}
                        misses_omitted_why: {type: string, minLength: 10, pattern: '\S[\s\S]{8,}\S'}
        - id: rejudge-accept
          script: rejudge_accept
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          depends_on: [rejudge]
          with: {status_guarded: true, reply: $rejudge.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
  - id: verdict
    script: verdict
    runtime: uv
    timeout: 1728000000
    depends_on: [intake, spec-freeze, diagnose-loop, verify-merge, rejudge-loop, pr-check-reads, head-depth-loop]
    trigger_rule: all_done
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [ready, stop_reason, units, judgment, purpose, world, spec, out_of_purpose, rejudge_verdict, depth, depth_why]
      properties:
        depth:
          type: string
          enum: [軽量, 標準]
        depth_why: {type: string}
        ready: {type: boolean}
        stop_reason: {type: string}
        units:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, paths, summary]
            properties:
              id: {type: string}
              paths:
                type: array
                items: {type: string}
              summary: {type: string}
        judgment:
          type: object
          additionalProperties: false
          required: [type, run_id, path]
          properties:
            type:
              type: string
              enum: [archon_artifact]
            run_id: {type: string}
            path: {type: string}
        purpose:
          type: object
          additionalProperties: false
          required: [type, run_id, path]
          properties:
            type:
              type: string
              enum: [archon_artifact]
            run_id: {type: string}
            path: {type: string}
        world:
          anyOf:
            - type: object
              additionalProperties: false
              required: [type, run_id, path]
              properties:
                type:
                  type: string
                  enum: [archon_artifact]
                run_id: {type: string}
                path: {type: string}
            - {type: 'null'}
        spec:
          anyOf:
            - type: object
              additionalProperties: false
              required: [type, run_id, path]
              properties:
                type:
                  type: string
                  enum: [archon_artifact]
                run_id: {type: string}
                path: {type: string}
            - {type: 'null'}
        out_of_purpose:
          anyOf:
            - type: object
              additionalProperties: false
              required: [type, run_id, path]
              properties:
                type:
                  type: string
                  enum: [archon_artifact]
                run_id: {type: string}
                path: {type: string}
            - {type: 'null'}
        rejudge_verdict:
          anyOf:
            - type: string
              enum: [採る, 退ける, 一部採る]
            - {type: 'null'}

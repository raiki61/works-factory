name: works-factory-judge
description: '判定のサブグラフ（メイングラフが include する部品。単独の run には使わない）。依頼を根本の単位にまとめる: run の頭の深さ・前提の実測・目的の固定・定石（世界の解）・並行 PR とのぶつかり・素材集め 11 本・根本の診断と受け付け・判定の裏取り・再審・目的の外の所見の持ち越し。始めの記録が仕様の段を選んだ run は、仕様を書いて審査し、仕様の承認ノードの承認の後に受け入れテストを固める'
interactive: true
inputs:
  start: {default: 'null', description: 始めの記録のポインタ（JSON の字。メイングラフの $start.output.record）}
  baseline: {default: 'null', description: 直す前の結末のポインタ（JSON の字。メイングラフの $test-gate-base.output.baseline）}
  objection: {default: '', description: 修正役の異議（メイングラフの $fix.output.objection）。空でなければ再審の道}
  prior_failures: {default: 'null', description: 前の run の持ち越しの前の失敗の行のポインタ（JSON の字。今の works の prior-failures-in.json）。約束に無い入力}
returns: verdict
outcome_field: ready
nodes:
  - id: intake
    script: intake
    runtime: uv
    timeout: 1728000000
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [go, mode, spec, world, verify, reason]
      properties:
        go: {type: boolean}
        mode:
          type: string
          enum: [judge, rejudge]
        spec: {type: boolean}
        world: {type: boolean}
        verify: {type: boolean}
        reason: {type: string}
  # run の頭の深さ（docs/design.md の「深さで飛ばすノードの表」）。支度が機械の止めを通し、役が依頼と行の引用で軽量か標準かを決め、
  # 受け付けが引用を照らす。控えは judge/depth-head.json で、返す節が読む。落ちても判定は標準で進む
  - id: head-depth-prep
    script: head_depth_prep
    runtime: uv
    timeout: 1728000000
    depends_on: [intake]
    when: $intake.output.go == true && $intake.output.mode == 'judge'
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [go, brief_file, reason]
      properties:
        go: {type: boolean}
        brief_file: {type: string}
        reason: {type: string}
  - id: head-depth-loop
    depends_on: [head-depth-prep]
    when: $head-depth-prep.output.go == true
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: done=$head-depth-accept.output.done; test "$done" = true
      nodes:
        - id: head-depth-reject
          script: reject
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          with: {reason: "$LOOP_PREV.head-depth-accept.output.reason"}
          output_format:
            type: object
            additionalProperties: false
            required: [reason, lang_line]
            properties: {reason: {type: string}, lang_line: {type: string}}
        - id: head-depth
          command: head-depth
          depends_on: [head-depth-reject]
          # 読むだけの sonnet の役の起こし方（目的の監査の役 purpose-review と同じ。docs/concepts.md の ai-launch）
          <<: &read_launch
            model: sonnet
            effort: medium
            settingSources: [user]
            allowed_tools: [Read, Grep, Glob]
            sandbox: {enabled: true, allowUnsandboxedCommands: false}
            idle_timeout: 1728000000
          mutates_checkout: false
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            additionalProperties: false
            required: [depth, why, items]
            properties:
              depth:
                type: string
                enum: [軽量, 標準]
              why: {type: string, minLength: 1, pattern: '\S'}
              items:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [item, cause_quote, where, code_quote]
                  properties:
                    item: {type: integer, minimum: 1}
                    cause_quote: {type: string, minLength: 1}
                    where: {type: string, minLength: 3}
                    code_quote: {type: string, minLength: 1}
        - id: head-depth-accept
          script: head_depth_accept
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          depends_on: [head-depth]
          with: {reply: $head-depth.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
  - id: spec-loop
    depends_on: [intake]
    when: $intake.output.spec == true
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: done=$spec-accept.output.done; test "$done" = true
      nodes:
        - id: spec-reject
          script: rejects
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          with: {board: judge, accept: spec-write}
          output_format:
            type: object
            additionalProperties: false
            required: [reason, lang_line]
            properties: {reason: {type: string}, lang_line: {type: string}}
        - id: spec
          command: spec
          depends_on: [spec-reject]
          model: opus
          effort: medium
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            additionalProperties: false
            required: [requirements, acceptance, out_of_scope]
            properties:
              requirements:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [key, text]
                  properties:
                    key: {type: string, minLength: 1}
                    text: {type: string, minLength: 4}
              acceptance:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [key, requirement, file, name, run]
                  properties:
                    key: {type: string, minLength: 1}
                    requirement: {type: string, minLength: 1}
                    file: {type: string, minLength: 1}
                    name: {type: string, minLength: 1}
                    run: {type: string, minLength: 1}
              out_of_scope:
                type: array
                items: {type: string}
        - id: spec-accept
          script: spec_accept
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          depends_on: [spec]
          with: {status_guarded: false, role: write, reply: $spec.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason, revise]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              revise: {type: boolean}
  - id: spec-review-loop
    depends_on: [spec-loop]
    when: $spec-loop.output.ok == true
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: done=$spec-review-accept.output.done; test "$done" = true
      nodes:
        - id: spec-review-reject
          script: rejects
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          with: {board: judge, accept: spec-review}
          output_format:
            type: object
            additionalProperties: false
            required: [reason, lang_line]
            properties: {reason: {type: string}, lang_line: {type: string}}
        - id: spec-review
          command: spec-review
          depends_on: [spec-review-reject]
          model: opus
          effort: high
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            additionalProperties: false
            required: [faces, reason]
            properties:
              faces:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [key, kind, where, why]
                  properties:
                    key: {type: string, minLength: 2}
                    kind:
                      type: string
                      enum: [missing, ambiguous, out_of_scope]
                    where: {type: string, minLength: 1}
                    why: {type: string, minLength: 20}
              faces_none: {type: string}
              reason: {type: string, minLength: 20}
        - id: spec-review-accept
          script: spec_accept
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          depends_on: [spec-review]
          with: {status_guarded: true, role: review, reply: $spec-review.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason, revise]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              revise: {type: boolean}
  - id: spec-revise-loop
    depends_on: [spec-review-loop]
    when: $spec-review-loop.output.revise == true
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: done=$spec-revise-accept.output.done; test "$done" = true
      nodes:
        - id: spec-revise-reject
          script: rejects
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          with: {board: judge, accept: spec-revise}
          output_format:
            type: object
            additionalProperties: false
            required: [reason, lang_line]
            properties: {reason: {type: string}, lang_line: {type: string}}
        - id: spec-revise
          command: spec-revise
          depends_on: [spec-revise-reject]
          model: opus
          effort: medium
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch]
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            additionalProperties: false
            required: [spec, handled]
            properties:
              spec:
                type: object
                additionalProperties: false
                required: [requirements, acceptance, out_of_scope]
                properties:
                  requirements:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required: [key, text]
                      properties:
                        key: {type: string, minLength: 1}
                        text: {type: string, minLength: 4}
                  acceptance:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required: [key, requirement, file, name, run]
                      properties:
                        key: {type: string, minLength: 1}
                        requirement: {type: string, minLength: 1}
                        file: {type: string, minLength: 1}
                        name: {type: string, minLength: 1}
                        run: {type: string, minLength: 1}
                  out_of_scope:
                    type: array
                    items: {type: string}
              handled:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [key, handled, how]
                  properties:
                    key: {type: string, minLength: 2}
                    handled:
                      type: string
                      enum: [absorbed, declared]
                    how: {type: string, minLength: 20}
        - id: spec-revise-accept
          script: spec_accept
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          depends_on: [spec-revise]
          with: {status_guarded: false, role: revise, reply: $spec-revise.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason, revise]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
              revise: {type: boolean}
  - id: spec-ask
    script: spec_ask
    runtime: uv
    timeout: 1728000000
    depends_on: [intake, spec-loop, spec-review-loop, spec-revise-loop]
    trigger_rule: all_done
    when: $intake.output.spec == true
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [ask, message]
      properties:
        ask: {type: boolean}
        message: {type: string}
  - id: spec-gate
    depends_on: [spec-ask]
    when: $spec-ask.output.ask == true
    idle_timeout: 1728000000
    approval:
      message: $spec-ask.output.message
      decisions:
        - {id: approve}
        - {id: continue}
        - {id: stop}
        - {id: reject}
  - id: spec-freeze
    script: spec_freeze
    runtime: uv
    timeout: 1728000000
    depends_on: [spec-ask, spec-gate]
    trigger_rule: all_done
    when: $intake.output.spec == true
    with:
      answer: {from: $spec-gate.output, if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [go, reason]
      properties:
        go: {type: boolean}
        reason: {type: string}
  - id: pr-scan
    script: pr_check
    runtime: uv
    timeout: 1728000000
    depends_on: [intake, spec-freeze]
    trigger_rule: all_done
    when: $intake.output.go == true && $intake.output.mode == 'judge'
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [go, go_role, reason]
      properties:
        go: {type: boolean}
        go_role: {type: boolean}
        reason: {type: string}
  - id: pr-check-loop
    depends_on: [pr-scan]
    when: $pr-scan.output.go_role == true
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: done=$pr-check-accept.output.done; test "$done" = true
      nodes:
        - id: pr-check-reject
          script: reject
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          with: {reason: "$LOOP_PREV.pr-check-accept.output.reason"}
          output_format:
            type: object
            additionalProperties: false
            required: [reason, lang_line]
            properties: {reason: {type: string}, lang_line: {type: string}}
        - id: pr-check
          command: pr-check
          depends_on: [pr-check-reject]
          model: sonnet
          effort: medium
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, Bash, WebSearch, WebFetch]
          sandbox:
            enabled: true
            allowUnsandboxedCommands: false
            failIfUnavailable: true
            excludedCommands: ['works-gh:*']
            network:
              allowedDomains: []
            # 作業ツリー・ほかの run の worktree・artifacts を書けなくする（~ は起動が隔離した HOME で、~/../archon-home が Archon の家。
            # '.' は cwd でなく設定の一時ファイルのフォルダに解かれる。実測 2026-10-13。issue #293）
            # 起こす直前に包み（workflows/.shared/fence.py）がこの値を印と読み、cwd・共通の .git・worktree の根などを足す（#309）
            filesystem:
              denyWrite: ['~/../archon-home']
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            required: [material, repo, listed, truncated, conflicts, excluded]
            additionalProperties: false
            properties:
              material:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [found, clean, carried_over, not_applicable, awaiting_human, not_run]
                  count: {type: integer, minimum: 0}
                  detail: {type: string}
                  checked: {type: string}
                  reason: {type: string}
                  from_round: {type: integer, minimum: 1}
              repo: {type: string}
              listed: {type: integer, minimum: 0}
              truncated: {type: boolean}
              conflicts:
                type: array
                items:
                  type: object
                  required: [pr, files, handed_over]
                  additionalProperties: false
                  properties:
                    pr: {type: string}
                    files:
                      type: array
                      items: {type: string}
                    handed_over: {type: boolean}
                    note: {type: string}
              excluded:
                type: array
                items:
                  type: object
                  required: [pr, file, start, end, why]
                  additionalProperties: false
                  properties:
                    pr: {type: string, minLength: 1, pattern: '\S'}
                    file: {type: string, minLength: 1, pattern: '\S'}
                    start: {type: integer, minimum: 1}
                    end: {type: integer, minimum: 1}
                    why: {type: string, minLength: 1, pattern: '\S'}
        - id: pr-check-accept
          script: pr_accept
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          depends_on: [pr-check]
          with: {reply: $pr-check.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
  # 読んだ証拠（受け付けの条件にしない）。並行 PR の役が渡し物 judge/pr-brief.json を読んだかを、フックの記録から集めて置き場の
  # reads-pr-check.json と索引に書く。pr-scan は機械が決めた回も渡し物を書くので、役を起こさなかった回は when で飛ばす。
  # pr-scan が走らなかった回（再審の道など）は飛ぶ（one_success）。輪が落ちても走り、落ちない
  - id: pr-check-reads
    script: pr_reads
    runtime: uv
    timeout: 1728000000
    mutates_checkout: false
    depends_on: [pr-scan, pr-check-loop]
    trigger_rule: one_success
    when: $pr-scan.output.go_role == true
    output_format:
      type: object
      additionalProperties: false
      required: [ok, missing, index_file, reason]
      properties:
        ok: {type: boolean}
        missing: {type: array, items: {type: string}}
        index_file: {type: string}
        reason: {type: string}
  - id: premises-loop
    depends_on: [pr-scan, pr-check-loop]
    trigger_rule: none_failed_min_one_success
    when: $pr-scan.output.go == true
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: done=$premises-accept.output.done; test "$done" = true
      nodes:
        - id: premises-reject
          script: reject
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          with: {reason: "$LOOP_PREV.premises-accept.output.reason"}
          output_format:
            type: object
            additionalProperties: false
            required: [reason, lang_line]
            properties: {reason: {type: string}, lang_line: {type: string}}
        - id: premises
          command: premises
          depends_on: [premises-reject]
          model: sonnet
          effort: medium
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, Bash, WebSearch, WebFetch]
          sandbox:
            enabled: true
            allowUnsandboxedCommands: false
            # denyWrite は pr-check の注釈と同じ
            filesystem:
              denyWrite: ['~/../archon-home']
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            required: [constraints]
            additionalProperties: false
            properties:
              constraints:
                type: array
                items:
                  type: object
                  required: [text, measured_how, kind]
                  additionalProperties: false
                  properties:
                    text: {type: string}
                    measured_how: {type: string}
                    kind:
                      type: string
                      enum: [実測, 仮説]
                    measured_output: {type: string, minLength: 1, pattern: '\S'}
        - id: premises-accept
          script: premises_accept
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          depends_on: [premises]
          with: {reply: $premises.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
  - id: purpose-prep
    script: purpose_prep
    runtime: uv
    timeout: 1728000000
    depends_on: [premises-loop]
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [go, brief_file, reason]
      properties:
        go: {type: boolean}
        brief_file: {type: string}
        reason: {type: string}
  - id: purpose-loop
    depends_on: [purpose-prep]
    when: $purpose-prep.output.go == true
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: done=$purpose-accept.output.done; test "$done" = true
      nodes:
        - id: purpose-reject
          script: reject
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          with: {reason: "$LOOP_PREV.purpose-accept.output.reason"}
          output_format:
            type: object
            additionalProperties: false
            required: [reason, lang_line]
            properties: {reason: {type: string}, lang_line: {type: string}}
        - id: purpose
          command: purpose
          depends_on: [purpose-reject]
          model: sonnet
          effort: medium
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            required: [purpose_text, source, known_weaknesses, source_files]
            additionalProperties: false
            properties:
              purpose_text: {type: string, minLength: 1, pattern: '\S'}
              source:
                type: string
                enum: [①PR 説明, ②計画・タスク記述, ③writer の要約, 目的不明]
              known_weaknesses:
                type: array
                items: {type: string}
              source_files:
                type: array
                items: {type: string}
              means:
                type: array
                items: {type: string, minLength: 1, pattern: '\S'}
        - id: purpose-accept
          script: purpose_accept
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          depends_on: [purpose]
          with: {status_guarded: true, reply: $purpose.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
  - id: world-intake
    script: world_intake
    runtime: uv
    timeout: 1728000000
    mutates_checkout: false
    depends_on: [purpose-loop]
    when: $intake.output.world == true
    output_format:
      type: object
      additionalProperties: false
      required: [due, prompt, reason]
      properties:
        due: {type: boolean}
        prompt: {type: string}
        reason: {type: string}
  - id: world-classes-loop
    depends_on: [world-intake]
    when: $world-intake.output.due == true
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: done=$world-classes-accept.output.done; test "$done" = true
      nodes:
        - id: world-classes-reject
          script: reject
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          with: {reason: "$LOOP_PREV.world-classes-accept.output.reason"}
          output_format:
            type: object
            additionalProperties: false
            required: [reason, lang_line]
            properties: {reason: {type: string}, lang_line: {type: string}}
        - id: world-classes
          command: world-classes
          depends_on: [world-classes-reject]
          model: opus
          effort: high
          settingSources: [user]
          allowed_tools: []
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000

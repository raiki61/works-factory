name: works-factory-judge
description: '判定のまとめの graph（docs/design/judge-eyes.md の 1 章）。run の頭の深さ・仕様・並行 PR・前提の実測・目的の固定・世界の解・素材の観点 10 本・根本の診断・判定の裏取りの block を今の judge と同じ順と条件で並べ、どこかの段が止めれば止めの語を返して後ろを回さない。判定の道だけを持ち、再審は持たない。line から 1 つの include で呼ばれ、単独でも依頼の行だけで回る'
inputs:
  request: {default: '[]', description: 'json(shared:request.schema.json): 依頼の行の配列か、それを findings の欄に持つ object（工場の依頼のファイルの形）。空の配列は依頼の行が無い run'}
  pr_text: {default: '', description: 'text: 依頼が名指す PR の番号・題・本文を並べた文。空は PR の無い run'}
  carried: {default: '[]', description: 'json(shared:constraints.schema.json): 前の run が運んだ前提の実測の行の配列。空の配列は運ばれていない'}
  base: {default: '', description: 'text: 入口の差分の根の commit。空は HEAD'}
  entry: {default: '', description: 'text: 判定から入る run の出どころの文。空は判定から入る run でない'}
  web: {default: 'on', description: 'choice(on|off): 世界の解の段が web で出典を探すか'}
  world: {default: 'true', description: 'flag: 世界の解の段を回すか'}
  spec: {default: 'false', description: 'flag: 仕様の段を挟むか（仕様の段は中に承認ノードを持つ）'}
  has_checks: {default: 'false', description: 'flag: 機械の確かめ（試験のコマンドか TDD の実行器）が在るか。false なら run の頭の深さの役を起こさず標準'}
  thickness: {default: 'auto', description: 'choice(auto|light|standard|heavy): 呼ぶ人の段の名指し（light は軽量・standard は標準・heavy は重厚）。auto は役と機械が決める'}
  design_only: {default: 'false', description: 'flag: 設計だけの run か。true なら run の頭の深さの役を起こさず標準'}
  verify_by_tier: {default: '{}', description: 'json(verify-by-tier.schema.json): 段ごとに判定の裏取りを回すか {軽量, 標準, 重厚}（真偽）。空の object はどの段でも回さない'}
  user_env_dir: {default: '', description: 'text: 利用者の HOME・XDG に戻して起こした印を置く置き場の絶対パス。空は place'}
  request_origin: {default: '', description: 'text: 依頼の行の出どころの名（判定役に見せる依頼のバッチの origin）。空は「人の依頼（依頼の行）」'}
  baseline: {default: '', description: 'file: 直す前の試験の結末（試験の関門が直す前に書いた baseline.json）。空は local_checks を not_run にする'}
  policy: {default: '', description: 'file: 人の方針の文書を run の頭で固めた写し。空は方針が無い'}
  lang: {default: '', description: 'text: 人に見せる欄の言語（include する block のどれにも渡す）。空は依頼の行の言語'}
returns: verdict
outcome_field: ok
nodes:
  - id: ins
    script: ins
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [spec, world, web]
      properties:
        spec: {type: boolean}
        world: {type: boolean}
        web: {type: string, enum: ['on', 'off']}
  - id: head-depth-run
    include: works-factory-head-depth
    depends_on: [ins]
    with:
      request: "$INPUTS.request"
      has_checks: "$INPUTS.has_checks"
      thickness: "$INPUTS.thickness"
      spec: "$INPUTS.spec"
      design_only: "$INPUTS.design_only"
      lang: "$INPUTS.lang"
  - id: head-depth-run-out
    # 受け皿の本体はここ 1 か所。ほかは <<: *receiver で受け、id・depends_on・with だけを書く（names は運ぶ欄の名）
    <<: &receiver
      script: returned
      runtime: uv
      mutates_checkout: false
      output_format:
        type: object
        additionalProperties: false
        required: [got, why]
        properties:
          got: {type: [object, 'null']}
          why: {type: string}
    depends_on: [head-depth-run]
    with:
      got: "$head-depth-run.output"
      names: "ok status reason tier why rows record report"
  - id: spec
    include: works-factory-spec
    depends_on: [ins]
    when: "$ins.output.spec == true"
    with:
      mode: "write"
      request: "$INPUTS.request"
      pr_text: "$INPUTS.pr_text"
      user_env_dir: "$INPUTS.user_env_dir"
      lang: "$INPUTS.lang"
  - id: spec-out
    <<: *receiver
    depends_on: [spec]
    with:
      got: "$spec.output"
      names: "ok status stop_reason reason spec added_rows added_origin report"
  - id: spec-in
    script: spec_in
    runtime: uv
    mutates_checkout: false
    depends_on: [ins, spec-out]
    trigger_rule: none_failed_min_one_success
    with:
      spec_out: {from: "$spec-out.output", if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [go, stop_reason, reason, request, spec, added_rows, added_origin]
      properties:
        go: {type: boolean}
        stop_reason: {type: string}
        reason: {type: string}
        request: {type: [object, 'null']}
        spec: {type: [object, 'null']}
        added_rows: {type: [object, 'null']}
        added_origin: {type: string}
  - id: parallel-pr
    include: works-factory-parallel-pr
    depends_on: [spec-in]
    when: "$spec-in.output.go == true"
    with:
      request: "$spec-in.output.request"
      base: "$INPUTS.base"
      changed: "[]"
      lang: "$INPUTS.lang"
  - id: parallel-pr-out
    <<: *receiver
    depends_on: [parallel-pr]
    with:
      got: "$parallel-pr.output"
      names: "ok status stop_reason reason material excluded drafts reads downgrades report"
  - id: premises-run
    include: works-factory-premises
    depends_on: [parallel-pr]
    when: "$parallel-pr.output.stop_reason == ''"
    with:
      request: "$spec-in.output.request"
      carried: "$INPUTS.carried"
      lang: "$INPUTS.lang"
  - id: premises-run-out
    <<: *receiver
    depends_on: [premises-run]
    with:
      got: "$premises-run.output"
      names: "ok status reason constraints report"
  - id: purpose-run
    include: works-factory-purpose
    depends_on: [premises-run]
    when: "$premises-run.output.ok == true"
    with:
      request: "$INPUTS.request"
      pr_text: "$INPUTS.pr_text"
      constraints: "$premises-run.output.constraints"
      lang: "$INPUTS.lang"
  - id: purpose-run-out
    <<: *receiver
    depends_on: [purpose-run]
    with:
      got: "$purpose-run.output"
      names: "ok status reason purpose purpose_text source means report"
  - id: world
    include: works-factory-world
    depends_on: [purpose-run, ins]
    when: "$purpose-run.output.ok == true && $ins.output.world == true"
    with:
      request: "$spec-in.output.request"
      purpose: "$purpose-run.output.purpose_text"
      means: "$purpose-run.output.means"
      web: "$ins.output.web"
      lang: "$INPUTS.lang"
  - id: world-out
    <<: *receiver
    depends_on: [world]
    with:
      got: "$world.output"
      names: "ok status reason rows classes dropped report"
  # 素材の観点 10 本（gate-efficacy は持ち主の決めで include しない。docs/design/judge-eyes.md の 3 節）。互いを待たずに並ぶ。世界の解の受け皿に依るのは、世界の解が切られた・落ちた run でも回すため
  - id: prior-decisions-run
    include: works-factory-prior-decisions
    depends_on: [purpose-run, world-out]
    trigger_rule: none_failed_min_one_success
    when: "$purpose-run.output.ok == true"
    with:
      base: "$INPUTS.base"
      entry: "$INPUTS.entry"
      request: "$spec-in.output.request"
      lang: "$INPUTS.lang"
  - id: prior-decisions-run-out
    <<: *receiver
    depends_on: [prior-decisions-run]
    with:
      got: "$prior-decisions-run.output"
      names: "ok status reason material report"
  - id: purpose-review-run
    include: works-factory-purpose-review
    depends_on: [purpose-run, world-out]
    trigger_rule: none_failed_min_one_success
    when: "$purpose-run.output.ok == true"
    with:
      base: "$INPUTS.base"
      entry: "$INPUTS.entry"
      purpose: "$purpose-run.output.purpose"
      lang: "$INPUTS.lang"
  - id: purpose-review-run-out
    <<: *receiver
    depends_on: [purpose-review-run]
    with:
      got: "$purpose-review-run.output"
      names: "ok status reason material report"
  - id: local-review-run
    include: works-factory-local-review
    depends_on: [purpose-run, world-out]
    trigger_rule: none_failed_min_one_success
    when: "$purpose-run.output.ok == true"
    with:
      base: "$INPUTS.base"
      entry: "$INPUTS.entry"
      lang: "$INPUTS.lang"
  - id: local-review-run-out
    <<: *receiver
    depends_on: [local-review-run]
    with:
      got: "$local-review-run.output"
      names: "ok status reason material report"
  - id: consistency-bypass-run
    include: works-factory-consistency-bypass
    depends_on: [purpose-run, world-out]
    trigger_rule: none_failed_min_one_success
    when: "$purpose-run.output.ok == true"
    with:
      base: "$INPUTS.base"
      entry: "$INPUTS.entry"
      lang: "$INPUTS.lang"
  - id: consistency-bypass-run-out
    <<: *receiver
    depends_on: [consistency-bypass-run]
    with:
      got: "$consistency-bypass-run.output"
      names: "ok status reason material report"
  - id: hygiene-run
    include: works-factory-hygiene
    depends_on: [purpose-run, world-out]
    trigger_rule: none_failed_min_one_success
    when: "$purpose-run.output.ok == true"
    with:
      base: "$INPUTS.base"
      entry: "$INPUTS.entry"
      lang: "$INPUTS.lang"
  - id: hygiene-run-out
    <<: *receiver
    depends_on: [hygiene-run]
    with:
      got: "$hygiene-run.output"
      names: "ok status reason material report"
  - id: external-standards-run
    include: works-factory-external-standards
    depends_on: [purpose-run, world-out]
    trigger_rule: none_failed_min_one_success
    when: "$purpose-run.output.ok == true"
    with:
      base: "$INPUTS.base"
      entry: "$INPUTS.entry"
      purpose: "$purpose-run.output.purpose"
      lang: "$INPUTS.lang"
  - id: external-standards-run-out
    <<: *receiver
    depends_on: [external-standards-run]
    with:
      got: "$external-standards-run.output"
      names: "ok status reason material report"
  - id: procedure-trace-run
    include: works-factory-procedure-trace
    depends_on: [purpose-run, world-out]
    trigger_rule: none_failed_min_one_success
    when: "$purpose-run.output.ok == true"
    with:
      base: "$INPUTS.base"
      entry: "$INPUTS.entry"
      lang: "$INPUTS.lang"
  - id: procedure-trace-run-out
    <<: *receiver
    depends_on: [procedure-trace-run]
    with:
      got: "$procedure-trace-run.output"
      names: "ok status reason material report"
  - id: test-double-fidelity-run
    include: works-factory-test-double-fidelity
    depends_on: [purpose-run, world-out]
    trigger_rule: none_failed_min_one_success
    when: "$purpose-run.output.ok == true"
    with:
      base: "$INPUTS.base"
      entry: "$INPUTS.entry"
      lang: "$INPUTS.lang"
  - id: test-double-fidelity-run-out
    <<: *receiver
    depends_on: [test-double-fidelity-run]
    with:
      got: "$test-double-fidelity-run.output"
      names: "ok status reason material report"
  - id: main-path-observation-run
    include: works-factory-main-path-observation
    depends_on: [purpose-run, world-out]
    trigger_rule: none_failed_min_one_success
    when: "$purpose-run.output.ok == true"
    with:
      base: "$INPUTS.base"
      entry: "$INPUTS.entry"
      lang: "$INPUTS.lang"
  - id: main-path-observation-run-out
    <<: *receiver
    depends_on: [main-path-observation-run]
    with:
      got: "$main-path-observation-run.output"
      names: "ok status reason material report"
  - id: provenance-run
    include: works-factory-provenance
    depends_on: [purpose-run, world-out]
    trigger_rule: none_failed_min_one_success
    when: "$purpose-run.output.ok == true"
    with:
      base: "$INPUTS.base"
      entry: "$INPUTS.entry"
      lang: "$INPUTS.lang"
  - id: provenance-run-out
    <<: *receiver
    depends_on: [provenance-run]
    with:
      got: "$provenance-run.output"
      names: "ok status reason material report"
  - id: diagnose-in
    script: diagnose_in
    runtime: uv
    mutates_checkout: false
    depends_on: [prior-decisions-run-out, purpose-review-run-out, local-review-run-out, consistency-bypass-run-out, hygiene-run-out, external-standards-run-out, procedure-trace-run-out, test-double-fidelity-run-out, main-path-observation-run-out, provenance-run-out, parallel-pr-out, head-depth-run-out, world-out, spec-in, premises-run-out, purpose-run-out]
    trigger_rule: all_done
    with:
      prior_decisions_out: {from: "$prior-decisions-run-out.output", if_skipped: null}
      purpose_review_out: {from: "$purpose-review-run-out.output", if_skipped: null}
      local_review_out: {from: "$local-review-run-out.output", if_skipped: null}
      consistency_bypass_out: {from: "$consistency-bypass-run-out.output", if_skipped: null}
      hygiene_out: {from: "$hygiene-run-out.output", if_skipped: null}
      external_standards_out: {from: "$external-standards-run-out.output", if_skipped: null}
      procedure_trace_out: {from: "$procedure-trace-run-out.output", if_skipped: null}
      test_double_fidelity_out: {from: "$test-double-fidelity-run-out.output", if_skipped: null}
      main_path_observation_out: {from: "$main-path-observation-run-out.output", if_skipped: null}
      provenance_out: {from: "$provenance-run-out.output", if_skipped: null}
      parallel_pr_out: {from: "$parallel-pr-out.output", if_skipped: null}
      world_out: {from: "$world-out.output", if_skipped: null}
      head_depth_out: {from: "$head-depth-run-out.output", if_skipped: null}
      spec_in: {from: "$spec-in.output", if_skipped: null}
      premises_out: {from: "$premises-run-out.output", if_skipped: null}
      purpose_out: {from: "$purpose-run-out.output", if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [ok, reason, go, purpose, constraints, materials, missing, pr_material, world_rows, row_asks, depth_why, spec_rows, spec_origin, tier, verify]
      properties:
        ok: {type: boolean}
        reason: {type: string}
        go: {type: boolean}
        purpose: {type: [object, 'null']}
        constraints: {type: [object, 'null']}
        materials: {type: array, items: {type: object}}
        missing: {type: array, items: {type: string}}
        pr_material: {type: [object, 'null']}
        world_rows: {type: [object, string]}
        row_asks: {type: array, items: {type: object}}
        depth_why: {type: string}
        spec_rows: {type: [object, string]}
        spec_origin: {type: string}
        tier: {type: string}
        verify: {type: boolean}
  # 判定の道だけ（objection・prior は渡さない。再審は line が diagnose を直に include する）
  - id: diagnose-run
    include: works-factory-diagnose
    depends_on: [diagnose-in]
    when: "$diagnose-in.output.ok == true && $diagnose-in.output.go == true"
    with:
      request: "$INPUTS.request"
      request_origin: "$INPUTS.request_origin"
      base: "$INPUTS.base"
      purpose: "$diagnose-in.output.purpose"
      constraints: "$diagnose-in.output.constraints"
      materials: "$diagnose-in.output.materials"
      pr_material: "$diagnose-in.output.pr_material"
      world_rows: "$diagnose-in.output.world_rows"
      row_asks: "$diagnose-in.output.row_asks"
      depth_why: "$diagnose-in.output.depth_why"
      spec_rows: "$diagnose-in.output.spec_rows"
      spec_origin: "$diagnose-in.output.spec_origin"
      baseline: "$INPUTS.baseline"
      pr_text: "$INPUTS.pr_text"
      policy: "$INPUTS.policy"
      lang: "$INPUTS.lang"
  - id: diagnose-run-out
    <<: *receiver
    depends_on: [diagnose-run]
    with:
      got: "$diagnose-run.output"
      names: "ok status mode stop_reason reason ready judgment units questions inputs brief materials out_of_purpose answer_ties downgrades report"
  - id: verify
    include: works-factory-verify
    depends_on: [diagnose-run, diagnose-in]
    when: "$diagnose-in.output.verify == true && $diagnose-run.output.ready == true"
    with:
      judgment: "$diagnose-run.output.judgment"
      lang: "$INPUTS.lang"
  - id: verify-out
    <<: *receiver
    depends_on: [verify]
    with:
      got: "$verify.output"
      names: "ok status stop_reason reason verify report"
  - id: verdict
    script: verdict
    runtime: uv
    mutates_checkout: false
    depends_on: [head-depth-run-out, spec-out, spec-in, parallel-pr-out, premises-run-out, purpose-run-out, world-out, prior-decisions-run-out, purpose-review-run-out, local-review-run-out, consistency-bypass-run-out, hygiene-run-out, external-standards-run-out, procedure-trace-run-out, test-double-fidelity-run-out, main-path-observation-run-out, provenance-run-out, diagnose-in, diagnose-run-out, verify-out]
    trigger_rule: all_done
    with:
      head_depth_out: {from: "$head-depth-run-out.output", if_skipped: null}
      spec_out: {from: "$spec-out.output", if_skipped: null}
      spec_in: {from: "$spec-in.output", if_skipped: null}
      parallel_pr_out: {from: "$parallel-pr-out.output", if_skipped: null}
      premises_out: {from: "$premises-run-out.output", if_skipped: null}
      purpose_out: {from: "$purpose-run-out.output", if_skipped: null}
      world_out: {from: "$world-out.output", if_skipped: null}
      prior_decisions_out: {from: "$prior-decisions-run-out.output", if_skipped: null}
      purpose_review_out: {from: "$purpose-review-run-out.output", if_skipped: null}
      local_review_out: {from: "$local-review-run-out.output", if_skipped: null}
      consistency_bypass_out: {from: "$consistency-bypass-run-out.output", if_skipped: null}
      hygiene_out: {from: "$hygiene-run-out.output", if_skipped: null}
      external_standards_out: {from: "$external-standards-run-out.output", if_skipped: null}
      procedure_trace_out: {from: "$procedure-trace-run-out.output", if_skipped: null}
      test_double_fidelity_out: {from: "$test-double-fidelity-run-out.output", if_skipped: null}
      main_path_observation_out: {from: "$main-path-observation-run-out.output", if_skipped: null}
      provenance_out: {from: "$provenance-run-out.output", if_skipped: null}
      diagnose_in: {from: "$diagnose-in.output", if_skipped: null}
      diagnose_out: {from: "$diagnose-run-out.output", if_skipped: null}
      verify_out: {from: "$verify-out.output", if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [ok, stop_reason, reason, ready, units, questions, judgment, answer_ties, out_of_purpose, materials, brief, inputs, purpose,
                 purpose_text, purpose_source, means, purpose_review, constraints, world, world_state, spec, spec_rows, spec_origin,
                 excluded, pr_drafts, downgrades, decisions, tier, tier_why, row_asks, tier_record, verify, verify_why, report,
                 sections, optional]
      properties:
        ok: {type: boolean}
        stop_reason: {type: string}
        reason: {type: string}
        ready: {type: boolean}
        units: {type: array, items: {type: object}}
        questions: {type: array, items: {type: object}}
        judgment: {type: [object, 'null']}
        answer_ties: {type: [object, 'null']}
        out_of_purpose: {type: [object, 'null']}
        materials: {type: [object, 'null']}
        brief: {type: [object, 'null']}
        inputs: {type: [object, 'null']}
        purpose: {type: [object, 'null']}
        purpose_text: {type: string}
        purpose_source: {type: string}
        means: {type: array, items: {type: string}}
        purpose_review: {type: [object, 'null']}
        constraints: {type: [object, 'null']}
        world: {type: [object, 'null']}
        world_state:
          type: object
          required: [status, reason]
          properties:
            status: {type: string}
            reason: {type: string}
            classes: {type: integer}
            dropped: {type: integer}
        spec: {type: [object, 'null']}
        spec_rows: {type: [object, 'null']}
        spec_origin: {type: string}
        excluded: {type: [object, 'null']}
        pr_drafts: {type: [object, 'null']}
        downgrades: {type: array, items: {type: object}}
        decisions: {type: [object, 'null']}
        tier: {type: string}
        tier_why: {type: string}
        row_asks: {type: array, items: {type: object}}
        tier_record: {type: [object, 'null']}
        verify: {type: [object, 'null']}
        verify_why: {type: string}
        report: {type: array, items: {type: string}}
        sections:
          type: array
          items:
            type: object
            required: [title, lines]
            properties:
              title: {type: string}
              lines: {type: array, items: {type: string}}
        optional:
          type: array
          items:
            type: object
            properties:
              node: {type: string}
              bare: {type: boolean}

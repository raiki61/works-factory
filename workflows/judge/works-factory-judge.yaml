      main-path-observation-loop, provenance-loop]
    trigger_rule: all_done
    when: $intake.output.go == true && $intake.output.mode == 'judge'
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [go, brief_file, review_md, repo_review_md, reason]
      properties:
        go: {type: boolean}
        brief_file: {type: string}
        review_md: {type: string}
        repo_review_md: {type: string}
        reason: {type: string}
  - id: diagnose-loop
    depends_on: [diagnose-prep]
    when: $diagnose-prep.output.go == true
    timeout: 1728000000
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: done=$diagnose-accept.output.done; test "$done" = true
      nodes:
        - id: diagnose-reject
          script: reject
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          with: {reason: "$LOOP_PREV.diagnose-accept.output.reason"}
          output_format:
            type: object
            additionalProperties: false
            required: [reason, lang_line]
            properties: {reason: {type: string}, lang_line: {type: string}}
        - id: diagnose
          command: diagnose
          depends_on: [diagnose-reject]
          model: opus
          effort: high
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, WebSearch, WebFetch]
          mutates_checkout: false
          sandbox: {enabled: true, allowUnsandboxedCommands: false}
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            required: [units, questions, framing, one_shot, materials_missing, carried_r1, one_shot_closes, precedents]
            additionalProperties: false
            properties:
              units:
                type: array
                items:
                  type: object
                  required: [key, label]
                  additionalProperties: true
                  properties:
                    key: {type: string, minLength: 1, pattern: '\S'}
                    label:
                      type: string
                      enum: [block, suggest, nit, question, info]
                    disposition:
                      type: string
                      enum: [do-now, defer]
                    reason: {type: string}
                    reopen_evidence: {type: string}
                    origin_analysis: {type: string}
                    why_chain:
                      type: array
                      items: {type: string}
                    prescriptions:
                      type: array
                      items: {type: string}
                    closed_note: {type: string}
                    class_query:
                      type: object
                      required: [how, counts, total]
                      additionalProperties: false
                      properties:
                        how:
                          type: object
                          required: [patterns, paths, count]
                          additionalProperties: false
                          properties:
                            patterns:
                              type: array
                              minItems: 1
                              maxItems: 20
                              items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]*[^\s\x00][^\n\r\x00]*$'}
                            fixed: {type: boolean}
                            paths:
                              type: array
                              minItems: 1
                              maxItems: 50
                              items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]*[^\s\x00][^\n\r\x00]*$'}
                            count:
                              type: string
                              enum: [lines, files]
                            untracked: {type: boolean}
                            ignore_case: {type: boolean}
                            word: {type: boolean}
                        counts:
                          type: string
                          enum: [defects, population]
                        total: {type: integer, minimum: 0}
                        note: {type: string}
                        hits:
                          type: array
                          maxItems: 20
                          items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]*[^\s\x00][^\n\r\x00]*$'}
                        misses:
                          type: array
                          maxItems: 20
                          items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]*[^\s\x00][^\n\r\x00]*$'}
                        examples_unavailable: {type: string, minLength: 10, pattern: '\S[\s\S]{8,}\S'}
                        misses_omitted_why: {type: string, minLength: 10, pattern: '\S[\s\S]{8,}\S'}
              questions:
                type: array
                items:
                  type: object
                  required: [key, kind, status, reason]
                  additionalProperties: false
                  properties:
                    key: {type: string, minLength: 1, pattern: '\S'}
                    kind:
                      type: string
                      enum: [fork, split, rule, stuck, thrash, premise, unverifiable, awaiting, field]
                    status:
                      type: string
                      enum: [held, decided, resolved, escalate]
                    reason: {type: string}
                    resolution: {type: string}
                    options:
                      type: array
                      items: {type: string}
                    depends:
                      type: array
                      items: {type: string}
                    origin: {type: string}
              framing: {type: string}
              one_shot: {type: string}
              materials_missing:
                type: array
                items: {type: string}
              carried_r1:
                type: array
                items:
                  type: object
                  required: [where, disposition]
                  additionalProperties: false
                  properties:
                    where: {type: string, minLength: 1, pattern: '\S'}
                    disposition:
                      type: string
                      enum: [promote, decline]
                    unit_key: {type: string}
                    why: {type: string}
              router:
                type: array
                items:
                  type: object
                  required: [key, route, note]
                  additionalProperties: false
                  properties:
                    key: {type: string}
                    route: {type: string}
                    note: {type: string}
              reburn_causes:
                type: array
                items:
                  type: object
                  required: [key, cause]
                  additionalProperties: false
                  properties:
                    key: {type: string}
                    cause:
                      type: string
                      enum: [コード, レビュアー, 規約, 前の周の修正]
                    note: {type: string}
              one_shot_closes:
                type: array
                items: {type: string}
              precedents:
                type: array
                items:
                  type: object
                  required: [key, problem, source, verdict, reason]
                  additionalProperties: false
                  properties:
                    key: {type: string, minLength: 1, pattern: '\S'}
                    problem: {type: string, minLength: 4, pattern: '\S[\s\S]{2,}\S'}
                    source: {type: string}
                    verdict:
                      type: string
                      enum: [adopt, adapt, does_not_apply, not_found]
                    reason: {type: string, minLength: 4, pattern: '\S[\s\S]{2,}\S'}
                    searched: {type: string}
                    undecided_because: {type: string}
              out_of_purpose:
                type: array
                items:
                  type: object
                  required: [source, where, why_outside]
                  additionalProperties: false
                  properties:
                    source: {type: string, minLength: 1, pattern: '\S'}
                    where: {type: string, minLength: 1, pattern: '\S'}
                    why_outside: {type: string, minLength: 10, pattern: '\S[\s\S]{8,}\S'}
                    text: {type: string, minLength: 1, pattern: '\S'}
              answer_ties:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    answer: {type: string, minLength: 1, pattern: '\S'}
                    redesign: {type: string, minLength: 1, pattern: '\S'}
                    to: {type: string, minLength: 1, pattern: '\S'}
                    none: {type: string, minLength: 20, pattern: '\S[\s\S]{18,}\S'}
        - id: diagnose-accept
          script: diagnose_accept
          runtime: uv
          timeout: 1728000000
          mutates_checkout: false
          depends_on: [diagnose]
          with: {status_guarded: true, reply: $diagnose.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
  - id: verify-prep
    script: verify
    runtime: uv
    timeout: 1728000000
    depends_on: [diagnose-loop]
    mutates_checkout: false
    with: {status_guarded: false, stage: prep}
    output_format:
      type: object
      additionalProperties: false
      required: [go, prompt_file, reason, lang_line]
      properties:

name: works-factory-merge
description: 取り込み。seal は run の差分を封じて守りのパスの当たりを返し、apply は封じた hash を今の差分と照らして run の置き場に置き、handoff は周の鎖の最後の差分を hash と R2 を照らして置く（対象のリポジトリへ当てるのは人。ただし deliver が pr の時だけ、置いた差分を run 専用の枝へ push して既定の枝向けの PR を作り、読み戻した結果を delivered に返す。merge はしない）
inputs:
  mode:
    required: true
    description: seal（差分を封じる）・apply（封じた差分を置き場に置く）・handoff（周の鎖の最後の差分を受けて出口を決める）
  start:
    default: ""
    description: 始めの記録のポインタ（base_rev を読む。seal と apply だけ）
  fingerprint:
    default: ""
    description: 最後のテストの段の緑の認証の指紋 {head, diff_hash}
  green_ok:
    default: ""
    description: 最後のテストの段が通ったか（ok）
  eyes_ok:
    default: ""
    description: 独立の目が通したか（ok）
  sealed_hash:
    default: ""
    description: seal が封じた差分の hash（apply だけ）
  answer:
    default: ""
    description: 最後の承認ノードの答え {decision, text}。承認ノードが開かなければ null（apply だけ）
  r2:
    default: ""
    description: apply は独立設計との比較（R2）の {status, reason}（省いた・走らなければ null）。handoff は周の鎖の最後の差分の r2_status の字（pass・redesign-needed・null）
  deliver:
    default: ""
    description: 出口の語。空は差分を置くだけ、pr は置いた差分を run 専用の枝（works-factory/run-<run id>）へ push して既定の枝向けの PR を作る（apply と handoff だけ。seal は読まない）
  placed:
    default: ""
    description: 周の鎖の最後の差分を置いた結果 {ok, hash, diff, reason}（handoff だけ）
  base_rev:
    default: ""
    description: 元の基の commit（handoff だけ。deliver が pr の時に PR の元になる版。既定の枝から届く版でなければ提出しない）
  request:
    default: ""
    description: 依頼のファイルの絶対パス（handoff だけ。deliver が pr の時に、その欄 issue の番号を commit と PR の本文で名指す。空は名指さない）
returns: merge
outcome_field: ok
nodes:
  - id: merge
    script: merge
    runtime: uv
    mutates_checkout: false
    timeout: 1728000000
    with:
      mode: $INPUTS.mode
      start: $INPUTS.start
      fingerprint: $INPUTS.fingerprint
      green_ok: $INPUTS.green_ok
      eyes_ok: $INPUTS.eyes_ok
      sealed_hash: $INPUTS.sealed_hash
      answer: $INPUTS.answer
      r2: $INPUTS.r2
      deliver: $INPUTS.deliver
      placed: $INPUTS.placed
      base_rev: $INPUTS.base_rev
      request: $INPUTS.request
    output_format:
      type: object
      properties:
        mode:
          type: string
          enum: [seal, apply, handoff]
        ok:
          type: boolean
        hash:
          type: string
        diff:
          type: [object, "null"]
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [merge/sealed.diff, merge/apply.diff, merge/refused.diff] }
          required: [type, run_id, path]
        protected_hits:
          type: [array, "null"]
          items:
            type: string
        reason:
          type: string
        delivered:
          type: [object, "null"]
          properties:
            ok: { type: boolean }
            branch: { type: string }
            commit: { type: string }
            url: { type: string }
            reason: { type: string }
          required: [ok, branch, commit, url, reason]
      required: [mode, ok, hash, diff, protected_hits, reason, delivered]
      additionalProperties: false

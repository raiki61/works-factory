# apply が置かなかった時: run は終わり（completed）、仕事の結末は ok: false。照らした差分を merge/refused.diff で指す。
# 出口の語 pr でも commit と PR の節は走らず、渡し方は作らずに止めた訳を返す
place:
  mode: apply
  ok: false
  hash: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  diff: { type: archon_artifact, run_id: fixture-run, path: merge/refused.diff }
  protected_hits: null
  protected_count: null
  reason: 封じた差分と今の差分が違う
  base_rev: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
  deliver: pr
fixture:
  expect: completed
  reached: [place, merge]
  inputs:
    mode: apply
    start: '{"type":"archon_artifact","run_id":"fixture-run","path":"start.json"}'
    sealed_hash: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    answer: "null"
    r2: '{"status":"redesign-needed","reason":"別の設計"}'
    deliver: pr
exec-code: true

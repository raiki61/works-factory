# seal の配線: 照らしの節 place の差し替えが output_format に通り、返す節 merge が渡し方を null にして返る（PR の節は走らない）
place:
  mode: seal
  ok: true
  hash: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  diff: { type: archon_artifact, run_id: fixture-run, path: sealed.diff }
  protected_hits: []
  protected_count: 0
  reason: ""
  base_rev: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
  deliver: ""
fixture:
  expect: completed
  reached: [place, merge]
  inputs:
    mode: seal
    base: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
exec-code: true

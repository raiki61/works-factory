name: works-factory-external-standards
description: >-
  外部標準照合: 対象差分が解いている問題を一般の問題の類に言い直し、リポジトリの外の一次情報（公式文書・標準・当該 OSS の issue と PR・ソース）で、
  枯れた定番解からの逸脱・定番解の劣化変種・手元の依存の使い残しを見る。素材集めの観点の block（docs/design/materials.md の形）。
  単独の run でも、判定のまとめから include されても動く
inputs:
  base: {default: "", description: "text: 対象差分の根の commit（対象差分は、この commit から作業ツリーの今の姿まで。未追跡の新しいファイルも入る）。空は HEAD"}
  purpose: {default: "null", description: "json(shared:purpose.schema.json): 固めた目的 {purpose_text, source, known_weaknesses, source_files}。null は目的の文が無い run"}
  entry: {default: "", description: "text: 判定から入る run の出どころの文（例「人の依頼（/path/req.json）」）。空は判定から入る run でない"}
  lang: {default: "", description: "text: 人に見せる欄（material の detail・checked・reason、findings の text・mechanism・measured・false_positive_if、seen・unseen、rankings の problem・ranked・diff_at・why_not_higher、rankings_none）の言語。空は依頼の言語"}
returns: finish
outcome_field: ok
nodes:
  - id: intake
    script: intake
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [due, reason]
      properties:
        due: {type: boolean}
        reason: {type: string}
  - id: external-standards-loop
    depends_on: [intake]
    when: $intake.output.due == true
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: done=$external-standards-accept.output.done; test "$done" = true
      nodes:
        - id: external-standards-prep
          script: role_prep
          runtime: uv
          mutates_checkout: false
          output_format:
            type: object
            additionalProperties: false
            required: [prompt]
            properties:
              prompt: {type: string}
        - id: external-standards
          prompt: "$external-standards-prep.output.prompt"
          depends_on: [external-standards-prep]
          model: '@wf-judge-materials'
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, Bash, WebSearch, WebFetch]
          sandbox:
            enabled: true
            allowUnsandboxedCommands: false
            failIfUnavailable: true
            excludedCommands: ['works-gh:*']
            network:
              allowedDomains: []
            # 作業ツリー・ほかの run の worktree・artifacts を書けなくする（~ は起動が隔離した HOME で、~/../archon-home が Archon の家。
            # '.' は cwd でなく設定の一時ファイルのフォルダに解かれる。実測 2026-10-13。issue #293）
            # 起こす直前に包み（workflows/.shared/fence.py）がこの値を印と読み、cwd・共通の .git・worktree の根などを足す（#309）
            filesystem:
              denyWrite: ['~/../archon-home']
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            required: [material, findings, seen, unseen, web_refetched, rankings]
            additionalProperties: false
            properties:
              material:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [found, clean, carried_over, not_applicable, awaiting_human, not_run]
                  count: {type: integer, minimum: 0}
                  detail: {type: string}
                  checked: {type: string}
                  reason: {type: string}
                  from_round: {type: integer, minimum: 1}
              findings:
                type: array
                items:
                  type: object
                  required: [where, text]
                  additionalProperties: false
                  properties:
                    where: {type: string}
                    text: {type: string}
                    mechanism: {type: string}
                    measured: {type: string}
                    false_positive_if: {type: string}
              seen: {type: string}
              unseen: {type: string}
              web_refetched: {type: boolean}
              rankings:
                type: array
                items:
                  type: object
                  required: [problem, source, ranked, diff_at]
                  additionalProperties: false
                  properties:
                    problem: {type: string, minLength: 4}
                    source: {type: string, minLength: 4}
                    ranked:
                      type: array
                      minItems: 1
                      items: {type: string, minLength: 1}
                    diff_at: {type: string, minLength: 1}
                    why_not_higher: {type: string}
              rankings_none: {type: string}
        - id: external-standards-accept
          script: role_accept
          runtime: uv
          mutates_checkout: false
          depends_on: [external-standards]
          with: {reply: $external-standards.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
  - id: finish
    script: finish
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, external-standards-loop]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, status, reason, material, report]
      properties:
        ok: {type: boolean}
        status: {type: string, enum: [ran, skipped, gave_up, failed]}
        reason: {type: string}
        material:
          type: [object, "null"]
          description: 'json(shared:material.schema.json): 観点の素材の状態のファイル（material.json）。書けなければ null'
          additionalProperties: false
          required: [type, run_id, path]
          properties:
            type: {type: string, enum: [archon_artifact]}
            run_id: {type: string}
            path: {type: string}
        report: {type: array, items: {type: string}}

# graph の筋書き: include した block ごとに入口と出口の node を台本で差し替え（中は飛ぶ）、graph の script（ins・受け皿・after-in・
# verdict）は本物で回す。block の中の道は各 block の筋書きが見る（docs/design/judge-eyes.md の 2.7 と 3 節の作る時の決め）
# standalone: 差分の根・目的・単位だけ。4 つの目が pass を返し、verdict が ok: true
fixture:
  expect: completed
  reached:
  - ins
  - structure-after__finish
  - after-in
  - r1__finish
  - r2__finish
  - r3__finish
  - r4__finish
  - verdict
  inputs:
    base: HEAD
    purpose: Uploads survive a flaky link.
    units: '[{"id": "u1", "summary": "retry the upload", "paths": ["app.py"]}]'
exec-code: true
structure-after__measure:
  eye: false
  sketch: false
  reason: '筋書き: block の中は block の筋書きが見る'
structure-after__finish:
  ok: true
  status: ok
  reason: ''
  structure: null

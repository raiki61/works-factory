  - id: result
    script: result
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        closed: { type: boolean }
        ok: { type: boolean }
        reason: { type: string }
        act: { type: string }
        word: { type: string }
        text: { type: string }
        request: { type: string }
        rounds: { type: array, items: { type: object } }
      required: [closed, ok, reason, act, word, text, request, rounds]
    mutates_checkout: false
    depends_on: [chain-start, round-1-decide, round-2-decide, round-3-decide, round-4-decide, round-5-decide]
    trigger_rule: all_done
    always_run: true
    with:
      start: { from: "$chain-start.output", if_skipped: null }
      d1: { from: "$round-1-decide.output", if_skipped: null }
      d2: { from: "$round-2-decide.output", if_skipped: null }
      d3: { from: "$round-3-decide.output", if_skipped: null }
      d4: { from: "$round-4-decide.output", if_skipped: null }
      d5: { from: "$round-5-decide.output", if_skipped: null }

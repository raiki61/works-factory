    workflow: works-factory-line
    depends_on: [round-4-decide]
    when: "$round-4-decide.output.act == 'launch'"
    with:
      request: "$round-4-decide.output.request"
      base: "$round-4-decide.output.base"
      pr: "$round-4-decide.output.pr"
      spec: "$round-4-decide.output.spec"
      test_cmd: "$INPUTS.test_cmd"
      tdd_suite: "$INPUTS.tdd_suite"

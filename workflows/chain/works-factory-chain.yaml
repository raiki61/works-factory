name: works-factory-chain
description: |
  works-factory の周の鎖。1 回の起動で、メイングラフ works-factory-line の run（周）を workflow: のノードで子の run として最大 5 本
  つなぐ。前の周の残り（次の依頼）が次の周の依頼になり、止めの語（lib/chain.py の STOPS）が出たら止まる。
  起こす・待つ・承認・再開・費用の合算は Archon の workflow: のノードが持ち、works-factory が書くのは周の commit（round_commit）・
  次の依頼（round_facts）・止めの決め（decide）の script だけ。鎖は名指して起こした時だけで、メイングラフを直に起こせば今の 1 周の run のまま。
  鎖の最後のノード final-diff が、止まった周を採らずに元の基から採る周までの差分を封じ、周ごとの表 chain.md を親の置き場に書く。
  出口の語 pr の時だけ、その後にサブグラフ merge を check で include し、親の run の枝を最後の差分と照らして PR を 1 本作る（周の子は PR を作らない）。
  出力はノード result（最後の決めの act・止めの語 word・周ごとの行 rounds と、止めの語が closed の時に真の closed と、bin/apply が
  読む最後の差分 apply・sealed・R2 の語 r2_status・承認し直すかの問いの数 spec_questions と chain.md のポインタ report）。
  bin/apply <親の run> が最後の差分を当てる。出口の語 pr の run は、result の deliver が PR の在りかか作らずに止めた訳を持つ。

inputs:
  rounds:
    required: true
    description: つなぐ周の数（1〜5 の整数）。範囲の外は chain-start が AI の前で止める
  budget_usd:
    default: ""
    description: 費用の上限 USD（空か正の数）。在れば、累計と最大の周の費用の和が上限を越えうる時と、費用が読めない周が在る時に止める
  request:
    default: ""
    description: 1 周目の子にだけ渡すメイングラフの同じ名の入力。2 周目からは request を前の周が運んだ次の依頼に替え、ほかは空にする
  base:
    default: ""
    description: 1 周目の子にだけ渡すメイングラフの同じ名の入力。2 周目からは request を前の周が運んだ次の依頼に替え、ほかは空にする
  pr:
    default: ""
    description: 1 周目の子にだけ渡すメイングラフの同じ名の入力。2 周目からは request を前の周が運んだ次の依頼に替え、ほかは空にする
  spec:
    default: ""
    description: 1 周目の子にだけ渡すメイングラフの同じ名の入力。2 周目からは request を前の周が運んだ次の依頼に替え、ほかは空にする
  test_cmd:
    default: ""
    description: どの周の子にも渡すメイングラフの同じ名の入力
  tdd_suite:
    default: ""
    description: どの周の子にも渡すメイングラフの同じ名の入力
  final_gate:
    default: ""
    description: どの周の子にも渡すメイングラフの同じ名の入力
  unattended:
    default: ""
    description: どの周の子にも渡すメイングラフの同じ名の入力
  design_only:
    default: ""
    description: メイングラフの同じ名の入力。鎖とは組めず、空でなければ chain-start が拒む（子には空のまま渡る）
  thickness:
    default: ""
    description: どの周の子にも渡すメイングラフの同じ名の入力
  features_off:
    default: ""
    description: どの周の子にも渡すメイングラフの同じ名の入力
  features_on:
    default: ""
    description: どの周の子にも渡すメイングラフの同じ名の入力
  policy_md:
    default: ""
    description: どの周の子にも渡すメイングラフの同じ名の入力
  fix_fixture:
    default: ""
    description: メイングラフの同じ名の入力。鎖とは組めず、空でなければ chain-start が拒む（子には空のまま渡る）
  lang:
    default: ""
    description: どの周の子にも渡すメイングラフの同じ名の入力
  deliver:
    default: ""
    description: 出口の語（lib/entry.py の DELIVERS）。周の子には空で渡し、子は PR を作らない。pr は最後の差分を封じた後に、親の run の枝を最後の差分と照らし、Archon に同梱の archon-pr で PR を 1 本だけ作る（親の run の枝が対象の既定の枝と同じ名なら push せずに止める。merge はしない）。知らない語は chain-start が止める

# 周の commit（round-k-commit）は run の作業ツリーの枝へ積む。--no-worktree で利用者の作業ツリーに走らせない
worktree:
  enabled: true

returns: result
outcome_field: closed

nodes:
  # 始め。入力を確かめ、0 周目の決めと同じ形の出力を返す。受けなければ act: refused で、周のノードは when: で全部飛ぶ
  - id: chain-start
    script: chain_start
    runtime: uv
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        reason: { type: string }
        act: { type: string }
        word: { type: string }
        text: { type: string }
        request: { type: string }
        base: { type: string }
        pr: { type: string }
        spec: { type: string }
        rows: { type: array, items: { type: object } }
        rounds: { type: integer }
        budget: { type: [number, "null"] }
        first_request: { type: string }
        first_pr: { type: integer }
        origin: { type: string }
        deliver: { type: string }
        user_env_dir: { type: string }
      required: [ok, reason, act, word, text, request, base, pr, spec, rows, rounds, budget, first_request, first_pr, origin, deliver,
                 user_env_dir]
    mutates_checkout: false

  # 周ごとの 4 つのノード。5 組は番号と前の決め（1 周目は chain-start、ほかは前の周の round-<k-1>-decide）のほかは同じ形。
  # 同じ物は 1 周目の定義のアンカーが持ち、2〜5 周目は <<: * で受ける。アンカーが共有するのは commit・facts・decide の本体（script・
  # runtime・timeout・output_format と、facts・decide の mutates_checkout）と、子の workflow（round_line）と、子へ渡す入力（line_inputs）と facts・decide の入力
  # （facts_inputs・decide_inputs）。周ごとに残すのは id・depends_on・when・前の決めから受ける request・base・pr・spec・rows・child と
  # round-k の参照（outcome・apply・r2_status・spec_questions・facts・commit・next_request）。縛るのは tests/workflows/test_chain.py。
  # 前の周が飛ぶと、既定の trigger_rule で後ろの周も全部飛ぶ
  - id: round-1
    <<: &round_line
      workflow: works-factory-line
    depends_on: [chain-start]
    when: "$chain-start.output.act == 'launch'"
    with:
      <<: &line_inputs
        test_cmd: "$INPUTS.test_cmd"
        tdd_suite: "$INPUTS.tdd_suite"
        final_gate: "$INPUTS.final_gate"
        unattended: "$INPUTS.unattended"
        design_only: "$INPUTS.design_only"
        thickness: "$INPUTS.thickness"
        features_off: "$INPUTS.features_off"
        features_on: "$INPUTS.features_on"
        policy_md: "$INPUTS.policy_md"
        fix_fixture: "$INPUTS.fix_fixture"
        lang: "$INPUTS.lang"
        deliver: ""
      request: "$chain-start.output.request"
      base: "$chain-start.output.base"
      pr: "$chain-start.output.pr"
      spec: "$chain-start.output.spec"

  - id: round-1-commit
    <<: &round_commit
      script: round_commit
      runtime: uv
      output_format:
        type: object
        properties:
          ok: { type: boolean }
          changed: { type: [boolean, "null"] }
          head: { type: string }
          reason: { type: string }
        required: [ok, changed, head, reason]
    depends_on: [round-1]

  - id: round-1-facts
    <<: &round_facts
      script: round_facts
      runtime: uv
      output_format:
        type: object
        properties:
          ok: { type: boolean }
          error: { type: string }
          run: { type: string }
          keys: { type: array, items: { type: string } }
          held_rows: { type: array, items: { type: object } }
          request: { type: string }
          source: { type: string }
          cost: { type: [number, "null"] }
          cost_read: { type: boolean }
          minutes: { type: [number, "null"] }
        required: [ok, error, run, keys, held_rows, request, source, cost, cost_read, minutes]
      mutates_checkout: false
    depends_on: [round-1-commit]
    with:
      <<: &facts_inputs
        first_request: "$chain-start.output.first_request"
        first_pr: "$chain-start.output.first_pr"
      next_request: "$round-1.output.next_request"
      child: round-1

  - id: round-1-decide
    <<: &round_decide
      script: decide
      runtime: uv
      output_format:
        type: object
        properties:
          act: { type: string }
          word: { type: string }
          text: { type: string }
          request: { type: string }
          base: { type: string }
          pr: { type: string }
          spec: { type: string }
          rows: { type: array, items: { type: object } }
        required: [act, word, text, request, base, pr, spec, rows]
      mutates_checkout: false
    depends_on: [round-1-facts]
    with:
      <<: &decide_inputs
        rounds_max: "$chain-start.output.rounds"
        budget: "$chain-start.output.budget"
      rows: "$chain-start.output.rows"
      outcome: "$round-1.output.outcome"
      apply: "$round-1.output.apply"
      r2_status: "$round-1.output.r2_status"
      spec_questions: "$round-1.output.spec_questions"
      facts: "$round-1-facts.output"
      commit: "$round-1-commit.output"

  - id: round-2
    <<: *round_line
    depends_on: [round-1-decide]
    when: "$round-1-decide.output.act == 'launch'"
    with:
      <<: *line_inputs
      request: "$round-1-decide.output.request"
      base: "$round-1-decide.output.base"
      pr: "$round-1-decide.output.pr"
      spec: "$round-1-decide.output.spec"

  - id: round-2-commit
    <<: *round_commit
    depends_on: [round-2]

  - id: round-2-facts
    <<: *round_facts
    depends_on: [round-2-commit]
    with:
      <<: *facts_inputs
      next_request: "$round-2.output.next_request"
      child: round-2

  - id: round-2-decide
    <<: *round_decide
    depends_on: [round-2-facts]
    with:
      <<: *decide_inputs
      rows: "$round-1-decide.output.rows"
      outcome: "$round-2.output.outcome"
      apply: "$round-2.output.apply"
      r2_status: "$round-2.output.r2_status"
      spec_questions: "$round-2.output.spec_questions"
      facts: "$round-2-facts.output"
      commit: "$round-2-commit.output"

  - id: round-3
    <<: *round_line
    depends_on: [round-2-decide]
    when: "$round-2-decide.output.act == 'launch'"
    with:
      <<: *line_inputs
      request: "$round-2-decide.output.request"
      base: "$round-2-decide.output.base"
      pr: "$round-2-decide.output.pr"
      spec: "$round-2-decide.output.spec"

  - id: round-3-commit
    <<: *round_commit
    depends_on: [round-3]

  - id: round-3-facts
    <<: *round_facts
    depends_on: [round-3-commit]
    with:
      <<: *facts_inputs
      next_request: "$round-3.output.next_request"
      child: round-3

  - id: round-3-decide
    <<: *round_decide
    depends_on: [round-3-facts]
    with:
      <<: *decide_inputs
      rows: "$round-2-decide.output.rows"
      outcome: "$round-3.output.outcome"
      apply: "$round-3.output.apply"
      r2_status: "$round-3.output.r2_status"
      spec_questions: "$round-3.output.spec_questions"
      facts: "$round-3-facts.output"
      commit: "$round-3-commit.output"

  - id: round-4
    <<: *round_line
    depends_on: [round-3-decide]
    when: "$round-3-decide.output.act == 'launch'"
    with:
      <<: *line_inputs
      request: "$round-3-decide.output.request"
      base: "$round-3-decide.output.base"
      pr: "$round-3-decide.output.pr"
      spec: "$round-3-decide.output.spec"

  - id: round-4-commit
    <<: *round_commit
    depends_on: [round-4]

  - id: round-4-facts
    <<: *round_facts
    depends_on: [round-4-commit]
    with:
      <<: *facts_inputs
      next_request: "$round-4.output.next_request"
      child: round-4

  - id: round-4-decide
    <<: *round_decide
    depends_on: [round-4-facts]
    with:
      <<: *decide_inputs
      rows: "$round-3-decide.output.rows"
      outcome: "$round-4.output.outcome"
      apply: "$round-4.output.apply"
      r2_status: "$round-4.output.r2_status"
      spec_questions: "$round-4.output.spec_questions"
      facts: "$round-4-facts.output"
      commit: "$round-4-commit.output"

  - id: round-5
    <<: *round_line
    depends_on: [round-4-decide]
    when: "$round-4-decide.output.act == 'launch'"
    with:
      <<: *line_inputs
      request: "$round-4-decide.output.request"
      base: "$round-4-decide.output.base"
      pr: "$round-4-decide.output.pr"
      spec: "$round-4-decide.output.spec"

  - id: round-5-commit
    <<: *round_commit
    depends_on: [round-5]

  - id: round-5-facts
    <<: *round_facts
    depends_on: [round-5-commit]
    with:
      <<: *facts_inputs
      next_request: "$round-5.output.next_request"
      child: round-5

  - id: round-5-decide
    <<: *round_decide
    depends_on: [round-5-facts]
    with:
      <<: *decide_inputs
      rows: "$round-4-decide.output.rows"
      outcome: "$round-5.output.outcome"
      apply: "$round-5.output.apply"
      r2_status: "$round-5.output.r2_status"
      spec_questions: "$round-5.output.spec_questions"
      facts: "$round-5-facts.output"
      commit: "$round-5-commit.output"

  # 最後の差分と chain.md。周の子かその周のノードが落ちて後ろが飛んでも走る（resume のたびに走り直す）
  - id: final-diff
    script: final_diff
    runtime: uv
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        reason: { type: string }
        apply: { type: [object, "null"] }
        sealed: { type: [object, "null"], properties: { hash: { type: string } } }
        report: { type: [object, "null"] }
        kept: { type: integer }
        skipped: { type: array, items: { type: integer } }
        outcome: { type: string }
        r2_status: { type: [string, "null"] }
        spec_questions: { type: integer }
        placed: { type: boolean }
      required: [ok, reason, apply, sealed, report, kept, skipped, outcome, r2_status, spec_questions, placed]
    mutates_checkout: false
    depends_on: [chain-start, round-1-decide, round-2-decide, round-3-decide, round-4-decide, round-5-decide]
    trigger_rule: all_done
    always_run: true
    with:
      start: { from: "$chain-start.output", if_skipped: null }
      d1: { from: "$round-1-decide.output", if_skipped: null }
      d2: { from: "$round-2-decide.output", if_skipped: null }
      d3: { from: "$round-3-decide.output", if_skipped: null }
      d4: { from: "$round-4-decide.output", if_skipped: null }
      d5: { from: "$round-5-decide.output", if_skipped: null }

  # 出口の語 pr の時だけ。親の run の枝（周の commit が積まれた枝）を元の基からの最後の差分と照らし、PR を 1 本作る。最後の差分に入る
  # どの周も差分を置いた時だけ（placed）
  - id: hand
    include: works-factory-merge
    depends_on: [final-diff]
    when: "$chain-start.output.deliver == 'pr' && $final-diff.output.placed == true"
    with:
      mode: check
      base_rev: "$chain-start.output.origin"
      sealed_hash: "$final-diff.output.sealed.hash"
      deliver: "$chain-start.output.deliver"
      request: "$chain-start.output.first_request"
      user_env_dir: "$chain-start.output.user_env_dir"

  # 鎖の出力。周の子かその周のノードか final-diff が落ちて後ろが飛んでも走る（resume のたびに走り直す）
  - id: result
    script: result
    runtime: uv
    output_format:
      type: object
      properties:
        closed: { type: boolean }
        ok: { type: boolean }
        reason: { type: string }
        act: { type: string }
        word: { type: string }
        text: { type: string }
        request: { type: string }
        rounds: { type: array, items: { type: object } }
        apply: { type: [object, "null"] }
        sealed: { type: [object, "null"] }
        report: { type: [object, "null"] }
        outcome: { type: string }
        r2_status: { type: [string, "null"] }
        spec_questions: { type: integer }
        stop_reason: { type: string }
        deliver: { type: [object, "null"] }
      required: [closed, ok, reason, act, word, text, request, rounds, apply, sealed, report, outcome, r2_status, spec_questions,
                 stop_reason, deliver]
    mutates_checkout: false
    depends_on: [chain-start, round-1-decide, round-2-decide, round-3-decide, round-4-decide, round-5-decide, final-diff, hand]
    trigger_rule: all_done
    always_run: true
    with:
      start: { from: "$chain-start.output", if_skipped: null }
      final: { from: "$final-diff.output", if_skipped: null }
      hand: { from: "$hand.output.deliver", if_skipped: null }
      d1: { from: "$round-1-decide.output", if_skipped: null }
      d2: { from: "$round-2-decide.output", if_skipped: null }
      d3: { from: "$round-3-decide.output", if_skipped: null }
      d4: { from: "$round-4-decide.output", if_skipped: null }
      d5: { from: "$round-5-decide.output", if_skipped: null }

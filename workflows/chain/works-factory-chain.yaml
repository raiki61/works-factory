        keys: { type: array, items: { type: string } }
        held_rows: { type: array, items: { type: object } }
        request: { type: string }
        source: { type: string }
        cost: { type: [number, "null"] }
        cost_read: { type: boolean }
      required: [ok, error, run, keys, held_rows, request, source, cost, cost_read]
    mutates_checkout: false
    depends_on: [round-3-commit]
    with:
      next_request: "$round-3.output.next_request"
      child: round-3
      first_request: "$chain-start.output.first_request"
      first_pr: "$chain-start.output.first_pr"

  - id: round-3-decide
    script: decide
    runtime: uv
    timeout: 1728000000
    output_format:
      type: object
      properties:
        act: { type: string }
        word: { type: string }
        text: { type: string }
        request: { type: string }
        base: { type: string }
        pr: { type: string }
        spec: { type: string }
        rows: { type: array, items: { type: object } }

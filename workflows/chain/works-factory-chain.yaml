    mutates_checkout: false
    depends_on: [round-3-facts]
    with:
      rows: "$round-2-decide.output.rows"
      outcome: "$round-3.output.outcome"
      facts: "$round-3-facts.output"
      commit: "$round-3-commit.output"
      rounds_max: "$chain-start.output.rounds"
      budget: "$chain-start.output.budget"

  - id: round-4
    workflow: works-factory-line
    depends_on: [round-3-decide]
    when: "$round-3-decide.output.act == 'launch'"
    with:
      request: "$round-3-decide.output.request"
      base: "$round-3-decide.output.base"
      pr: "$round-3-decide.output.pr"
      spec: "$round-3-decide.output.spec"
      test_cmd: "$INPUTS.test_cmd"
      tdd_suite: "$INPUTS.tdd_suite"
      final_gate: "$INPUTS.final_gate"
      unattended: "$INPUTS.unattended"
      design_only: "$INPUTS.design_only"
      thickness: "$INPUTS.thickness"
      features_off: "$INPUTS.features_off"
      features_on: "$INPUTS.features_on"

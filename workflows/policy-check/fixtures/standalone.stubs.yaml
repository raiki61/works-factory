# 単独の run: 方針の文だけで、world と plan-review（事前審査の形 text）の include を通って最後まで届く（script は本当に走り、AI の役の
# 返答だけを差し替える）。dry-run は include の中の loop の本体の node に include の道を渡さない（docs/design/README.md の 13 節）ので、
# world の言い直しの輪の本体と、事前審査の方針の文の輪の本体（text-prep・text-accept）は差し替え、配線（policy-in の値が world と
# review の入口に届き、result がまとめる）だけを見る。world と plan-review の中の道は、それぞれの block の筋書きが見る
fixture:
  expect: completed
  reached: [policy-in, world__intake, world-classes-prep, world-classes, world-classes-accept, world__pick, world__finish, review-run__intake,
            text-prep, review-text, text-accept, review-run__review-reads, review-run__finish, result]
  inputs:
    policy: '- Retry a failed upload three times with a fixed one second wait.'
exec-code: true
world-classes-prep: {prompt: 'You are the restater.'}
world-classes:
  classes:
    - finding: 1
      problem: how a client should retry a failed network upload
      activity: retrying failed network requests
      proposed: retry three times with a fixed one second wait
      queries: [retry policy for failed network requests]
world-classes-accept: {ok: true, done: true, reason: ''}
text-prep: {prompt: 'You are the pre-reviewer.'}
review-text:
  faces:
    - key: fixed-wait-retry-storm
      kind: regression
      where: the retry policy statement
      why: 'A fixed one second wait makes every client retry at the same moment and overloads the server again.'
      severity: block
      reach: breaks_fix
  shrink: []
  reason: 'Checked the policy statement against the eight checks; the fixed wait is the only hole.'
text-accept: {ok: true, done: true, give_up: false, reason: ''}

name: works-factory-policy-check
description: '方針の文だけを入れる入口の graph（docs/design/world.md の 9 章）。方針の文（直し方の案）を世界の解と事前審査の観点（案の欠陥を探す review。plan-review の形 text）で評価し、事前審査の block の穴と定石と違う所を先に並べて返す。承認ノードは持たない'
inputs:
  policy:
    required: true
    description: 'text: 評価する方針の文（直し方の案）'
  problem: {default: '', description: 'text: 何が困っているか（依頼の文）。空なら方針の文を依頼の行として使う'}
  purpose: {default: '', description: 'text: 目的の 1 文。空は渡されていない'}
  web: {default: 'on', description: 'choice(on|off): web で出典を探すか'}
  lang: {default: '', description: 'text: 人に見せる欄の言語。空は依頼の言語'}
returns: result
outcome_field: ok
nodes:
  - id: policy-in
    script: policy_in
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [request, policy, means, purpose, web, lang]
      properties:
        request:
          type: object
          additionalProperties: false
          required: [type, run_id, path]
          description: 'json(shared:request.schema.json): 方針の文と困り事から組んだ依頼の行'
          properties: &pointer_fields
            type: {type: string, enum: [archon_artifact]}
            run_id: {type: string}
            path: {type: string}
        policy: {type: string}
        means:
          type: array
          items: {type: string}
        purpose: {type: string}
        web:
          type: string
          enum: ['on', 'off']
        lang: {type: string}
  - id: world
    include: works-factory-world
    depends_on: [policy-in]
    with:
      request: "$policy-in.output.request"
      means: "$policy-in.output.means"
      purpose: "$policy-in.output.purpose"
      web: "$policy-in.output.web"
      lang: "$policy-in.output.lang"
  - id: review-run
    include: works-factory-plan-review
    depends_on: [policy-in, world]
    trigger_rule: all_done
    with:
      proposal: "$policy-in.output.policy"
      purpose: "$policy-in.output.purpose"
      world_rows: "$world.output.rows"
      lang: "$policy-in.output.lang"
  - id: result
    script: result
    runtime: uv
    mutates_checkout: false
    depends_on: [world, review-run]
    trigger_rule: all_done
    with:
      world: {from: "$world.output", if_skipped: null}
      review: {from: "$review-run.output", if_skipped: null}
    output_format:
      type: object
      additionalProperties: false
      required: [ok, world, holes, report]
      properties:
        ok: {type: boolean}
        world:
          # world の返り（WORLD の 7 欄）をそのまま載せる。走らなかった時は null
          type: [object, 'null']
          properties:
            ok: {type: boolean}
            status: {type: string}
            reason: {type: string}
            rows:
              type: [object, 'null']
              additionalProperties: false
              required: [type, run_id, path]
              description: 'jsonl(lib:world-row.schema.json): 世界の解の行。行が無ければ null'
              properties: *pointer_fields
            classes: {type: integer}
            dropped: {type: integer}
            report: {type: array, items: {type: string}}
        holes:
          # 事前審査の返答の faces（人に回しうる穴の行）
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              unit_keys: {type: array, items: {type: string}}
              kind: {type: string}
              where: {type: string}
              why: {type: string}
              severity: {type: string}
              reach: {type: string}
        report:
          type: array
          items: {type: string}

name: works-factory-prior-decisions
description: >-
  先行議論の突合: 対象差分が触れる領域（差分が空なら依頼が指す場所）の決定記録を洗い、決着済みの論点を返す。素材集めの観点の block
  （docs/design/materials.md の形）。単独の run でも、判定のまとめから include されても動く
inputs:
  base: {default: "", description: "text: 対象差分の根の commit（対象差分は、この commit から作業ツリーの今の姿まで。未追跡の新しいファイルも入る）。空は HEAD"}
  request: {default: "[]", description: "json(shared:request.schema.json): 依頼の行の配列 [{where, text, mechanism?, measured?, false_positive_if?}]。それを findings の欄に持つオブジェクトでもよい（工場の依頼のファイルの形）。空の配列は依頼の行が無い"}
  entry: {default: "", description: "text: 判定から入る run の出どころの文（例「人の依頼（/path/req.json）」）。空は判定から入る run でない"}
  lang: {default: "", description: "text: 人に見せる欄（material の detail・checked・reason、searched、settled の topic・decision・reason・revisit）の言語。空は依頼の言語"}
returns: finish
outcome_field: ok
nodes:
  - id: intake
    script: intake
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [due, reason]
      properties:
        due: {type: boolean}
        reason: {type: string}
  - id: prior-decisions-loop
    depends_on: [intake]
    when: $intake.output.due == true
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: done=$prior-decisions-accept.output.done; test "$done" = true
      nodes:
        - id: prior-decisions-prep
          script: role_prep
          runtime: uv
          mutates_checkout: false
          output_format:
            type: object
            additionalProperties: false
            required: [prompt]
            properties:
              prompt: {type: string}
        - id: prior-decisions
          prompt: "$prior-decisions-prep.output.prompt"
          depends_on: [prior-decisions-prep]
          model: '@wf-judge-materials'
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, Bash, WebSearch, WebFetch]
          sandbox:
            enabled: true
            allowUnsandboxedCommands: false
            failIfUnavailable: true
            excludedCommands: ['works-gh:*']
            network:
              allowedDomains: []
            # 作業ツリー・ほかの run の worktree・artifacts を書けなくする（~ は起動が隔離した HOME で、~/../archon-home が Archon の家。
            # '.' は cwd でなく設定の一時ファイルのフォルダに解かれる。実測 2026-10-13。issue #293）
            # 起こす直前に包み（workflows/.shared/fence.py）がこの値を印と読み、cwd・共通の .git・worktree の根などを足す（#309）
            filesystem:
              denyWrite: ['~/../archon-home']
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            required: [material, checked, searched, settled]
            additionalProperties: false
            properties:
              material:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [found, clean, carried_over, not_applicable, awaiting_human, not_run]
                  count: {type: integer, minimum: 0}
                  detail: {type: string}
                  checked: {type: string}
                  reason: {type: string}
                  from_round: {type: integer, minimum: 1}
              checked: {type: boolean}
              searched:
                type: array
                items: {type: string}
              settled:
                type: array
                items:
                  type: object
                  required: [topic, decision, reason, revisit]
                  additionalProperties: false
                  properties:
                    topic: {type: string}
                    decision: {type: string}
                    reason: {type: string}
                    revisit: {type: string}
                    where: {type: string}
              conflicts:
                type: array
                items:
                  type: object
                  required: [decision, where, why]
                  additionalProperties: false
                  properties:
                    decision: {type: string, minLength: 1}
                    where: {type: string, minLength: 1}
                    why: {type: string, minLength: 1}
        - id: prior-decisions-accept
          script: role_accept
          runtime: uv
          mutates_checkout: false
          depends_on: [prior-decisions]
          with: {reply: $prior-decisions.output}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              reason: {type: string}
  - id: finish
    script: finish
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, prior-decisions-loop]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, status, reason, material, report]
      properties:
        ok: {type: boolean}
        status: {type: string, enum: [ran, skipped, gave_up, failed]}
        reason: {type: string}
        material:
          type: [object, "null"]
          required: [type, run_id, path]
          properties:
            type: {const: archon_artifact}
            run_id: {type: string}
            path: {type: string}
        report: {type: array, items: {type: string}}

name: works-factory-weapon-tdd-close
description: >-
  書き手の型 tdd-close の block（docs/design/weapon-tdd-close.md）。注文の単位のうち、TDD の loop が試験を先に作業ツリーに直し終えた単位の返答（単位ごとの changes の行と周の全体の欄）を書く閉じの書き手を 1 人起こし、返答を形に照らして返す。
  修正の block が include する葉の block（入口が script）で、単独の run でも回る
inputs:
  order:
    required: true
    description: 'json(shared:weapon-order.schema.json): 注文（この型の単位・範囲・許し・起点）'
  slots:
    required: true
    description: 'json(shared:writer-slots.schema.json): 書き手の指示の共通の値と段落の真偽（材料・却下・裁定・相談の続き・義務から引く段落）'
returns: tdd-close-out
outcome_field: ok
nodes:
  - id: tdd-close-prep
    script: writer_prep
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt: {type: string}

  - id: tdd-close
    description: '書き手の型の block tdd-close の書き手'
    depends_on: [tdd-close-prep]
    prompt: "$tdd-close-prep.output.prompt"
    model: '@wf-fix-writers'
    settingSources: [user]
    allowed_tools: [Read, Grep, Glob, Edit, Write, Bash, WebSearch, WebFetch]
    sandbox: {enabled: true, allowUnsandboxedCommands: false}
    idle_timeout: 1728000000
    retry: {max_attempts: 2, on_error: all}
    output_format:
      type: object
      required: [changes, fix_closure, gates_changed, interactions, mechanism_changed, not_done, path_changed, plan_faces, premise_drift, seams_changed, security_surface_changed, wrote_refs]
      additionalProperties: false
      properties:
        changes:
          type: array
          items:
            type: object
            required: [breaks, bypass_tried, closure, files, root_or_symptom, unit_key, what, precedent]
            additionalProperties: false
            properties:
              unit_key: {type: string}
              what: {type: string}
              closure:
                type: object
                required: [mechanism, fix_mechanism, verified_how, sites]
                additionalProperties: false
                properties:
                  mechanism: {type: string}
                  fix_mechanism: {type: string}
                  verified_how: {type: string}
                  sites:
                    type: array
                    items:
                      type: object
                      required: [site, red_seen]
                      additionalProperties: false
                      properties:
                        site: {type: string}
                        red_seen: {type: boolean}
                        path: {type: string}
                        at: {type: string}
                        fixed_by:
                          type: array
                          items: {type: string}
                        test: {type: string}
              files:
                type: array
                minItems: 1
                items: {type: string}
              coverage:
                type: object
                additionalProperties: false
                properties:
                  how:
                    type: object
                    required: [patterns, paths, count]
                    additionalProperties: false
                    properties:
                      patterns:
                        type: array
                        minItems: 1
                        maxItems: 20
                        items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]+$'}
                      fixed: {type: boolean}
                      paths:
                        type: array
                        minItems: 1
                        maxItems: 50
                        items: {type: string, minLength: 1, pattern: '^[^\n\r\x00]+$'}
                      count:
                        type: string
                        enum: [lines, files]
                      untracked: {type: boolean}
                      ignore_case: {type: boolean}
                      word: {type: boolean}
                  counts:
                    type: string
                    enum: [defects, population]
                  remaining: {type: string}
              root_or_symptom:
                type: object
                required: [kind, why]
                additionalProperties: false
                properties:
                  kind:
                    type: string
                    enum: [root, symptom]
                  why: {type: string, minLength: 1}
              bypass_tried: {type: string, minLength: 1}
              breaks:
                type: object
                required: [how, result]
                additionalProperties: false
                properties:
                  how: {type: string, minLength: 1}
                  result: {type: string, minLength: 1}
                  accepted: {type: string}
                  accepted_title: {type: string}
              precedent:
                type: object
                required: [verdict, reason]
                additionalProperties: false
                properties:
                  problem: {type: string}
                  source: {type: string}
                  verdict:
                    type: string
                    enum: [adopt, adapt, does_not_apply, not_found]
                  reason: {type: string, minLength: 4}
                  searched: {type: string}
                  from_judge_row: {type: boolean}
                allOf:
                - if:
                    not:
                      required: [from_judge_row]
                      properties:
                        from_judge_row: {const: true}
                  then:
                    required: [problem]
                    properties:
                      problem: {type: string, minLength: 4}
                - if:
                    allOf:
                    - not:
                        required: [from_judge_row]
                        properties:
                          from_judge_row: {const: true}
                    - required: [verdict]
                      properties:
                        verdict: {const: not_found}
                  then:
                    required: [searched]
                    properties:
                      searched: {type: string, minLength: 4}
                - if:
                    allOf:
                    - not:
                        required: [from_judge_row]
                        properties:
                          from_judge_row: {const: true}
                    - required: [verdict]
                      properties:
                        verdict:
                          not: {const: not_found}
                  then:
                    required: [source]
                    properties:
                      source: {type: string, minLength: 4}
        not_done:
          type: array
          items:
            type: object
            required: [unit_key, why]
            additionalProperties: false
            properties:
              unit_key: {type: string}
              why: {type: string}
        fix_closure:
          type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [found, clean, carried_over, not_applicable, awaiting_human, not_run]
            count: {type: integer, minimum: 0}
            detail: {type: string}
            checked: {type: string}
            reason: {type: string}
            from_round: {type: integer, minimum: 1}
        mechanism_changed: {type: boolean}
        premise_drift: {type: boolean}
        premise_drift_note: {type: string}
        gates_changed: {type: boolean}
        seams_changed: {type: boolean}
        security_surface_changed: {type: boolean}
        path_changed: {type: boolean}
        decision_records_changed: {type: boolean}
        rejudge_requested: {type: string}
        interactions:
          type: array
          items:
            type: object
            required: [surface, checked]
            additionalProperties: false
            properties:
              surface: {type: string, minLength: 1}
              checked: {type: string, minLength: 1}
              combined_effect: {type: string}
        wrote_refs:
          type: array
          maxItems: 50
          items:
            type: object
            required: [kind, target, where]
            additionalProperties: false
            properties:
              kind:
                type: string
                enum: [file, text]
              cite: {type: string, minLength: 1, maxLength: 500}
              target: {type: string, minLength: 1, maxLength: 300}
              where: {type: string, minLength: 1, maxLength: 300}
        plan_faces:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, handled, how]
            properties:
              key: {type: string, minLength: 8}
              handled:
                type: string
                enum: [absorbed, declared]
              how: {type: string, minLength: 20}
        x_scalars:
          type: object
          additionalProperties: false
          patternProperties:
            ^x_[a-z0-9_]+$: {type: number}
        conflicts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [unit_key, between, why_both_cannot_hold, which_is_right, kind]
            properties:
              unit_key: {type: string, minLength: 1}
              between:
                type: array
                minItems: 2
                items: {type: string, minLength: 3}
              why_both_cannot_hold: {type: string, minLength: 10}
              which_is_right:
                type: string
                enum: [request, test, code, unknown, query]
              correct_lines:
                type: array
                minItems: 1
                maxItems: 20
                items: {type: string, minLength: 1}
              kind:
                type: string
                enum: [brief_vs_judgment, unnamed_test_broke, not_red, scope_needed, query_hits_fixed, needs_context, red_at_base]
        consult:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [item, paths, tests, why, tried, blocked, evidence]
            properties:
              item: {type: integer, minimum: 1}
              paths:
                type: array
                items: {type: string, minLength: 1}
              tests:
                type: array
                items: {type: string, minLength: 1}
              new_tests:
                type: array
                items: {type: string, minLength: 1}
              why: {type: string, minLength: 10}
              tried:
                type: array
                minItems: 1
                items: {type: string, minLength: 1}
              blocked: {type: string, minLength: 10}
              evidence:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [path, line]
                  properties:
                    path: {type: string, minLength: 1}
                    line: {type: integer, minimum: 1}
        bash_writes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, why]
            properties:
              path: {type: string, minLength: 1}
              why: {type: string, minLength: 10}
        evidence:
          type: object
          additionalProperties: false
          properties:
            kinds:
              type: array
              items:
                type: object
                required: [kind, did]
                additionalProperties: false
                properties:
                  kind:
                    type: string
                    enum: [docs, prompts, config, code]
                  did: {type: string, minLength: 1}
            named:
              type: array
              items:
                type: object
                required: [unit_key, test]
                additionalProperties: false
                properties:
                  unit_key: {type: string, minLength: 1}
                  test: {type: string, minLength: 1}

  - id: tdd-close-save
    script: writer_save
    runtime: uv
    mutates_checkout: false
    depends_on: [tdd-close]
    with:
      reply: "$tdd-close.output"
    output_format:
      type: object
      additionalProperties: false
      required: [saved]
      properties:
        saved: {type: boolean}

  - id: tdd-close-out
    script: writer_out
    runtime: uv
    mutates_checkout: false
    depends_on: [tdd-close-save]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, reason, reply, report]
      properties:
        ok: {type: boolean}
        reason: {type: string}
        reply:
          type: [object, 'null']
          description: 'json(shared:writer-reply.schema.json): 書き手の返答（受け付けの前の物）のファイル reply-<n>.json。ok が偽の時は null'
          additionalProperties: false
          required: [type, run_id, path]
          properties:
            type: {type: string, enum: [archon_artifact]}
            run_id: {type: string}
            path: {type: string}
        report: {type: array, items: {type: string}}

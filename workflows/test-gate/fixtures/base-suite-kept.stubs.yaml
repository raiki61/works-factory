# 筋書き base-suite-kept: 入力 tdd_suite を省いた run の base で、同じ test_cmd の取り置きが在る。suite-prep が写して書き手の役と
# suite-place は when で飛び（AI の手番を起こさない）、suite-try が照らしを通す。返す節に届く
run:
  by: engine
  material: {status: found, count: 1, detail: "suite: exit 1"}
  runs: [{name: suite, exit: 1, how: direct}]
  skipped_steps: []
  same_as: null
  log: test-gate/base/logs/a1/checks.log
  junit_steps: [suite]
  fingerprint_before: {head: "1111111111111111111111111111111111111111", diff_hash: "aa"}
  fingerprint_after: {head: "1111111111111111111111111111111111111111", diff_hash: "aa"}
  suite_owed: true
suite-prep: {write: false, brief_file: ""}
suite-try: {done: true, ok: true, why: ""}
result:
  mode: base
  ok: true
  green: false
  red_cause: ""
  ran_steps: {ran: [suite], unran: []}
  baseline: {type: archon_artifact, run_id: stub-run, path: test-gate/base/baseline.json}
  fingerprint: null
  test_outcomes: null
  evidence: {type: archon_artifact, run_id: stub-run, path: test-gate/base/evidence.md}
  by: engine
  suites_line: "走らせた: suite（exit 1・direct）／走らせなかった: test_cmd（渡されていない）"
  log: test-gate/base/logs/a1/checks.log
  baseline_line: ""
  reason: ""
fixture:
  inputs:
    mode: base
    start: '{"type": "archon_artifact", "run_id": "stub-run", "path": "start/record.json"}'
  expect: completed
  reached: [run, suite-prep, suite-try, result]

# 筋書き base-role: 宣言も test_cmd も無い（by role_needed）ので、任せ先の CI の役の輪（ci-prep → ci → ci-accept）を回してから
# 返す節に届く。走らせられなかった役の awaiting_human は base では受け付け、返す節は緑を仮定しない（green: false・incomplete）が
# 直す前の結末を控えて鎖を進める（ok: true。#495。走らせられなかった系統は控えの素材の reason が名指す）
run:
  by: role_needed
  material: null
  runs: []
  skipped_steps: []
  same_as: null
  log: ""
  junit_steps: []
  fingerprint_before: {head: "1111111111111111111111111111111111111111", diff_hash: "aa"}
  fingerprint_after: {head: "1111111111111111111111111111111111111111", diff_hash: "aa"}
ci-prep:
  copy_dir: /tmp/works-factory-ci-stub/work
  tmp_dir: /tmp/works-factory-ci-stub/tmp
  root: /tmp/target
  base_rev: ""
  mode: base
  reject: ""
  attempt: 1
ci:
  material: {status: awaiting_human, reason: "CI の定義が実機を要る"}
ci-accept:
  ok: true
  done: true
  give_up: false
  reason: ""
result:
  mode: base
  ok: true
  green: false
  red_cause: incomplete
  ran_steps: {ran: [], unran: []}
  baseline: {type: archon_artifact, run_id: stub-run, path: test-gate/base/baseline.json}
  fingerprint: null
  test_outcomes: null
  evidence: {type: archon_artifact, run_id: stub-run, path: test-gate/base/evidence.md}
  by: role_needed
  suites_line: "走らせた: 無い／走らせなかった: 宣言の段・test_cmd（任せ先の CI の役 blk-ci が走らせなかった: 素材の status awaiting_human）"
  log: ""
  baseline_line: ""
  reason: ""
fixture:
  inputs:
    mode: base
    start: '{"type": "archon_artifact", "run_id": "stub-run", "path": "start/record.json"}'
  expect: completed
  reached: [ci-prep, ci, ci-accept, result]

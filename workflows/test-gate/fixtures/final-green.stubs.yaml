# 筋書き final-green: 形 final で base の返りの baseline を渡し、緑で指紋が揃ったので返す節が認証する（ok: true）
run:
  by: engine
  material: {status: clean, checked: "suite: exit 0"}
  runs: [{name: suite, exit: 0, how: direct}]
  skipped_steps: []
  same_as: null
  log: test-gate/final/logs/a1/checks.log
  junit_steps: [suite]
  fingerprint_before: {head: "2222222222222222222222222222222222222222", diff_hash: "bb"}
  fingerprint_after: {head: "2222222222222222222222222222222222222222", diff_hash: "bb"}
result:
  mode: final
  ok: true
  green: true
  red_cause: ""
  baseline: null
  fingerprint: {head: "2222222222222222222222222222222222222222", diff_hash: "bb"}
  test_outcomes: {rows: [], unmeasured: ""}
  evidence: {type: archon_artifact, run_id: stub-run, path: test-gate/final/evidence.md}
  by: engine
  suites_line: "走らせた: suite（exit 0・direct）／走らせなかった: test_cmd（渡されていない）"
  log: test-gate/final/logs/a1/checks.log
  baseline_line: "修正前のテスト: 赤（元の結末（入力 baseline） の status found）"
  reason: ""
fixture:
  inputs:
    mode: final
    start: '{"type": "archon_artifact", "run_id": "stub-run", "path": "start/record.json"}'
    baseline: '{"type": "archon_artifact", "run_id": "stub-run", "path": "test-gate/base/baseline.json"}'
  expect: completed
  reached: [run, result]

# 筋書き base-suite-written: 入力 tdd_suite を省いた run の base（run の返り suite_owed）。取り置きが無いので書き手の役 suite-write が
# 実行器の本文を返し、suite-place が置き、suite-try が 1 回走らせて照らしを通す（JUnit XML が出て試験が 1 件以上）。返す node に届く
intake: {ok: true, reason: ""}
run:
  by: engine
  material: {status: found, count: 1, detail: "suite: exit 1"}
  runs: [{name: suite, exit: 1, how: direct}]
  skipped_steps: []
  same_as: null
  log: logs/a1/checks.log
  junit_steps: [suite]
  fingerprint_before: {head: "1111111111111111111111111111111111111111", diff_hash: "aa"}
  fingerprint_after: {head: "1111111111111111111111111111111111111111", diff_hash: "aa"}
  suite_owed: true
suite-prep: {write: true, prompt: "(prep が組んだ指示)"}
suite-write:
  made: true
  body: "#!/bin/sh\nmake check REPORT=\"$1\"\n"
  why: ""
suite-place: {made: true, why: ""}
suite-try: {done: true, ok: true, why: ""}
result:
  mode: base
  ok: true
  green: false
  red_cause: ""
  ran_steps: {ran: [suite], unran: []}
  baseline: {type: archon_artifact, run_id: stub-run, path: baseline.json}
  fingerprint: null
  test_outcomes: null
  evidence: {type: archon_artifact, run_id: stub-run, path: evidence.md}
  by: engine
  suites_line: "走らせた: suite（exit 1・direct）／走らせなかった: test_cmd（渡されていない）"
  log: logs/a1/checks.log
  baseline_line: ""
  reason: ""
  suite: "/tmp/runner"
  related: {applied: false, whole: false, files: [], left: [], far: [], reasons: [], ran: none}
  suite_note: "TDD の実行器は AI が書いた"
  report: ["直す前のテスト: 赤"]
fixture:
  inputs:
    mode: base
    test_cmd: make test
  expect: completed
  reached: [intake, run, suite-prep, suite-write, suite-place, suite-try, result]

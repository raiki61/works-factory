name: works-factory-test-gate
description: |
  試験の関門。メイングラフに 2 つの形で include する。base（判定の前）は対象のテストの走らせ方を見つけて 1 度走らせ、直す前の結末
  （段ごとの結末と、JUnit の報告が在れば 1 件ごとの結末）を控える。final（修正の後）はテスト一式を走らせ、赤の原因を分けて
  証拠と一緒に返し、緑を作業ツリーの指紋（HEAD と差分の hash）つきで認証する。赤は原因が何でも認証しない。
  走らせ方は機械が決める（対象の宣言 .review-checks.json の段と test_cmd）。どちらも無ければ任せ先の CI の役が CI の定義を読み、
  作業ツリーの写しの上で走らせる。出力は 1 つのノード result で、mode で形が分かれる（docs/design.md の「test-gate の出力」）。
  入力 tdd_suite を省いた run の base は、走らせた後に TDD の実行器を用意する（suite-loop）: 同じ test_cmd で前に照らしを通った取り置きが
  在れば使い、無ければ書き手の役 suite-write が test_cmd と CI の定義から書く。その実行器を 1 回走らせた結末を機械が照らし（JUnit XML が
  出て試験が 1 件以上）、通れば始めの記録の tdd_suite に結ぶ。取り置きが通らなければ捨てて書き直す（持ち主の決め suite-by-ai）。

inputs:
  mode:
    required: true
    description: 形。base（判定の前）か final（修正の後）
  start:
    required: true
    description: 始めの記録のポインタの JSON の字
  baseline:
    default: ""
    description: final の時だけ、base の出力の baseline のポインタの JSON の字。"" と null は「無い」と読む
  reuse_dir:
    default: ""
    description: 同じ run の中の試験の結果の控えの置き場の絶対パス。base の時だけ引いて置く。空は使い回さない
  user_env_dir:
    default: ""
    description: 利用者の HOME・XDG に戻して起こした印（user-env-ran）を置く置き場の絶対パス。空は置き場が無い（戻す run では止まる）

returns: result
outcome_field: ok

nodes:
  - id: run
    script: run
    runtime: uv
    with:
      mode: $INPUTS.mode
      start: $INPUTS.start
      reuse_dir: $INPUTS.reuse_dir
      user_env_dir: $INPUTS.user_env_dir
    output_format:
      type: object
      additionalProperties: false
      required: [by, material, runs, skipped_steps, same_as, log, junit_steps, fingerprint_before, fingerprint_after]
      properties:
        by: &run_by {type: string, enum: [engine, role, role_needed]}
        material:
          type: [object, "null"]   # null は role_needed（任せ先の CI の役が渡す）
          additionalProperties: false
          required: [status]
          properties:
            status: {type: string, enum: [found, clean, not_applicable, awaiting_human, not_run]}
            count: {type: integer, minimum: 0}
            detail: {type: string}
            checked: {type: string}
            reason: {type: string}
            systems: &systems   # 系統の名の分け（走らせた ran・走らせられなかった unran）。任せ先の役が final の not_run で書き、冒頭の句が読む
              type: object
              additionalProperties: false
              required: [ran, unran]
              properties:
                ran: {type: array, items: {type: string}}
                unran: {type: array, items: {type: string}}
        runs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, exit, how]
            properties:
              name: {type: string}
              exit: {type: [integer, "null"]}   # null は起こせなかった段
              how: {type: string, enum: [direct, shell]}
              launch: {type: string, enum: [broken]}
              reused:   # 同じ run の中の控えから使った段の出どころ（tree_run.reuse_run の note）
                type: object
                additionalProperties: false
                required: [at, key, from]
                properties:
                  at: {type: number}
                  took_s: {type: [number, "null"]}
                  key: {type: string}
                  entry: {type: string}
                  from: {type: string}
              reuse_off: {type: string}   # 控えを使わなかった・置かなかった理由
        skipped_steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, paths_ignore]
            properties:
              name: {type: string}
              paths_ignore: {type: array, items: {type: string}}
        same_as: {type: [string, "null"]}
        log: {type: string}
        junit_steps: {type: array, items: {type: string}}
        fingerprint_before:
          type: object
          additionalProperties: false
          required: [head, diff_hash]
          properties:
            head: {type: string}
            diff_hash: {type: string}
        fingerprint_after:
          type: object
          additionalProperties: false
          required: [head, diff_hash]
          properties:
            head: {type: string}
            diff_hash: {type: string}
        suite_owed: {type: boolean}   # TDD の実行器を用意するか（required に入れない。無ければ用意しない）

  # 任せ先の CI の役の出し直しの輪（今の works の blk-ci）。諦めは ci-accept の done・give_up で抜け、max_iterations で落とさない。
  # 役は 1 回目は新しい会話で起き、拒まれた後は出し直しの役 ci-fix が同じ会話の続きで拒まれた欄だけを返し、受け付けが前の答えと
  # 合わせる（振り分けは ci-prep の resubmit。並んだ層は会話を切るので ci-fix は ci の後ろの層に置く。#571）
  - id: ci-loop
    depends_on: [run]
    when: "$run.output.by == 'role_needed'"
    loop_group:
      max_iterations: 3
      fresh_context: false
      until_bash: accepted=$ci-accept.output.done; test "$accepted" = true
      nodes:
        - id: ci-prep
          script: ci_prep
          runtime: uv
          mutates_checkout: false
          with:
            mode: $INPUTS.mode
            start: $INPUTS.start
            prev: "$LOOP_PREV.ci-accept.output.ok"
          output_format:
            type: object
            additionalProperties: false
            required: [copy_dir, tmp_dir, root, base_rev, mode, reject, attempt]
            properties:
              copy_dir: {type: string}
              tmp_dir: {type: string}
              root: {type: string}
              base_rev: {type: string}
              mode: {type: string, enum: [base, final]}
              reject: {type: string}
              attempt: {type: integer, minimum: 1}
              resubmit: {type: boolean}
              brief: {type: string}
        - id: ci
          description: 'CI の任せ先: 対象の CI の定義を読み、作業ツリーの写しの上でテスト・lint を走らせて素材を返す'
          command: ci
          depends_on: [ci-prep]
          when: "$ci-prep.output.resubmit != true"
          <<: &ci_launch
            model: '@wf-test-gate'   # 既定は今の works の stage-models.json の blk-ci/ci（light）の値（lib/launchgroups.py の群の表）
            mutates_checkout: false
            settingSources: [user]
            allowed_tools: [Read, Grep, Glob, Bash, WebSearch, WebFetch]   # Bash はテストを走らせるため
            # 依存の導入（~/.cache・網）と localhost のテストを通す（今の works の blk-ci と同じ形）。本物の作業ツリーへの書き込みは
            # denyWrite で Archon の家（~/../archon-home。~ は起動が隔離した HOME）ごと塞ぐ。相対のパスは cwd でなく設定の一時
            # ファイルのフォルダに解かれるので '.' は効かない（実測 2026-10-13。#217）。写し（ci-prep の mkdtemp。TMPDIR の下）は
            # 書ける。起こす直前に包み（workflows/.shared/fence.py）がこの値を印と読み、cwd・共通の .git・worktree の根などを足す（#309）。
            # その上に mutates_checkout: false と ci-accept の作業ツリーの比べ
            sandbox:
              enabled: true
              allowUnsandboxedCommands: false
              failIfUnavailable: true
              enableWeakerNetworkIsolation: true
              network: {allowedDomains: ['*'], allowLocalBinding: true}
              filesystem: {allowWrite: ['/'], denyWrite: ['~/../archon-home']}
            idle_timeout: 1728000000
            retry: {max_attempts: 2, on_error: all}
          output_format: &ci_reply
            type: object
            additionalProperties: false
            required: [material]
            properties:
              material:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: {type: string, enum: [found, clean, not_applicable, awaiting_human, not_run]}
                  count: {type: integer, minimum: 0}
                  detail: {type: string}
                  checked: {type: string}
                  reason: {type: string}
                  systems: *systems
        - id: ci-fix
          prompt: 前の回の返答は受け付けで拒まれた。この会話の続きで直す。指示書 `$ci-prep.output.brief` を Read で全部読み、その指示に従え。返すのは指示書の返し方の形の JSON だけ。
          depends_on: [ci-prep, ci]
          trigger_rule: none_failed_min_one_success
          when: "$ci-prep.output.resubmit == true"
          <<: *ci_launch
          output_format:
            <<: *ci_reply
            required: []
        - id: ci-accept
          script: ci_accept
          runtime: uv
          mutates_checkout: false
          depends_on: [ci, ci-fix]
          trigger_rule: none_failed_min_one_success
          with:
            status_guarded: true
            mode: $INPUTS.mode
            reply: {from: "$ci.output", if_skipped: null}
            fix_reply: {from: "$ci-fix.output", if_skipped: null}
          output_format:
            type: object
            additionalProperties: false
            required: [ok, done, give_up, reason]
            properties:
              ok: {type: boolean}
              done: {type: boolean}
              give_up: {type: boolean}
              reason: {type: string}

  # TDD の実行器を用意する輪。1 周目は取り置きを使うか書き、取り置きが照らしを通らなかった時だけ 2 周目で書き直す（書いた物の周は
  # 照らしの結末に依らず終わる）。走らせるのは輪の終わりの suite-try の 1 回で、修正前のテストの一式の回を兼ねる。任せ先の CI の役が
  # 本物の作業ツリーの外でテストを走らせ終えてから回す
  - id: suite-loop
    depends_on: [run, ci-loop]
    trigger_rule: none_failed_min_one_success
    when: "$run.output.suite_owed == true"
    loop_group:
      max_iterations: 2
      fresh_context: true
      until_bash: done=$suite-try.output.done; test "$done" = true
      nodes:
        - id: suite-prep
          script: suite_prep
          runtime: uv
          mutates_checkout: false
          with:
            start: $INPUTS.start
          output_format:
            type: object
            additionalProperties: false
            required: [write, brief_file]
            properties:
              write: {type: boolean}
              brief_file: {type: string}
        - id: suite-write
          description: 'TDD の実行器の書き手: test_cmd と CI の定義を読み、JUnit XML を第 1 引数に書く実行器の本文を返す（置くのも走らせるのも機械）'
          command: suite-write
          depends_on: [suite-prep]
          when: "$suite-prep.output.write == true"
          <<: *ci_launch
          output_format:
            type: object
            additionalProperties: false
            required: [made, body, why]
            properties:
              made: {type: boolean}
              body: {type: string}
              why: {type: string}
        - id: suite-place
          script: suite_place
          runtime: uv
          mutates_checkout: false
          depends_on: [suite-write]
          with:
            start: $INPUTS.start
            reply: {from: "$suite-write.output", if_skipped: null}
          output_format:
            type: object
            additionalProperties: false
            required: [made, why]
            properties:
              made: {type: boolean}
              why: {type: string}
        # 書き手が飛ばされても（取り置きを使う周）落ちても（記録には suite-prep の悲観の印が残る）走る
        - id: suite-try
          script: suite_try
          runtime: uv
          mutates_checkout: false
          depends_on: [suite-prep, suite-place]
          trigger_rule: all_done
          with:
            mode: $INPUTS.mode
            start: $INPUTS.start
            user_env_dir: $INPUTS.user_env_dir
          output_format:
            type: object
            additionalProperties: false
            required: [done, ok, why]
            properties:
              done: {type: boolean}
              ok: {type: boolean}
              why: {type: string}

  # 返す節。前の節の結果はファイル（run.json・ci-material.json）で読み、$run.output・$ci-accept.output を束ねない
  # （落ちた節への束ねは if_skipped が在っても誤りになる）。run が落ちても届くように all_done。TDD の実行器の輪の後の始めの記録を読む。
  # with: の optional は、落ちても線が先へ進めてよい節の宣言（TDD の実行器の輪と書き手。落ちれば実行器の無い run の道を通る）。
  # [{node, bare}] の JSON の字で、bare はループの中の節で、記録の step に include の前付けの無い素の id で載るか
  - id: result
    script: result
    runtime: uv
    mutates_checkout: false
    depends_on: [run, ci-loop, suite-loop]
    trigger_rule: all_done
    output_type: green-cert
    with:
      mode: $INPUTS.mode
      start: $INPUTS.start
      baseline: $INPUTS.baseline
      optional: '[{"node": "suite-loop", "bare": false}, {"node": "suite-write", "bare": true}]'
    output_format:
      type: object
      additionalProperties: false
      required: [mode, ok, green, red_cause, ran_steps, baseline, fingerprint, test_outcomes, evidence, by, suites_line, log, baseline_line, reason]
      properties:
        mode: {type: string, enum: [base, final]}
        ok: {type: boolean}
        green: {type: boolean}
        red_cause: {type: string, enum: [introduced, inherited, environment, interaction, incomplete, ""]}
        # 起こした段と、起こせない・試験を走らせなかった段の名（green_cert.ran_steps。任せ先の役の run は素材の systems）。
        # 報告と最後の関所の冒頭の句が読む
        ran_steps: *systems
        baseline:
          anyOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [type, run_id, path]
              properties:
                type: {type: string, enum: [archon_artifact]}
                run_id: {type: string}
                path: {type: string}
        fingerprint:
          anyOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [head, diff_hash]
              properties:
                head: {type: string}
                diff_hash: {type: string}
        test_outcomes:   # final だけ。テストごとの修正前と今の結末（片側に居なければ ""）。比べない時は rows が空で unmeasured に訳
          anyOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [rows, unmeasured]
              properties:
                rows:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [key, base, final, fail_message]
                    properties:
                      key: {type: string}
                      base: {type: string, enum: [passed, failure, error, skipped, ""]}
                      final: {type: string, enum: [passed, failure, error, skipped, ""]}
                      fail_message: {type: string}
                unmeasured: {type: string}
        evidence:
          type: object
          additionalProperties: false
          required: [type, run_id, path]
          properties:
            type: {type: string, enum: [archon_artifact]}
            run_id: {type: string}
            path: {type: string}
        by: {anyOf: [*run_by, {type: string, enum: [""]}]}   # "" は返す節の中の誤り
        suites_line: {type: string}
        log: {type: string}
        baseline_line: {type: string}
        reason: {type: string}
        optional: {type: array}

name: works-factory-test-gate
description: '試験の関門の block（docs/design/test-gate.md）。対象のテストの走らせ方を機械で決めて走らせ（対象の宣言 .review-checks.json の段と test_cmd）、決められなければ（宣言も test_cmd も無い）AI が書く TDD の実行器で、変更に関わる試験だけを走らせる（全体の試験は CI と人に任せる）。base は直す前の版で試験を何も走らせず、TDD の実行器を人が渡していなければ用意する（取り置きから使うか、書き手の役が書く。走らせて確かめるのは修正の段の TDD のループ）。final は一式を走らせ、元の結末に無い赤は修正前の版で走らせ直して赤の原因を機械が分け、緑を作業ツリーの指紋（HEAD と差分の hash）つきで認証する。赤は原因が何でも認証せず、AI が書いた実行器の緑も認証しない。単独の run でも、graph から include されても回る'
inputs:
  mode:
    required: true
    description: 'choice(base|final): 形。base は直す前の用意（判定の前。試験は走らせない）。final は修正の後に一式を走らせ、赤の原因を分けて緑を認証する'
  test_cmd:
    default: ''
    description: 'text: 人が渡したテストのコマンド（対象の根で走らせる 1 行。字のまま）。空は渡されていない'
  tdd_suite:
    default: ''
    description: 'text: TDD の実行器のパス（人が渡した物か、base の出力の suite）。空は無い（base では用意する）'
  base:
    default: ''
    description: 'text: 修正前の版（範囲の照らしの起点。関わる試験の選びの起点の版にもなる）。空は起点なし（範囲の照らしは依頼の where だけ）'
  entry_base:
    default: ''
    description: 'text: 入口の差分の根（変更の起点の版）。関わる試験の選びが、ここから今の作業ツリーまでに触ったファイルを起点にする。空は修正前の版（base）'
  request:
    default: '[]'
    description: 'json(shared:request.schema.json): 依頼の行の配列か、それを findings の欄に持つオブジェクト（where だけを読む）。空の配列は無い'
  request_scope:
    default: 'false'
    description: 'flag: 真なら base の形で依頼の行の where を範囲の照らしの変更に足す（入口の差分が空の run）'
  baseline:
    default: ''
    description: 'json(lib:baseline.schema.json): final の時、base の出力の baseline のファイル。空は無い（1 件ごとの比べをしない）'
  reuse_dir:
    default: ''
    description: 'text: 同じ run の中の試験の結果の控えの置き場の絶対パス。今は読まない（直す前は試験を走らせず、控えを引かず置かない。docs/design/test-gate.md の 15）。空は使い回さない'
  reuse_key:
    default: ''
    description: 'text: 控えに書いて引く時に照らす run の名。今は読まない（reuse_dir と同じ）。空はこの run の id'
  user_env_dir:
    default: ''
    description: 'text: 利用者の HOME・XDG に戻して起こした印を置く置き場の絶対パス。空は置き場が無い（戻す run では止まる）'
  lang:
    default: ''
    description: 'text: 人に見せる欄（実行器の書き手の why）の言語。空は依頼の言語'

returns: result
outcome_field: ok

nodes:
  # port を読み、この block の前の回のファイルを消して intake.json と実行器の控えを書く。後ろの script は port を読まずに intake.json を読む
  - id: intake
    script: intake
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [ok, reason]
      properties:
        ok: {type: boolean}
        reason: {type: string}

  - id: run
    script: run
    runtime: uv
    depends_on: [intake]
    when: "$intake.output.ok == true"
    output_format:
      type: object
      additionalProperties: false
      required: [by, material, runs, skipped_steps, same_as, log, junit_steps, fingerprint_before, fingerprint_after]
      properties:
        by: &run_by {type: string, enum: [engine, role, role_needed]}
        material:
          type: [object, "null"]   # null は role_needed（機械が走らせず、返す node が実行器の結果から組む）
          additionalProperties: false
          required: [status]
          properties:
            status: {type: string, enum: [found, clean, not_applicable, awaiting_human, not_run]}
            count: {type: integer, minimum: 0}
            detail: {type: string}
            checked: {type: string}
            reason: {type: string}
            systems: &systems   # 系統の名の分け（走らせた ran・走らせられなかった unran）。冒頭の句が読む
              type: object
              additionalProperties: false
              required: [ran, unran]
              properties:
                ran: {type: array, items: {type: string}}
                unran: {type: array, items: {type: string}}
        runs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, exit, how]
            properties:
              name: {type: string}
              exit: {type: [integer, "null"]}   # null は起こせなかった段
              how: {type: string, enum: [direct, shell]}
              launch: {type: string, enum: [broken]}
              reused:   # 同じ run の中の控えから使った段の出どころ（tree_run.reuse_run の note）
                type: object
                additionalProperties: false
                required: [at, key, from]
                properties:
                  at: {type: number}
                  took_s: {type: [number, "null"]}
                  key: {type: string}
                  entry: {type: string}
                  from: {type: string}
              reuse_off: {type: string}   # 控えを使わなかった・置かなかった理由
        skipped_steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, paths_ignore]
            properties:
              name: {type: string}
              paths_ignore: {type: array, items: {type: string}}
        same_as: {type: [string, "null"]}
        log: {type: string}
        junit_steps: {type: array, items: {type: string}}
        fingerprint_before:
          type: object
          additionalProperties: false
          required: [head, diff_hash]
          properties:
            head: {type: string}
            diff_hash: {type: string}
        fingerprint_after:
          type: object
          additionalProperties: false
          required: [head, diff_hash]
          properties:
            head: {type: string}
            diff_hash: {type: string}
        suite_owed: {type: boolean}   # TDD の実行器を用意するか（required に入れない。無ければ用意しない）

  # TDD の実行器を用意する輪。1 周目は取り置きを使うか書き、取り置きが照らしを通らなかった時だけ 2 周目で書き直す（書いた物の周は
  # 照らしの結末に依らず終わる）。輪の終わりの suite-try は実行器を走らせずに結ぶ（直す前の版では試験を走らせない。照らすのは修正の段の
  # TDD のループ。docs/design/test-gate.md の 15）
  - id: suite-loop
    depends_on: [run]
    when: "$run.output.suite_owed == true"
    loop_group:
      max_iterations: 2
      fresh_context: true
      until_bash: done=$suite-try.output.done; test "$done" = true
      nodes:
        - id: suite-prep
          script: suite_prep
          runtime: uv
          mutates_checkout: false
          output_format:
            type: object
            additionalProperties: false
            required: [write, prompt]
            properties:
              write: {type: boolean}
              prompt: {type: string}
        - id: suite-write
          description: 'TDD の実行器の書き手: test_cmd と CI の定義を読み、JUnit XML を第 1 引数に書く実行器の本文を返す（置くのも走らせるのも機械）'
          prompt: "$suite-prep.output.prompt"
          depends_on: [suite-prep]
          when: "$suite-prep.output.write == true"
          model: '@wf-test-gate'   # 既定の値は lib/launchgroups.py の群の表
          mutates_checkout: false
          settingSources: [user]
          allowed_tools: [Read, Grep, Glob, Bash, WebSearch, WebFetch]   # Bash は実行器の使い方の表示を見るため
          # 依存の導入（~/.cache・網）と localhost のテストを通す。本物の作業ツリーへの書き込みは denyWrite で Archon の家
          # （~/../archon-home。~ は起動が隔離した HOME）ごと塞ぐ。相対のパスは cwd でなく設定の一時ファイルのフォルダに解かれるので
          # '.' は効かない。その上に mutates_checkout: false
          sandbox:
            enabled: true
            allowUnsandboxedCommands: false
            failIfUnavailable: true
            enableWeakerNetworkIsolation: true
            network: {allowedDomains: ['*'], allowLocalBinding: true}
            filesystem: {allowWrite: ['/'], denyWrite: ['~/../archon-home']}
          idle_timeout: 1728000000
          retry: {max_attempts: 2, on_error: all}
          output_format:
            type: object
            additionalProperties: false
            required: [made, body, why]
            properties:
              made: {type: boolean}
              body: {type: string}
              why: {type: string}
        - id: suite-place
          script: suite_place
          runtime: uv
          mutates_checkout: false
          depends_on: [suite-write]
          with:
            reply: {from: "$suite-write.output", if_skipped: null}
          output_format:
            type: object
            additionalProperties: false
            required: [made, why]
            properties:
              made: {type: boolean}
              why: {type: string}
        # 書き手が飛ばされても（取り置きを使う周）落ちても（記録には suite-prep の悲観の印が残る）走る
        - id: suite-try
          script: suite_try
          runtime: uv
          mutates_checkout: false
          depends_on: [suite-prep, suite-place]
          trigger_rule: all_done
          output_format:
            type: object
            additionalProperties: false
            required: [done, ok, why]
            properties:
              done: {type: boolean}
              ok: {type: boolean}
              why: {type: string}

  # 返す node。前の node の結果は place のファイル（intake.json・run.json・suite-state.json）で読み、$run.output を束ねない
  # （落ちた node への束ねは if_skipped が在っても誤りになる）。run が落ちても届くように all_done。
  # with: の optional は、落ちても線が先へ進めてよい node の宣言（TDD の実行器の輪と書き手。落ちれば実行器の無い run の道を通る）。
  # [{node, bare}] の JSON の字で、bare は輪の中の node で、記録の step に include の前付けの無い素の id で載るか
  - id: result
    script: result
    runtime: uv
    mutates_checkout: false
    depends_on: [run, suite-loop]
    trigger_rule: all_done
    output_type: green-cert
    with:
      optional: '[{"node": "suite-loop", "bare": false}, {"node": "suite-write", "bare": true}]'
    output_format:
      type: object
      additionalProperties: false
      required: [mode, ok, green, red_cause, ran_steps, baseline, fingerprint, test_outcomes, evidence, by, suites_line, log, baseline_line, reason, suite, suite_note, related, report]
      properties:
        mode: {type: string, enum: [base, final]}
        ok: {type: boolean}
        green: {type: boolean}
        red_cause: {type: string, enum: [introduced, inherited, environment, interaction, incomplete, ""]}
        # 起こした段と、起こせない・試験を走らせなかった段の名（green_cert.ran_steps。by role_needed の run は実行器の 1 段）。
        # 報告と最後の関所の冒頭の句が読む
        ran_steps: *systems
        baseline:
          description: 'json(lib:baseline.schema.json): 直す前の結末のファイル（base だけ。final は null）'
          type: [object, "null"]
          additionalProperties: false
          required: [type, run_id, path]
          properties:
            type: {type: string, enum: [archon_artifact]}
            run_id: {type: string}
            path: {type: string}
        fingerprint:   # final だけ（base は null）
          type: [object, "null"]
          additionalProperties: false
          required: [head, diff_hash]
          properties:
            head: {type: string}
            diff_hash: {type: string}
        test_outcomes:   # final だけ。テストごとの修正前と今の結末（片側に居なければ ""）。比べない時は rows が空で unmeasured に訳
          type: [object, "null"]
          additionalProperties: false
          required: [rows, unmeasured]
          properties:
            rows:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key, base, final, fail_message]
                properties:
                  key: {type: string}
                  base: {type: string, enum: [passed, failure, error, skipped, ""]}
                  final: {type: string, enum: [passed, failure, error, skipped, ""]}
                  fail_message: {type: string}
            unmeasured: {type: string}
        evidence:
          description: 'file: 証拠の文（evidence.md。書けなければ誤りの 1 行の failure.txt）'
          type: object
          additionalProperties: false
          required: [type, run_id, path]
          properties:
            type: {type: string, enum: [archon_artifact]}
            run_id: {type: string}
            path: {type: string}
        by: {type: string, enum: [engine, role, role_needed, ""]}   # "" は返す節の中の誤り（語は走らせ方の by と同じ）
        suites_line: {type: string}
        log: {type: string}
        baseline_line: {type: string}
        reason: {type: string}
        suite: {type: string}        # この後の段が使う TDD の実行器のパス（base: 人が渡した物か、照らしを通った物か ""。final: port tdd_suite のまま）
        suite_note: {type: string}   # 実行器を取り置きから使った・書いた・作れなかったの 1 行（用意しなかった run は ""）
        # 関わる試験の選び（docs/design/test-gate.md の 14）。applied が偽は絞らない道。ran は related（選んだ試験だけ）・whole（一式）・none（走らせていない）
        related:
          type: object
          additionalProperties: false
          required: [applied, whole, files, left, far, reasons, ran]
          properties:
            applied: {type: boolean}
            whole: {type: boolean}
            files: &names {type: array, items: {type: string}}
            left: *names
            far: *names
            reasons: *names
            ran: {type: string, enum: [related, whole, none]}
        report: {type: array, items: {type: string}}   # 報告に載せる日本語の行
        # 落ちても線が先へ進めてよい node の宣言（入力 optional を読んだ並びのまま）
        optional: {type: array, items: {type: object, properties: {node: {type: string}, bare: {type: boolean}}}}

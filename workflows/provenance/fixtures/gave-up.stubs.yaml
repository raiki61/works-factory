# 出所検査の役の返答が受け付けを通らない道（carried_over は走った観点が名乗れない）: run は止めず、出口が落ちずに返る。筋書きでは輪が
# 1 周で終わるので却下は 1 回で、3 回で諦めて出口が status: gave_up を返す数えは tests/blocks/provenance の試験が確かめる
fixture:
  expect: completed
  reached: [intake, provenance-prep, provenance, provenance-accept, finish]
  inputs:
    base: ''
    entry: ''
    lang: ''
  resolved-text-contains:
    provenance: 'You are the provenance role.'
exec-code: true
provenance:
  material:
    status: carried_over
    from_round: 1
    reason: reuse of the earlier round
  claims: []

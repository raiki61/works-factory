name: works-factory-r3
description: '独立の目 R3 全体の整合の block（docs/design/r3.md）。直しを作った役と別の新しい会話で、読むだけの 1 つの役（整合の役）が累積差分を見る: 変更全体でファイル横断の整合（命名・規約・界面・文書の追従、変更が触れる文書群が示す推奨の一致）と、差分が考えを住処の外に書き足していないかを、見た範囲と見ていない範囲つきで判定の行にする。方針とぶつかる所は記録された方針の行を名指して書く。差分が触れていない横断のリスクは見ない。落ちず、判定の行と報告の行を出す。単独の run でも、graph から include されても回る'
inputs:
  base: {default: '', description: 'text: 累積差分の根の commit（入口の差分の根。差分の run では PR の根）。累積差分はここから作業ツリーの今の姿まで（未追跡の新しいファイルも入る）。空は HEAD'}
  lang: {default: '', description: 'text: 人に見せる欄（reason・seen・unseen）の言語。空は依頼の言語'}
  green: {default: 'true', description: 'flag: 修正の後の試験の緑が認証されたか。偽なら目の指示に「最後のテストの認証が通っていない」の 1 文を足す'}
  after: {default: '', description: 'json(shared:structure-after.schema.json): 直した後の構造の実測の控え（structure-after.json）。空は測っていない'}
  review: {default: '{}', description: 'json(shared:plan-verdict.schema.json): 修正が使った修正案を審査した事前審査の最後の往復の結論 {round, verdict, blocks, why}。空のオブジェクトは渡されていない'}
  policy: {default: '', description: 'file: 人の方針の文書を run の頭で固めた写し。空は方針の文書が無い'}
  answers: {default: '{}', description: 'json(shared:gate-answers.schema.json): 承認ノードの人の答え {start, before_fix}（始めの承認ノードと修正前の承認ノード。どちらも {decision, text?, asked?, pushed?} か null）。記録された方針の行を組むためだけに読む。空のオブジェクトは答えが無い'}
  request: {default: '', description: 'json(shared:request.schema.json): 依頼のファイル（工場の依頼の JSON）。欄 answers を記録された方針の行の出どころの 1 つとして読む（中身が読めなくても役は止めない）。空は依頼のファイルが無い'}
  pushes: {default: '[]', description: 'json(shared:pushes.schema.json): 無人の run が判定の保留の問いに採った推しの文の配列（「問い <key>: <推し>」）。記録された方針の行を組むためだけに読む。空の配列は無い'}
  decisions: {default: '', description: 'json(shared:material.schema.json): 先行議論の突合の素材（material.json の形。欄 reply.settled を読む）。記録された方針の行を組むためだけに読む。空は突合が無い'}
returns: finish
outcome_field: ok
nodes:
  - id: intake
    script: intake
    runtime: uv
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      required: [due, reason]
      properties:
        due: {type: boolean}
        reason: {type: string}

  - id: r3-coherence-prep
    script: coherence_prep
    runtime: uv
    mutates_checkout: false
    depends_on: [intake]
    when: "$intake.output.due == true"
    output_format:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt: {type: string, minLength: 1}

  - id: r3-coherence
    prompt: "$r3-coherence-prep.output.prompt"
    depends_on: [r3-coherence-prep]
    model: '@wf-eyes-scope'
    context: fresh
    settingSources: [user]
    sandbox: {enabled: true, allowUnsandboxedCommands: false}
    allowed_tools: [Read, Grep, Glob]
    mutates_checkout: false
    idle_timeout: 1728000000
    retry: {max_attempts: 2, on_error: all}
    output_format:
      type: object
      required: [status, reason, seen, unseen]
      properties:
        status: {type: string, enum: [pass, redesign-needed, unverifiable]}
        reason: {type: string, minLength: 1}
        seen: {type: array, items: {type: string}}
        unseen: {type: array, items: {type: string}}

  - id: r3-coherence-save
    script: save
    runtime: uv
    mutates_checkout: false
    depends_on: [r3-coherence]
    with:
      name: r3-coherence
      reply: $r3-coherence.output
    output_format:
      type: object
      additionalProperties: false
      required: [saved]
      properties:
        saved: {type: boolean}

  - id: finish
    script: finish
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, r3-coherence-save]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      required: [ok, status, reason, verdict, questions, report]
      properties:
        ok: {type: boolean}
        status:
          type: string
          enum: [ran, failed]
        reason: {type: string}
        verdict:
          type: object
          additionalProperties: false
          required: [status, reason]
          properties:
            status:
              type: string
              enum: [pass, redesign-needed, unverifiable]
            reason: {type: string}
        questions:
          type: array
          items: {type: string}
        report:
          type: array
          items: {type: string}

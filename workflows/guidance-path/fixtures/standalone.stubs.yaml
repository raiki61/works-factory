# 単独の run: 頼み 1 つを読み手が入口（既定の README.md と AGENTS.md）から辿り、閉じるべき所の外に置いたので、案内を見直す役が
# 直しを出す（script は本当に走り、AI の役の返答だけを差し替える。入口は tests/archon.py の TARGET_FILES）
fixture:
  expect: completed
  reached: [intake, walk-prep, guidance-walk, walk-accept, compare, fix-prep, guidance-fix, fix-accept, finish]
  inputs:
    requests: '[{"id": "add-check", "request": "Add one more check that an AI role answer must pass.", "closes": ["blocks/world/"]}]'
  resolved-text-contains:
    guidance-walk: 'You are a first-time contributor to this repository, started in a new conversation.'
    guidance-fix: 'You are the guidance reviewer.'
exec-code: true
guidance-walk:
  steps:
    - {file: AGENTS.md, why: the entry file}
  placed:
    - {path: lib/checks.py, change: add the check as a new function}
  copied: []
  stuck: [the entry file does not say where checks of one role live]
  guessed: [that shared checks go to lib]
guidance-fix:
  fixes:
    - request: add-check
      kind: guide
      where: AGENTS.md
      change: Say that a check that one role answer must pass goes in that block's src and accept script.
      why: The reader's first step found no pointer to the block that owns the role.
